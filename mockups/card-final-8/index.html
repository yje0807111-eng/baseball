<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>선반 카드 확정안 목업 8종</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700;800&family=Saira+Condensed:wght@500;600;700;800&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #03060c; color: #e5e7eb; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .disp { font-family: 'Saira Condensed', 'IBM Plex Sans KR', sans-serif; }
  .top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: rgba(3,6,12,.95); border-bottom: 1px solid #1f2937; font-size: 13px; color: #9ca3af; }
  .top b { color: #fff; font-size: 15px; }
  .top .g { margin-left: auto; display: flex; gap: 4px; }
  .top .g button { padding: 5px 11px; font-weight: 700; color: #d1d5db; box-shadow: inset 0 0 0 1px #374151; }
  .top .g button.on { color: #04150e; background: #10b981; box-shadow: none; }
  .wrap { display: flex; flex-direction: column; gap: 22px; padding: 16px 12px 60px; }
  .vlab { display: flex; align-items: baseline; gap: 12px; margin: 0 4px 7px; }
  .vlab b { font-size: 15px; color: #fff; white-space: nowrap; }
  .vlab b i { font-style: normal; color: #10b981; margin-right: 6px; }
  .vlab span { font-size: 12px; color: #9ca3af; }
  .panel { padding: 10px 6px; background: linear-gradient(180deg, rgba(6,10,19,.8), rgba(6,10,19,.92)), url(/ui/stadium.webp) center 40%/cover; box-shadow: inset 0 0 0 1px rgba(16,185,129,.25); overflow: hidden; }
  .shelf { display: grid; gap: 3px; grid-template-columns: repeat(17, minmax(0, 8rem)); justify-content: center; }
  .x2 .shelf { grid-template-columns: repeat(8, minmax(0, 11rem)); }

  /* ── 카드 공통 (확정 요소) ── */
  .card { --g: #e5e7eb; position: relative; aspect-ratio: 2/3; width: 100%; background: #05080f; container-type: inline-size; clip-path: polygon(10% 0,100% 0,100% 93.3%,90% 100%,0 100%,0 6.7%); overflow: hidden; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 18%; }
  .card .sh { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,8,15,.62) 0, rgba(5,8,15,0) 28%, rgba(5,8,15,0) 46%, rgba(5,8,15,.9) 72%, #05080f 100%); }
  .card .fr { position: absolute; inset: 2.5cqw; border: 1px solid color-mix(in srgb, var(--n) 40%, transparent); pointer-events: none; }
  /* 종합: 75 미만 흰색 · 75~89 초록 · 90+ 는 변형마다 더 강하게 */
  .card.t75 { --g: #34d399; }
  .ov { position: absolute; left: 7cqw; top: 6cqw; font-size: 33cqw; font-weight: 800; line-height: .85; color: var(--g); text-shadow: 0 0 2px #000, 0 2px 8px #000; }
  .card.t75 .ov { text-shadow: 0 0 2px #000, 0 2px 8px #000, 0 0 12px rgba(52,211,153,.4); }
  /* 아래: [이름 | CP/숫자] + 포지션 영문 전체 */
  .bt { position: absolute; left: 7cqw; right: 6cqw; bottom: 7cqw; }
  .bt .row { display: flex; align-items: flex-end; gap: 2cqw; }
  .nm { flex: 1; min-width: 0; font-size: 20cqw; font-weight: 800; line-height: 1.05; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.02em; text-shadow: 0 1px 4px #000; }
  .cp { flex: none; text-align: right; line-height: 1; }
  .cp small { display: block; font-size: 7cqw; font-weight: 700; letter-spacing: .08em; color: #9ca3af; }
  .cp b { display: block; font-size: 17cqw; font-weight: 800; color: var(--n); }
  .pos { display: block; margin-top: 2.5cqw; font-size: 10.5cqw; font-weight: 700; letter-spacing: .03em; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .card.lock img { opacity: .35; filter: grayscale(1); }
  .card.lock .ov, .card.lock .bt { opacity: .45; }
  .lk { position: absolute; z-index: 6; }
  .lk svg { width: 10cqw; height: 10cqw; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ════ 1 · 금빛 발광 / 호박색 테두리 알림 ════ */
  .v1 .card.t90 { --g: #fbbf24; }
  .v1 .card.t90 .ov { text-shadow: 0 0 2px #000, 0 2px 8px #000, 0 0 14px rgba(251,191,36,.75), 0 0 28px rgba(251,191,36,.35); }
  .v1 .lk { left: 5cqw; right: 5cqw; top: 58cqw; display: flex; align-items: center; justify-content: center; gap: 2cqw; padding: 3.5cqw 0; font-size: 11cqw; font-weight: 800; color: #fde68a; background: rgba(40,26,4,.94); box-shadow: inset 0 0 0 1.5px #f59e0b, 0 0 10px rgba(245,158,11,.35); }

  /* ════ 2 · 금→주황 그라데이션 + 별 / 붉은 알림 ════ */
  .v2 .card.t90 .ov { background: linear-gradient(180deg, #fff3b0 0%, #fbbf24 45%, #f97316 100%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 1px #000) drop-shadow(0 2px 5px #000); }
  .v2 .card.t90 .ov::after { content: "★"; position: absolute; left: 100%; top: 0; margin-left: 1.5cqw; font-size: 11cqw; color: #fbbf24; -webkit-text-fill-color: #fbbf24; }
  .v2 .lk { left: 5cqw; right: 5cqw; top: 58cqw; display: flex; align-items: center; justify-content: center; gap: 2cqw; padding: 3.5cqw 0; font-size: 11cqw; font-weight: 800; color: #fff; background: linear-gradient(180deg, rgba(127,29,29,.95), rgba(69,10,10,.95)); box-shadow: inset 0 1.2cqw 0 #f87171, inset 0 -1.2cqw 0 #f87171; }

  /* ════ 3 · 금판 위 숫자 / 흰 바탕 알림 (최고 대비) ════ */
  .v3 .card.t90 .ov { padding: 1.5cqw 3.5cqw 0; color: #1a1204; background: linear-gradient(135deg, #fde68a, #f59e0b); text-shadow: none; box-shadow: 0 0 12px rgba(251,191,36,.55); }
  .v3 .lk { left: 7cqw; right: 7cqw; top: 58cqw; display: flex; align-items: center; justify-content: center; gap: 2cqw; padding: 3.5cqw 0; font-size: 11cqw; font-weight: 800; color: #05080f; background: #f3f4f6; box-shadow: 0 2px 10px rgba(0,0,0,.7); clip-path: polygon(4cqw 0,100% 0,100% calc(100% - 4cqw),calc(100% - 4cqw) 100%,0 100%,0 4cqw); }

  /* ════ 4 · 무지개 흐름 숫자 / 사선 경고 테이프 ════ */
  @keyframes prism { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
  .v4 .card.t90 .ov { background: linear-gradient(90deg, #f0abfc, #7dd3fc, #6ee7b7, #fde68a, #f0abfc) 0 50% / 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 1px #000) drop-shadow(0 2px 5px #000); animation: prism 3s linear infinite; }
  .v4 .lk { left: -6cqw; right: -6cqw; top: 56cqw; display: flex; align-items: center; justify-content: center; gap: 2cqw; padding: 3.5cqw 0; font-size: 11cqw; font-weight: 800; color: #111; transform: rotate(-8deg); background: repeating-linear-gradient(135deg, #fbbf24 0 5cqw, #1f1a0b 5cqw 7.5cqw); box-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .v4 .lk span { padding: 0 3cqw; background: #fbbf24; }

  /* ════ 5 · 금 숫자 + 카드 테두리까지 금색 / 네온 붉은 알약 ════ */
  .v5 .card.t90 { --g: #fbbf24; }
  .v5 .card.t90 .ov { text-shadow: 0 0 2px #000, 0 2px 8px #000, 0 0 12px rgba(251,191,36,.6); }
  .v5 .card.t90 .fr { inset: 1.5cqw; border: 1.5cqw solid transparent; border-image: linear-gradient(160deg, #fde68a, #b45309 50%, #fde68a) 1; box-shadow: inset 0 0 12px rgba(251,191,36,.35); }
  .v5 .lk { left: 8cqw; right: 8cqw; top: 58cqw; display: flex; align-items: center; justify-content: center; gap: 2cqw; padding: 3cqw 0; font-size: 10.5cqw; font-weight: 800; color: #fecaca; background: rgba(10,5,8,.94); border-radius: 99px; box-shadow: inset 0 0 0 1.5px #f43f5e, 0 0 12px rgba(244,63,94,.55); }

  /* ════ 6 · 금 숫자 + 반짝 밑줄 / 가로 전체 띠 ════ */
  .v6 .card.t90 { --g: #fbbf24; }
  .v6 .card.t90 .ov { text-shadow: 0 0 2px #000, 0 2px 8px #000, 0 0 12px rgba(251,191,36,.55); }
  .v6 .card.t90 .ov::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3cqw; height: 1.8cqw; background: linear-gradient(90deg, transparent, #fde68a, #f59e0b, transparent); box-shadow: 0 0 6px rgba(251,191,36,.8); }
  .v6 .lk { left: 0; right: 0; top: 57cqw; display: flex; align-items: center; justify-content: center; gap: 2cqw; padding: 4cqw 0; font-size: 11.5cqw; font-weight: 800; color: #fbbf24; background: rgba(5,8,15,.92); box-shadow: inset 0 1px 0 rgba(251,191,36,.7), inset 0 -1px 0 rgba(251,191,36,.7), inset 2cqw 0 0 #f59e0b; }

  /* ════ 7 · 더 큰 금 외곽선 숫자 / 사유별 색 두 줄 알림 ════ */
  .v7 .card.t90 { --g: #fbbf24; }
  .v7 .card.t90 .ov { font-size: 38cqw; -webkit-text-stroke: 1.8cqw #3b2303; paint-order: stroke fill; text-shadow: 0 0 14px rgba(251,191,36,.55); }
  .v7 .lk { left: 10cqw; right: 10cqw; top: 50cqw; display: flex; flex-direction: column; align-items: center; gap: 1.5cqw; padding: 3.5cqw 0 3cqw; font-size: 10.5cqw; font-weight: 800; color: #fff; background: rgba(5,8,15,.94); box-shadow: inset 0 0 0 1.5px var(--r), 0 0 12px color-mix(in srgb, var(--r) 45%, transparent); }
  .v7 .lk svg { width: 13cqw; height: 13cqw; color: var(--r); }

  /* ════ 8 · 금 광원 뒤판 / 호박→장미 채움 알림 ════ */
  .v8 .card.t90 { --g: #fff7d6; }
  .v8 .card.t90::before { content: ""; position: absolute; z-index: 1; left: -20cqw; top: -24cqw; width: 90cqw; height: 80cqw; background: radial-gradient(circle at 40% 45%, rgba(251,191,36,.75), rgba(251,191,36,.18) 45%, transparent 70%); pointer-events: none; }
  .v8 .card.t90 .ov { z-index: 2; text-shadow: 0 0 2px #7c4a03, 0 0 10px rgba(251,191,36,.9); }
  .v8 .lk { left: 6cqw; right: 6cqw; top: 58cqw; display: flex; align-items: center; justify-content: center; gap: 2cqw; padding: 3.5cqw 0; font-size: 11cqw; font-weight: 800; color: #1a0a05; background: linear-gradient(90deg, #fbbf24, #fb7185); box-shadow: 0 2px 10px rgba(0,0,0,.65); clip-path: polygon(3cqw 0,100% 0,calc(100% - 3cqw) 100%,0 100%); }
</style>
</head>
<body>
<div class="top"><b>선반 카드 확정안 목업 8종</b><span>공통: 종합 75 미만 흰색 · 75~89 초록 · 90+ 강조 | 이름 아래 포지션 영문 전체 | 우하단 CP/숫자 두 줄 — 변형은 90+ 표현과 잠금 알림</span>
  <div class="g"><button data-s="1" class="on">실제 크기</button><button data-s="2">크게 보기 (8장)</button></div></div>
<div class="wrap" id="wrap"></div>
<script type="module">
const M = await import('/src/KboAugmentDraft.jsx');
const POS_FULL = { SP: 'STARTING PITCHER', RP: 'RELIEF PITCHER', C: 'CATCHER', '1B': 'FIRST BASE', '2B': 'SECOND BASE', '3B': 'THIRD BASE', SS: 'SHORTSTOP', OF: 'OUTFIELDER', DH: 'DESIGNATED HITTER' };
const TEAM_NEON = { 한화: '#ff8a3d', 대한민국: '#60a5fa', SK: '#ff5a67', 롯데: '#7cb4ff', KIA: '#ff5a67', 해태: '#ff5a67', 두산: '#a5a3ff', OB: '#a5a3ff', NC: '#6cc0ff', 삼성: '#5aa2ff', 넥센: '#ff6b9a', 키움: '#ff6b9a', KT: '#e5e7eb', LG: '#ff5c95', 현대: '#6f97ff' };
const ORDER = ['SP', 'RP', 'C', '1B', '2B', '3B', 'SS', 'OF', 'DH'];
const LOCK = { 2: ['투수 마감', '#f59e0b'], 7: ['CP 부족', '#f43f5e'], 12: ['외국인 한도', '#38bdf8'] };
const LOCK_ICON = '<svg viewBox="0 0 20 20"><rect x="4.5" y="9" width="11" height="8" rx="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9"/></svg>';
const V = [
  ['금빛 발광 · 호박색 테두리 알림', '90+ 는 금색 숫자에 은은한 금빛 번짐 · 알림은 어두운 호박색 바탕 + 호박색 테두리 + 자물쇠'],
  ['금→주황 그라데이션 + 별 · 붉은 알림', '90+ 는 금에서 주황으로 흐르는 숫자 옆에 ★ · 알림은 진한 붉은 바탕에 위아래 붉은 선'],
  ['금판 위 숫자 · 흰 바탕 알림', '90+ 는 금색 판 위에 어두운 숫자 (가장 확실한 구분) · 알림은 흰 바탕 검은 글씨로 대비 최대'],
  ['무지개 흐름 · 경고 테이프', '90+ 는 무지개 색이 흐르는 숫자 · 알림은 카드를 가로지르는 사선 노란 경고 테이프'],
  ['금 테두리 카드 · 네온 붉은 알약', '90+ 는 숫자와 카드 테두리까지 금색 · 알림은 붉은 네온 테두리 알약'],
  ['금 숫자 + 반짝 밑줄 · 가로 띠', '90+ 는 금색 숫자 아래 빛나는 밑줄 · 알림은 카드 폭 전체를 가로지르는 어두운 띠에 호박색 글씨'],
  ['큰 금 외곽선 숫자 · 사유별 색 알림', '90+ 는 숫자를 더 크게 + 금 외곽선 · 알림은 자물쇠 위·사유 아래 두 줄, 사유마다 색 (마감 호박 · CP 부족 빨강 · 한도 하늘)'],
  ['금 광원 · 채운 그라데이션 알림', '90+ 는 숫자 뒤에서 금빛이 번지는 광원 · 알림은 호박→장미색으로 채운 사선 띠에 어두운 글씨'],
];

// 90+ · 75~89 · 75 미만이 고루 섞이도록 실제 선수에서 17명 고르기 (동일인 제외)
const seen = new Set();
const uniq = (p) => { const k = p.name; if (seen.has(k)) return false; seen.add(k); return true; };
const all = [...M.ALL_PLAYERS].sort((a, b) => b.overall - a.overall);
const top = all.filter((p) => p.overall >= 90).filter(uniq).filter((p, i, arr) => arr.findIndex((q) => q.position === p.position) === i).slice(0, 4);
const mid = all.filter((p) => p.overall >= 75 && p.overall < 90).filter(uniq).filter((p, i, arr) => arr.findIndex((q) => q.position === p.position) === i).slice(0, 7);
const low = all.filter((p) => p.overall < 75).filter(uniq).filter((p, i, arr) => arr.findIndex((q) => q.position === p.position) === i).slice(0, 6);
const players = [...top, ...mid, ...low].sort((a, b) => ORDER.indexOf(a.position) - ORDER.indexOf(b.position) || b.overall - a.overall).slice(0, 17);

let scale = 1;
const tier = (ov) => (ov >= 90 ? 't90 t75' : ov >= 75 ? 't75' : '');
function card(p, i) {
  const lock = LOCK[i];
  return `<div class="card ${tier(p.overall)} ${lock ? 'lock' : ''}" style="--n:${TEAM_NEON[p.team] || '#10b981'}">
    <img src="/cards/${encodeURIComponent(p.id)}.webp" alt="" /><span class="sh"></span><span class="fr"></span>
    <span class="ov disp">${p.overall}</span>
    <div class="bt"><div class="row"><span class="nm">${p.name}</span><span class="cp"><small class="disp">CP</small><b class="disp">${p.cost}</b></span></div><span class="pos disp">${POS_FULL[p.position]}</span></div>
    ${lock ? `<span class="lk" style="--r:${lock[1]}">${LOCK_ICON}<span>${lock[0]}</span></span>` : ''}
  </div>`;
}
function render() {
  const list = scale === 2 ? players.slice(0, 8) : players;
  document.body.classList.toggle('x2', scale === 2);
  document.getElementById('wrap').innerHTML = V.map(([n, d], v) => `
    <section class="v${v + 1}"><div class="vlab"><b><i class="disp">${v + 1}</i>${n}</b><span>${d}</span></div>
    <div class="panel"><div class="shelf">${list.map(card).join('')}</div></div></section>`).join('');
}
document.querySelectorAll('.top [data-s]').forEach((b) => b.onclick = () => { scale = +b.dataset.s; document.querySelectorAll('.top [data-s]').forEach((x) => x.classList.toggle('on', x === b)); render(); });
render();
window.__players = players.map((p) => `${p.name}:${p.position}:${p.overall}`);
</script>
</body>
</html>
