<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>선반 카드 글자 · 코스트 목업 16종</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700;800&family=Saira+Condensed:wght@500;600;700;800&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #03060c; color: #e5e7eb; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .disp { font-family: 'Saira Condensed', 'IBM Plex Sans KR', sans-serif; }
  .top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: rgba(3,6,12,.95); border-bottom: 1px solid #1f2937; font-size: 13px; color: #9ca3af; }
  .top b { color: #fff; font-size: 15px; }
  .top .g { margin-left: auto; display: flex; gap: 4px; }
  .top .g button { padding: 5px 11px; font-weight: 700; color: #d1d5db; box-shadow: inset 0 0 0 1px #374151; }
  .top .g button.on { color: #04150e; background: #10b981; box-shadow: none; }
  .wrap { display: flex; flex-direction: column; gap: 22px; padding: 16px 12px 60px; }
  .vlab { display: flex; align-items: baseline; gap: 12px; margin: 0 4px 7px; }
  .vlab b { font-size: 15px; color: #fff; white-space: nowrap; }
  .vlab b i { font-style: normal; color: #10b981; margin-right: 6px; }
  .vlab span { font-size: 12px; color: #9ca3af; }
  .panel { padding: 10px 6px; background: linear-gradient(180deg, rgba(6,10,19,.8), rgba(6,10,19,.92)), url(/ui/stadium.webp) center 40%/cover; box-shadow: inset 0 0 0 1px rgba(16,185,129,.25); overflow: hidden; }
  .shelf { display: grid; gap: 3px; grid-template-columns: repeat(17, minmax(0, 8rem)); justify-content: center; }
  .x2 .shelf { grid-template-columns: repeat(8, minmax(0, 11rem)); }

  /* 카드 공통 */
  .card { position: relative; aspect-ratio: 2/3; width: 100%; background: #05080f; container-type: inline-size; clip-path: polygon(10% 0,100% 0,100% 93.3%,90% 100%,0 100%,0 6.7%); overflow: hidden; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 18%; }
  .card .sh { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,8,15,.6) 0, rgba(5,8,15,0) 28%, rgba(5,8,15,0) 46%, rgba(5,8,15,.9) 74%, #05080f 100%); }
  .card .fr { position: absolute; inset: 2.5cqw; border: 1px solid color-mix(in srgb, var(--n) 40%, transparent); pointer-events: none; }
  .card.lock img { opacity: .35; filter: grayscale(1); }
  .card .lk { position: absolute; z-index: 5; left: 6cqw; right: 6cqw; top: 58cqw; padding: 3cqw 0; font-size: 11cqw; font-weight: 700; text-align: center; color: #f3f4f6; background: rgba(5,8,15,.92); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); }
  .card.lock > :not(img):not(.sh):not(.lk):not(.fr) { opacity: .45; }
  .nm { display: block; font-weight: 800; line-height: 1.05; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.02em; text-shadow: 0 1px 4px #000; }
  .tg { display: block; white-space: nowrap; overflow: hidden; }

  /* ① 플레이트 · 사선 코스트 */
  .k1 .tl { position: absolute; left: 0; top: 0; padding: 6cqw 14cqw 7cqw 8cqw; background: linear-gradient(135deg, rgba(5,8,15,.92) 50%, rgba(5,8,15,0) 80%); }
  .k1 .tl b { display: block; font-size: 32cqw; font-weight: 800; line-height: .85; color: var(--n); text-shadow: 0 0 10px color-mix(in srgb, var(--n) 60%, transparent); }
  .k1 .tl span { display: block; margin-top: 2cqw; font-size: 11.5cqw; font-weight: 700; color: #fff; }
  .k1 .bt { position: absolute; left: 7cqw; right: 7cqw; bottom: 22cqw; }
  .k1 .nm { font-size: 19cqw; }
  .k1 .tg { margin-top: 2cqw; font-size: 11cqw; font-weight: 600; color: #d1d5db; }
  .k1 .tg em { font-style: normal; color: var(--n); font-weight: 700; }
  .k1 .cp { position: absolute; right: 0; bottom: 0; display: flex; align-items: baseline; gap: 1.5cqw; padding: 2.5cqw 10cqw 3.5cqw 11cqw; background: var(--n); color: #05080f; clip-path: polygon(20% 0,100% 0,100% 100%,0 100%); }
  .k1 .cp b { font-size: 15cqw; font-weight: 800; line-height: 1; }
  .k1 .cp small { font-size: 8cqw; font-weight: 700; }

  /* ② 네온 박스 · 코인 */
  .k2 .tl { position: absolute; left: 7cqw; top: 7cqw; }
  .k2 .tl b { display: inline-block; padding: 1.5cqw 4cqw 0; font-size: 26cqw; font-weight: 800; line-height: 1; color: #05080f; background: var(--n); }
  .k2 .tl span { display: block; margin-top: 2.5cqw; font-size: 12cqw; font-weight: 800; letter-spacing: .06em; color: #fff; text-shadow: 0 1px 4px #000; }
  .k2 .cp { position: absolute; right: 6cqw; top: 7cqw; display: grid; place-items: center; width: 30cqw; height: 30cqw; border-radius: 50%; background: rgba(5,8,15,.85); box-shadow: inset 0 0 0 1.6cqw var(--n); line-height: 1; }
  .k2 .cp b { font-size: 12.5cqw; font-weight: 800; color: #fff; margin-top: 2cqw; }
  .k2 .cp small { font-size: 6.5cqw; font-weight: 700; color: var(--n); margin-top: -3cqw; }
  .k2 .bt { position: absolute; left: 7cqw; right: 7cqw; bottom: 8cqw; }
  .k2 .nm { font-size: 19cqw; }
  .k2 .tg { display: flex; gap: 2cqw; margin-top: 3cqw; }
  .k2 .tg i, .k2 .tg em { font-style: normal; padding: 1cqw 3cqw; font-size: 10.5cqw; font-weight: 700; }
  .k2 .tg i { color: #e5e7eb; box-shadow: inset 0 0 0 1px rgba(255,255,255,.45); }
  .k2 .tg em { color: #05080f; background: var(--n); }

  /* ③ 하단 밴드 */
  .k3 .ov { position: absolute; left: 7cqw; top: 6cqw; font-size: 33cqw; font-weight: 800; line-height: .85; color: var(--n); text-shadow: 0 0 2px #000, 0 2px 8px #000, 0 0 14px color-mix(in srgb, var(--n) 50%, transparent); }
  .k3 .ps { position: absolute; right: 5cqw; top: 6cqw; padding: 1.5cqw 3cqw; font-size: 10.5cqw; font-weight: 700; color: #fff; background: rgba(5,8,15,.8); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--n) 55%, transparent); }
  .k3 .band { position: absolute; left: 0; right: 0; bottom: 0; padding: 4cqw 7cqw 6cqw; background: rgba(5,8,15,.94); box-shadow: inset 0 1.2cqw 0 var(--n); }
  .k3 .nm { font-size: 18cqw; }
  .k3 .row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 2cqw; }
  .k3 .tg { font-size: 10.5cqw; font-weight: 600; color: #9ca3af; }
  .k3 .tg em { font-style: normal; color: #fff; }
  .k3 .cp b { font-size: 14cqw; font-weight: 800; color: var(--n); line-height: 1; }
  .k3 .cp small { font-size: 7.5cqw; font-weight: 700; color: #9ca3af; margin-left: 1cqw; }

  /* ④ 외곽선 숫자 · 영문 포지션 · 우상단 배지 */
  .k4 .tl { position: absolute; left: 7cqw; top: 6cqw; }
  .k4 .tl b { display: block; font-size: 34cqw; font-weight: 800; line-height: .82; color: #fff; -webkit-text-stroke: 2.2cqw #05080f; paint-order: stroke fill; }
  .k4 .tl span { display: block; margin-top: 2.5cqw; font-size: 9.5cqw; font-weight: 800; letter-spacing: .08em; color: var(--n); -webkit-text-stroke: 1.6cqw #05080f; paint-order: stroke fill; }
  .k4 .cp { position: absolute; right: 5cqw; top: 6cqw; padding: 2cqw 3cqw 1.5cqw; line-height: 1; text-align: center; background: rgba(5,8,15,.88); border-radius: 2cqw; box-shadow: inset 0 0 0 1px var(--n); }
  .k4 .cp b { display: block; font-size: 13cqw; font-weight: 800; color: #fff; }
  .k4 .cp small { display: block; font-size: 6.5cqw; font-weight: 700; color: var(--n); }
  .k4 .bt { position: absolute; left: 7cqw; right: 7cqw; bottom: 8cqw; }
  .k4 .nm { font-size: 20cqw; }
  .k4 .tg { margin-top: 2.5cqw; font-size: 11cqw; font-weight: 600; color: #d1d5db; }
  .k4 .tg em { font-style: normal; font-weight: 700; color: var(--n); padding-left: 3cqw; margin-left: 3cqw; border-left: 1px solid rgba(255,255,255,.35); }

  /* ⑤ 왼쪽 세로 띠 */
  .k5 .strip { position: absolute; left: 0; top: 0; width: 30cqw; padding: 6cqw 0 5cqw; text-align: center; background: rgba(5,8,15,.86); box-shadow: inset -1cqw 0 0 var(--n); }
  .k5 .strip b { display: block; font-size: 22cqw; font-weight: 800; line-height: 1; color: #fff; }
  .k5 .strip span { display: block; margin-top: 1.5cqw; font-size: 9.5cqw; font-weight: 700; color: var(--n); }
  .k5 .bt { position: absolute; left: 7cqw; right: 30cqw; bottom: 8cqw; }
  .k5 .nm { font-size: 19cqw; }
  .k5 .tg { margin-top: 2.5cqw; font-size: 10.5cqw; font-weight: 600; color: #d1d5db; }
  .k5 .tg em { font-style: normal; display: block; color: var(--n); font-weight: 700; }
  .k5 .cp { position: absolute; right: 7cqw; bottom: 8cqw; text-align: right; line-height: 1; }
  .k5 .cp small { display: block; font-size: 7cqw; font-weight: 700; color: #9ca3af; }
  .k5 .cp b { display: block; font-size: 17cqw; font-weight: 800; color: var(--n); }

  /* ⑥ 숫자 밑줄 · 보석 코스트 */
  .k6 .tl { position: absolute; left: 7cqw; top: 6cqw; }
  .k6 .tl b { display: block; font-size: 32cqw; font-weight: 800; line-height: .85; color: #fff; text-shadow: 0 2px 8px #000; }
  .k6 .tl i { display: block; width: 22cqw; height: 2.4cqw; margin: 2cqw 0 2cqw; background: var(--n); box-shadow: 0 0 6px var(--n); }
  .k6 .tl span { display: block; font-size: 11cqw; font-weight: 700; color: #f3f4f6; text-shadow: 0 1px 4px #000; }
  .k6 .bt { position: absolute; left: 7cqw; right: 34cqw; bottom: 8cqw; }
  .k6 .nm { font-size: 19cqw; }
  .k6 .tg { margin-top: 2.5cqw; font-size: 10.5cqw; font-weight: 600; color: #d1d5db; line-height: 1.3; }
  .k6 .tg em { font-style: normal; display: block; font-weight: 700; color: var(--n); }
  .k6 .cp { position: absolute; right: 7cqw; bottom: 9cqw; width: 25cqw; height: 25cqw; display: grid; place-items: center; }
  .k6 .cp::before { content: ""; position: absolute; inset: 3cqw; background: var(--n); transform: rotate(45deg); box-shadow: 0 0 8px color-mix(in srgb, var(--n) 60%, transparent); }
  .k6 .cp b { position: relative; font-size: 12cqw; font-weight: 800; color: #05080f; }
  .k6 .cp small { display: none; }

  /* ⑦ 유리 패널 */
  .k7 .tl { position: absolute; left: 5cqw; top: 5cqw; padding: 3cqw 5cqw 3cqw 4cqw; background: rgba(5,8,15,.55); backdrop-filter: blur(3px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--n) 45%, transparent); }
  .k7 .tl b { display: block; font-size: 28cqw; font-weight: 800; line-height: .85; color: var(--n); }
  .k7 .tl span { display: block; margin-top: 2cqw; font-size: 10cqw; font-weight: 800; letter-spacing: .05em; color: #fff; }
  .k7 .glass { position: absolute; left: 4cqw; right: 4cqw; bottom: 5cqw; padding: 4cqw 4cqw 3.5cqw; background: rgba(5,8,15,.62); backdrop-filter: blur(3px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .k7 .nm { font-size: 18cqw; }
  .k7 .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 2cqw; }
  .k7 .tg { font-size: 10cqw; font-weight: 600; color: #d1d5db; }
  .k7 .tg em { font-style: normal; color: var(--n); font-weight: 700; }
  .k7 .cp b { font-size: 13cqw; font-weight: 800; color: #fff; }
  .k7 .cp small { font-size: 7cqw; color: var(--n); font-weight: 700; margin-left: .5cqw; }

  /* ⑧ 중계 자막 */
  .k8 .tl { position: absolute; left: 7cqw; top: 6cqw; padding-left: 3.5cqw; box-shadow: inset 1.6cqw 0 0 var(--n); }
  .k8 .tl b { display: block; font-size: 31cqw; font-weight: 800; line-height: .85; color: #fff; text-shadow: 0 2px 8px #000; }
  .k8 .tl span { display: block; margin-top: 2cqw; font-size: 10.5cqw; font-weight: 700; color: var(--n); text-shadow: 0 1px 4px #000; }
  .k8 .lt { position: absolute; left: 0; right: 0; bottom: 7cqw; }
  .k8 .bar { display: flex; align-items: stretch; }
  .k8 .nm { flex: 1; min-width: 0; padding: 2.5cqw 3cqw 2cqw 6cqw; font-size: 17cqw; background: linear-gradient(90deg, #0f1a2b, #152238); box-shadow: inset 1.6cqw 0 0 var(--n); }
  .k8 .cp { display: flex; align-items: center; padding: 0 4cqw 0 5cqw; background: var(--n); clip-path: polygon(22% 0,100% 0,100% 100%,0 100%); margin-left: -3cqw; }
  .k8 .cp b { font-size: 13cqw; font-weight: 800; color: #05080f; }
  .k8 .cp small { display: none; }
  .k8 .tg { padding: 2cqw 0 0 7cqw; font-size: 10.5cqw; font-weight: 600; color: #d1d5db; }
  .k8 .tg em { font-style: normal; color: var(--n); font-weight: 700; }

  /* ⑨ 모서리 컷 */
  .k9 .cn { position: absolute; left: 0; top: 0; width: 48cqw; height: 48cqw; background: var(--n); clip-path: polygon(0 0,100% 0,0 100%); }
  .k9 .cn b { position: absolute; left: 6cqw; top: 4cqw; font-size: 22cqw; font-weight: 800; line-height: 1; color: #05080f; }
  .k9 .ps { position: absolute; left: 6cqw; top: 36cqw; font-size: 11cqw; font-weight: 700; color: #fff; text-shadow: 0 1px 4px #000; }
  .k9 .bt { position: absolute; left: 7cqw; right: 30cqw; bottom: 8cqw; }
  .k9 .nm { font-size: 19cqw; }
  .k9 .tg { margin-top: 2.5cqw; font-size: 10.5cqw; font-weight: 600; color: #d1d5db; line-height: 1.3; }
  .k9 .tg em { font-style: normal; display: block; font-weight: 700; color: var(--n); }
  .k9 .cp { position: absolute; right: 0; bottom: 0; width: 44cqw; height: 44cqw; background: var(--n); clip-path: polygon(100% 0,100% 100%,0 100%); }
  .k9 .cp b { position: absolute; right: 6cqw; bottom: 6cqw; font-size: 14cqw; font-weight: 800; line-height: 1; color: #05080f; }
  .k9 .cp small { position: absolute; right: 6cqw; bottom: 21cqw; font-size: 6.5cqw; font-weight: 800; color: #05080f; }

  /* ⑩ 미니멀 대비 */
  .k10 .sh { background: linear-gradient(180deg, rgba(5,8,15,.75) 0, rgba(5,8,15,0) 32%, rgba(5,8,15,0) 44%, rgba(5,8,15,.95) 72%, #05080f 100%); }
  .k10 .tl { position: absolute; left: 7cqw; top: 6cqw; }
  .k10 .tl b { display: block; font-size: 34cqw; font-weight: 800; line-height: .82; color: #fff; text-shadow: 0 2px 10px #000; }
  .k10 .tl span { display: inline-block; margin-top: 2.5cqw; padding: 1cqw 3cqw; font-size: 10.5cqw; font-weight: 800; color: #fff; background: rgba(255,255,255,.16); }
  .k10 .bt { position: absolute; left: 7cqw; right: 26cqw; bottom: 8cqw; }
  .k10 .nm { font-size: 20cqw; }
  .k10 .tg { margin-top: 2.5cqw; font-size: 11cqw; font-weight: 600; color: #cbd5e1; line-height: 1.3; }
  .k10 .tg em { font-style: normal; display: block; color: var(--n); font-weight: 700; }
  .k10 .cp { position: absolute; right: 7cqw; bottom: 8cqw; text-align: right; line-height: 1; }
  .k10 .cp small { display: block; font-size: 7cqw; font-weight: 700; color: #9ca3af; letter-spacing: .1em; }
  .k10 .cp b { display: block; font-size: 16cqw; font-weight: 800; color: var(--n); }

  /* ⑪ 태그 채움 · 알약 코스트 */
  .k11 .tl { position: absolute; left: 7cqw; top: 6cqw; }
  .k11 .tl b { display: block; font-size: 31cqw; font-weight: 800; line-height: .85; color: var(--n); text-shadow: 0 0 2px #000, 0 2px 8px #000; }
  .k11 .tl span { display: block; margin-top: 2cqw; font-size: 11cqw; font-weight: 700; color: #fff; text-shadow: 0 1px 4px #000; }
  .k11 .bt { position: absolute; left: 6cqw; right: 6cqw; bottom: 7cqw; }
  .k11 .nm { font-size: 19cqw; }
  .k11 .row { display: flex; align-items: center; justify-content: space-between; margin-top: 3cqw; gap: 2cqw; }
  .k11 .tg { display: flex; gap: 1.5cqw; }
  .k11 .tg i, .k11 .tg em { font-style: normal; padding: .8cqw 2.4cqw; font-size: 9.5cqw; font-weight: 700; border-radius: 1.5cqw; }
  .k11 .tg i { color: #e5e7eb; background: rgba(255,255,255,.14); }
  .k11 .tg em { color: #05080f; background: var(--n); }
  .k11 .cp { flex: none; display: inline-flex; align-items: center; gap: 1.5cqw; padding: .8cqw 3cqw .8cqw 2cqw; border-radius: 99px; background: color-mix(in srgb, var(--n) 18%, rgba(5,8,15,.8)); box-shadow: inset 0 0 0 1px var(--n); }
  .k11 .cp::before { content: ""; width: 5cqw; height: 5cqw; border-radius: 50%; background: var(--n); }
  .k11 .cp b { font-size: 11cqw; font-weight: 800; color: #fff; }
  .k11 .cp small { display: none; }

  /* ⑫ 포지션 리본 · 오른쪽 탭 */
  .k12 .ov { position: absolute; left: 7cqw; top: 6cqw; font-size: 31cqw; font-weight: 800; line-height: .85; color: #fff; text-shadow: 0 2px 8px #000; }
  .k12 .rb { position: absolute; left: 0; top: 34cqw; padding: 1.5cqw 7cqw 1.5cqw 7cqw; font-size: 10.5cqw; font-weight: 800; color: #05080f; background: var(--n); clip-path: polygon(0 0,100% 0,88% 100%,0 100%); }
  .k12 .bt { position: absolute; left: 7cqw; right: 7cqw; bottom: 8cqw; }
  .k12 .nm { font-size: 19cqw; }
  .k12 .tg { margin-top: 2.5cqw; font-size: 10.5cqw; font-weight: 600; color: #d1d5db; }
  .k12 .tg em { font-style: normal; color: var(--n); font-weight: 700; }
  .k12 .cp { position: absolute; right: 0; top: 6cqw; padding: 2cqw 4cqw 2cqw 6cqw; line-height: 1; text-align: right; background: rgba(5,8,15,.88); box-shadow: inset -1.4cqw 0 0 var(--n); clip-path: polygon(14% 0,100% 0,100% 100%,0 100%); }
  .k12 .cp b { display: block; font-size: 13cqw; font-weight: 800; color: #fff; }
  .k12 .cp small { display: block; font-size: 6.5cqw; font-weight: 700; color: var(--n); }

  /* ⑬ 스탯 카드형 · 코스트 바 */
  .k13 .hd { position: absolute; left: 6cqw; top: 6cqw; display: flex; align-items: center; gap: 3cqw; padding: 2cqw 4cqw 2cqw 3cqw; background: rgba(5,8,15,.82); }
  .k13 .hd b { font-size: 24cqw; font-weight: 800; line-height: .9; color: var(--n); }
  .k13 .hd i { width: 1px; align-self: stretch; background: rgba(255,255,255,.25); }
  .k13 .hd span { font-size: 10.5cqw; font-weight: 800; line-height: 1.1; color: #fff; }
  .k13 .bt { position: absolute; left: 7cqw; right: 7cqw; bottom: 21cqw; }
  .k13 .nm { font-size: 19cqw; }
  .k13 .tg { margin-top: 2cqw; font-size: 10.5cqw; font-weight: 600; color: #d1d5db; }
  .k13 .tg em { font-style: normal; color: var(--n); font-weight: 700; }
  .k13 .cp { position: absolute; left: 5cqw; right: 5cqw; bottom: 5cqw; display: flex; align-items: center; justify-content: space-between; padding: 1.5cqw 3cqw; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .k13 .cp small { order: -1; font-size: 8cqw; font-weight: 700; letter-spacing: .1em; color: #9ca3af; }
  .k13 .cp b { font-size: 12.5cqw; font-weight: 800; color: var(--n); line-height: 1; }

  /* ⑭ 등급 색 숫자 · 티켓 코스트 */
  .k14 .tl { position: absolute; left: 7cqw; top: 6cqw; }
  .k14 .tl b { display: block; font-size: 33cqw; font-weight: 800; line-height: .85; color: var(--g); text-shadow: 0 0 2px #000, 0 2px 8px #000, 0 0 12px color-mix(in srgb, var(--g) 45%, transparent); }
  .k14 .tl span { display: block; margin-top: 2cqw; font-size: 11cqw; font-weight: 700; color: #fff; text-shadow: 0 1px 4px #000; }
  .k14 .bt { position: absolute; left: 7cqw; right: 7cqw; bottom: 22cqw; }
  .k14 .nm { font-size: 19cqw; }
  .k14 .tg { margin-top: 2cqw; font-size: 10.5cqw; font-weight: 600; color: #d1d5db; }
  .k14 .tg em { font-style: normal; color: var(--n); font-weight: 700; }
  .k14 .cp { position: absolute; left: 7cqw; right: 7cqw; bottom: 6cqw; display: flex; align-items: center; justify-content: center; gap: 2cqw; height: 13cqw; background: var(--n);
    -webkit-mask: radial-gradient(circle 3cqw at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 3cqw at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
            mask: radial-gradient(circle 3cqw at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 3cqw at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat; }
  .k14 .cp b { font-size: 11.5cqw; font-weight: 800; color: #05080f; line-height: 1; }
  .k14 .cp small { font-size: 7.5cqw; font-weight: 800; color: #05080f; }

  /* ⑮ 두 줄 정보 (포지션을 아래 줄로) */
  .k15 .ov { position: absolute; left: 7cqw; top: 6cqw; font-size: 35cqw; font-weight: 800; line-height: .82; color: var(--n); text-shadow: 0 0 2px #000, 0 2px 8px #000; }
  .k15 .cp { position: absolute; right: 5cqw; top: 6cqw; padding: 1.5cqw 3cqw; line-height: 1; background: rgba(5,8,15,.86); box-shadow: inset 0 -1cqw 0 var(--n); }
  .k15 .cp b { font-size: 12.5cqw; font-weight: 800; color: #fff; }
  .k15 .cp small { font-size: 6.5cqw; font-weight: 700; color: #9ca3af; margin-left: .5cqw; }
  .k15 .bt { position: absolute; left: 7cqw; right: 6cqw; bottom: 8cqw; }
  .k15 .nm { font-size: 20cqw; }
  .k15 .tg { margin-top: 3cqw; font-size: 11cqw; font-weight: 600; color: #9ca3af; }
  .k15 .tg b { color: #fff; font-weight: 800; }
  .k15 .tg em { font-style: normal; color: var(--n); font-weight: 700; }

  /* ⑯ 배지 스택 */
  .k16 .ov { position: absolute; left: 7cqw; top: 6cqw; font-size: 32cqw; font-weight: 800; line-height: .85; color: #fff; text-shadow: 0 2px 8px #000; }
  .k16 .cp { position: absolute; right: 5cqw; top: 6cqw; display: flex; align-items: baseline; gap: 1cqw; padding: 2cqw 3.5cqw; background: var(--n); clip-path: polygon(3cqw 0,100% 0,100% calc(100% - 3cqw),calc(100% - 3cqw) 100%,0 100%,0 3cqw); }
  .k16 .cp b { font-size: 12.5cqw; font-weight: 800; line-height: 1; color: #05080f; }
  .k16 .cp small { font-size: 6.5cqw; font-weight: 800; color: #05080f; }
  .k16 .bt { position: absolute; left: 6cqw; right: 6cqw; bottom: 7cqw; }
  .k16 .nm { font-size: 19cqw; }
  .k16 .tg { display: flex; flex-wrap: wrap; gap: 1.5cqw; margin-top: 3cqw; }
  .k16 .tg b, .k16 .tg i, .k16 .tg em { font-style: normal; padding: .8cqw 2.2cqw; font-size: 9.5cqw; font-weight: 700; }
  .k16 .tg b { color: #05080f; background: #fff; }
  .k16 .tg i { color: #e5e7eb; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
  .k16 .tg em { color: var(--n); box-shadow: inset 0 0 0 1px var(--n); }

  /* 현재(기준) */
  .k0 .ov { position: absolute; left: 8cqw; top: 6cqw; font-size: 26cqw; font-weight: 700; line-height: .85; color: var(--n); text-shadow: 0 1px 3px #000; }
  .k0 .ps { position: absolute; left: 8cqw; top: 31cqw; font-size: 8.5cqw; font-weight: 700; letter-spacing: .1em; color: #fff; }
  .k0 .nm { position: absolute; left: 8cqw; right: 8cqw; bottom: 19cqw; font-size: 14cqw; font-weight: 700; }
  .k0 .ft { position: absolute; left: 8cqw; right: 8cqw; bottom: 6.5cqw; display: flex; justify-content: space-between; align-items: center; }
  .k0 .ft span { font-size: 8cqw; font-weight: 700; color: rgba(255,255,255,.8); }
  .k0 .ft b { font-size: 10cqw; line-height: 1; padding: 1.2cqw 3.4cqw; background: var(--n); color: #05080f; }
</style>
</head>
<body>
<div class="top"><b>선반 카드 글자 · 코스트 목업 16종</b><span>실제 선반 크기(17장 한 줄)로 보입니다. 3·8·13번째 카드는 잠긴 상태 예시.</span>
  <div class="g"><button data-s="1" class="on">실제 크기</button><button data-s="2">크게 보기 (8장)</button></div></div>
<div class="wrap" id="wrap"></div>
<script>
const POS_KO = { SP: '선발투수', RP: '불펜투수', C: '포수', '1B': '1루수', '2B': '2루수', '3B': '3루수', SS: '유격수', OF: '외야수', DH: '지명타자' };
const POS_EN = { SP: 'STARTER', RP: 'RELIEVER', C: 'CATCHER', '1B': '1ST BASE', '2B': '2ND BASE', '3B': '3RD BASE', SS: 'SHORTSTOP', OF: 'OUTFIELD', DH: 'DH' };
const POS_SHORT = { SP: '선발', RP: '불펜', C: '포수', '1B': '1루', '2B': '2루', '3B': '3루', SS: '유격', OF: '외야', DH: '지명' };
const NEON = { 두산: '#a5a3ff', 대한민국: '#60a5fa' };
const LOCK = { 2: '투수 마감', 7: 'CP 부족', 12: '외국인 한도' };
const ORDER = ['SP', 'RP', 'C', '1B', '2B', '3B', 'SS', 'OF', 'DH'];
const hand = (p) => (p.position === 'SP' || p.position === 'RP') ? (p.hand === 'L' ? '좌투' : '우투') : (p.hand === 'L' ? '좌타' : p.hand === 'S' ? '양타' : '우타');
const isNat = (p) => p.team === '대한민국' || p.sid === '2008-beijing';
const special = (p) => (p.isForeign ? '외인' : isNat(p) ? '국대' : '');
const grade = (ov) => (ov >= 85 ? '#fbbf24' : ov >= 75 ? '#34d399' : '#e5e7eb');

const V = [
  ['현재 (기준)', '지금 게임 그대로 — 비교용', (p) => `<span class="ov disp">${p.ov}</span><span class="ps disp">${p.position}</span><span class="nm">${p.name}</span><span class="ft"><span class="disp">${special(p) || hand(p)}</span><b class="disp">${p.cost}</b></span>`],
  ['플레이트 · 사선 코스트', '종합은 왼쪽 위 어두운 판 위 네온 · 포지션 한글 전체 · 태그 “우투 · 외인” · 코스트는 오른쪽 아래 사선 네온 탭', (p) => `<div class="tl"><b class="disp">${p.ov}</b><span>${POS_KO[p.position]}</span></div><div class="bt"><span class="nm">${p.name}</span><span class="tg">${hand(p)}${special(p) ? ` · <em>${special(p)}</em>` : ''}</span></div><span class="cp"><b class="disp">${p.cost}</b><small class="disp">CP</small></span>`],
  ['네온 박스 · 코인', '종합을 네온 상자에 · 포지션 영문 굵게 · 태그 칩(특별은 채움) · 코스트는 오른쪽 위 동전', (p) => `<div class="tl"><b class="disp">${p.ov}</b><span class="disp">${p.position}</span></div><span class="cp"><b class="disp">${p.cost}</b><small class="disp">CP</small></span><div class="bt"><span class="nm">${p.name}</span><span class="tg"><i>${hand(p)}</i>${special(p) ? `<em>${special(p)}</em>` : ''}</span></div>`],
  ['하단 밴드', '아래 전체를 어두운 띠로 묶어 대비 확보 · 포지션은 오른쪽 위 칩 · 띠 안에 이름 / 태그 · 코스트', (p) => `<span class="ov disp">${p.ov}</span><span class="ps">${POS_KO[p.position]}</span><div class="band"><span class="nm">${p.name}</span><div class="row"><span class="tg">${hand(p)}${special(p) ? ` · <em>${special(p)}</em>` : ''}</span><span class="cp"><b class="disp">${p.cost}</b><small class="disp">CP</small></span></div></div>`],
  ['외곽선 숫자 · 우상단 배지', '숫자에 검은 외곽선을 둘러 배경과 섞이지 않게 · 포지션 영문 전체 · 코스트는 오른쪽 위 테두리 배지', (p) => `<div class="tl"><b class="disp">${p.ov}</b><span class="disp">${POS_EN[p.position]}</span></div><span class="cp"><b class="disp">${p.cost}</b><small class="disp">CP</small></span><div class="bt"><span class="nm">${p.name}</span><span class="tg">${hand(p)}${special(p) ? `<em>${special(p)}</em>` : ''}</span></div>`],
  ['왼쪽 세로 띠', '종합·포지션을 왼쪽 위 어두운 세로 띠에 · 코스트는 오른쪽 아래 “CP / 숫자” 두 줄', (p) => `<div class="strip"><b class="disp">${p.ov}</b><span>${POS_SHORT[p.position]}</span></div><div class="bt"><span class="nm">${p.name}</span><span class="tg">${hand(p)}${special(p) ? `<em>${special(p)}</em>` : ''}</span></div><span class="cp"><small class="disp">CP</small><b class="disp">${p.cost}</b></span>`],
  ['숫자 밑줄 · 보석', '흰 숫자 + 네온 밑줄 · 포지션 한글 · 코스트는 마름모 보석', (p) => `<div class="tl"><b class="disp">${p.ov}</b><i></i><span>${POS_KO[p.position]}</span></div><div class="bt"><span class="nm">${p.name}</span><span class="tg">${hand(p)}${special(p) ? `<em>${special(p)}</em>` : ''}</span></div><span class="cp"><b class="disp">${p.cost}</b><small>CP</small></span>`],
  ['유리 패널', '위·아래 반투명 유리 판 두 장에 정보를 모음 · 아래 판 오른쪽에 “78CP”', (p) => `<div class="tl"><b class="disp">${p.ov}</b><span class="disp">${p.position}</span></div><div class="glass"><span class="nm">${p.name}</span><div class="row"><span class="tg">${hand(p)}${special(p) ? ` · <em>${special(p)}</em>` : ''}</span><span class="cp"><b class="disp">${p.cost}</b><small class="disp">CP</small></span></div></div>`],
  ['중계 자막', '이름을 중계 자막 바에 · 바 끝에 사선 네온 코스트 · 종합은 왼쪽 세로 선', (p) => `<div class="tl"><b class="disp">${p.ov}</b><span>${POS_KO[p.position]}</span></div><div class="lt"><div class="bar"><span class="nm">${p.name}</span><span class="cp"><b class="disp">${p.cost}</b><small>CP</small></span></div><span class="tg">${hand(p)}${special(p) ? ` · <em>${special(p)}</em>` : ''}</span></div>`],
  ['모서리 컷', '왼쪽 위 네온 삼각형에 종합 · 오른쪽 아래 삼각형에 코스트 — 카드 컷 모양과 맞춤', (p) => `<div class="cn"><b class="disp">${p.ov}</b></div><span class="ps">${POS_KO[p.position]}</span><div class="bt"><span class="nm">${p.name}</span><span class="tg">${hand(p)}${special(p) ? `<em>${special(p)}</em>` : ''}</span></div><span class="cp"><small class="disp">CP</small><b class="disp">${p.cost}</b></span>`],
  ['미니멀 대비', '아래 암부를 진하게 · 흰 큰 숫자 + 영문 포지션 칩 · 코스트는 상자 없이 “CP / 숫자”', (p) => `<div class="tl"><b class="disp">${p.ov}</b><span class="disp">${p.position}</span></div><div class="bt"><span class="nm">${p.name}</span><span class="tg">${hand(p)}${special(p) ? `<em>${special(p)}</em>` : ''}</span></div><span class="cp"><small class="disp">CP</small><b class="disp">${p.cost}</b></span>`],
  ['태그 채움 · 알약', '투타 칩(회색) + 특별 칩(네온 채움) · 코스트는 점 달린 알약', (p) => `<div class="tl"><b class="disp">${p.ov}</b><span>${POS_KO[p.position]}</span></div><div class="bt"><span class="nm">${p.name}</span><div class="row"><span class="tg"><i>${hand(p)}</i>${special(p) ? `<em>${special(p)}</em>` : ''}</span><span class="cp"><b class="disp">${p.cost}</b><small>CP</small></span></div></div>`],
  ['포지션 리본 · 오른쪽 탭', '숫자 아래 네온 리본에 포지션 · 코스트는 오른쪽 위 가장자리 탭', (p) => `<span class="ov disp">${p.ov}</span><span class="rb">${POS_KO[p.position]}</span><span class="cp"><b class="disp">${p.cost}</b><small class="disp">CP</small></span><div class="bt"><span class="nm">${p.name}</span><span class="tg">${hand(p)}${special(p) ? ` · <em>${special(p)}</em>` : ''}</span></div>`],
  ['스탯 카드형 · 코스트 바', '왼쪽 위 “종합 | 포지션” 한 덩어리 · 맨 아래 가로 코스트 바 “CP ··· 78”', (p) => `<div class="hd"><b class="disp">${p.ov}</b><i></i><span>${POS_KO[p.position]}</span></div><div class="bt"><span class="nm">${p.name}</span><span class="tg">${hand(p)}${special(p) ? ` · <em>${special(p)}</em>` : ''}</span></div><span class="cp"><b class="disp">${p.cost}</b><small class="disp">CP</small></span>`],
  ['등급 색 숫자 · 티켓', '종합 85+ 금 · 75+ 초록 · 그 아래 흰색 · 코스트는 양옆 홈이 파인 티켓', (p) => `<div class="tl" style="--g:${grade(p.ov)}"><b class="disp">${p.ov}</b><span>${POS_KO[p.position]}</span></div><div class="bt"><span class="nm">${p.name}</span><span class="tg">${hand(p)}${special(p) ? ` · <em>${special(p)}</em>` : ''}</span></div><span class="cp"><b class="disp">${p.cost}</b><small class="disp">CP</small></span>`],
  ['두 줄 정보', '위에는 큰 종합만 · 포지션을 아래 줄로 내려 “선발 · 우투 · 외인” · 코스트는 오른쪽 위', (p) => `<span class="ov disp">${p.ov}</span><span class="cp"><b class="disp">${p.cost}</b><small class="disp">CP</small></span><div class="bt"><span class="nm">${p.name}</span><span class="tg"><b>${POS_SHORT[p.position]}</b> · ${hand(p)}${special(p) ? ` · <em>${special(p)}</em>` : ''}</span></div>`],
  ['배지 스택', '코스트는 오른쪽 위 네온 컷 배지 · 이름 아래 칩 세 개: 포지션(흰) · 투타 · 특별(네온)', (p) => `<span class="ov disp">${p.ov}</span><span class="cp"><b class="disp">${p.cost}</b><small class="disp">CP</small></span><div class="bt"><span class="nm">${p.name}</span><span class="tg"><b class="disp">${p.position}</b><i>${hand(p)}</i>${special(p) ? `<em>${special(p)}</em>` : ''}</span></div>`],
];

let players = [];
let scale = 1;
function card(p, i, v) {
  const lock = LOCK[i];
  return `<div class="card ${lock ? 'lock' : ''}" style="--n:${isNat(p) ? NEON.대한민국 : NEON[p.team] || '#10b981'}"><img src="/cards/${encodeURIComponent(p.sid + '_' + p.name)}.webp" alt="" /><span class="sh"></span><span class="fr"></span>${V[v][2](p)}${lock ? `<span class="lk">${lock}</span>` : ''}</div>`;
}
function render() {
  const list = scale === 2 ? players.slice(0, 8) : players;
  document.body.classList.toggle('x2', scale === 2);
  document.getElementById('wrap').innerHTML = V.map(([n, d], v) => `
    <section class="k${v}"><div class="vlab"><b><i class="disp">${v === 0 ? '기준' : v}</i>${n}</b><span>${d}</span></div>
    <div class="panel"><div class="shelf">${list.map((p, i) => card(p, i, v)).join('')}</div></div></section>`).join('');
}
document.querySelectorAll('.top [data-s]').forEach((b) => b.onclick = () => { scale = +b.dataset.s; document.querySelectorAll('.top [data-s]').forEach((x) => x.classList.toggle('on', x === b)); render(); });

const mk = (sid) => fetch(`/src/data/series/${sid}.json`).then((r) => r.json()).then((d) => d.players.map((p) => {
  const vals = Object.values(p.stats);
  const ov = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
  return { ...p, sid, ov, cost: Math.max(40, Math.round(ov * 1.05 - 8)) };
}));
Promise.all([mk('2016-doosan'), mk('2008-beijing')]).then(([doo, bj]) => {
  const pickD = ['니퍼트', '보우덴', '장원준', '이현승', '양의지', '오재일', '에반스', '허경민', '김재환', '박건우'];
  const d = pickD.map((n) => doo.find((p) => p.name === n)).filter(Boolean);
  const b = bj.filter((p) => ['RP', 'SS', 'OF', '2B', 'C', 'DH', '1B', 'SP', '3B'].includes(p.position)).slice(0, 17 - d.length);
  players = [...d, ...b].sort((x, y) => ORDER.indexOf(x.position) - ORDER.indexOf(y.position) || y.ov - x.ov).slice(0, 17);
  render();
});
</script>
</body>
</html>
