<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>경기 중 결과 표시 목업</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Saira+Condensed:ital,wght@0,700;0,800;1,800&display=swap">
<!--
  중계 화면 가운데 결과 표시 — 지금은 삼진 · 병살타 · 홈런 · 'N회 종료 · 점수'가 모두 같은 노란 70px 글자로 내야 한가운데에 뜬다.
  · 내야 선수 칩을 가린다 · 우리에게 좋은지 나쁜지 색으로 안 갈린다 · 자주 나오는 결과(삼진)와 드문 결과(홈런)가 같은 무게
  비슷한 게임:
   · MLB 더 쇼 — 결과는 아래쪽 방송 띠(하단 자막), 홈런 · 끝내기만 화면을 크게 쓴다
   · 컴투스 프로야구 · MLB 9이닝스 — 삼진 · 안타는 작은 도장, 홈런은 가운데 큰 연출 + 빛
   · KBO 중계 그래픽 — 팀 색 띠 + 선수 이름 · 결과 한 줄
  규칙(CLAUDE.md): 자주 보는 것은 짧고 가볍게(들어옴 0.18초), 드문 순간(홈런)만 크게. 모두 누르면 건너뜀.
  색: 우리에게 좋은 일 초록(#34d399) · 나쁜 일 빨강(#f87171) · 이닝 · 공수 교대는 중립(금색)
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1920px; height: 911px; overflow: hidden; background: #05080f; font-family: 'IBM Plex Sans KR', sans-serif; color: #fff; }
  .d { font-family: 'Saira Condensed', 'IBM Plex Sans KR', sans-serif; }
  .shot { position: absolute; inset: 0; width: 1920px; height: 911px; }
  .field { position: absolute; left: 24px; top: 72px; width: 1416px; height: 818px; overflow: hidden; border-radius: 24px; pointer-events: none; }
  .bar { position: fixed; left: 12px; bottom: 12px; z-index: 50; display: flex; gap: 4px; padding: 5px; border-radius: 12px; background: rgba(20,24,38,.96); box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 10px 30px #000; }
  .bar button { all: unset; cursor: pointer; padding: 7px 12px; border-radius: 8px; font-weight: 700; font-size: 13px; color: #94a3b8; }
  .bar button.on { background: rgba(251,191,36,.16); color: #fbbf24; box-shadow: inset 0 0 0 2px #fbbf24; }
  .bar i { width: 1px; background: rgba(255,255,255,.15); margin: 4px; }
  .cap { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 50; padding: 6px 14px; border-radius: 10px; background: rgba(251,191,36,.95); color: #1a1205; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .g { --k: #34d399; } .r { --k: #f87171; } .n { --k: #f5d27a; }

  /* ── A 방송 띠 — 구장 위쪽(관중석 앞)을 가로지르는 팀 색 띠. 내야는 비워 둔다 ── */
  .a { position: absolute; left: 0; right: 0; top: 150px; display: flex; align-items: center; gap: 22px; padding: 14px 40px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--k) 70%, transparent), color-mix(in srgb, var(--k) 22%, transparent) 45%, transparent 80%);
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--k) 70%, transparent), inset 0 -1px 0 color-mix(in srgb, var(--k) 40%, transparent);
    animation: aIn .18s ease-out both; }
  .a b { font-size: 46px; font-weight: 700; line-height: 1; text-shadow: 0 4px 18px rgba(0,0,0,.6); }
  .a span { font-size: 18px; font-weight: 600; color: rgba(255,255,255,.85); }
  .a.big { top: 250px; padding: 26px 60px; background: linear-gradient(90deg, color-mix(in srgb, var(--k) 85%, transparent), color-mix(in srgb, var(--k) 35%, transparent) 55%, transparent 90%); }
  .a.big b { font-size: 84px; }
  @keyframes aIn { from { opacity: 0; transform: translateX(-60px); clip-path: inset(0 100% 0 0); } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); } }

  /* ── B 도장 — 승률 알약 아래 작은 배지. 홈런만 가운데 큰 도장 ── */
  .b { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 12px 30px 10px; border-radius: 16px; background: rgba(7,10,18,.82); backdrop-filter: blur(10px);
    box-shadow: inset 0 0 0 2px var(--k), 0 12px 30px rgba(0,0,0,.5), 0 0 30px -6px var(--k); animation: bIn .18s cubic-bezier(.2,1.4,.4,1) both; }
  .b b { font-size: 36px; font-weight: 700; line-height: 1; color: var(--k); }
  .b span { font-size: 15px; font-weight: 600; color: #cbd5e1; }
  .b.big { top: 50%; transform: translate(-50%, -60%); padding: 26px 64px 20px; border-radius: 26px; box-shadow: inset 0 0 0 3px var(--k), 0 20px 60px rgba(0,0,0,.6), 0 0 90px -10px var(--k); animation: bBig .28s cubic-bezier(.2,1.5,.4,1) both; }
  .b.big b { font-size: 76px; }
  @keyframes bIn { from { opacity: 0; transform: translateX(-50%) scale(1.3); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
  @keyframes bBig { from { opacity: 0; transform: translate(-50%, -60%) scale(1.5); } to { opacity: 1; transform: translate(-50%, -60%) scale(1); } }

  /* ── C 타자 카드 위 — 가운데는 비우고, 결과는 타석 카드 바로 위 알약. 홈런만 가운데 ── */
  .c { position: absolute; left: 16px; bottom: 124px; display: flex; align-items: baseline; gap: 12px; padding: 10px 20px; border-radius: 14px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--k) 30%, rgba(7,10,18,.9)), rgba(7,10,18,.9)); box-shadow: inset 3px 0 0 var(--k), 0 10px 26px rgba(0,0,0,.5);
    animation: cIn .18s ease-out both; }
  .c b { font-size: 30px; font-weight: 700; line-height: 1; color: var(--k); }
  .c span { font-size: 15px; font-weight: 600; color: #e2e8f0; }
  .c.top { left: 50%; top: 96px; bottom: auto; transform: translateX(-50%); animation: bIn .18s ease-out both; }
  @keyframes cIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* ── D 사선 배너 — MLB 더 쇼처럼 기운 띠에 기운 글씨. 구장 위쪽 ── */
  .dd { position: absolute; left: -40px; top: 170px; padding: 12px 70px 12px 80px; transform: skewX(-14deg);
    background: linear-gradient(90deg, var(--k), color-mix(in srgb, var(--k) 55%, transparent)); box-shadow: 0 14px 30px rgba(0,0,0,.45);
    animation: dIn .2s cubic-bezier(.2,.9,.3,1) both; }
  .dd > div { transform: skewX(14deg); display: flex; align-items: baseline; gap: 18px; }
  .dd b { font-size: 50px; font-weight: 700; line-height: 1; color: #05080f; }
  .dd span { font-size: 18px; font-weight: 700; color: rgba(5,8,15,.8); }
  .dd.big { top: 260px; padding: 22px 110px 22px 120px; }
  .dd.big b { font-size: 92px; }
  .dd::after { content: ""; position: absolute; left: 100%; top: 0; bottom: 0; width: 18px; margin-left: 10px; background: var(--k); opacity: .7; }
  @keyframes dIn { from { transform: skewX(-14deg) translateX(-110%); } to { transform: skewX(-14deg); } }

  .replay { position: fixed; right: 12px; bottom: 12px; z-index: 50; all: unset; cursor: pointer; position: fixed; right: 12px; bottom: 12px; padding: 10px 16px; border-radius: 10px; background: #fbbf24; color: #1a1205; font-weight: 800; font-size: 14px; }
</style>
<body>
<img class="shot" src="field.jpg">
<div class="field" id="field"></div>
<div class="cap" id="cap"></div>
<div class="bar" id="bar"></div>
<button class="replay" id="replay">다시 ▶</button>
<script>
  /* 상태 넷 — 이 장면은 1회말 우리 공격 · SK 1 : 0 */
  const STATES = {
    k: { word: '삼진', sub: '서용빈 · 슬라이더 헛스윙', tone: 'r', big: false, ko: '삼진(우리 타자)' },
    hr: { word: '홈런', sub: '서용빈 · 2점', tone: 'g', big: true, ko: '홈런(우리)' },
    inn: { word: '1회 종료', sub: 'SK 1 : 0 점검감독', tone: 'n', big: false, ko: '이닝 종료' },
    half: { word: '우리 공격', sub: '1회말', tone: 'g', big: false, ko: '공수 교대' },
  };
  const VARS = {
    a: ['A · 방송 띠', '구장 위쪽을 가로지르는 팀 색 띠 · 내야는 비움 · 홈런만 굵고 크게'],
    b: ['B · 도장', '승률 알약 아래 작은 배지(0.18초 튕김) · 홈런만 가운데 큰 도장'],
    c: ['C · 타석 카드 위', '가운데는 늘 비움 · 결과는 타석 카드 위 알약 · 홈런만 위쪽 가운데'],
    d: ['D · 사선 배너', 'MLB 더 쇼처럼 기운 띠 · 팀 색 바탕에 검은 글씨 · 홈런만 크게'],
  };
  let v = 'a', st = 'k';
  const html = () => {
    const s = STATES[st];
    if (v === 'a') return `<div class="a ${s.tone} ${s.big ? 'big' : ''}"><b>${s.word}</b><span>${s.sub}</span></div>`;
    if (v === 'b') return `<div class="b ${s.tone} ${s.big ? 'big' : ''}"><b>${s.word}</b><span>${s.sub}</span></div>`;
    if (v === 'c') return s.big ? `<div class="b ${s.tone} big"><b>${s.word}</b><span>${s.sub}</span></div>`
      : `<div class="c ${s.tone} ${st === 'inn' || st === 'half' ? 'top' : ''}"><b>${s.word}</b><span>${s.sub}</span></div>`;
    return `<div class="dd ${s.tone} ${s.big ? 'big' : ''}"><div><b>${s.word}</b><span>${s.sub}</span></div></div>`;
  };
  const render = () => {
    const f = document.getElementById('field');
    f.innerHTML = '';
    requestAnimationFrame(() => { f.innerHTML = html(); });
    document.getElementById('cap').textContent = `${VARS[v][0]} — ${VARS[v][1]}`;
    const bar = document.getElementById('bar');
    bar.innerHTML = Object.entries(VARS).map(([k, [n]]) => `<button data-v="${k}" class="${k === v ? 'on' : ''}">${n.split(' · ')[0]}</button>`).join('')
      + '<i></i>' + Object.entries(STATES).map(([k, s]) => `<button data-s="${k}" class="${k === st ? 'on' : ''}">${s.ko}</button>`).join('');
    location.hash = `${v}-${st}`;
  };
  document.getElementById('bar').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.v) v = b.dataset.v; if (b.dataset.s) st = b.dataset.s; render(); });
  document.getElementById('replay').addEventListener('click', render);
  const h = location.hash.slice(1).split('-'); if (VARS[h[0]]) v = h[0]; if (STATES[h[1]]) st = h[1];
  render();
</script>
</body>
</html>
