<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>구단 정복 — 아래 판 배치 4안</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#f5d27a; --win:#34d399; --lose:#f87171; --kt:#e11d48; --me:#e879f9; --m:#9aa6b5; --d:#6b7787; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1920px;height:911px;background:#05080f;color:#e8ecf2;font:500 14px 'IBM Plex Sans KR',sans-serif;overflow:hidden}
  .n{font-family:'Saira Condensed',sans-serif;font-weight:800}
  #app{position:relative;width:1920px;height:911px;overflow:hidden}
  .bg{position:absolute;inset:0;background:#05080f url(/ui/gauntlet.webp) center/cover}
  .bg::after{content:'';position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 40%,rgba(124,58,237,.2),transparent 70%),radial-gradient(120% 90% at 50% 38%,rgba(7,9,19,.5),rgba(5,6,14,.95) 78%)}
  .shell{position:relative;height:100%;display:flex;flex-direction:column}
  .glass{position:relative;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025)),rgba(6,10,19,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.06),0 30px 60px -30px rgba(0,0,0,.9);backdrop-filter:blur(16px)}
  .glass::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(245,210,122,.18)}
  .lab{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--k,var(--gold))}
  .lab::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
  .row{display:flex;align-items:center;gap:10px}
  /* 머리 줄 */
  .hd{height:64px;display:flex;align-items:center;gap:16px;padding:0 32px;background:rgba(6,10,19,.72);box-shadow:inset 0 -1px 0 rgba(255,255,255,.08)}
  .btn{height:36px;padding:0 14px;border-radius:10px;font-weight:700;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);display:grid;place-items:center}
  .emb{border-radius:50%;background:#0b1220 center 26%/cover;flex:none}
  /* 원정길 */
  .road{position:relative;display:flex;justify-content:space-between;padding:20px 48px 10px}
  .road .line{position:absolute;left:132px;right:132px;top:74px;height:4px;border-radius:4px;background:rgba(255,255,255,.1)}
  .road .line i{display:block;height:100%;width:12.5%;border-radius:4px;background:linear-gradient(90deg,#b7832a,var(--gold));box-shadow:0 0 12px var(--gold)}
  .stop{position:relative;z-index:1;width:168px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .stop .ic{height:92px;display:grid;place-items:center}
  .tag{border-radius:4px;padding:0 6px;font-size:12px;font-weight:800}
  /* 아래 판 */
  .stage{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);gap:20px;padding:8px 48px 24px}
  .field{position:relative;border-radius:14px;overflow:hidden;background:#0b1220 center/cover no-repeat}
  .field::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,15,.25),rgba(5,9,15,.55))}
  .fp{position:absolute;display:flex;align-items:center;gap:6px;transform:translate(-50%,-50%)}
  .face{border-radius:50%;background:#0b1220 url(/ui/mt/silhouette-player.webp) center 8%/cover;flex:none;box-shadow:0 0 0 2px var(--kt)}
  .fp .nm{display:grid;border-radius:7px;padding:2px 8px;background:rgba(6,10,19,.9);line-height:1.25;white-space:nowrap}
  .fp .nm b{font-size:13px}.fp .nm small{font-family:'Saira Condensed';font-weight:800;font-size:13px}
  .pit{display:grid;align-items:center;gap:10px;border-radius:10px;background:rgba(255,255,255,.045)}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 10px;background:rgba(255,255,255,.05);font-size:13px}
  .chip small{color:var(--d);font-size:12px}
  .pri{border-radius:14px;font-size:18px;font-weight:900;color:#1c1203;background:linear-gradient(180deg,#fbe7a8,#e0b44f 55%,#b7832a);box-shadow:0 14px 30px -12px rgba(245,185,58,.8),inset 0 1px 0 rgba(255,255,255,.5);display:grid;place-items:center}
  .bars{display:grid;gap:10px}
  .bar{display:grid;grid-template-columns:52px 1fr 54px 1fr 52px;align-items:center;gap:8px}
  .bar .l,.bar .r{height:10px;background:rgba(255,255,255,.06);display:flex}
  .bar .l{justify-content:flex-end;border-radius:10px 0 0 10px}.bar .r{border-radius:0 10px 10px 0}
  .bar i{display:block;height:100%}
  .bar .l i{border-radius:10px 0 0 10px}.bar .r i{border-radius:0 10px 10px 0}
  .t4{font-size:12px}.t2{font-size:18px;font-weight:800}.t1{font-size:28px;font-weight:900}
  .m{color:var(--m)}.d{color:var(--d)}
  .key{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:5px 12px;border-radius:12px;background:rgba(255,255,255,.045)}
  /* 비교용 탭 */
  .vtabs{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);z-index:9;display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(0,0,0,.6)}
  .vtabs a{height:30px;padding:0 12px;border-radius:8px;color:#9ca3af;font-weight:700;text-decoration:none;display:grid;place-items:center}
  .vtabs a.on{color:#fff;background:rgba(255,255,255,.16)}
  .ov{position:absolute;border-radius:14px;background:rgba(6,10,19,.78);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
</style></head>
<body><div id="app"></div>
<script>
const V = [
  ['1', '넓은 구장 · 투수 세로줄'],
  ['2', '투수 · 구장 · 벤치 세 칸'],
  ['3', '구장 가득 · 명단 겹치기'],
  ['4', '구장 + 상대 핵심 셋'],
];
const ROAD = [
  ['박수', 'dream', '85.1', 'me'], ['KT', 'kt', '77.5', 'now'], ['SSG', 'sk', '78.6'], ['키움', 'kiwoom', '79.6'],
  ['한화', 'hanwha', '82.1'], ['LG', 'lg', '82.8'], ['롯데', 'lotte', '83.6'], ['삼성', 'samsung', '85.6'],
];
const FIELD = { OF2: ['이정훈', '외야수', 99], OF1: ['윤동희', '외야수', 74], OF3: ['장성호', '외야수', 82], SS: ['김민호', '유격수', 82], '2B': ['지화동', '2루수', 64],
  '3B': ['송광민', '3루수', 75], '1B': ['홍신차', '1루수', 73], C: ['이만수', '포수', 83], DH: ['박승호', '지명타자', 80] };
const ARMS = [['선발', '임호균', 75], ['롱릴리프', '이극성', 76], ['중간계투', '원종현', 74], ['셋업', '전승남', 81], ['마무리', '김일형', 67]];
const BENCH = [['불펜', '김세현', 92], ['선발', '선동열', 104], ['불펜', '심창민', 91], ['선발', '송진우', 80], ['포수', '안중열', 72], ['지명', '퓨처스 유망주', 70]];
const STATS = [['타격', 87, 81], ['마운드', 86, 76], ['수비', 78, 74], ['전력', 85.1, 77.5]];
const tone = (o) => (o >= 92 ? '#fde047' : o >= 85 ? '#34d399' : o >= 78 ? '#7dd3fc' : '#94a3b8');
const pct = (v) => Math.max(6, Math.min(100, ((v - 62) / 28) * 100));
/* 자리 좌표(%) — 4:3 구장(field.webp) · 넓은 구장(field-wide.webp, 상자 약 1.8:1 로 덮을 때) */
const XY43 = { OF2: [50, 13], OF1: [18, 27], OF3: [82, 27], SS: [35, 47], '2B': [65, 47], '3B': [20, 64], '1B': [80, 64], C: [50, 88], DH: [86, 88] };
const XYW = { OF2: [50, 16], OF1: [27, 28], OF3: [73, 28], SS: [42, 46], '2B': [58, 46], '3B': [34, 60], '1B': [66, 60], C: [50, 85], DH: [66, 85] };

const road = () => `
  <div class="road">
    <div class="line"><i></i></div>
    ${ROAD.map(([nm, key, str, st]) => {
      const size = st === 'now' ? 84 : st === 'me' ? 76 : 64;
      const ring = st === 'now' ? 'var(--gold)' : st === 'me' ? 'var(--me)' : null;
      return `<div class="stop"><div class="ic"><span class="emb" style="width:${size}px;height:${size}px;background-image:url(/ui/clubs/${key}.webp);box-shadow:${ring ? `0 0 0 3px ${ring},0 0 26px -2px ${ring}` : 'inset 0 0 0 1px rgba(255,255,255,.14)'}"></span></div>
        <b style="font-size:14px;font-weight:900;color:${st === 'me' ? 'var(--me)' : '#e8ecf2'}">${nm}</b>
        <span class="row" style="gap:6px"><b class="n" style="font-size:14px;color:${st === 'now' ? 'var(--gold)' : '#93a0af'}">${str}</b>
        ${st === 'me' ? '<b class="tag" style="color:var(--me);box-shadow:inset 0 0 0 1px #e879f966">나</b>' : st === 'now' ? '<b class="tag" style="color:var(--gold);box-shadow:inset 0 0 0 1px #f5d27a66">다음</b>' : ''}</span>
        ${st === 'now' ? '<i style="position:absolute;bottom:-12px;width:40px;height:3px;border-radius:3px;background:var(--gold);box-shadow:0 0 10px var(--gold)"></i>' : ''}</div>`;
    }).join('')}
    <div class="stop"><div class="ic"><span style="width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:rgba(245,210,122,.08);box-shadow:inset 0 0 0 2px #f5d27a66;font-size:30px">🏆</span></div>
      <b style="font-size:14px;font-weight:900;color:var(--gold)">정복 보상</b><small class="t4 m">기념 카드 5장 중 1장</small></div>
  </div>`;

const fieldBox = (w, h, wide, face = 40, fill = false) => {
  const XY = wide ? XYW : XY43;
  return `<div class="field" style="${fill ? 'position:absolute;inset:0' : `width:${w}px;height:${h}px`};background-image:url(/ui/${wide ? 'field-wide' : 'field'}.webp)">
    ${Object.entries(FIELD).map(([slot, [nm, pos, o]]) => `<span class="fp" style="left:${XY[slot][0]}%;top:${XY[slot][1]}%">
      <span class="face" style="width:${face}px;height:${face}px"></span>
      <span class="nm"><b>${nm}</b><small style="color:${tone(o)}">${pos} ${o}</small></span></span>`).join('')}
  </div>`;
};
const scoutHead = () => `<div class="row" style="margin-bottom:12px"><span class="lab" style="--k:var(--kt)">다음 상대 전력</span><b class="t2">KT 위즈</b>
  <span class="m" style="margin-left:auto">간판 <b style="color:#e8ecf2">선동열</b> <b class="n" style="color:${tone(104)}">104</b></span></div>`;
const pitRows = (h, role = 70) => ARMS.map(([r, nm, o]) => `<div class="pit" style="height:${h}px;padding:0 12px;grid-template-columns:${h > 40 ? '34px ' : ''}${role}px 1fr auto">
  ${h > 40 ? '<span class="face" style="width:32px;height:32px;box-shadow:none"></span>' : ''}<small class="t4 d">${r}</small><b class="tr">${nm}</b><b class="n" style="font-size:18px;color:${tone(o)}">${o}</b></div>`).join('');
const benchChips = () => BENCH.map(([r, nm, o]) => `<span class="chip"><small>${r}</small><b>${nm}</b><b class="n" style="color:${tone(o)}">${o}</b></span>`).join('');

const versus = (extra = '', big = 96, gap = 18) => `
  <section class="glass" style="display:flex;flex-direction:column;gap:${gap}px;padding:24px">
    <span class="lab">다음 상대</span>
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center">
      <span style="display:grid;justify-items:center;gap:8px"><span class="emb" style="width:${big}px;height:${big}px;background-image:url(/ui/clubs/dream.webp);box-shadow:0 0 0 3px var(--me),0 0 26px -2px var(--me)"></span><b class="t2">박수</b></span>
      <span style="display:grid;justify-items:center;gap:6px"><b class="n" style="font-size:28px;font-style:italic;color:#7c8797">VS</b>
        <b style="border-radius:6px;padding:2px 10px;font-weight:900;color:var(--win);background:#34d3991f;box-shadow:inset 0 0 0 1px #34d39988">우세 +7.6</b></span>
      <span style="display:grid;justify-items:center;gap:8px"><span class="emb" style="width:${big}px;height:${big}px;background-image:url(/ui/clubs/kt.webp);box-shadow:0 0 0 3px var(--kt),0 0 26px -2px var(--kt)"></span><b class="t2">KT</b></span>
    </div>
    <div class="row" style="justify-content:center;gap:8px"><b class="tag" style="color:#f59e0b;box-shadow:inset 0 0 0 1px #f59e0b88">탄탄</b><b class="tag" style="color:#cbd5e1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)">가성비</b></div>
    <div class="bars">${STATS.map(([ko, a, b]) => `<div class="bar">
      <b class="n" style="text-align:right;font-size:18px;color:${a > b ? 'var(--win)' : '#cbd5e1'}">${a}</b>
      <span class="l"><i style="width:${pct(a)}%;background:${a > b ? 'var(--win)' : 'rgba(203,213,225,.35)'}"></i></span>
      <small class="t4" style="text-align:center;font-weight:700;color:#8b97a6">${ko}</small>
      <span class="r"><i style="width:${pct(b)}%;background:${b > a ? 'var(--lose)' : 'rgba(203,213,225,.35)'}"></i></span>
      <b class="n" style="font-size:18px;color:${b > a ? 'var(--lose)' : '#cbd5e1'}">${b}</b></div>`).join('')}</div>
    ${extra}
    <button class="pri" style="margin-top:auto;height:64px">정비하기 ▶</button>
  </section>`;

/* ── 1안: 넓은 구장(넓은 그림) + 오른쪽 좁은 투수 세로줄 · 벤치 알약 ── */
const v1 = () => `<div class="stage" style="grid-template-columns:minmax(0,1fr) 440px">
  <section class="glass" style="padding:20px;display:flex;flex-direction:column">${scoutHead()}
    <div style="display:flex;gap:16px;flex:1;min-height:0">
      ${fieldBox(960, 530, true, 42)}
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
        <span class="lab" style="--k:#f87171">투수진</span>${pitRows(48, 64)}
        <span class="lab" style="--k:#94a3b8;margin-top:8px">벤치</span><div class="row" style="flex-wrap:wrap;gap:6px">${benchChips()}</div>
      </div>
    </div></section>
  ${versus()}</div>`;

/* ── 2안: 중계 그래픽처럼 투수진 | 구장 | 벤치 ── */
const col = (lab, k, body) => `<div style="width:230px;flex:none;display:flex;flex-direction:column;gap:8px"><span class="lab" style="--k:${k}">${lab}</span>${body}</div>`;
const stack = (rows) => rows.map(([r, nm, o]) => `<div class="pit" style="height:62px;padding:0 12px;grid-template-columns:1fr auto">
  <span style="display:grid;line-height:1.3"><small class="t4 d">${r}</small><b>${nm}</b></span><b class="n" style="font-size:20px;color:${tone(o)}">${o}</b></div>`).join('');
const v2 = () => `<div class="stage" style="grid-template-columns:minmax(0,1fr) 440px">
  <section class="glass" style="padding:20px;display:flex;flex-direction:column">${scoutHead()}
    <div style="display:flex;gap:16px;flex:1;min-height:0">
      ${col('투수진', '#f87171', stack(ARMS))}
      ${fieldBox(716, 530, false, 40)}
      ${col('벤치', '#94a3b8', stack(BENCH).replace(/height:62px/g, 'height:52px'))}
    </div></section>
  ${versus()}</div>`;

/* ── 3안: 넓은 구장이 판을 가득 — 양옆 관중석 자리에 투수진 · 벤치를 반투명으로 겹친다 ── */
const v3 = () => `<div class="stage" style="grid-template-columns:minmax(0,1fr) 440px">
  <section class="glass" style="padding:14px;display:flex;flex-direction:column">
    <div style="position:relative;flex:1">
      ${fieldBox(0, 0, true, 44, true)}
      <div style="position:absolute;left:18px;top:14px;right:18px" class="row"><span class="lab" style="--k:var(--kt)">다음 상대 전력</span><b class="t2">KT 위즈</b>
        <span class="m" style="margin-left:auto">간판 <b style="color:#e8ecf2">선동열</b> <b class="n" style="color:${tone(104)}">104</b></span></div>
      <div class="ov" style="left:18px;top:56px;width:250px;padding:12px;display:flex;flex-direction:column;gap:6px"><span class="lab" style="--k:#f87171">투수진</span>${pitRows(40, 58)}</div>
      <div class="ov" style="right:18px;top:56px;width:250px;padding:12px;display:flex;flex-direction:column;gap:6px"><span class="lab" style="--k:#94a3b8">벤치</span>${BENCH.map(([r, nm, o]) => `<div class="pit" style="height:40px;padding:0 12px;grid-template-columns:58px 1fr auto"><small class="t4 d">${r}</small><b>${nm}</b><b class="n" style="font-size:18px;color:${tone(o)}">${o}</b></div>`).join('')}</div>
    </div></section>
  ${versus()}</div>`;

/* ── 4안: 구장 + 좁은 투수(이름 · 종합만) · 오른쪽 판에 상대 핵심 셋(간판 · 에이스 · 중심 타자) ── */
const keyCard = (lab, nm, pos, o, k) => `<div class="key"><span class="face" style="width:38px;height:38px;box-shadow:0 0 0 2px ${k}"></span>
  <span style="display:grid;line-height:1.35"><small class="t4" style="color:${k};font-weight:800">${lab}</small><b>${nm} <small class="t4 d">${pos}</small></b></span><b class="n" style="font-size:22px;color:${tone(o)}">${o}</b></div>`;
const v4 = () => `<div class="stage" style="grid-template-columns:minmax(0,1fr) 440px">
  <section class="glass" style="padding:20px;display:flex;flex-direction:column">${scoutHead()}
    <div style="display:flex;gap:16px;flex:1;min-height:0">
      ${fieldBox(1010, 530, true, 44)}
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
        <span class="lab" style="--k:#f87171">투수진</span>
        ${ARMS.map(([r, nm, o]) => `<div class="pit" style="height:42px;padding:0 12px;grid-template-columns:1fr auto"><span><small class="t4 d" style="margin-right:6px">${r}</small><b>${nm}</b></span><b class="n" style="font-size:18px;color:${tone(o)}">${o}</b></div>`).join('')}
        <span class="lab" style="--k:#94a3b8;margin-top:8px">벤치</span>
        ${BENCH.slice(0, 4).map(([r, nm, o]) => `<div class="pit" style="height:34px;padding:0 12px;grid-template-columns:1fr auto"><span><small class="t4 d" style="margin-right:6px">${r}</small><b>${nm}</b></span><b class="n" style="font-size:16px;color:${tone(o)}">${o}</b></div>`).join('')}
        <small class="t4 d">외 2명</small>
      </div>
    </div></section>
  ${versus(`<div style="display:grid;gap:8px"><span class="lab" style="--k:var(--kt)">상대 핵심</span>
    ${keyCard('간판', '선동열', '선발', 104, '#fde047')}${keyCard('에이스', '전승남', '셋업', 81, '#f87171')}${keyCard('중심 타자', '이정훈', '외야수', 99, '#7dd3fc')}</div>`, 76, 12)}</div>`;

const MAKE = { 1: v1, 2: v2, 3: v3, 4: v4 };
function render() {
  const k = (location.hash || '#1').slice(1);
  document.getElementById('app').innerHTML = `<div class="bg"></div><div class="shell">
    <div class="hd"><span class="btn">← 정비</span><b class="t1">구단 정복</b>
      <span class="row" style="gap:6px;border-left:1px solid rgba(255,255,255,.15);padding-left:16px"><b class="n" style="font-size:28px;color:var(--gold)">0</b><small class="n m" style="font-size:14px">/ 7 구단</small></span>
      <span class="row" style="margin-left:auto;gap:12px"><span class="emb" style="width:34px;height:34px;background-image:url(/ui/clubs/dream.webp)"></span><b>박수</b><b class="n" style="font-size:18px"><span style="color:var(--win)">0승</span> <span style="color:var(--lose)">0패</span></b></span></div>
    ${road()}
    ${(MAKE[k] || v1)()}
  </div>
  <nav class="vtabs">${V.map(([id, nm]) => `<a href="#${id}" class="${id === k ? 'on' : ''}">${id}. ${nm}</a>`).join('')}</nav>`;
}
addEventListener('hashchange', render);
render();
</script></body></html>
