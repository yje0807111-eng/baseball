<!doctype html>
<html lang="ko">
<title>반이닝 정리 배치안</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Saira+Condensed:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root { --em:#10b981; --em2:#34d399; --red:#f87171; --yel:#fde047; --sky:#38bdf8; --sky2:#7dd3fc;
          --vio:#c4b5fd; --or:#fb923c; --gray:#94a3b8; --my:#34d399; --opp:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; background:#03050a; color:#e5e7eb;
         font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  .d { font-family:'Saira Condensed',sans-serif; }

  .ui-cut { --c:14px; clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
  .ui-lab { display:inline-flex; align-items:center; gap:9px; font-size:13px; font-weight:700; letter-spacing:.32em;
            text-transform:uppercase; color:var(--a,#10b981); }
  .ui-lab::before { content:""; width:15px; height:11px; background:currentColor; clip-path:polygon(0 0,60% 0,100% 100%,40% 100%); }
  .ui-btn { --c:10px; display:flex; flex-direction:column; justify-content:center; min-height:60px; padding:9px 22px;
            font-size:19px; font-weight:700; color:#e8ecf2; background:rgba(255,255,255,.055);
            box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
  .ui-btn.pri { background:var(--em); color:#04070d; box-shadow:none; }
  .ui-btn small { font-size:12.5px; font-weight:600; color:#8b95a5; margin-top:3px; }
  .ui-btn.pri small { color:rgba(4,7,13,.62); }
  .ui-chip { --c:6px; display:inline-flex; align-items:center; padding:4px 11px; font-size:13px; font-weight:700;
             color:var(--a,#cbd5e1); background:rgba(5,8,15,.6); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a,#94a3b8) 55%,transparent); }

/* ══ 공통 화면 틀 ══ */
  .screen { position:relative; width:1920px; height:911px; overflow:hidden; background:#05080f; font-size:16px; }
  .bg { position:absolute; inset:0; background:url(clutch/sim-broad.webp) center/cover; opacity:.3; }
  .vig { position:absolute; inset:0; pointer-events:none;
         background:radial-gradient(130% 92% at 50% 42%,rgba(3,5,10,.48),rgba(3,5,10,.96) 76%),
                    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px); }
  .lay { position:relative; z-index:2; height:100%; }

  /* 공통 하단 방침 띠 */
  .foot { display:flex; flex-direction:column; justify-content:center; gap:12px; padding:0 46px; height:158px;
          border-top:1px solid rgba(255,255,255,.1); background:linear-gradient(0deg,rgba(3,5,10,.94),rgba(3,5,10,.4)); }
  .foot .hd { display:flex; align-items:center; gap:16px; }
  .foot .hd p { margin:0; font-size:18px; color:#9ca3af; } .foot .hd p b { color:#fff; }
  .opts { display:flex; gap:12px; } .opts .ui-btn { flex:1; }
  .ring { position:relative; display:grid; place-items:center; width:66px; flex:none; }
  .ring svg { transform:rotate(-90deg); } .ring circle { fill:none; stroke-width:4; }
  .ring .b1 { stroke:rgba(255,255,255,.12); } .ring .b2 { stroke:var(--em); stroke-linecap:round; }
  .ring b { position:absolute; font:800 21px 'Saira Condensed'; color:#fff; }

  /* 공통 조각 */
  .tot { display:flex; align-items:center; gap:14px; }
  .tot .t { font-size:15px; font-weight:600; color:#6b7280; } .tot .t.mine { color:var(--my); }
  .tot .v { font:800 30px/1 'Saira Condensed'; color:#fff; } .tot .v .x { color:#374151; margin:0 8px; }
  .gainbox { --g:var(--yel); display:inline-block; padding:16px 30px 14px; text-align:center;
             background:color-mix(in srgb,var(--g) 12%,rgba(2,4,8,.9)); box-shadow:inset 0 0 0 2px var(--g); }
  .gainbox b { display:block; font:800 92px/1 'Saira Condensed'; color:var(--g); text-shadow:0 0 46px color-mix(in srgb,var(--g) 55%,transparent); }
  .gainbox span { display:block; margin-top:8px; font-size:13px; font-weight:700; letter-spacing:.28em; color:color-mix(in srgb,var(--g) 80%,#fff); }
  .evl { display:grid; grid-template-columns:12px 1fr auto; align-items:baseline; gap:14px; padding:13px 0;
         border-top:1px solid rgba(255,255,255,.06); }
  .evl:first-of-type { border-top:0; }
  .evl .dot { width:9px; height:9px; background:var(--e,var(--my)); transform:skewX(-22deg); align-self:center; }
  .evl .tx { font-size:18px; line-height:1.4; } .evl .tx b { color:#fff; margin-right:9px; }
  .evl .tx span { color:#9ca3af; } .evl .tx span.hi { color:var(--e,var(--yel)); font-weight:700; }
  .evl .rt { font:800 25px 'Saira Condensed'; color:var(--e,var(--yel)); }

/* ══ A · 세 구역 가로 ══ */
  .A .lay { display:grid; grid-template-rows:76px 1fr 158px; }
  .A .bar { display:flex; align-items:center; gap:30px; padding:0 46px; border-bottom:1px solid rgba(255,255,255,.1);
            background:linear-gradient(180deg,rgba(3,5,10,.9),rgba(3,5,10,.42)); }
  .A .bar .tot { margin-left:auto; }
  .A .mid { display:grid; grid-template-columns:560px 1fr 560px; }
  .A .z1 { display:flex; flex-direction:column; justify-content:center; gap:32px; padding:0 46px; }
  .A .inn { font-size:128px; font-weight:700; line-height:.9; color:#fff; letter-spacing:-.045em; margin:0; }
  .A .inn em { font-style:normal; color:var(--or); }
  .A .sd { display:block; margin-top:18px; font-size:23px; font-weight:700; color:#cbd5e1; }
  .A .sd i { font-style:normal; color:var(--my); }
  .A .z2 { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px 30px;
           border-left:1px solid rgba(255,255,255,.08); border-right:1px solid rgba(255,255,255,.08); }
  .A .hero { position:relative; width:310px; height:465px; background:#0b1220 center 8%/cover; margin-top:14px;
             box-shadow:inset 0 0 0 2px var(--my), 0 0 66px -18px var(--my); }
  .A .hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 48%,rgba(3,5,10,.92) 92%); }
  .A .hero .cap { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:15px; text-align:center; }
  .A .hero .cap b { display:block; font-size:32px; font-weight:700; color:#fff; }
  .A .hero .cap span { font-size:13px; color:color-mix(in srgb,var(--my) 80%,#fff); }
  .A .did { margin-top:18px; text-align:center; }
  .A .did b { font-size:28px; font-weight:700; color:var(--my); }
  .A .did span { display:block; margin-top:8px; font-size:15px; color:#9ca3af; }
  .A .z3 { padding:30px 46px; }

/* ══ B · 전면 히어로 ══ */
  .B .shot { position:absolute; right:0; top:0; width:64%; height:100%; background:#0b1220 62% 6%/cover;
             -webkit-mask-image:linear-gradient(90deg,transparent,#000 42%); mask-image:linear-gradient(90deg,transparent,#000 42%); }
  .B .lay { display:grid; grid-template-rows:1fr 158px; }
  .B .body { position:relative; display:flex; flex-direction:column; justify-content:center; padding:0 70px; }
  .B .wm { position:absolute; right:-30px; top:-70px; font:800 540px/1 'Saira Condensed'; color:transparent;
           -webkit-text-stroke:2px rgba(251,146,60,.16); pointer-events:none; }
  .B .kicker { display:flex; align-items:center; gap:18px; margin-bottom:18px; }
  .B .inn { font-size:150px; font-weight:700; line-height:.86; color:#fff; letter-spacing:-.05em; margin:0;
            text-shadow:0 8px 60px rgba(0,0,0,.95); }
  .B .inn em { font-style:normal; color:var(--or); }
  .B .nm { margin:26px 0 0; font-size:78px; font-weight:700; color:#fff; line-height:1; }
  .B .act { margin:14px 0 0; font-size:38px; font-weight:700; color:var(--yel); }
  .B .sub { margin:12px 0 0; font-size:18px; color:#9ca3af; }
  .B .body { overflow:hidden; }
  .B .side { position:absolute; right:56px; bottom:40px; width:420px; }
  .B .side .evl { padding:9px 0; } .B .side .evl .tx { font-size:16px; }
  .B .gainbox { position:absolute; left:70px; bottom:40px; }

/* ══ C · 가로 타임라인 ══ */
  .C .lay { display:grid; grid-template-rows:118px 1fr 158px; }
  .C .bar { display:flex; align-items:center; gap:28px; padding:0 52px; border-bottom:1px solid rgba(255,255,255,.1); }
  .C .bar .inn { font-size:60px; font-weight:700; color:#fff; margin:0; letter-spacing:-.03em; }
  .C .bar .inn em { font-style:normal; color:var(--or); }
  .C .bar .sd { font-size:19px; font-weight:700; color:#cbd5e1; } .C .bar .sd i { font-style:normal; color:var(--my); }
  .C .bar .tot { margin-left:auto; }
  .C .bar .gm { font:800 66px/1 'Saira Condensed'; color:var(--yel); margin-left:26px; text-shadow:0 0 40px rgba(253,224,71,.5); }
  .C .tl { position:relative; display:flex; align-items:center; justify-content:space-between; padding:52px 90px 0; }
  .C .tl::before { content:''; position:absolute; left:90px; right:90px; top:50%; height:3px;
                   background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(253,224,71,.5)); }
  .C .node { position:relative; width:250px; text-align:center; }
  .C .node .pin { width:20px; height:20px; margin:0 auto; background:var(--e,var(--my)); transform:skewX(-22deg);
                  box-shadow:0 0 22px var(--e,var(--my)); }
  .C .node.big .pin { width:30px; height:30px; }
  .C .node .fc { width:126px; height:168px; margin:0 auto 18px; background:#0b1220 center 8%/cover;
                 box-shadow:inset 0 0 0 2px var(--e,var(--my)); clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px); }
  .C .node.big .fc { width:190px; height:254px; }
  .C .node .nm { margin:16px 0 0; font-size:24px; font-weight:700; color:#fff; }
  .C .node.big .nm { font-size:32px; }
  .C .node .tx { margin:7px 0 0; font-size:17px; color:#9ca3af; }
  .C .node .tx b { color:var(--e,var(--yel)); }
  .C .node .rt { display:block; margin-top:9px; font:800 34px 'Saira Condensed'; color:var(--yel); }
  .C .node .ord { position:absolute; left:50%; top:-44px; transform:translateX(-50%);
                  font:800 14px 'Saira Condensed'; letter-spacing:.3em; color:#4b5563; }

/* ══ D · 전광판 ══ */
  .D .lay { display:grid; grid-template-rows:1fr 158px; }
  .D .body { display:grid; grid-template-columns:1fr 620px; }
  .D .left { display:flex; flex-direction:column; justify-content:center; padding:0 54px; gap:30px; }
  .D .board { width:100%; border-collapse:collapse; font-family:'Saira Condensed'; text-align:center;
              background:rgba(2,4,8,.8); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
  .D .board th { font-size:17px; font-weight:600; color:#6b7280; padding:11px 0; }
  .D .board th.now { color:var(--yel); }
  .D .board td { font-size:34px; color:#cbd5e1; padding:13px 0; }
  .D .board td.tm { width:270px; text-align:left; padding-left:26px; font:700 21px 'IBM Plex Sans KR'; color:#9ca3af; }
  .D .board td.tm.mine { color:var(--my); }
  .D .board td.now { background:rgba(253,224,71,.16); color:var(--yel); font-size:52px; font-weight:800;
                     box-shadow:inset 0 0 0 2px var(--yel); }
  .D .board td.r { color:#fff; font-weight:800; } .D .board tr+tr td { border-top:1px solid rgba(255,255,255,.08); }
  .D .cap2 { display:flex; align-items:baseline; gap:22px; }
  .D .cap2 .inn { font-size:78px; font-weight:700; color:#fff; margin:0; letter-spacing:-.04em; }
  .D .cap2 .inn em { font-style:normal; color:var(--or); }
  .D .cap2 .sd { font-size:21px; font-weight:700; color:#cbd5e1; } .D .cap2 .sd i { font-style:normal; color:var(--my); }
  .D .right { padding:46px 54px 0; border-left:1px solid rgba(255,255,255,.08); background:rgba(3,5,10,.5); }
  .D .who { display:flex; align-items:center; gap:22px; margin:18px 0 26px; }
  .D .who .fc { width:120px; height:160px; background:#0b1220 center 8%/cover; box-shadow:inset 0 0 0 2px var(--my); }
  .D .who b { display:block; font-size:36px; font-weight:700; color:#fff; }
  .D .who span { display:block; margin-top:6px; font-size:15px; color:#9ca3af; }
  .D .who .did { margin-top:10px; font-size:23px; font-weight:700; color:var(--yel); }

/* ══ E · 그라운드 도해 ══ */
  .E .lay { display:grid; grid-template-rows:1fr 158px; }
  .E .body { display:grid; grid-template-columns:760px 1fr; }
  .E .fieldwrap { display:grid; place-items:center; border-right:1px solid rgba(255,255,255,.08); }
  .E .right { display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding:0 54px; gap:28px; }
  .E .right > div:last-of-type, .E .right > div:nth-of-type(2) { width:100%; max-width:720px; }
  .E .hd2 { display:flex; align-items:flex-end; gap:26px; }
  .E .hd2 .inn { font-size:104px; font-weight:700; color:#fff; margin:0; letter-spacing:-.045em; line-height:.9; }
  .E .hd2 .inn em { font-style:normal; color:var(--or); }
  .E .hd2 .sd { padding-bottom:12px; font-size:21px; font-weight:700; color:#cbd5e1; }
  .E .hd2 .sd i { font-style:normal; color:var(--my); }

/* ══ F · 좌우 대결 ══ */
  .F .lay { display:grid; grid-template-rows:1fr 158px; }
  .F .body { position:relative; display:grid; grid-template-columns:1fr 1fr; }
  .F .halfp { display:flex; flex-direction:column; justify-content:center; padding:0 64px; gap:24px; }
  .F .halfp.mine { background:linear-gradient(90deg,color-mix(in srgb,var(--my) 11%,transparent),transparent); }
  .F .halfp.theirs { background:linear-gradient(270deg,color-mix(in srgb,var(--opp) 11%,transparent),transparent); align-items:flex-end; text-align:right; }
  .F .halfp .who { display:flex; align-items:center; gap:24px; }
  .F .halfp.theirs .who { flex-direction:row-reverse; }
  .F .halfp .fc { width:152px; height:203px; background:#0b1220 center 8%/cover; box-shadow:inset 0 0 0 2px var(--c2); }
  .F .halfp b.nm { display:block; font-size:44px; font-weight:700; color:#fff; line-height:1.1; }
  .F .halfp span.pos { font-size:15px; color:#9ca3af; }
  .F .halfp .did { font-size:27px; font-weight:700; color:var(--c2); }
  .F .halfp .sub { font-size:16px; color:#9ca3af; }
  .F .halfp .lst { width:100%; } .F .halfp .lst .evl { padding:10px 0; } .F .halfp .lst .evl .tx { font-size:16px; }
  .F .halfp.theirs .lst .evl { grid-template-columns:auto 1fr 12px; text-align:right; }
  .F .spine { position:absolute; left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%);
              background:linear-gradient(180deg,transparent,rgba(255,255,255,.22),transparent); }
  .F .knot { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center;
             padding:26px 34px; background:rgba(3,5,10,.96); box-shadow:inset 0 0 0 2px rgba(255,255,255,.18); }
  .F .knot .inn { font-size:62px; font-weight:700; color:#fff; margin:0; letter-spacing:-.04em; }
  .F .knot .inn em { font-style:normal; color:var(--or); }
  .F .knot .v { display:block; margin-top:12px; font:800 46px/1 'Saira Condensed'; color:#fff; }
  .F .knot .v .x { color:#374151; margin:0 10px; }
  .F .knot .gm { display:block; margin-top:12px; font:800 30px 'Saira Condensed'; color:var(--yel); }

/* ══ G · 하단 자막 띠 ══ */
  .G .lay { display:grid; grid-template-rows:1fr auto; }
  .G .live { position:relative; display:flex; align-items:flex-start; padding:34px 46px; }
  .G .live .badge { display:flex; align-items:center; gap:12px; padding:8px 16px; background:rgba(3,5,10,.8);
                    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); }
  .G .live .badge i { width:9px; height:9px; border-radius:50%; background:var(--yel); }
  .G .live .badge span { font:800 14px 'Saira Condensed'; letter-spacing:.3em; color:#cbd5e1; }
  .G .live .tot { margin-left:auto; padding:8px 20px; background:rgba(3,5,10,.8); box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); }
  .G .strip { background:linear-gradient(0deg,rgba(3,5,10,.97),rgba(3,5,10,.88)); border-top:2px solid var(--or);
              padding:30px 46px 30px; }
  .G .row1 { display:flex; align-items:center; gap:32px; }
  .G .row1 .inn { font-size:74px; font-weight:700; color:#fff; margin:0; letter-spacing:-.04em; line-height:1; }
  .G .row1 .inn em { font-style:normal; color:var(--or); }
  .G .row1 .gm { font:800 74px/1 'Saira Condensed'; color:var(--yel); }
  .G .row1 .who { display:flex; align-items:center; gap:18px; margin-left:16px; }
  .G .row1 .who .fc { width:74px; height:99px; background:#0b1220 center 8%/cover; box-shadow:inset 0 0 0 2px var(--my); }
  .G .row1 .who b { display:block; font-size:32px; font-weight:700; color:#fff; }
  .G .row1 .who span { font-size:17px; color:var(--yel); font-weight:700; }
  .G .row1 .rest { margin-left:auto; text-align:right; font-size:15px; color:#9ca3af; line-height:1.65; }
  .G .row1 .rest b { color:#e5e7eb; }
  .G .row2 { display:flex; align-items:center; gap:14px; margin-top:26px; }
  .G .row2 p { margin:0 20px 0 0; font-size:17px; color:#9ca3af; } .G .row2 p b { color:#fff; }
  .G .row2 .opts { flex:1; }

/* ══ H · 헤드라인 ══ */
  .H .lay { display:grid; grid-template-rows:1fr 158px; }
  .H .body { display:grid; grid-template-rows:auto 1fr; padding:44px 64px 0; }
  .H .over { display:flex; align-items:center; gap:22px; padding-bottom:20px; border-bottom:2px solid var(--or); }
  .H .over .inn { font:800 34px 'Saira Condensed'; color:var(--or); letter-spacing:.06em; }
  .H .over .sd { font-size:17px; font-weight:700; color:#cbd5e1; } .H .over .sd i { font-style:normal; color:var(--my); }
  .H .over .tot { margin-left:auto; }
  .H .head { margin:30px 0 0; padding:0; border:0; font-size:96px; font-weight:700; color:#fff;
             line-height:1.08; letter-spacing:-.04em; max-width:1180px; }
  .H .head em { font-style:normal; font-size:inherit; font-weight:inherit; letter-spacing:inherit;
                margin:0; color:var(--yel); }
  .H .deck { margin:22px 0 0; font-size:22px; color:#9ca3af; max-width:900px; line-height:1.6; }
  .H .lower { display:grid; grid-template-columns:1fr 330px; gap:60px; align-items:start; padding-bottom:36px; }
  .H .cut { position:absolute; right:64px; top:170px; width:330px; height:440px; background:#0b1220 center 6%/cover;
            box-shadow:inset 0 0 0 2px var(--my), 0 0 70px -20px var(--my); }
  .H .lst .evl { padding:12px 0; }

/* ══ 페이지 ══ */
  .wrap { max-width:1380px; margin:0 auto; padding:44px 22px 110px; }
  h1 { font-size:33px; font-weight:700; color:#fff; margin:12px 0 10px; }
  .lead { color:#9ca3af; font-size:15px; line-height:1.85; margin:0 0 6px; } .lead b { color:#fff; }
  h2 { font-size:26px; font-weight:700; color:#fff; margin:62px 0 6px; padding-top:30px; border-top:1px solid rgba(255,255,255,.09); }
  h2 em { font-style:normal; font:800 15px 'Saira Condensed'; letter-spacing:.3em; color:var(--em2); margin-right:14px; }
  .h2n { color:#9ca3af; font-size:15px; margin:0 0 22px; line-height:1.7; } .h2n b { color:#fff; }
  .pn { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:16px; }
  .pn div { padding:14px 18px; font-size:13.5px; line-height:1.75; background:rgba(255,255,255,.035); }
  .pn div b { display:block; margin-bottom:5px; font-size:13px; letter-spacing:.12em; }
  .pn .good b { color:var(--em2); } .pn .bad b { color:var(--or); }
  .stage { position:relative; width:100%; aspect-ratio:1920/911; overflow:hidden; box-shadow:inset 0 0 0 1px #1f2937; }
  .stage .in { position:absolute; left:0; top:0; width:1920px; height:911px; transform-origin:0 0; transform:scale(var(--s,.7)); }
</style>

<div class="wrap">
  <p class="ui-lab" style="--a:var(--em2)">Half-Inning Recap · Layouts</p>
  <h1>반이닝 정리 배치안 8가지</h1>

},
];

const fit = () => document.querySelectorAll('.stage').forEach((el) => {
