<!doctype html>
<html lang="ko">
<title>이닝 정리</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root { --em:#10b981; --em2:#34d399; --red:#f87171; --yel:#fde047; --sky:#38bdf8; --sky2:#7dd3fc;
          --vio:#c4b5fd; --or:#fb923c; --gray:#94a3b8; --my:#34d399; --opp:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; background:#03050a; color:#e5e7eb;
         font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }

/* ═════ 게임 본편 문법 (KboAugmentDraft.jsx 의 .ui-* 를 그대로) ═════ */
  .cut { --c:14px; clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
  .glass { background:rgba(6,10,19,.74); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .glass2 { background:rgba(9,14,26,.9); }
  .frame { position:relative; }
  .frame::after {
    content:""; position:absolute; inset:0; z-index:7; pointer-events:none;
    background:
      linear-gradient(135deg,transparent calc(50% - 1px),var(--a) calc(50% - 1px),var(--a) calc(50% + 1px),transparent calc(50% + 1px)) left top / var(--c) var(--c) no-repeat,
      linear-gradient(135deg,transparent calc(50% - 1px),var(--a) calc(50% - 1px),var(--a) calc(50% + 1px),transparent calc(50% + 1px)) right bottom / var(--c) var(--c) no-repeat,
      linear-gradient(var(--a),var(--a)) left var(--c) top 0 / 56px 2px no-repeat,
      linear-gradient(var(--a),var(--a)) left 0 top var(--c) / 2px 30px no-repeat,
      linear-gradient(var(--a),var(--a)) right var(--c) bottom 0 / 56px 2px no-repeat,
      linear-gradient(var(--a),var(--a)) right 0 bottom var(--c) / 2px 30px no-repeat;
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 32%,transparent); }
  .lab { display:inline-flex; align-items:center; gap:9px; font-size:12px; font-weight:700; letter-spacing:.32em;
         text-transform:uppercase; color:var(--a,#10b981); white-space:nowrap; }
  .lab::before { content:""; width:14px; height:10px; background:currentColor; clip-path:polygon(0 0,60% 0,100% 100%,40% 100%); }
  .lab em { font-style:normal; letter-spacing:0; text-transform:none; font-size:14px; color:#9ca3af; margin-left:4px; }
  .btn { --c:10px; display:flex; flex-direction:column; justify-content:center; min-height:58px; padding:9px 22px;
         font-size:19px; font-weight:700; color:#e8ecf2; background:rgba(255,255,255,.055);
         box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
  .btn.pri { background:var(--em); color:#04070d; box-shadow:none; }
  .btn small { font-size:12.5px; font-weight:500; color:#8b95a5; margin-top:3px; }
  .btn.pri small { color:rgba(4,7,13,.66); }
  .chip { --c:6px; display:inline-flex; align-items:center; gap:6px; padding:4px 11px; font-size:12.5px; font-weight:700;
          color:var(--a,#cbd5e1); background:rgba(5,8,15,.66); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a,#94a3b8) 55%,transparent); }
  .seg { display:grid; grid-auto-flow:column; gap:3px; height:9px; }
  .seg i { background:rgba(255,255,255,.08); transform:skewX(-24deg); }
  .seg i.on { background:var(--a); box-shadow:0 0 8px var(--a); }
  .seg i.now { background:var(--yel); box-shadow:0 0 12px var(--yel); }
  .scan { background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px); }

/* ── 조각 ── */
  .wm { position:absolute; color:transparent; pointer-events:none; user-select:none; white-space:nowrap;
        font-family:'Saira Condensed'; font-weight:800; line-height:1;
        -webkit-text-stroke:2px color-mix(in srgb,var(--a) 15%,transparent); }
  .stbox { --c:8px; padding:9px 16px 8px; background:rgba(3,6,13,.8); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
  .stbox span { display:block; font-size:11px; font-weight:600; letter-spacing:.06em; color:#6b7280; }
  .stbox b { display:block; margin-top:3px; font:800 26px/1 'Saira Condensed'; color:#fff; }
  .stbox b.a { color:var(--a); }
  .nameul { display:inline-block; padding-bottom:6px; font-weight:700; color:#fff;
            background:linear-gradient(90deg,var(--a),transparent) left bottom / 100% 3px no-repeat; }
  .port { position:relative; background:#0b1220 center 6%/cover;
          box-shadow:inset 0 0 0 2px var(--a), 0 0 78px -20px var(--a), 0 30px 64px -28px #000;
          clip-path:polygon(var(--c,16px) 0,100% 0,100% calc(100% - var(--c,16px)),calc(100% - var(--c,16px)) 100%,0 100%,0 var(--c,16px)); }
  .port::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 42%,rgba(3,5,10,.94) 94%); }
  .port .tag { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:13px 18px; }
  .port .tag .k { font-size:11px; font-weight:700; letter-spacing:.3em; color:var(--a); }
  .port .tag b { display:block; margin-top:4px; font-size:31px; font-weight:700; color:#fff; line-height:1.05; }
  .port .tag span { display:block; margin-top:3px; font-size:13px; color:#9ca3af; }
  .lrow { display:grid; grid-template-columns:22px 34px 1fr auto; align-items:center; gap:11px; padding:7px 11px;
          background:rgba(5,9,17,.62); box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
          clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px); }
  .lrow+.lrow { margin-top:5px; }
  .lrow i { font:800 13px 'Saira Condensed'; font-style:normal; color:#4b5563; text-align:center; }
  .lrow .fc { width:34px; height:42px; background:#0b1220 center 16%/cover;
              clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px); }
  .lrow b { font-size:15px; font-weight:600; color:#e5e7eb; }
  .lrow .v { font:800 19px 'Saira Condensed'; color:var(--e,#9ca3af); }
  .lrow.hit { background:rgba(253,224,71,.09); box-shadow:inset 0 0 0 1px rgba(253,224,71,.42); }
  .lrow.hit b { color:#fff; font-weight:700; }
  .bar2 { display:flex; height:12px; overflow:hidden; }
  .bar2 i { display:block; height:100%; }
  .tot { display:flex; align-items:center; gap:13px; }
  .tot .t { font-size:14px; font-weight:600; color:#6b7280; } .tot .t.me { color:var(--my); } .tot .t.op { color:var(--opp); }
  .tot .v { font:800 29px/1 'Saira Condensed'; color:#fff; } .tot .v .x { color:#374151; margin:0 8px; }

/* ═════ 화면 틀 ═════ */
  .screen { position:relative; width:1920px; height:911px; overflow:hidden; background:#05080f; font-size:16px; }
  .bg { position:absolute; inset:0; background:url(clutch/sim-broad.webp) center/cover; opacity:.26; }
  .vig { position:absolute; inset:0; pointer-events:none;
         background:radial-gradient(128% 92% at 50% 40%,rgba(3,5,10,.42),rgba(3,5,10,.97) 78%),
                    repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px); }
  .lay { position:relative; z-index:2; height:100%; display:grid; }

  /* 공통 상단 바 (드래프트 화면의 머리와 같은 문법) */
  .top { display:flex; align-items:center; gap:34px; padding:0 44px; height:78px;
         border-bottom:1px solid rgba(255,255,255,.1); background:linear-gradient(180deg,rgba(3,5,10,.94),rgba(3,5,10,.4)); }
  .top .grp { display:flex; flex-direction:column; gap:3px; }
  .top .grp span { font-size:10px; font-weight:700; letter-spacing:.34em; color:#4b5563; }
  .top .grp b { font-size:19px; font-weight:700; color:#fff; line-height:1; }
  .top .grp b.a { color:var(--a); }
  .top .prog { flex:1; max-width:420px; }
  .top .prog .pl { display:flex; justify-content:space-between; font-size:11px; color:#4b5563; margin-bottom:6px; }
  .top .tot { margin-left:auto; }

  /* 공통 하단 방침 */
  .foot { display:flex; flex-direction:column; justify-content:center; gap:13px; padding:0 44px; height:150px;
          border-top:1px solid rgba(255,255,255,.1); background:linear-gradient(0deg,rgba(3,5,10,.95),rgba(3,5,10,.42)); }
  .foot .hd { display:flex; align-items:center; gap:15px; }
  .foot .hd p { margin:0; font-size:17px; color:#9ca3af; } .foot .hd p b { color:#fff; }
  .opts { display:flex; gap:11px; } .opts .btn { flex:1; }
  .ring { position:relative; display:grid; place-items:center; width:62px; flex:none; }
  .ring svg { transform:rotate(-90deg); } .ring circle { fill:none; stroke-width:4; }
  .ring .b1 { stroke:rgba(255,255,255,.12); } .ring .b2 { stroke:var(--em); stroke-linecap:round; }
  .ring b { position:absolute; font:800 20px 'Saira Condensed'; color:#fff; }

/* ═════ 페이지 ═════ */
  .wrap { max-width:1400px; margin:0 auto; padding:44px 22px 110px; }
  h1 { font-size:33px; font-weight:700; color:#fff; margin:12px 0 10px; }
  .lead { color:#9ca3af; font-size:15px; line-height:1.85; margin:0 0 4px; } .lead b { color:#fff; }
  .fam { margin:66px 0 0; padding-top:30px; border-top:1px solid rgba(255,255,255,.1); }
  .fam h2 { font-size:27px; font-weight:700; color:#fff; margin:0 0 6px; }
  .fam h2 em { font-style:normal; font:800 15px 'Saira Condensed'; letter-spacing:.3em; color:var(--em2); margin-right:14px; }
  .fam p { color:#9ca3af; font-size:14.5px; margin:0 0 4px; line-height:1.7; } .fam p b { color:#fff; }
  h3 { font-size:20px; font-weight:700; color:#fff; margin:42px 0 5px; }
  h3 em { font-style:normal; font:800 13px 'Saira Condensed'; letter-spacing:.26em; color:#6b7280; margin-right:12px; }
  .h3n { color:#8b95a5; font-size:13.5px; margin:0 0 18px; line-height:1.75; } .h3n b { color:#cbd5e1; }
  .stage { position:relative; width:100%; aspect-ratio:1920/911; overflow:hidden; box-shadow:inset 0 0 0 1px #1f2937; }
  .stage .in { position:absolute; left:0; top:0; width:1920px; height:911px; transform-origin:0 0; transform:scale(var(--s,.72)); }
</style>

<style>
/* ═════ 이닝 정리 ═════ */
  .screen .lay { grid-template-rows:78px 1fr 150px; }
  .mid { display:grid; grid-template-columns:1fr 620px 1fr; gap:26px; padding:24px 44px; align-items:stretch; }
  .col { display:flex; flex-direction:column; gap:14px; min-width:0; }
  .col.r { align-items:flex-end; text-align:right; }
  .col .rows, .col .mt, .col .blk, .col .who { width:100%; }
  .col > .blk:last-child { flex:1; }

  /* 반이닝 머리 */
  .hh { display:flex; align-items:center; gap:14px; width:100%; }
  .col.r .hh { flex-direction:row-reverse; }
  .hh .t { font-size:19px; font-weight:700; color:#fff; }
  .hh .t span { font-size:14px; font-weight:500; color:#9ca3af; margin-left:8px; }
  .hh .g { order:-1; font:800 44px/1 'Saira Condensed'; color:var(--g,var(--yel)); }
  .hh .t { margin-right:auto; } .col.r .hh .t { margin-right:0; margin-left:auto; }
  .hh .g.zero { font-size:20px; color:#4b5563; letter-spacing:.14em; }

  .who { display:flex; align-items:center; gap:16px; }
  .col.r .who { flex-direction:row-reverse; }
  .who .port { width:132px; height:176px; --c:11px; flex:none; }
  .who .nm { font-size:31px; font-weight:700; color:#fff; line-height:1.08; }
  .who .ps { font-size:13px; color:#9ca3af; margin-top:3px; }
  .who .ac { margin-top:9px; font-size:20px; font-weight:700; color:var(--a); }
  .who .sb { margin-top:5px; font-size:12.5px; color:#6b7280; }

  .blk { padding:15px 18px; } .blk .lab { margin-bottom:11px; }
  .mt { display:grid; gap:6px; } .mt.c3 { grid-template-columns:repeat(3,1fr); } .mt.c2 { grid-template-columns:repeat(2,1fr); }
  .sline { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:8px 0;
           border-top:1px solid rgba(255,255,255,.06); font-size:14px; }
  .col.r .sline { flex-direction:row-reverse; }
  .sline:first-of-type { border-top:0; }
  .sline b { color:#e5e7eb; font-weight:600; } .sline span { color:#8b95a5; font-size:13px; }
  .sline em { font-style:normal; font:800 18px 'Saira Condensed'; color:var(--e,#9ca3af); }
  .quiet { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; flex:1; padding:26px 0; }
  .quiet b { font-size:24px; font-weight:700; color:#6b7280; } .quiet span { font-size:13.5px; color:#4b5563; }

  /* 가운데 */
  .center { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:space-evenly;
            gap:16px; padding:26px 32px; }
  .center .wm { left:50%; top:50%; transform:translate(-50%,-50%); font-size:330px; z-index:-1; }
  .center .inn { margin:0; font-size:96px; font-weight:700; color:#fff; letter-spacing:-.05em; line-height:.9; text-align:center; }
  .center .inn em { font-style:normal; font-size:54px; color:var(--or); margin-left:8px; }
  .center .sd { font-size:15px; color:#9ca3af; letter-spacing:.04em; }

  /* 이닝별 양방향 막대 */
  .innb { width:100%; display:grid; gap:6px; }
  .innb .hd { display:grid; grid-template-columns:1fr 46px 1fr; align-items:baseline; gap:10px;
              font-size:11px; font-weight:700; letter-spacing:.26em; color:#4b5563; margin-bottom:4px; }
  .innb .hd .l { text-align:right; color:var(--my); } .innb .hd .rr { color:var(--opp); }
  .innb .r { display:grid; grid-template-columns:1fr 46px 1fr; align-items:center; gap:10px; }
  .innb .r .l { display:flex; justify-content:flex-end; gap:4px; } .innb .r .rr { display:flex; gap:4px; }
  .innb .r i { display:block; height:17px; width:24px; }
  .innb .r span { font:800 14px 'Saira Condensed'; color:#4b5563; text-align:center; }
  .innb .r.n span { color:var(--yel); font-size:17px; }
  .innb .r.n { background:rgba(253,224,71,.07); box-shadow:inset 0 0 0 1px rgba(253,224,71,.28); padding:3px 0;
               clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px); }
  .innb .r.fu span { color:#334155; }

  /* 이번 이닝 결산 */
  .tally { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px; width:100%; }
  .tally .s { text-align:center; }
  .tally .s b { display:block; font:800 62px/1 'Saira Condensed'; }
  .tally .s.me b { color:var(--my); } .tally .s.op b { color:var(--opp); }
  .tally .s b.z { color:#374151; font-size:40px; }
  .tally .s span { display:block; margin-top:7px; font-size:11px; font-weight:700; letter-spacing:.24em; color:#6b7280; }
  .tally .vs { font:800 17px 'Saira Condensed'; color:#374151; letter-spacing:.2em; }
  .fin { text-align:center; } .fin b { display:block; font-size:30px; font-weight:700; color:#fff; }
  .fin span { display:block; margin-top:8px; font-size:14px; color:#9ca3af; }
</style>

<div class="wrap">
  <p class="lab" style="--a:var(--em2)">Inning Recap</p>
  <h1>이닝 정리 — 초·말을 한 장에</h1>
  <p class="lead">
    반이닝마다 끊지 않고 <b>한 이닝이 다 끝나면</b> 정리한다. 화면이 <b>18번 → 9번</b>으로 줄고,
    왼쪽은 우리 공격(말) · 오른쪽은 상대 공격(초) · 가운데는 이닝별 흐름 —
    <b>좌우 대결 구도가 저절로 맞아떨어진다.</b><br>
    같은 배치로 <b>다섯 가지 이닝 상황</b>을 담았다. 어떤 이닝이 와도 칸이 흔들리지 않는지가 관건이다.
  </p>
  <div id="root"></div>
</div>

<script>
const C = (id) => `cards/${encodeURIComponent(id)}.webp`;
const 박병호='legend-kiwoom_박병호', 이정후='legend-mvp_이정후', 김도영='legend-mvp_김도영',
      최정='legend-ssg_최정', 강백호='legend-nc-kt_강백호', 김광현='legend-ssg_김광현',
      구자욱='legend-samsung_구자욱', 손아섭='legend-lotte_손아섭',
      이종범='legend-mvp_이종범', 이대호='legend-lotte_이대호', 양현종='legend-kia_양현종';

const lab = (t, a = 'var(--or)', em = '') => `<span class="lab" style="--a:${a}">${t}${em ? `<em>${em}</em>` : ''}</span>`;
const seg = (n, a = 'var(--my)') => `<div class="seg" style="--a:${a}">${
  Array.from({ length: 9 }, (_, i) => `<i class="${i + 1 < n ? 'on' : i + 1 === n ? 'now' : ''}"></i>`).join('')}</div>`;
const st = (s, v, a) => `<div class="stbox cut"><span>${s}</span><b${a ? ' class="a"' : ''}${a ? ` style="--a:${a}"` : ''}>${v}</b></div>`;
const sline = (b, s, em, e = '#9ca3af') => `<div class="sline" style="--e:${e}"><div><b>${b}</b> <span>${s}</span></div><em>${em}</em></div>`;
const pane = (a, inner) => `<div class="blk cut frame glass" style="--a:${a};--c:14px">${inner}</div>`;
const who = (id, nm, ps, ac, sb, a) => `
  <div class="who" style="--a:${a}">
    <div class="port" style="--a:${a};background-image:url(${C(id)})"></div>
    <div><div class="nm">${nm}</div><div class="ps">${ps}</div>
      <div class="ac">${ac}</div>${sb ? `<div class="sb">${sb}</div>` : ''}</div>
  </div>`;
const topbar = (n, sc) => `
  <div class="top" style="--a:var(--or)">
    <div class="grp"><span>INNING RECAP</span><b>이닝 정리</b></div>
    <div class="grp"><span>INNING</span><b class="a">${n}회 종료</b></div>
    <div class="prog"><div class="pl"><span>경기 진행</span><span>${n} / 9 이닝</span></div>${seg(n)}</div>
    <div class="tot"><span class="t">AI 올스타</span><span class="v">${sc[0]}<span class="x">:</span>${sc[1]}</span><span class="t me">나의 드림팀</span></div>
  </div>`;
const foot = (p, o, d) => `
  <div class="foot">
    <div class="hd">${lab('Next', 'var(--em2)')}<p>${p}</p></div>
    <div class="opts">
      ${o.map(([t, s], i) => `<div class="btn cut${i === d ? ' pri' : ''}">${t}<small>${s}</small></div>`).join('')}
      <div class="ring"><svg width="58" height="58"><circle class="b1" cx="29" cy="29" r="24"/>
        <circle class="b2" cx="29" cy="29" r="24" stroke-dasharray="151" stroke-dashoffset="44"/></svg><b>5</b></div>
    </div>
  </div>`;
/* 이닝 방침 — 반이닝이 아니라 이닝 단위 기조 하나로 */
const PLAN = [['균형', '기본 — 맡긴다'], ['공격적으로', '작전 · 대타를 아끼지 않는다'], ['지키기', '불펜 · 전진 수비']];
const bar = (rows, now) => `
  <div class="innb">
    <div class="hd"><span class="l">나의 드림팀</span><span></span><span class="rr">AI 올스타</span></div>
    ${rows.map(([n, a, b, fut]) => `<div class="r ${n === now ? 'n' : ''}${fut ? ' fu' : ''}">
      <div class="l">${Array.from({ length: a }, () => `<i style="background:${n === now ? 'var(--yel)' : 'var(--my)'};box-shadow:${n === now ? '0 0 14px var(--yel)' : 'none'}"></i>`).join('')}</div>
      <span>${n}</span>
      <div class="rr">${Array.from({ length: b }, () => `<i style="background:${n === now ? 'var(--opp)' : 'color-mix(in srgb,var(--opp) 72%,#000)'};box-shadow:${n === now ? '0 0 14px var(--opp)' : 'none'}"></i>`).join('')}</div>
    </div>`).join('')}
  </div>`;
const tally = (me, op) => `
  <div class="tally">
    <div class="s me"><b class="${me ? '' : 'z'}">${me ? `+${me}` : '0'}</b><span>우리 ${me ? '득점' : '무득점'}</span></div>
