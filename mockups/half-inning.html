<!doctype html>
<html lang="ko">
<title>반이닝 정리 화면</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Saira+Condensed:wght@500;600;800&display=swap" rel="stylesheet">
<style>
/* ── 게임 본편과 같은 언어 (src/KboAugmentDraft.jsx 의 .ui-* 를 그대로) ── */
  :root { --em:#10b981; --em2:#34d399; --red:#f87171; --red2:#ef4444; --yel:#fde047;
          --sky:#38bdf8; --sky2:#7dd3fc; --vio:#c4b5fd; --or:#fb923c; --gray:#94a3b8;
          --my:#34d399; --opp:#f87171; }          /* 내 팀 / 상대 — 중계 화면과 같은 색 */
  * { box-sizing:border-box; }
  body { margin:0; background:#03050a; color:#e5e7eb;
         font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  .d { font-family:'Saira Condensed',sans-serif; }

  .ui-cut { --c:14px; clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
  .ui-frame { position:relative; }
  .ui-frame::after {
    content:""; position:absolute; inset:0; z-index:7; pointer-events:none;
    background:
      linear-gradient(135deg,transparent calc(50% - 1px),var(--a,#10b981) calc(50% - 1px),var(--a,#10b981) calc(50% + 1px),transparent calc(50% + 1px)) left top / var(--c) var(--c) no-repeat,
      linear-gradient(135deg,transparent calc(50% - 1px),var(--a,#10b981) calc(50% - 1px),var(--a,#10b981) calc(50% + 1px),transparent calc(50% + 1px)) right bottom / var(--c) var(--c) no-repeat,
      linear-gradient(var(--a,#10b981),var(--a,#10b981)) left var(--c) top 0 / 56px 2px no-repeat,
      linear-gradient(var(--a,#10b981),var(--a,#10b981)) left 0 top var(--c) / 2px 30px no-repeat,
      linear-gradient(var(--a,#10b981),var(--a,#10b981)) right var(--c) bottom 0 / 56px 2px no-repeat,
      linear-gradient(var(--a,#10b981),var(--a,#10b981)) right 0 bottom var(--c) / 2px 30px no-repeat;
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a,#10b981) 32%,transparent); }
  .ui-lab { display:inline-flex; align-items:center; gap:9px; font-size:13px; font-weight:700; letter-spacing:.32em;
            text-transform:uppercase; color:var(--a,#10b981); }
  .ui-lab::before { content:""; width:15px; height:11px; background:currentColor; clip-path:polygon(0 0,60% 0,100% 100%,40% 100%); }
  .ui-btn { --c:10px; display:flex; flex-direction:column; justify-content:center; min-height:62px; padding:10px 24px;
            font-size:20px; font-weight:700; color:#e8ecf2; background:rgba(255,255,255,.055);
            box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
  .ui-btn.pri { background:var(--em); color:#04070d; box-shadow:none; }
  .ui-btn small { font-size:13px; font-weight:600; color:#8b95a5; margin-top:3px; }
  .ui-btn.pri small { color:rgba(4,7,13,.62); }
  .ui-chip { --c:6px; display:inline-flex; align-items:center; gap:6px; padding:4px 11px; font-size:13px; font-weight:700;
             color:var(--a,#cbd5e1); background:rgba(5,8,15,.6); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a,#94a3b8) 55%,transparent); }

/* ══════════ 화면 ══════════ */
  .screen { position:relative; width:1920px; height:911px; overflow:hidden; background:#05080f;
            display:grid; grid-template-rows:76px 1fr 158px;
            font-size:16px; }
  .screen::before { content:''; position:absolute; inset:0; z-index:0;
    background:url(clutch/sim-broad.webp) center/cover; opacity:.30; }
  .screen::after { content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(130% 92% at 50% 42%,rgba(3,5,10,.5),rgba(3,5,10,.96) 76%),
               repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px); }
  .screen > * { position:relative; z-index:2; }

  /* ── 상단 바 ── */
  .bar { display:flex; align-items:center; gap:30px; padding:0 46px;
         border-bottom:1px solid rgba(255,255,255,.1); background:linear-gradient(180deg,rgba(3,5,10,.9),rgba(3,5,10,.42)); }
  .bar .prog { margin-left:auto; display:flex; align-items:center; gap:5px; }
  .bar .prog i { width:16px; height:7px; background:rgba(255,255,255,.12); transform:skewX(-24deg); }
  .bar .prog i.on { background:var(--my); } .bar .prog i.now { background:var(--yel); box-shadow:0 0 10px var(--yel); }
  .bar .tot { display:flex; align-items:center; gap:16px; margin-left:30px; }
  .bar .tot .t { font-size:15px; font-weight:600; color:#6b7280; }
  .bar .tot .t.mine { color:var(--my); } .bar .tot .t.theirs { color:var(--opp); }
  .bar .tot .v { font:800 30px/1 'Saira Condensed'; color:#fff; } .bar .tot .v .x { color:#374151; margin:0 9px; }

  /* ── 가운데: 세 구역 ── */
  .mid { display:grid; grid-template-columns:560px 1fr 560px; align-items:stretch; }

  /* 구역 1 — 회차 */
  .z1 { position:relative; display:flex; flex-direction:column; justify-content:center; gap:34px; padding:0 46px; overflow:hidden; }
  .z1 .wm { position:absolute; left:26px; top:50%; transform:translateY(-50%); font:800 300px/1 'Saira Condensed';
            color:transparent; -webkit-text-stroke:2px color-mix(in srgb,var(--a) 11%,transparent);
            pointer-events:none; user-select:none; }
  .inn { position:relative; }
  .inn b { display:block; font-size:132px; font-weight:700; line-height:.9; color:#fff; letter-spacing:-.045em;
           text-shadow:0 6px 50px rgba(0,0,0,.95); }
  .inn b em { font-style:normal; color:var(--a); }
  .inn .sd { display:flex; align-items:center; gap:14px; margin-top:20px; font-size:24px; font-weight:700; color:#cbd5e1; }
  .inn .sd i { font-style:normal; color:var(--sc); }
  .gain { position:relative; --c:16px; --g:var(--yel); align-self:flex-start; min-width:264px; padding:20px 34px 18px; text-align:center;
          background:color-mix(in srgb,var(--g) 12%,rgba(2,4,8,.9)); box-shadow:inset 0 0 0 2px var(--g); }
  .gain b { display:block; font:800 108px/1 'Saira Condensed'; color:var(--g);
            text-shadow:0 0 50px color-mix(in srgb,var(--g) 55%,transparent); }
  .gain span { display:block; margin-top:10px; font-size:14px; font-weight:700; letter-spacing:.28em;
               color:color-mix(in srgb,var(--g) 80%,#fff); }
  .gain.minus { --g:var(--opp); }
  .gain.zero { background:rgba(2,4,8,.72); box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  .gain.zero b { font-size:62px; color:#9ca3af; text-shadow:none; padding:23px 0 22px; }
  .gain.zero span { color:#6b7280; }

  /* 구역 2 — 이 회차 최고 활약 한 명 */
  .z2 { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
        padding:26px 30px 30px; border-left:1px solid rgba(255,255,255,.08); border-right:1px solid rgba(255,255,255,.08);
        background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--sc) 6%,transparent)); }
  .z2 .who { margin-bottom:16px; }
  .hero { position:relative; width:320px; height:480px; background:#0b1220 center 8%/cover;
          box-shadow:inset 0 0 0 2px var(--sc), 0 0 70px -18px var(--sc), 0 34px 70px -30px #000;
          clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px); }
  .hero::after { content:''; position:absolute; inset:0;
                 background:linear-gradient(180deg,transparent 46%,rgba(3,5,10,.9) 92%); }
  .hero .cap { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:16px 20px; text-align:center; }
  .hero .cap b { display:block; font-size:34px; font-weight:700; color:#fff; line-height:1.1; }
  .hero .cap span { display:block; margin-top:4px; font-size:14px; font-weight:600; color:color-mix(in srgb,var(--sc) 80%,#fff); }
  .z2 .did { margin-top:20px; text-align:center; }
  .z2 .did b { display:inline-block; font-size:30px; font-weight:700; color:var(--sc); padding-bottom:7px;
               background:linear-gradient(90deg,transparent,var(--sc),transparent) bottom / 100% 2px no-repeat; }
  .z2 .did span { display:block; margin-top:12px; font-size:16px; color:#9ca3af; }

  /* 구역 3 — 이 회에 벌어진 일 */
  .z3 { display:flex; flex-direction:column; padding:30px 46px 26px; }
  .z3 > .ui-lab { margin-bottom:18px; }
  .ev { display:grid; grid-template-columns:14px 1fr auto; align-items:baseline; gap:16px; padding:15px 0;
        border-top:1px solid rgba(255,255,255,.06); }
  .ev:first-of-type { border-top:0; padding-top:4px; }
  .ev .dot { width:10px; height:10px; background:var(--e); transform:skewX(-22deg); align-self:center; }
  .ev .tx { min-width:0; font-size:19px; line-height:1.4; }
  .ev .tx b { color:var(--tc,#fff); font-weight:700; margin-right:10px; }
  .ev .tx span { color:#9ca3af; } .ev .tx span.hi { color:var(--e); font-weight:700; }
  .ev .tx small { display:block; margin-top:5px; font-size:14px; color:#6b7280; }
  .ev .rt { font:800 27px 'Saira Condensed'; color:var(--e); white-space:nowrap; }

  /* ── 하단 바 ── */
  .foot { display:flex; flex-direction:column; justify-content:center; gap:14px; padding:0 46px;
          border-top:1px solid rgba(255,255,255,.1); background:linear-gradient(0deg,rgba(3,5,10,.92),rgba(3,5,10,.4)); }
  .foot .hd { display:flex; align-items:center; gap:16px; }
  .foot .hd p { margin:0; font-size:18px; color:#9ca3af; } .foot .hd p b { color:#fff; }
  .opts { display:flex; gap:12px; align-items:stretch; }
  .opts .ui-btn { flex:1; }
  .ring { position:relative; display:grid; place-items:center; width:66px; flex:none; }
  .ring svg { transform:rotate(-90deg); } .ring circle { fill:none; stroke-width:4; }
  .ring .b1 { stroke:rgba(255,255,255,.12); } .ring .b2 { stroke:var(--em); stroke-linecap:round; }
  .ring b { position:absolute; font:800 21px 'Saira Condensed'; color:#fff; }
  .fin { display:flex; align-items:center; justify-content:center; gap:20px; }
  .fin b { font-size:28px; color:#fff; } .fin span { font-size:16px; color:#6b7280; }

/* ══════════ 페이지 ══════════ */
  .wrap { max-width:1340px; margin:0 auto; padding:44px 22px 100px; }
  h1 { font-size:32px; font-weight:700; color:#fff; margin:12px 0 10px; }
  .lead { color:#9ca3af; font-size:15px; line-height:1.85; margin:0; } .lead b { color:#fff; }
  .key { display:flex; flex-wrap:wrap; gap:16px; margin:22px 0 6px; align-items:center; }
  .key i { display:inline-block; width:14px; height:14px; transform:skewX(-22deg); margin-right:8px; vertical-align:-2px; }
  .key span { font-size:14px; color:#9ca3af; } .key span b { color:#fff; }
  h2 { font-size:19px; font-weight:700; color:#fff; margin:56px 0 4px; padding-top:28px; border-top:1px solid rgba(255,255,255,.08); }
  .h2n { color:#6b7280; font-size:14px; margin:0 0 26px; line-height:1.7; } .h2n b { color:#cbd5e1; }
  .note { color:#7c8798; font-size:13.5px; line-height:1.8; margin:13px 0 0; } .note b { color:#cbd5e1; }
  .slot { margin:0 0 44px; }
  .stage { position:relative; width:100%; aspect-ratio:1920/911; overflow:hidden; box-shadow:inset 0 0 0 1px #1f2937; }
  .stage .in { position:absolute; left:0; top:0; width:1920px; height:911px; transform-origin:0 0; transform:scale(var(--s,.68)); }
</style>

<div class="wrap">
  <p class="ui-lab" style="--a:var(--em2)">Half-Inning Recap</p>
  <h1>반이닝 정리 화면</h1>
  <p class="lead">
    초·말이 바뀌면 <b>화면 전체가 정리 화면으로 바뀐다.</b> 카드가 떠오르는 게 아니라 중계 화면이 통째로 넘어간다.<br>
    세 구역 — <b>왼쪽에 몇 회 초·말과 이번 회 점수</b>, <b>가운데에 이 회차 최고 활약 한 명</b>,
    <b>오른쪽에 벌어진 일</b>. 아래는 다음 방침.
  </p>
  <div class="key">
    <span><i style="background:var(--my)"></i><b>내 팀</b> — 초록</span>
    <span><i style="background:var(--opp)"></i><b>상대</b> — 빨강</span>
    <span><i style="background:var(--gray)"></i><b>날씨 · 그라운드</b> — 회색</span>
    <span style="color:#6b7280">가운데 선수 액자와 이름, 오른쪽 목록의 점이 모두 이 색을 따른다.</span>
  </div>
  <div id="root"></div>
</div>

<script>
const IMG = (id) => `cards/${encodeURIComponent(id)}.webp`;
const 박병호='legend-kiwoom_박병호', 최정='legend-ssg_최정', 구자욱='legend-samsung_구자욱',
      강백호='legend-nc-kt_강백호', 김도영='legend-mvp_김도영', 박세웅='2026-lotte_박세웅',
      김광현='legend-ssg_김광현', 류현진='legend-mvp_류현진', 오승환='legend-samsung_오승환',
      손아섭='legend-lotte_손아섭', 양현종='legend-kia_양현종', 이정후='legend-mvp_이정후',
      원태인='2026-samsung_원태인', 이종범='legend-mvp_이종범', 이대호='legend-lotte_이대호';

/* 사건 줄 — my: 내 팀 / opp: 상대 / env: 날씨·그라운드 */
const my  = (nm, tx, rt='', sub='', e='var(--my)')  => ({ t:'my',  e, nm, tx, rt, sub });
const opp = (nm, tx, rt='', sub='')                 => ({ t:'opp', e:'var(--opp)', nm, tx, rt, sub });
const env = (nm, tx, sub='')                        => ({ t:'env', e:'var(--gray)', nm, tx, rt:'', sub });
const 득 = (nm, tx, rt, sub='') => my(nm, tx, rt, sub, 'var(--yel)');
const 악 = (nm, tx, sub='') => ({ t:'my', e:'var(--opp)', nm, tx, rt:'', sub });
const 호 = (nm, tx, sub='') => ({ t:'my', e:'var(--sky2)', nm, tx, rt:'', sub });
const 증 = (nm, tx, sub='') => ({ t:'my', e:'var(--vio)', nm, tx, rt:'', sub });

const DEF    = [['정면 승부','기본'],['신중하게','유인구 위주'],['전진 수비','1점을 막는다']];
const DEF_CH = [['정면 승부','기본'],['투수 교체','불펜에서 고른다'],['신중하게','유인구 위주']];
const OFF    = [['강공','기본'],['작전 야구','번트 · 도루'],['기다리기','투구수를 늘린다']];
const OFF_PH = [['강공','기본'],['대타 기용','벤치에서 고른다'],['작전 야구','번트 · 도루']];

const S = [
{ sec:'점수가 난 회차', secn:'한 경기 <b>3.6회</b>. 왼쪽 <b>+N</b>이 먼저 읽히고, 가운데 선수가 그 점수를 낸 사람이다.' },
{
  a:'var(--or)', wm:'6TH', inn:'6회', half:'말', side:'나의 드림팀', act:'공격', sc:'my', gain:'+3',
  hero:[박병호,'박병호','4번 · 1B','쓰리런 홈런','비거리 127m · 시즌 21호'],
  ev:[ 득('박병호','쓰리런 <span class="hi">홈런</span>','+3'), my('이정후','우전 안타'),
       my('김도영','볼넷'), my('최정','중견수 뜬공 아웃') ],
  sc2:[4,8], prog:[11,'my'], nx:['<b>7회초 내 수비</b> — 우리 선발 <b>92구</b>', DEF_CH, 1], secs:4.5,
  note:'가장 기본. 왼쪽 <b>회차 → 득점</b>, 가운데 <b>한 명</b>, 오른쪽 <b>전부</b>. 액자가 초록이라 <b>내 팀 선수</b>임이 한눈에 읽힌다.',
},
{
  a:'var(--yel)', wm:'3RD', inn:'3회', half:'말', side:'나의 드림팀', act:'공격', sc:'my', gain:'+4',
  hero:[최정,'최정','5번 · 3B','만루 싹쓸이 2루타','이 회 타자 8명 · 안타 4개'],
  ev:[ 득('최정','만루 싹쓸이 <span class="hi">2루타</span>','+3'), 득('이정후','적시타','+1'),
       my('구자욱','2루타'), my('김도영','볼넷'), my('강백호','병살타로 이닝 종료') ],
  sc2:[1,6], prog:[5,'my'], nx:['<b>4회초 내 수비</b> — 상대 7·8·9번', DEF, 0], secs:5,
  note:'<b>빅이닝.</b> 오른쪽 목록이 길어져도 구역이 넓어서 답답하지 않다. 다섯 줄까지 보여주고 넘치면 접는다.',
},
{
  a:'var(--yel)', wm:'7TH', inn:'7회', half:'말', side:'나의 드림팀', act:'공격', sc:'my', gain:'+2', tag:'역전',
  hero:[구자욱,'구자욱','7번 · RF','역전 2타점 3루타','3 : 4 — 경기를 뒤집었다'],
  ev:[ 득('구자욱','역전 2타점 <span class="hi">3루타</span>','+2'), my('김하성','좌전 안타'),
       my('손아섭','희생번트'), env('관중','홈 관중 기립 — 팀 사기 <span class="hi">+2</span>','다음 이닝 타격 보정') ],
  sc2:[3,4], prog:[13,'my'], nx:['<b>8회초 내 수비</b> — 리드를 지킨다', DEF_CH, 1], secs:5,
  note:'<b>역전.</b> 회차 아래에 태그가 붙고 상단 점수판이 뒤집히는 연출이 들어갈 자리. 관중 반응은 회색 — <b>사람이 아니라 환경</b>이다.',
},
{
  a:'var(--em2)', wm:'5TH', inn:'5회', half:'말', side:'나의 드림팀', act:'공격', sc:'my', gain:'+1',
  hero:[강백호,'강백호','6번 · DH','밀어내기 볼넷','이 회 볼넷 3개 — 상대를 흔들었다'],
  ev:[ 득('강백호','밀어내기 <span class="hi">볼넷</span>','+1'), my('손아섭','볼넷'),
       my('김도영','몸에 맞는 공'), my('이정후','볼넷'), my('최정','삼진 — 잔루 3') ],
  sc2:[2,3], prog:[9,'my'], nx:['<b>6회초 내 수비</b> — 상대 3·4·5번', DEF, 0], secs:3.5,
  note:'안타 하나 없이 난 점수. <b>가운데 한 명만 봐서는 모르고</b> 오른쪽을 읽어야 "볼넷으로 흔들었다"가 보인다 — 두 구역이 서로를 보완한다.',
},
{

function screen(k) {
  const minus = String(k.gain).startsWith('−');
  const SC = k.sc === 'opp' ? 'var(--opp)' : 'var(--my)';
  const gain = k.gain === 0
    ? `<div class="gain zero ui-cut"><b>0</b><span>${k.gainLab || '무득점'}</span></div>`
    : `<div class="gain ui-cut${minus ? ' minus' : ''}"><b>${k.gain}</b><span>${k.gainLab || (minus ? '이 회 실점' : '이 회 득점')}</span></div>`;

  const prog = Array.from({ length: 18 }, (_, i) =>
    `<i class="${i + 1 < k.prog[0] ? 'on' : i + 1 === k.prog[0] ? 'now' : ''}"></i>`).join('');

  const rows = k.ev.map((e) => `
    <div class="ev" style="--e:${e.e};--tc:${e.t === 'opp' ? 'var(--opp)' : e.t === 'env' ? '#cbd5e1' : '#fff'}">
      <span class="dot"></span>
      <div class="tx"><b>${e.nm}</b><span>${e.tx}</span>${e.sub ? `<small>${e.sub}</small>` : ''}</div>
      <span class="rt">${e.rt}</span>
    </div>`).join('');

  return `
<div class="screen" style="--a:${k.a};--sc:${SC}">
  <div class="bar">
    <span class="ui-lab" style="--a:${k.a}">Half-Inning Recap</span>
    <div class="prog">${prog}</div>
    <div class="tot">
      <span class="t ${k.sc === 'opp' ? 'theirs' : ''}">AI 올스타</span>
      <span class="v">${k.sc2[0]}<span class="x">:</span>${k.sc2[1]}</span>
      <span class="t ${k.sc === 'opp' ? '' : 'mine'}">나의 드림팀</span>
    </div>
  </div>

  <div class="mid">
    <div class="z1">
      <span class="wm">${k.wm}</span>
      <div class="inn">
        <b>${k.inn}<em>${k.half}</em></b>
        <span class="sd">${k.side} <i>${k.act}</i>${k.tag ? `<span class="ui-chip ui-cut" style="--a:${k.a}">${k.tag}</span>` : ''}</span>
      </div>
      ${gain}
    </div>

    <div class="z2">
      <span class="ui-lab who" style="--a:${SC}">${k.sc === 'opp' ? 'Opponent · 상대' : 'My Team · 내 팀'}</span>
      <div class="hero" style="background-image:url(${IMG(k.hero[0])})">
        <div class="cap"><b>${k.hero[1]}</b><span>${k.hero[2]}</span></div>
      </div>
      <div class="did"><b>${k.hero[3]}</b><span>${k.hero[4]}</span></div>
    </div>

    <div class="z3">
      <span class="ui-lab" style="--a:${k.a}">이 회에 벌어진 일</span>
      ${rows}
    </div>
  </div>

  ${k.fin ? `<div class="foot"><div class="fin"><b>${k.fin[0]}</b><span>${k.fin[1]}</span></div></div>` : `
  <div class="foot">
    <div class="hd"><span class="ui-lab" style="--a:var(--em2)">Next</span><p>${k.nx[0]}</p></div>
    <div class="opts">
      ${k.nx[1].map(([t, s], i) => `<div class="ui-btn ui-cut${i === k.nx[2] ? ' pri' : ''}">${t}<small>${s}</small></div>`).join('')}
      <div class="ring">
        <svg width="62" height="62"><circle class="b1" cx="31" cy="31" r="26"/><circle class="b2" cx="31" cy="31" r="26" stroke-dasharray="164" stroke-dashoffset="48"/></svg>
        <b>${k.secs}</b>
      </div>
    </div>
  </div>`}
</div>`;
}

let html = '', n = 0;
for (const k of S) {
  if (k.sec) { html += `<h2>${k.sec}</h2><p class="h2n">${k.secn}</p>`; continue; }
  n += 1;
  html += `<div class="slot"><div class="stage"><div class="in">${screen(k)}</div></div>
    <p class="note"><b class="d" style="font-size:16px">${String(n).padStart(2, '0')}</b> · ${k.secs}초 — ${k.note}</p></div>`;
}
document.getElementById('root').innerHTML = html;

const fit = () => document.querySelectorAll('.stage').forEach((el) => {
  el.querySelector('.in').style.setProperty('--s', el.clientWidth / 1920);
});
fit(); addEventListener('resize', fit);
