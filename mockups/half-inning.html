<!doctype html>
<html lang="ko">
<title>반이닝 정리 카드</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Saira+Condensed:wght@500;600;800&display=swap" rel="stylesheet">
<style>
/* ── 게임 본편과 같은 언어 (src/KboAugmentDraft.jsx 의 .ui-* 를 그대로 가져옴) ── */
  :root { --em:#10b981; --em2:#34d399; --red:#f87171; --yel:#fde047; --sky:#38bdf8; --sky2:#7dd3fc; --vio:#c4b5fd; --or:#fb923c; }
  * { box-sizing:border-box; }
  body { margin:0; background:#05080f; color:#e5e7eb;
         font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  .d { font-family:'Saira Condensed',sans-serif; }

  .ui-cut { --c:14px; clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
  .ui-glass { background:rgba(6,10,19,.74); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .ui-glass2 { background:rgba(9,14,26,.9); }
  .ui-frame { position:relative; }
  .ui-frame::after {
    content:""; position:absolute; inset:0; z-index:7; pointer-events:none;
    background:
      linear-gradient(135deg,transparent calc(50% - 1px),var(--a,#10b981) calc(50% - 1px),var(--a,#10b981) calc(50% + 1px),transparent calc(50% + 1px)) left top / var(--c) var(--c) no-repeat,
      linear-gradient(135deg,transparent calc(50% - 1px),var(--a,#10b981) calc(50% - 1px),var(--a,#10b981) calc(50% + 1px),transparent calc(50% + 1px)) right bottom / var(--c) var(--c) no-repeat,
      linear-gradient(var(--a,#10b981),var(--a,#10b981)) left var(--c) top 0 / 56px 2px no-repeat,
      linear-gradient(var(--a,#10b981),var(--a,#10b981)) left 0 top var(--c) / 2px 30px no-repeat,
      linear-gradient(var(--a,#10b981),var(--a,#10b981)) right var(--c) bottom 0 / 56px 2px no-repeat,
      linear-gradient(var(--a,#10b981),var(--a,#10b981)) right 0 bottom var(--c) / 2px 30px no-repeat;
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a,#10b981) 32%,transparent); }
  .ui-lab { display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700; letter-spacing:.32em;
            text-transform:uppercase; color:var(--a,#10b981); }
  .ui-lab::before { content:""; width:14px; height:10px; background:currentColor; clip-path:polygon(0 0,60% 0,100% 100%,40% 100%); }
  .ui-btn { --c:9px; position:relative; display:flex; flex-direction:column; justify-content:center; min-height:44px; padding:8px 16px;
            font-size:15px; font-weight:700; color:#e8ecf2; background:rgba(255,255,255,.06);
            box-shadow:inset 0 0 0 1px rgba(255,255,255,.22); }
  .ui-btn.pri { background:var(--a,#10b981); color:#05080f; box-shadow:none; }
  .ui-btn small { font-size:11px; font-weight:600; color:#8b95a5; margin-top:2px; }
  .ui-btn.pri small { color:color-mix(in srgb,#05080f 62%,transparent); }
  .ui-chip { --c:6px; display:inline-flex; align-items:center; gap:6px; padding:3px 9px; font-size:12px; font-weight:600;
             color:#cbd5e1; background:rgba(5,8,15,.6); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a,#94a3b8) 45%,transparent); }
  .ui-scan { background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px); }

/* ── 페이지 ── */
  .wrap { max-width:1020px; margin:0 auto; padding:40px 20px 90px; }
  h1 { font-size:30px; font-weight:700; color:#fff; margin:10px 0 8px; letter-spacing:-.01em; }
  .lead { color:#9ca3af; font-size:14px; line-height:1.8; margin:0; } .lead b { color:#fff; font-weight:700; }
  .facts { display:flex; flex-wrap:wrap; gap:7px; margin:20px 0 10px; }
  h2 { font-size:18px; font-weight:700; color:#fff; margin:52px 0 4px; padding-top:26px; border-top:1px solid rgba(255,255,255,.08); }
  .h2n { color:#6b7280; font-size:13px; margin:0 0 24px; line-height:1.7; } .h2n b { color:#cbd5e1; }
  .note { max-width:900px; color:#7c8798; font-size:12.5px; line-height:1.75; margin:11px 0 0; }
  .note b { color:#cbd5e1; } .note .k { font-family:'Saira Condensed'; font-weight:800; color:var(--em2); }
  .slot { margin:0 0 34px; }

/* ── 카드 ── */
  .card { --c:18px; position:relative; width:100%; max-width:900px; overflow:hidden;
          background:linear-gradient(180deg,rgba(10,16,29,.96),rgba(5,8,15,.99)); }

  /* 1) 머리 — 회차가 가장 크다 */
  .top { position:relative; padding:20px 26px 18px; display:grid; grid-template-columns:1fr auto; align-items:center; gap:16px;
         border-bottom:1px solid rgba(255,255,255,.08); overflow:hidden; }
  .wm { position:absolute; right:186px; top:50%; transform:translateY(-50%); font:800 132px/1 'Saira Condensed';
        color:transparent; -webkit-text-stroke:1.5px color-mix(in srgb,var(--a) 13%,transparent);
        pointer-events:none; user-select:none; white-space:nowrap; }
  .who { position:relative; }
  .inn { font-size:70px; font-weight:700; line-height:.96; color:#fff; letter-spacing:-.03em; margin:0;
         text-shadow:0 4px 30px rgba(0,0,0,.9); }
  .inn em { font-style:normal; font-size:44px; color:var(--a); margin-left:4px; }
  .side { display:flex; align-items:center; gap:11px; margin-top:10px; font-size:15px; font-weight:600; color:#cbd5e1; }
  .side i { font-style:normal; color:var(--a); }

  /* 2) 이번 회 추가 득점 — 두 번째로 크다 */
  .gain { position:relative; --c:12px; --g:var(--yel); min-width:168px; padding:12px 22px 11px; text-align:center;
          background:color-mix(in srgb,var(--g) 13%,rgba(2,4,8,.85)); box-shadow:inset 0 0 0 1.5px var(--g); }
  .gain b { display:block; font:800 62px/1 'Saira Condensed'; color:var(--g); text-shadow:0 0 30px color-mix(in srgb,var(--g) 55%,transparent); }
  .gain span { display:block; margin-top:5px; font-size:11px; font-weight:700; letter-spacing:.24em; color:color-mix(in srgb,var(--g) 82%,#fff); }
  .gain.minus { --g:var(--red); }
  .gain.zero { background:rgba(2,4,8,.7); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
  .gain.zero b { font-size:34px; color:#9ca3af; text-shadow:none; padding:11px 0 10px; }
  .gain.zero span { color:#6b7280; }

  /* 3) 이 회에 벌어진 일 — 목록 */
  .feed { position:relative; padding:15px 26px 17px; }
  .feed > .ui-lab { margin-bottom:11px; }
  .ev { display:grid; grid-template-columns:30px 40px 1fr auto; align-items:center; gap:12px; padding:7px 0;
        border-top:1px solid rgba(255,255,255,.055); font-size:14px; }
  .ev:first-of-type { border-top:0; }
  .ev .ic { font-size:15px; text-align:center; color:var(--e,#6b7280); }
  .ev .fc { width:40px; height:50px; background:#0b1220 center 20%/cover; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
            clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px); }
  .ev .fc.none { background:none; box-shadow:none; }
  .ev .tx { min-width:0; } .ev .tx b { color:#fff; font-weight:700; margin-right:7px; }
  .ev .tx span { color:#9ca3af; } .ev .tx span.hi { color:var(--e); font-weight:700; }
  .ev .tx small { display:block; margin-top:2px; font-size:11.5px; color:#6b7280; }
  .ev .rt { font:800 20px 'Saira Condensed'; color:var(--e,#9ca3af); white-space:nowrap; }
  .ev.big .tx b { font-size:17px; } .ev.big .fc { width:48px; height:60px; }
  .ev.mvp { background:linear-gradient(90deg,color-mix(in srgb,var(--a) 9%,transparent),transparent 70%); margin:0 -26px; padding:8px 26px; }

  /* 4) 누적 점수 — 작게 */
  .sc { display:flex; align-items:center; justify-content:center; gap:16px; padding:9px 26px;
        background:rgba(2,4,8,.66); border-top:1px solid rgba(255,255,255,.07); border-bottom:1px solid rgba(255,255,255,.07); }
  .sc .t { font-size:12px; font-weight:600; color:#6b7280; } .sc .t.me { color:#cbd5e1; }
  .sc .v { font:800 22px/1 'Saira Condensed'; color:#cbd5e1; } .sc .v .x { color:#374151; margin:0 7px; }
  .sc .lab { font-size:10px; font-weight:700; letter-spacing:.24em; color:#4b5563; margin-right:4px; }

  /* 5) 다음 방침 */
  .nx { position:relative; padding:14px 26px 17px; }
  .nx .hd { display:flex; align-items:center; gap:12px; margin-bottom:11px; }
  .nx .hd p { margin:0; font-size:13px; color:#9ca3af; } .nx .hd p b { color:#fff; }
  .opts { display:flex; gap:8px; align-items:stretch; }
  .opts .ui-btn { flex:1; }
  .ring { position:relative; display:grid; place-items:center; width:48px; flex:none; }
  .ring svg { transform:rotate(-90deg); } .ring circle { fill:none; stroke-width:3; }
  .ring .b1 { stroke:rgba(255,255,255,.12); } .ring .b2 { stroke:var(--a); stroke-linecap:round; }
  .ring b { position:absolute; font:800 15px 'Saira Condensed'; color:#fff; }
  .fin { text-align:center; padding:16px 26px 20px; }
  .fin b { font-size:17px; color:#fff; } .fin span { display:block; margin-top:5px; font-size:12px; color:#6b7280; }

  /* 짧은 카드 */
  .thin { display:grid; grid-template-columns:auto auto 1fr auto; align-items:center; gap:16px; padding:13px 24px; }
  .thin .inn { font-size:36px; } .thin .inn em { font-size:24px; }
  .thin .fc { width:38px; height:46px; background:#0b1220 center 20%/cover;
              clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px); }
  .thin .tx b { color:#fff; font-size:16px; } .thin .tx span { color:#9ca3af; font-size:13px; }
  .thin .rt { font:800 17px 'Saira Condensed'; color:var(--a); }

  /* 화면 위 미리보기 */
  .stage { position:relative; width:100%; aspect-ratio:1920/911; background:url(clutch/sim-broad.webp) center/cover;
           overflow:hidden; box-shadow:inset 0 0 0 1px #1f2937; }
  .stage::before { content:''; position:absolute; inset:0; background:rgba(3,5,10,.78); backdrop-filter:blur(4px); }
  .stage .in { position:absolute; left:50%; top:50%; width:1920px; height:911px; margin:-455px 0 0 -960px;
               display:grid; place-items:center; transform:scale(var(--s,.5)); }
  @media (max-width:820px){
    .top{padding:16px} .inn{font-size:48px} .inn em{font-size:30px} .wm{font-size:104px}
    .gain{min-width:118px;padding:9px 14px} .gain b{font-size:44px}
    .feed,.nx{padding-left:16px;padding-right:16px} .ev.mvp{margin:0 -16px;padding-left:16px;padding-right:16px}
    .ev{grid-template-columns:22px 32px 1fr auto;gap:9px;font-size:13px} .ev .fc{width:32px;height:40px}
    .opts{flex-wrap:wrap} .opts .ui-btn{flex:1 1 42%}
  }
</style>

<div class="wrap">
  <p class="ui-lab" style="--a:var(--em2)">Half-Inning Recap</p>
  <h1>반이닝 정리 카드</h1>
  <p class="lead">
    초·말이 바뀔 때 <b>이 회차에 벌어진 일</b>을 한 장으로 정리한다. 득점만이 아니라 부상 · 교체 · 날씨까지 —
    <b>그 반이닝 동안 일어난 전부</b>다.<br>
    읽는 순서는 <b>① 몇 회 초·말 → ② 이번 회 몇 점 → ③ 무슨 일이 있었나 → ④ 다음 방침</b>.
    기본 선택지가 이미 눌려 있고 초읽기가 끝나면 그대로 진행된다.
  </p>
  <div class="facts" id="facts"></div>
  <div id="root"></div>
</div>

<script>
const FACTS = [
  ['반이닝', '18.2', '회 / 경기'], ['득점한 이닝', '3.6', '회'], ['위기 탈출', '8.7', '회'],
  ['삼자범퇴', '5.9', '회'], ['전환 카드 예산', '49', '초 / 경기'], ['경기 길이', '5.0', '분'],
];
document.getElementById('facts').innerHTML = FACTS.map(([k, v, s]) =>
  `<span class="ui-chip ui-cut">${k} <b class="d" style="font-size:15px;color:#fff">${v}</b> ${s}</span>`).join('');

const P = (id) => `profiles/${encodeURIComponent(id)}.webp`;
const 이정후='legend-mvp_이정후', 김도영='legend-mvp_김도영', 이종범='legend-mvp_이종범',
      박병호='legend-kiwoom_박병호', 최정='legend-ssg_최정', 강백호='legend-nc-kt_강백호',
      구자욱='legend-samsung_구자욱', 김하성='legend-kiwoom_김하성', 손아섭='legend-lotte_손아섭',
      이대호='legend-lotte_이대호', 박세웅='2026-lotte_박세웅', 류현진='legend-mvp_류현진',
      김광현='legend-ssg_김광현', 양현종='legend-kia_양현종', 원태인='2026-samsung_원태인',
      오승환='legend-samsung_오승환', 고우석='legend-lg_고우석', 정우람='legend-hanwha_정우람';

/* 사건 줄: [아이콘, 색, 사진id|null, 이름, 본문, 오른쪽, 덧말, 표시옵션] */
const E = (ic, e, id, nm, tx, rt = '', sub = '', o = {}) => ({ ic, e, id, nm, tx, rt, sub, ...o });
const 득 = (id, nm, tx, rt, sub, o) => E('◆', 'var(--yel)', id, nm, tx, rt, sub, o);
const 무 = (id, nm, tx, rt, sub, o) => E('·', '#6b7280', id, nm, tx, rt, sub, o);
const 수 = (id, nm, tx, rt, sub, o) => E('◆', 'var(--em2)', id, nm, tx, rt, sub, o);
const 악 = (nm, tx, sub, id) => E('⚠', 'var(--red)', id || null, nm, tx, '', sub);
const 호 = (nm, tx, sub, id) => E('✦', 'var(--sky2)', id || null, nm, tx, '', sub);
const 환 = (nm, tx, sub) => E('☁', '#94a3b8', null, nm, tx, '', sub);
const 증 = (nm, tx, sub, id) => E('✦', 'var(--vio)', id || null, nm, tx, '', sub);

const DEF = [['정면 승부', '기본'], ['신중하게', '유인구 위주'], ['전진 수비', '1점을 막는다']];
const DEF_CH = [['정면 승부', '기본'], ['투수 교체', '불펜에서 고른다'], ['신중하게', '유인구 위주']];
const OFF = [['강공', '기본'], ['작전 야구', '번트 · 도루'], ['기다리기', '투구수를 늘린다']];
const OFF_PH = [['강공', '기본'], ['대타 기용', '벤치에서 고른다'], ['작전 야구', '번트 · 도루']];

const C = [
/* ══ 득점 ══ */
{ sec:'점수가 난 회차', secn:'한 경기 <b>3.6회</b>. <b>+N</b> 이 카드의 주인공이고, 누가 냈는지는 목록의 첫 줄이다.' },
{
  a:'var(--or)', wm:'6TH', inn:'6회', half:'말', side:'나의 드림팀 <i>공격</i>', gain:'+3',
  ev:[ 득(박병호,'박병호','쓰리런 <span class="hi">홈런</span>','+3','비거리 127m · 시즌 21호',{big:1,mvp:1}),
       무(이정후,'이정후','우전 안타'), 무(김도영,'김도영','볼넷'), 무(최정,'최정','중견수 뜬공 아웃') ],
  sc:[4,8], nx:['8회초는 아직 · <b>7회초 내 수비</b> — 우리 선발 <b>92구</b>', DEF_CH, 1], secs:4.5,
  note:'가장 기본. <b>+3</b> 이 먼저 눈에 들어오고, 그 아래 목록에서 누가 냈는지를 읽는다. MVP 줄은 <b>배경이 옅게 깔린 첫 줄</b>일 뿐 따로 세우지 않는다.',
},
{
  a:'var(--yel)', wm:'3RD', inn:'3회', half:'말', side:'나의 드림팀 <i>공격</i>', gain:'+4',
  ev:[ 득(최정,'최정','만루 싹쓸이 <span class="hi">2루타</span>','+3','',{big:1,mvp:1}),
       득(이정후,'이정후','적시타','+1'), 무(이종범,'이종범','2루타'), 무(김도영,'김도영','볼넷'),
       무(강백호,'강백호','병살타로 이닝 종료') ],
  sc:[1,6], nx:['<b>4회초 내 수비</b> — 상대 7·8·9번', DEF, 0], secs:5,
  note:'<b>빅이닝.</b> 타자가 많으면 목록이 길어진다 — 위에서 다섯 줄까지 보여주고 나머지는 접는다. 5초.',
},
{
  a:'var(--yel)', wm:'7TH', inn:'7회', half:'말', side:'나의 드림팀 <i>공격</i>', gain:'+2', flip:'역전',
  ev:[ 득(구자욱,'구자욱','역전 2타점 <span class="hi">3루타</span>','+2','3 : 4 — 경기를 뒤집었다',{big:1,mvp:1}),
       무(김하성,'김하성','좌전 안타'), 무(손아섭,'손아섭','희생번트'),
       호('관중','홈 관중 기립 — 팀 사기 <span class="hi">+2</span>','다음 이닝 타격 보정') ],
  sc:[3,4], nx:['<b>8회초 내 수비</b> — 리드를 지킨다', DEF_CH, 1], secs:5,
  note:'<b>역전.</b> 회차 옆에 작은 태그가 붙고 점수판이 뒤집히는 연출이 들어갈 자리. 관중 반응이 <b>실제 보정</b>으로 이어지는 예.',
},
{
  a:'var(--em2)', wm:'5TH', inn:'5회', half:'말', side:'나의 드림팀 <i>공격</i>', gain:'+1',
  ev:[ 득(강백호,'강백호','밀어내기 <span class="hi">볼넷</span>','+1','',{mvp:1}),
       무(이종범,'이종범','볼넷'), 무(김도영,'김도영','몸에 맞는 공'), 무(이정후,'이정후','볼넷'),
       무(최정,'최정','삼진 — 잔루 3') ],
  sc:[2,3], nx:['<b>6회초 내 수비</b> — 상대 3·4·5번', DEF, 0], secs:3.5,
  note:'안타 하나 없이 난 점수. <b>목록을 읽어야 무슨 일이었는지 알 수 있는</b> 회차 — MVP 한 명만 세웠으면 "볼넷 3개로 흔들었다"가 안 남는다.',
},
{
  a:'var(--or)', wm:'9TH', inn:'9회', half:'말', side:'나의 드림팀 <i>공격</i>', gain:'+1', flip:'끝내기',

/* ── 그리기 ── */
function card(k) {
  if (k.thin) return `
    <div class="card ui-cut ui-frame ui-glass" style="--a:${k.a};--c:14px">
      <div class="thin">
        <p class="inn" style="margin:0">${k.inn}<em>${k.half}</em></p>
        <div class="fc" style="background-image:url(${P(k.id)})"></div>
        <div class="tx"><b>${k.nm}</b> <span>${k.tx}</span></div>
        <span class="rt">${k.rt}</span>
      </div>
    </div>`;

  const minus = String(k.gain).startsWith('−');
  const gain = k.gain === 0
    ? `<div class="gain zero ui-cut"><b>0</b><span>${k.gainLab || '무득점'}</span></div>`
    : `<div class="gain ui-cut${minus ? ' minus' : ''}"><b>${k.gain}</b><span>${k.gainLab || (minus ? '이 회 실점' : '이 회 득점')}</span></div>`;

  const rows = k.ev.map((e) => `
    <div class="ev${e.big ? ' big' : ''}${e.mvp ? ' mvp' : ''}" style="--e:${e.e}">
      <span class="ic">${e.ic}</span>
      <div class="fc${e.id ? '' : ' none'}"${e.id ? ` style="background-image:url(${P(e.id)})"` : ''}></div>
      <div class="tx"><b>${e.nm}</b><span>${e.tx}</span>${e.sub ? `<small>${e.sub}</small>` : ''}</div>
      <span class="rt">${e.rt}</span>
    </div>`).join('');

  return `
  <div class="card ui-cut ui-frame ui-glass ui-scan" style="--a:${k.a}">
    <div class="top">
      <span class="wm">${k.wm}</span>
      <div class="who">
        <p class="inn">${k.inn}<em>${k.half}</em></p>
        <span class="side">${k.side}${k.tag || k.flip ? `<span class="ui-chip ui-cut" style="--a:${k.a};color:${k.a}">${k.tag || k.flip}</span>` : ''}</span>
      </div>
      ${gain}
    </div>
    <div class="feed">
      <p class="ui-lab" style="--a:${k.a}">이 회에 벌어진 일</p>
      ${rows}
    </div>
    <div class="sc">
      <span class="lab">TOTAL</span>
      <span class="t${k.opp ? ' me' : ''}">AI 올스타</span>
      <span class="v">${k.sc[0]}<span class="x">:</span>${k.sc[1]}</span>
      <span class="t${k.opp ? '' : ' me'}">나의 드림팀</span>
    </div>
    ${k.fin ? `<div class="fin"><b>${k.fin[0]}</b><span>${k.fin[1]}</span></div>` : `
    <div class="nx" style="--a:var(--em)">
      <div class="hd"><span class="ui-lab" style="--a:${k.a}">Next</span><p>${k.nx[0]}</p></div>
      <div class="opts">
        ${k.nx[1].map(([t, s], i) => `<div class="ui-btn ui-cut${i === k.nx[2] ? ' pri' : ''}">${t}<small>${s}</small></div>`).join('')}
        <div class="ring">
          <svg width="46" height="46"><circle class="b1" cx="23" cy="23" r="19"/><circle class="b2" cx="23" cy="23" r="19" stroke-dasharray="119" stroke-dashoffset="36"/></svg>
          <b>${k.secs}</b>
        </div>
      </div>
    </div>`}
  </div>`;
}

let html = '', n = 0;
for (const k of C) {
  if (k.sec) { html += `<h2>${k.sec}</h2><p class="h2n">${k.secn}</p>`; continue; }
  n += 1;
  const shot = n === 1 ? `<div class="stage"><div class="in">${card(k)}</div></div>
    <p class="note" style="margin:10px 0 24px">↑ <b>실제 화면 위에 얹힌 모습.</b> 중계가 어두워지고 카드만 떠오른다. 아래부터는 카드만 크게 본다.</p>` : '';
  html += `<div class="slot">${shot}${card(k)}<p class="note"><b class="d" style="font-size:15px">${String(n).padStart(2, '0')}</b> · ${k.secs}초 — ${k.note}</p></div>`;
}
document.getElementById('root').innerHTML = html;

/* 미리보기 축소율: 실제 화면(1920) 대비 */
const fitStage = () => document.querySelectorAll('.stage').forEach((el) => {
  el.querySelector('.in').style.setProperty('--s', el.clientWidth / 1920);
});
fitStage();
addEventListener('resize', fitStage);
</script>
