const avg = (a) => (a.length ? (a.reduce((x, r) => x + r.ov, 0) / a.length).toFixed(1) : '-');
function rowsOf(doc, fill) {
  return [...doc.querySelectorAll('.lf-field .lf-tok')].map((t) => {
    const ins = t.querySelectorAll('.lf-in'); const inner = ins[ins.length - 1];
    const ovTxt = inner?.querySelector('.lf-ov')?.textContent || '';
    const r = { slot: t.dataset.slot, empty: t.classList.contains('empty'), on: t.classList.contains('picked') || t.classList.contains('want'),
      name: inner?.querySelector('.lf-bx b')?.textContent || '', season: inner?.querySelector('.lf-bx small')?.textContent || '',
      ov: +(ovTxt.replace(/[^0-9]/g, '')) || 0, face: (inner?.querySelector('.lf-bp')?.getAttribute('style') || '').replace(/"/g, "'") };
    if (r.empty && fill[r.slot]) Object.assign(r, fill[r.slot], { empty: false });
    return r;
  });
}
const loads = (src) => new Promise((res) => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src; });
async function buildFill(taken) {
  const fill = {}; const used = new Set(taken);
  for (const slot of ['MR', 'CL', '2B', 'OF2', 'OF3', 'SP', 'C', '1B', '3B', 'SS', 'OF1', 'DH']) {
    const pool = ALL_PLAYERS.filter((p) => p.position === SLOT_POS[slot] && !used.has(p.name)).sort((a, b) => b.overall - a.overall);
    for (const p of pool.slice(0, 25)) {
      const src = `profiles/${encodeURIComponent(p.id)}.webp`;
      if (await loads(`/${src}`)) { used.add(p.name); fill[slot] = { name: p.name, season: `${p.year} ${p.team}`, ov: p.overall, face: `background-image: url('${src}')` }; break; }
    }
  }
  return fill;
}
const row = (r) => `<div class="mt-row ${r.empty ? 'e' : ''} ${r.on ? 'on' : ''}" data-slot="${r.slot}">
  <span class="pos">${LABEL[r.slot]}</span><span class="fc ${r.face ? '' : 'nof'}" style="${r.face}"></span>
  <span class="who"><span class="nm">${r.empty ? '빈 자리' : r.name}</span><span class="sea">${r.empty ? '' : r.season}</span></span>
  <b class="ov">${r.empty ? '' : r.ov}</b></div>`;
function listHtml(R) {
  const by = (k) => R.find((x) => x.slot === k);
  return `<div class="mt-body">${GROUPS.map(([g, ks]) => `<div class="mt-box" style="--k:${ks.length}"><span class="gl">${g}</span>${ks.map((k) => row(by(k))).join('')}</div>`).join('')}</div>`;
}
function avgHtml(av, R) {
  const f = R.filter((r) => !r.empty);
  const t = avg(f), p = avg(f.filter((r) => ['SP', 'MR', 'CL'].includes(r.slot))), b = avg(f.filter((r) => !['SP', 'MR', 'CL'].includes(r.slot)));
  const w = (v) => (v === '-' ? 0 : v);
  return {
    c1: `<span class="t"><small>팀</small><em>${t}</em></span><span><small>투수</small><em>${p}</em></span><span><small>야수</small><em>${b}</em></span>`,
    c2: [['팀', t, 't'], ['투수', p, ''], ['야수', b, '']].map(([k, v, c]) => `<div class="${c}"><small>${k}</small><i><b style="width:${w(v)}%"></b></i><em>${v}</em></div>`).join(''),
    c3: `<span class="big"><small>팀 평균</small><em>${t}</em></span><span class="sub"><span><small>투수</small><em>${p}</em></span><span><small>야수</small><em>${b}</em></span></span>`,
    c4: `<div class="cells"><span class="t"><small>팀</small><em>${t}</em></span><span><small>투수</small><em>${p}</em></span><span><small>야수</small><em>${b}</em></span></div>`,
    d1: [['팀', t, '#38bdf8'], ['투수', p, '#10b981'], ['야수', b, '#10b981']].map(([k, v, c]) => `<span class="g" style="--v:${w(v)};--gc:${c}"><span><small>${k}</small><em>${v}</em></span></span>`).join(''),
    d2: `<span class="t"><small>TEAM</small><em>${t}</em></span><span><small>투수</small><em>${p}</em></span><span><small>야수</small><em>${b}</em></span>`,
    d3: `<div class="cap">LINEUP AVG</div><div class="cells"><span class="t"><small>TEAM</small><em>${t}</em></span><span><small>투수</small><em>${p}</em></span><span><small>야수</small><em>${b}</em></span></div>`,
    d4: `<div class="big"><small>TEAM</small><em>${t}</em></div><div class="sub"><span><small>투수</small><em>${p}</em></span><span><small>야수</small><em>${b}</em></span></div>`,
  }[av];
}

function attach(ifr, v) {
  let wideSize = null; { const im = new Image(); im.onload = () => { wideSize = { w: im.naturalWidth, h: im.naturalHeight }; }; im.src = WIDE; }
  let fill = null; let filling = false;
  const tick = () => {
    const doc = ifr.contentDocument; const field = doc?.querySelector('.lf-field');
    if (!field || !wideSize) return;
    if (!fill) {
      if (REAL) fill = {};
      else if (!filling) { filling = true; const taken = [...doc.querySelectorAll('.lf-field .lf-tok:not(.empty) .lf-bx b')].map((b) => b.textContent); buildFill(taken).then((f) => { fill = f; }); }
      if (!fill) return;
    }
    const wrap = field.parentElement;
    if (!doc.getElementById('mk-style')) { const st = doc.createElement('style'); st.id = 'mk-style'; st.textContent = CSS; doc.body.appendChild(st); }
    const pickPanel = doc.querySelector('.pk-stage')?.closest('.bc-grp'); const grid = pickPanel?.parentElement;
    if (!grid) return;
    let p = grid.querySelector(':scope > .mk-listpanel');
    if (!p) { p = doc.createElement('div'); p.className = 'bc-grp mk-listpanel'; p.innerHTML = '<span class="bc-label font-display">LINEUP</span><div class="mk-list"></div>'; grid.appendChild(p); }
    grid.style.setProperty('grid-template-columns', `${Math.round(pickPanel.getBoundingClientRect().width)}px minmax(0,1fr) ${PANEL_W}px`, 'important');
    const listBox = p.querySelector('.mk-list');
    const W = wrap.clientWidth, H = wrap.clientHeight;
    const s = H / (IMG.b - IMG.t) * 1.003;
    const ox = 14 - (140 - HWU) * s;
    const oy = Math.min(Math.max((H - 580 * s) / 2, H - IMG.b * s), -IMG.t * s);
    field.style.setProperty('--mk-t', `translate(${ox}px, ${oy}px) scale(${s})`);
    const dl = Math.round(ox + (760 + HWU) * s + 16), dw = W - dl;
    wrap.style.setProperty('--dl', `${dl}px`); wrap.style.setProperty('--dw', `${dw}px`);
    let img = field.querySelector('.mk-wide');
    const fpw = 0.8789 / REG.s;
    if (!img) {
      img = doc.createElement('img'); img.className = 'mk-wide'; img.src = WIDE;
      Object.assign(img.style, { left: `${-REG.dx * fpw}px`, top: `${(-REG.dy / REG.s) * 0.8789 - 12.4}px`, width: `${wideSize.w * fpw}px`, height: `${wideSize.h * fpw}px` });
      field.insertBefore(img, field.firstChild);
    }
    const imgL = ox + IMG.l * s, imgWpx = (IMG.r - IMG.l) * s;
    img.style.setProperty('--fs', `${Math.min((dl + 40 - imgL) / imgWpx, 1) * 100}%`);
    img.style.setProperty('--fe', `${Math.min((dl + dw * .8 - imgL) / imgWpx, 1) * 100}%`);
    const R = rowsOf(doc, fill);
    const html = listHtml(R);
    if (listBox.dataset.h !== html) { listBox.dataset.h = html; listBox.innerHTML = html; }
    let av = wrap.querySelector(':scope > .mk-avg');
    if (!av) { av = doc.createElement('div'); av.className = `mk-avg av-${v.av}`; wrap.appendChild(av); }
    const ah = avgHtml(v.av, R);
    if (av.dataset.h !== ah) { av.dataset.h = ah; av.innerHTML = ah; }
    if (!listBox.dataset.bound) {
      listBox.dataset.bound = '1';
      listBox.addEventListener('click', (e) => { const r = e.target.closest('[data-slot]'); if (r) doc.querySelector(`.lf-field .lf-tok[data-slot="${r.dataset.slot}"]`)?.dispatchEvent(new ifr.contentWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); });
    }
  };
  tick(); setInterval(tick, 250);
}

const items = VARS.filter((v) => v.id);
const one = new URLSearchParams(location.search).get('v');
if (one) {
  const v = items.find((x) => x.id === one) || items[0];
  document.body.className = 'one';
  document.title = `${v.id} · ${v.title}`;
  document.body.innerHTML = `<iframe src="${SRC}" title="드래프트 화면"></iframe><span class="badge">${v.id} · ${v.title}</span>`;
  const ifr = document.querySelector('iframe');
  ifr.addEventListener('load', () => attach(ifr, v));
} else {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="top"><b>라인업 평균 표시 8안</b><span>1902×901 · 명단 판은 B4 + 왼쪽 세로 라벨(이름만) · 평균은 MY LINEUP 판 구장 오른쪽 위(시너지 왼쪽) · 명단은 12명이 다 찬 경우(&amp;real=1 이면 실제 8명)</span>
      <nav>${items.map((v) => `<a href="#v${v.id}">${v.id}</a>`).join('')}</nav></div>
    <div class="list">${VARS.map((v) => (v.g ? `<div class="grpt">${v.g}</div>` : `
      <section id="v${v.id}"><div class="hd"><b><i>${v.id}</i>${v.title}</b><span>${v.desc}</span><a href="./?v=${v.id}" target="_blank">크게 보기 ↗</a></div>
        <div class="frame"><iframe src="${SRC}" loading="lazy" title="${v.id} 드래프트 화면"></iframe></div></section>`)).join('')}</div>`);
  document.querySelectorAll('.frame iframe').forEach((ifr, i) => ifr.addEventListener('load', () => attach(ifr, items[i])));
  const fit = () => document.querySelectorAll('.frame').forEach((f) => { f.querySelector('iframe').style.transform = `scale(${f.clientWidth / 1902})`; });
  fit(); addEventListener('resize', fit);
}
</script>
