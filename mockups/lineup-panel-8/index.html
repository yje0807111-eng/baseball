const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const tierOf = (v) => (v == null ? '' : v >= 90 ? 't90' : v >= 75 ? 't75' : '');
const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);
const fmt = (v, d = 1) => (v == null ? '-' : d ? v.toFixed(d) : String(Math.round(v)));

/** 실제 시즌 기록 한 줄: 타자 .347 · 38HR · 40SB / 투수 ERA 2.53 · 12승 · 138K */
function rec(p) {
  const s = (p.source || '').split('—')[0];
  const g = (re) => (s.match(re) || [])[1];
  if (p.type === 'pitcher') {
    const era = g(/ERA\s?([\d.]+)/), w = g(/(\d+)승/), sv = g(/(\d+)SV/), h = g(/(\d+)HLD/), k = g(/(\d+)K\b/);
    const role = sv && +sv >= 10 ? `${sv}SV` : h && +h >= 10 ? `${h}HLD` : w ? `${w}승` : null;
    return [era && `ERA ${era}`, role, k && `${k}K`].filter(Boolean).join(' · ') || s.trim();
  }
  const avg = g(/(\.\d{3})/), hr = g(/(\d+)HR/), sb = g(/(\d+)SB/), rbi = g(/(\d+)타점/);
  return [avg, hr && `${hr}HR`, sb && +sb >= 10 ? `${sb}SB` : rbi ? `${rbi}타점` : null].filter(Boolean).join(' · ') || s.trim();
}

/** 게임 명단 줄에서 지금 라인업(자리 · 선수 · 얼굴 · 선택된 자리)을 읽는다 */
function readState(doc) {
  const rows = [...doc.querySelectorAll('.ll-row')];
  if (rows.length !== 12) return null;
  const roster = [], face = {};
  let sel = null;
  rows.forEach((r, i) => {
    const slot = ORDER[i];
    if (r.classList.contains('on')) sel = slot;
    if (r.classList.contains('e')) return;
    const name = r.querySelector('.ll-nm')?.textContent, sea = r.querySelector('.ll-sea')?.textContent;
    const p = ALL_PLAYERS.find((x) => x.name === name && `${x.year} ${x.team}` === sea);
    if (!p) return;
    roster.push({ ...p, slot });
    face[p.name] = (r.querySelector('.ll-fc')?.getAttribute('style') || '').replace(/"/g, "'");
  });
  const meter = doc.querySelector('[role="meter"][aria-label="샐러리 캡 잔여"]');
  const focused = new Set([...doc.querySelectorAll('.syn-dock .dock-row.open')].map((r) => r.querySelector('.text-sm')?.textContent));
  return { roster, face, sel, focused, cp: +(meter?.getAttribute('aria-valuenow') || 0) };
}

function compute(st) {
  const on = st.roster.map(playAt);
  const all = checkSynergies(on).filter((s) => !HIDDEN.has(s.id));
  const eff = applySynergies(on, all);
  const effBy = new Map(eff.map((p) => [p.slot, p]));
  const baseBy = new Map(on.map((p) => [p.slot, p]));
  const gain = (slot) => (effBy.get(slot)?.overall ?? 0) - (baseBy.get(slot)?.overall ?? 0);
  const syns = all.filter((s) => s.cur > 0).map((s) => {
    const next = s.tiers[s.level];
    const memberNames = new Set(s.members.map((m) => m.name));
    return { ...s, next, left: next ? next.need - s.count : 0, miss: s.names ? s.names.filter((n) => !memberNames.has(n)) : [] };
  }).sort((a, b) => (b.active - a.active) || (b.level - a.level) || (a.left - b.left) || (b.cur - a.cur));
  const ov = (f) => mean(eff.filter(f).map((p) => p.overall));
  const statAvg = (type, keys) => keys.map(([k, key]) => [k, mean(eff.filter((p) => p.type === type).map((p) => p.stats[key]))]);
  const empties = 12 - eff.length;
  const weak = eff.length ? eff.reduce((a, b) => (b.overall < a.overall ? b : a)) : null;
  const boosted = eff.filter((p) => gain(p.slot) > 0).sort((a, b) => gain(b.slot) - gain(a.slot));
  return {
    ...st, eff, effBy, baseBy, gain, syns, empties, weak, boosted,
    avgT: ov(() => true), avgP: ov((p) => PITCH.includes(p.slot)), avgB: ov((p) => !PITCH.includes(p.slot)),
    bat: statAvg('batter', [['파워', 'power'], ['컨택', 'contact'], ['주루', 'speed'], ['수비', 'defense']]),
    pit: statAvg('pitcher', [['구위', 'stuff'], ['제구', 'control'], ['체력', 'stamina'], ['안정', 'stability']]),
    per: empties ? Math.floor(st.cp / empties) : 0,
    near: syns.filter((s) => s.next && s.left <= 2).sort((a, b) => a.left - b.left),
    gainSum: boosted.reduce((s, p) => s + gain(p.slot), 0),
  };
}

/* ── 조각 ── */
const bar = (k, v, d = 1, cls = '') => `<div class="bar ${cls}"><span>${k}</span><i><b style="width:${v ?? 0}%"></b></i><span class="num ${tierOf(v)}">${fmt(v, d)}</span></div>`;

function synCard(c, s) {
  const who = s.members.map((m) => `<span class="mb"><i class="av" style="${c.face[m.name] || ''}"></i>${esc(m.name)}</span>`).join('')
    + s.miss.slice(0, 3).map((n) => `<span class="mb off">${esc(n)}</span>`).join('')
    + (s.miss.length > 3 ? `<span class="cond">외 ${s.miss.length - 3}명</span>` : ''); // 대표팀 시너지는 명단이 18명이라 3명까지만
  const need = s.next ? `<span class="need"><b>${s.left}명</b> 더 → ${s.level + 1}단계</span>` : '<span class="need max">최종 단계</span>';
  return `<button type="button" class="sy ${s.active ? 'on' : ''} ${c.focused.has(s.name) ? 'focus' : ''}" data-syn="${esc(s.name)}">
    <span class="sy-hd"><b>${esc(s.name)}</b>${s.level ? `<span class="lv">${s.level}단계</span>` : ''}${need}</span>
    <span class="lads">${s.tiers.map((t, i) => `<span class="lad ${i < s.level ? 'ok' : i === s.level ? 'nx' : ''}"><i>${t.need}</i>${esc(t.effect)}</span>`).join('')}</span>
    <span class="mbs">${who}${s.names ? '' : `<span class="cond">${esc(s.cond)}</span>`}</span></button>`;
}
const synHead = (c) => { const act = c.syns.filter((s) => s.active).length;
  return `<div class="sd-hd"><span>적용<b class="g">${act}</b>· 진행 중<b>${c.syns.length - act}</b></span><button type="button" data-act="all">전체 보기</button></div>`; };
const synList = (c) => (c.syns.length ? `<div class="sy-list">${c.syns.map((s) => synCard(c, s)).join('')}</div>` : '<p class="empty">선수를 영입하면 시너지가 나타납니다.</p>');

function recRow(c, slot) {
  const p = c.effBy.get(slot), g = c.gain(slot);
  return `<button type="button" class="rr ${p ? '' : 'e'} ${c.sel === slot ? 'on' : ''}" data-slot="${slot}">
    <span class="pos">${LABEL[slot]}</span><i class="fc ${p ? '' : 'nof'}" style="${p ? c.face[p.name] : ''}"></i>
    <span class="who"><b>${p ? esc(p.name) : '빈 자리'}</b><small>${p ? `${p.year} ${esc(p.team)}` : ''}</small></span>
    <span class="st">${p ? `<span>${esc(rec(p))}</span><small>${p.cost} CP${g ? ` · <em>시너지 +${g}</em>` : ''}</small>` : ''}</span>
    <b class="ov num ${p ? tierOf(p.overall) : ''}">${p ? p.overall : ''}</b></button>`;
}
const recList = (c) => `<div class="rl-body">${GROUPS.map(([g, ks]) => `<div class="rl-box" style="--k:${ks.length}"><span class="gl">${g}</span>${ks.map((k) => recRow(c, k)).join('')}</div>`).join('')}</div>`;

function guide(c, max = 4) {
  const out = [c.empties
    ? ['', `빈 자리 <b class="n">${c.empties}</b>곳 · 남은 <b class="n">${c.cp}</b> CP → 자리당 <em class="n">${c.per}</em> CP`]
    : ['', `12자리 완성 · 남은 <b class="n">${c.cp}</b> CP`]];
  if (c.weak) out.push(['warn', `가장 약한 자리 <b>${LABEL[c.weak.slot]}</b> ${esc(c.weak.name)} <b class="n ${tierOf(c.weak.overall)}">${c.weak.overall}</b>`]);
  c.near.slice(0, 2).forEach((s) => out.push(['sky', `<span><b>${esc(s.name)}</b> ${s.left}명 더면 <em>${esc(s.next.effect)}</em>${s.miss.length ? ` · ${s.miss.slice(0, 3).map(esc).join('·')}` : ''}</span>`]));
  return `<ul class="guide">${out.slice(0, max).map(([k, h]) => `<li class="${k}"><span>${h}</span></li>`).join('')}</ul>`;
}
const teamTop = (c) => `<div class="rp-top"><div class="rp-big"><small>팀 평균</small><span class="num ${tierOf(c.avgT)}">${fmt(c.avgT)}</span></div>
  <div class="bars">${bar('투수', c.avgP, 1, 'p')}${bar('야수', c.avgB)}<div class="bar"><span>시너지</span><span class="gt">${c.boosted.length}명 보정</span><span class="num t75">+${c.gainSum}</span></div></div></div>`;
const report = (c) => `<div class="rp">
  <div class="sec"><span class="gl">전력</span>${teamTop(c)}</div>
  <div class="sec"><span class="gl">능력치 평균</span><div class="rp-two">
    <div><h5>타선</h5><div class="bars">${c.bat.map(([k, v]) => bar(k, v, 0)).join('')}</div></div>
    <div><h5>마운드</h5><div class="bars">${c.pit.map(([k, v]) => bar(k, v, 0, 'p')).join('')}</div></div></div></div>
  <div class="sec"><span class="gl">자리별 종합</span><div class="slotg">${ORDER.map((s) => { const p = c.effBy.get(s);
    return `<button type="button" class="sc ${p ? '' : 'e'} ${p && c.weak && p.slot === c.weak.slot ? 'weak' : ''} ${c.sel === s ? 'on' : ''}" data-slot="${s}"><small>${SHORT[s]}</small><span class="num ${p ? tierOf(p.overall) : ''}">${p ? p.overall : '비어 있음'}</span></button>`; }).join('')}</div></div>
  <div class="sec"><span class="gl">다음 영입 가이드</span>${guide(c)}</div></div>`;

const boostBox = (c) => `<div class="sec bs"><span class="gl">시너지로 오른 선수 ${c.boosted.length}명</span>
  ${c.boosted.length ? c.boosted.slice(0, 4).map((p) => `<div class="bs-row"><i class="av" style="${c.face[p.name] || ''}"></i><b>${esc(p.name)}</b><small>${esc((p.synergyBoost || []).join(' · '))}</small>
    <span class="ch"><span class="num">${c.baseBy.get(p.slot).overall}</span>→<span class="num to ${tierOf(p.overall)}">${p.overall}</span></span></div>`).join('')
    + (c.boosted.length > 4 ? `<div class="bs-more">+${c.boosted.length - 4}명 더</div>` : '')
  : '<p class="empty">아직 없음</p>'}</div>`;

const SIDES = {
  syn: (c) => `${synHead(c)}<div class="mk-scroll">${synList(c)}</div>`,
  rec: (c) => recList(c),
  rep: (c) => `<div class="mk-scroll">${report(c)}</div>`,
  synBoost: (c) => `${synHead(c)}<div class="mk-scroll">${synList(c)}</div>${boostBox(c)}`,
  synReport: (c) => `<div class="sec">${'<span class="gl">전력</span>'}${teamTop(c)}<div style="margin-top:9px">${guide(c, 3)}</div></div>${synHead(c)}<div class="mk-scroll">${synList(c)}</div>`,
  tabs: (c, tab) => `${tabBar([['syn', '시너지'], ['rec', '선수 기록'], ['rep', '팀 분석']], tab)}
    ${tab === 'rec' ? recList(c) : tab === 'rep' ? `<div class="mk-scroll">${report(c)}</div>` : `${synHead(c)}<div class="mk-scroll">${synList(c)}</div>`}`,
  tabs2: (c, tab) => `${tabBar([['rec', '선수 기록'], ['rep', '팀 분석']], tab)}
    ${tab === 'rep' ? `<div class="mk-scroll tight">${report(c)}</div>` : recList(c)}`,
};
function tabBar(tabs, tab) {
  return `<div class="tabs" style="grid-template-columns:repeat(${tabs.length},1fr)">${tabs.map(([k, t]) => `<button type="button" data-tab="${k}" class="${tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>`;
}
const strip = (c) => `<div class="ms-team"><small>팀 평균</small><span class="num ${tierOf(c.avgT)}">${fmt(c.avgT)}</span></div>
  <div class="ms-b"><h5>투수 · 야수</h5><div class="bars">${bar('투수', c.avgP, 1, 'p')}${bar('야수', c.avgB)}<div class="bar"><span>보정</span><span class="gt">${c.boosted.length}명</span><span class="num t75">+${c.gainSum}</span></div></div></div>
  <div class="ms-b"><h5>타선</h5><div class="bars">${c.bat.map(([k, v]) => bar(k, v, 0)).join('')}</div></div>
  <div class="ms-b"><h5>마운드</h5><div class="bars">${c.pit.map(([k, v]) => bar(k, v, 0, 'p')).join('')}</div></div>
  <div class="ms-g"><h5>다음 영입 가이드</h5>${guide(c, 3)}</div>`;

/* ── 게임 화면에 붙이기 ── */
function attach(ifr, v) {
  const tick = () => {
    const doc = ifr.contentDocument;
    const field = doc?.querySelector('.lf-field');
    const pickP = doc?.querySelector('.pk-stage')?.closest('.bc-grp');
    const listP = doc?.querySelector('.ll-body')?.closest('.bc-grp');
    if (!field || !pickP || !listP) return;
    const lineP = field.closest('.bc-grp'), grid = pickP.parentElement, wrap = field.parentElement;
    if (!doc.getElementById('mk-style')) { const s = doc.createElement('style'); s.id = 'mk-style'; s.textContent = CSS; doc.body.appendChild(s); }
    const cls = { 'mk-full': v.full, 'mk-noavg': v.noavg, 'mk-hasside': v.side, 'mk-d2': v.d2 };
    Object.entries(cls).forEach(([k, on]) => doc.body.classList.toggle(k, !!on));
    const st = readState(doc);
    if (!st) return;
    const c = compute(st);

    if (v.full) { // 구장이 가운데 판을 혼자 쓴다: 사진이 판을 덮는 범위 안에서 선수들을 가운데로
      const W = wrap.clientWidth, H = wrap.clientHeight, s = (H / 553) * 1.003;
      const y = Math.min(Math.max((H - 580 * s) / 2, H - 560.35 * s), -7.35 * s);
      const x = Math.min(Math.max(W / 2 - 450 * s, W - 1101.9 * s), 201.6 * s);
      field.style.setProperty('--mk-t', `translate(${x}px, ${y}px) scale(${s})`);
    }
    if (v.twoCol) {
      grid.style.setProperty('grid-template-columns', `${Math.round(pickP.getBoundingClientRect().width)}px minmax(0,1fr)`, 'important');
      listP.style.setProperty('display', 'none', 'important');
    }
    if (v.side) {
      const lab = listP.querySelector('.bc-label');
      if (lab && lab.textContent !== v.label) lab.textContent = v.label;
      let side = listP.querySelector(':scope > .mk-side');
      if (!side) {
        side = doc.createElement('div'); side.className = 'mk mk-side'; side.dataset.tab = v.side === 'tabs2' ? 'rec' : 'syn'; listP.appendChild(side);
        side.addEventListener('click', (e) => {
          const t = e.target.closest('[data-slot],[data-syn],[data-tab],[data-act]');
          if (!t) return;
          if (t.dataset.slot) doc.querySelectorAll('.ll-row')[ORDER.indexOf(t.dataset.slot)]?.click();
          else if (t.dataset.syn) [...doc.querySelectorAll('.syn-dock .dock-row')].find((r) => r.querySelector('.text-sm')?.textContent === t.dataset.syn)?.click();
          else if (t.dataset.tab) { side.dataset.tab = t.dataset.tab; side.dataset.h = ''; }
          else if (t.dataset.act === 'all') [...doc.querySelectorAll('.syn-dock button')].find((b) => b.textContent.trim() === '전체 보기')?.click();
        });
      }
      const html = SIDES[v.side](c, side.dataset.tab);
      if (side.dataset.h !== html) {
        const sc = side.querySelector('.mk-scroll')?.scrollTop || 0;
        side.innerHTML = html; side.dataset.h = html;
        const el = side.querySelector('.mk-scroll'); if (el) el.scrollTop = sc;
      }
    }
    if (v.strip) {
      let sp = lineP.querySelector(':scope > .mk-strip');
      if (!sp) { sp = doc.createElement('div'); sp.className = 'mk mk-strip'; lineP.appendChild(sp); }
      const html = strip(c);
      if (sp.dataset.h !== html) { sp.innerHTML = html; sp.dataset.h = html; }
    }
  };
  tick(); setInterval(tick, 250);
}

const items = VARS.filter((v) => v.id);
const one = new URLSearchParams(location.search).get('v');
if (one) {
  const v = items.find((x) => x.id === one) || items[0];
  document.body.className = 'one';
  document.title = `${v.id} · ${v.title}`;
  document.body.innerHTML = `<iframe src="${SRC}" title="드래프트 화면"></iframe><span class="badge">${v.id} · ${v.title}</span>`;
  const ifr = document.querySelector('iframe');
  ifr.addEventListener('load', () => attach(ifr, v));
} else {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="top"><b>오른쪽 판 방향 8안</b><span>1902×901 · 게임 화면 그대로(드래프트 데모 라인업 8명) · 카드와 줄을 누르면 실제로 동작</span>
      <nav>${items.map((v) => `<a href="#v${v.id}">${v.id}</a>`).join('')}</nav></div>
    <div class="list">${VARS.map((v) => (v.g ? `<div class="grpt">${v.g}</div>` : `
      <section id="v${v.id}"><div class="hd"><b><i>${v.id}</i>${v.title}</b><span>${v.desc}</span><a href="./?v=${v.id}" target="_blank">크게 보기 ↗</a></div>
        <div class="frame"><iframe src="${SRC}" loading="lazy" title="${v.id} 드래프트 화면"></iframe></div></section>`)).join('')}</div>`);
  document.querySelectorAll('.frame iframe').forEach((ifr, i) => ifr.addEventListener('load', () => attach(ifr, items[i])));
  const fit = () => document.querySelectorAll('.frame').forEach((f) => { f.querySelector('iframe').style.transform = `scale(${f.clientWidth / 1902})`; });
  fit(); addEventListener('resize', fit);
}
</script>
