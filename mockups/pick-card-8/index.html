  .v7 .cp { right: 6cqw; bottom: 5cqw; display: flex; align-items: baseline; gap: 1.2cqw; } .v7 .cp small { font-size: 3.6cqw; } .v7 .cp b { font-size: 8cqw; }
  .v7 .slot { right: 6cqw; bottom: 5.5cqw; font-size: 4cqw; }

  /* ════ V8 · 미니멀 텍스트 ════ */
  .v8 .ov { left: 6cqw; top: 6cqw; font-size: 27cqw; }
  .v8 .meta { left: 6.5cqw; top: 31cqw; font-size: 4.2cqw; }
  .v8 .stats { left: 6cqw; top: 38cqw; display: grid; grid-template-columns: auto auto; column-gap: 4cqw; row-gap: 1.6cqw; }
  .v8 .st { justify-content: flex-start; gap: 1.4cqw; } .v8 .st dt { font-size: 4cqw; color: #9ca3af; } .v8 .st dd { font-size: 6.4cqw; text-shadow: 0 1px 4px #000; }
  .v8 .syn { right: 4cqw; top: 5cqw; }
  .v8 .ochips { left: 6cqw; right: 6cqw; bottom: 50cqw; }
  .v8 .note { left: 6cqw; right: 6cqw; bottom: 43cqw; font-size: 4cqw; }
  .v8 .pos { left: 6cqw; right: 6cqw; bottom: 35.5cqw; } .v8 .pos em { font-size: 4.4cqw; } .v8 .pos span { font-size: 4.6cqw; } .v8 .pos .tg b { font-size: 3.6cqw; }
  .v8 .rule { left: 6cqw; right: 6cqw; bottom: 32.5cqw; }
  .v8 .nm { left: 6cqw; right: 25cqw; bottom: 7cqw; font-size: 15cqw; }
  .v8 .cp { right: 6cqw; bottom: 7.5cqw; } .v8 .cp small { font-size: 3.8cqw; } .v8 .cp b { font-size: 12cqw; }
  .v8 .slot { right: 6cqw; bottom: 9cqw; font-size: 4.4cqw; }
</style>
</head>
<body>
<div class="top"><b>PICK 카드 리뉴얼 목업 8종</b><span>변형마다 같은 네 장: ① 90+ 국가대표 ② 외국인 + 시너지 칸 ③ 살 수 없음 ④ 내 라인업 선수(시너지 상승·제자리 밖·자리 이름) — 기존 카드 내용(종합·포지션·연도/구단/투타·능력치 4개·노트·이름·국대/외인·영입가·잠금·보유 표시) 모두 포함</span>
  <div class="g"><button data-s="lg" class="on">크게 (250px)</button><button data-s="sm">작게 (200px)</button></div></div>
<div class="wrap" id="wrap"></div>
<script type="module">
const M = await import('/src/KboAugmentDraft.jsx');
const POS_FULL = { SP: 'STARTING PITCHER', RP: 'RELIEF PITCHER', C: 'CATCHER', '1B': 'FIRST BASE', '2B': 'SECOND BASE', '3B': 'THIRD BASE', SS: 'SHORTSTOP', OF: 'OUTFIELDER', DH: 'DESIGNATED HITTER' };
const POS_LABEL = { SP: '선발투수', RP: '불펜투수', C: '포수', '1B': '1루수', '2B': '2루수', '3B': '3루수', SS: '유격수', OF: '외야수', DH: '지명타자' };
const STAT = { power: '파워', contact: '컨택', speed: '주루', defense: '수비', stuff: '구위', control: '제구', stamina: '체력', stability: '안정' };
const TEAM_NEON = { 한화: '#ff8a3d', 대한민국: '#60a5fa', SK: '#ff5a67', 롯데: '#7cb4ff', KIA: '#ff5a67', 해태: '#ff5a67', 두산: '#a5a3ff', OB: '#a5a3ff', NC: '#6cc0ff', 삼성: '#5aa2ff', 넥센: '#ff6b9a', 키움: '#ff6b9a', KT: '#e5e7eb', LG: '#ff5c95', 현대: '#6f97ff' };
const hand = (p) => (p.hand === 'S' ? '양타' : p.type === 'batter' ? `${p.hand === 'L' ? '좌' : '우'}타` : `${p.hand === 'L' ? '좌' : '우'}투`);
const LINK = '<svg viewBox="0 0 20 20"><path d="M8.5 11.5a3.5 3.5 0 0 0 5 0l2.5-2.5a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M11.5 8.5a3.5 3.5 0 0 0-5 0L4 11a3.5 3.5 0 0 0 5 5l1-1"/></svg>';
const LOCK = '<svg viewBox="0 0 20 20"><rect x="4.5" y="9" width="11" height="8" rx="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9"/></svg>';

// 네 장의 예시 선수 (실제 데이터)
const all = M.ALL_PLAYERS;
const byNote = (f) => all.filter(f).sort((a, b) => (b.note ? 1 : 0) - (a.note ? 1 : 0) || b.overall - a.overall)[0];
const nat90 = byNote((p) => p.isNational && p.overall >= 90) || byNote((p) => p.overall >= 90);
const foreign = byNote((p) => p.isForeign && p.overall >= 75 && p.overall < 90);
const locked = byNote((p) => p.overall < 75 && p.type === 'pitcher');
const ownedBase = byNote((p) => p.position === 'SS' && p.overall >= 75 && p.overall < 90);
const keys = (p) => (p.type === 'batter' ? ['power', 'contact', 'speed', 'defense'] : ['stuff', 'control', 'stamina', 'stability']);
const CARDS = [
  { label: '① 90+ · 국가대표', p: nat90 },
  { label: '② 외국인 · 시너지 칸', p: foreign, syn: { name: '용병 트리오', on: 1, nx: 1, total: 2 } },
  { label: '③ 살 수 없음', p: locked, lock: '투수 마감' },
  { label: '④ 내 라인업 (2루수로 기용)', p: ownedBase, owned: { slot: '2루수', off: '유격수', diff: { power: 2, contact: 2, speed: -3, defense: -3 }, ovDiff: -3, syns: ['베이징 9전 전승', '국민 테이블세터'] } },
];

function card(c, v) {
  const p = c.p;
  const tier = p.overall + (c.owned?.ovDiff || 0) >= 90 ? 't90' : p.overall + (c.owned?.ovDiff || 0) >= 75 ? 't75' : '';
  const ks = keys(p);
  const val = (k) => p.stats[k] + (c.owned?.diff?.[k] || 0);
  const stats = ks.map((k) => {
    const d = c.owned?.diff?.[k] || 0;
    return `<div class="st"><dt>${STAT[k]}</dt><dd class="${val(k) >= 90 ? 'hi' : ''}">${val(k)}${d ? `<em class="${d > 0 ? 'up' : 'dn'}">${d > 0 ? '+' + d : '−' + -d}</em>` : ''}</dd><b class="bar"><i style="width:${val(k)}%"></i></b></div>`;
  }).join('');
  // 마름모 레이더 (위·오른쪽·아래·왼쪽)
  const R = 17, cx = 25, cy = 25;
  const pts = ks.map((k, i) => { const r = R * val(k) / 100; const a = -Math.PI / 2 + i * Math.PI / 2; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
  const lab = ks.map((k, i) => { const a = -Math.PI / 2 + i * Math.PI / 2; const x = cx + (R + 5.2) * Math.cos(a), y = cy + (R + 5.2) * Math.sin(a) + 1; const d = c.owned?.diff?.[k] || 0; return `<text x="${x}" y="${y - 1.6}" text-anchor="middle" font-size="2.6" fill="#9ca3af">${STAT[k]}</text><text x="${x}" y="${y + 2.4}" text-anchor="middle" font-size="4.2" font-weight="700" fill="${val(k) >= 90 ? 'var(--n)' : '#f3f4f6'}">${val(k)}${d ? `<tspan font-size="2.6" fill="${d > 0 ? '#34d399' : '#fbbf24'}">${d > 0 ? '+' + d : '−' + -d}</tspan>` : ''}</text>`; }).join('');
  const radar = `<svg class="radar" viewBox="0 0 50 50">${[1, .66, .33].map((s) => `<polygon points="${[0, 1, 2, 3].map((i) => { const a = -Math.PI / 2 + i * Math.PI / 2; return `${cx + R * s * Math.cos(a)},${cy + R * s * Math.sin(a)}`; }).join(' ')}" fill="${s === 1 ? 'rgba(5,8,15,.55)' : 'none'}" stroke="rgba(255,255,255,.18)" stroke-width=".3"/>`).join('')}<polygon points="${pts.map((q) => q.join(',')).join(' ')}" fill="color-mix(in srgb, var(--n) 35%, transparent)" stroke="var(--n)" stroke-width=".6"/>${lab}</svg>`;
  const tags = [p.isNational && '국대', p.isForeign && '외인'].filter(Boolean).map((t) => `<b>${t}</b>`).join('');
  const syn = c.syn ? `<span class="syn">${LINK}${Array.from({ length: c.syn.total }, (_, i) => `<i class="${i < c.syn.on ? 'on' : i < c.syn.on + c.syn.nx ? 'nx' : ''}"></i>`).join('')}<b>${c.syn.name}</b></span>` : '';
  const ochips = c.owned ? `<div class="ochips">${c.owned.syns.map((s) => `<span class="sy">▲ ${s}</span>`).join('')}<span class="off">원래 ${c.owned.off}</span></div>` : '';
  const ov = p.overall + (c.owned?.ovDiff || 0);
  const ovDiff = c.owned?.ovDiff ? `<em style="font-size:.32em;margin-left:1cqw;vertical-align:top;-webkit-text-fill-color:${c.owned.ovDiff > 0 ? '#34d399' : '#fbbf24'};color:${c.owned.ovDiff > 0 ? '#34d399' : '#fbbf24'}">${c.owned.ovDiff > 0 ? '+' : '−'}${Math.abs(c.owned.ovDiff)}</em>` : '';
  const fs = p.position === 'DH' ? 'style="font-size:4cqw"' : p.position === 'SP' ? 'style="font-size:4.4cqw"' : '';
  return `<div class="pc ${tier} ${c.lock ? 'lock' : ''}" style="--n:${TEAM_NEON[p.team] || '#10b981'}"><div class="in">
    <img class="art" src="/cards/${encodeURIComponent(p.id)}.webp" alt="" /><span class="sh"></span>${v === 7 ? '<span class="base"></span>' : ''}${v === 6 ? '<span class="lt"></span>' : ''}<span class="tb"></span>
    <span class="ov">${ov}${ovDiff}</span>
    <span class="meta">${p.year} · ${p.team} · ${hand(p)}</span>
    <dl class="stats">${stats}</dl>${radar}
    ${syn}${ochips}
    ${p.note ? `<span class="note">${p.note}</span>` : ''}
    <span class="pos"><em>${c.owned ? c.owned.slot === '2루수' ? '2B' : p.position : p.position}</em><span ${fs}>${c.owned ? 'SECOND BASE' : POS_FULL[p.position]}</span>${v === 7 ? '' : `<span class="tg">${tags}</span>`}</span>
    ${v === 7 ? `<span class="tg2">${tags}</span>` : ''}
    <span class="rule"></span>
    <h3 class="nm">${p.name}</h3>
    ${c.owned ? `<span class="slot">${c.owned.slot}</span>` : `<span class="cp"><small>CP</small><b>${p.cost}</b></span>`}
  </div><span class="fr"></span>${c.lock ? `<span class="lk">${LOCK}${c.lock}</span>` : ''}</div>`;
}
const V = [
  ['선반 카드 확대형', '선반 카드 배치를 그대로 키움 · 왼쪽 위 종합 → 연도·구단·투타 → 능력치 판 · 아래는 노트 → 포지션 칩+영문(+국대/외인) → 구분선 → 이름 · CP/숫자'],
  ['능력치 가로 띠', '능력치 4개를 포지션 줄 위 가로 띠로(숫자 크게, 이름 작게) — 그림 가운데가 가장 넓게 보임'],
  ['막대 그래프 판', '왼쪽 유리 판에 능력치 숫자 + 팀 색 막대 — 강점·약점이 한눈에'],
  ['오른쪽 능력치 기둥', '오른쪽 가장자리를 따라 능력치를 세로로 쌓음 · 시너지 칸은 왼쪽 메타 아래'],
  ['마름모 레이더', '능력치 4개를 마름모 레이더로 — 투수·타자 유형이 모양으로 보임, 숫자는 꼭짓점에'],
  ['중계 자막형', '아래를 중계 자막 판으로 묶고 오른쪽 끝에 사선 팀 색 코스트 · 능력치는 판 위 칩 네 개'],
  ['위 그림 · 아래 정보판', '카드를 위(그림 64%) / 아래(정보판)로 나눈 트레이딩 카드형 · 능력치 2×2 · 글자가 그림에 겹치지 않아 가장 잘 읽힘'],
  ['미니멀 텍스트', '판·막대 없이 글자만: 종합을 더 크게, 능력치는 두 줄 두 칸 “구위 88  제구 75”'],
];
let size = 'lg';
function render() {
  document.body.classList.toggle('sm', size === 'sm');
  document.getElementById('wrap').innerHTML = V.map(([n, d], i) => `
    <section class="v${i + 1}"><div class="vlab"><b><i class="disp">${i + 1}</i>${n}</b><span>${d}</span></div>
    <div class="panel">${CARDS.map((c) => `<div class="cell"><small>${c.label} — ${c.p.name}</small>${card(c, i + 1)}</div>`).join('')}</div></section>`).join('');
}
document.querySelectorAll('.top [data-s]').forEach((b) => b.onclick = () => { size = b.dataset.s; document.querySelectorAll('.top [data-s]').forEach((x) => x.classList.toggle('on', x === b)); render(); });
render();
window.__cards = CARDS.map((c) => `${c.p.name} ${c.p.position} ${c.p.overall} nat:${!!c.p.isNational} for:${!!c.p.isForeign} note:${c.p.note || ''}`);
</script>
</body>
</html>
