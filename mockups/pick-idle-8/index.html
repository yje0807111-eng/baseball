<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>빈 PICK 대기 애니 8안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Saira+Condensed:wght@600;700;800&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #03060c; color: #e5e7eb; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
  .top { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 14px; background: rgba(3,6,12,.95); border-bottom: 1px solid #1f2937; font-size: 13px; color: #9ca3af; }
  .top b { color: #fff; font-size: 15px; }
  .top label { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; cursor: pointer; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, 300px); justify-content: center; gap: 28px 22px; padding: 18px; background: linear-gradient(180deg, rgba(5,8,15,.55), rgba(5,8,15,.92)), url(/ui/stadium.webp) center 30% / cover; }
  .cell { display: flex; flex-direction: column; gap: 8px; }
  .cell > b { font-size: 14px; color: #fff; }
  .cell > b i { font-style: normal; color: #10b981; margin-right: 6px; font-family: 'Saira Condensed', sans-serif; }
  .cell > span { min-height: 54px; font-size: 12px; line-height: 1.5; color: #9ca3af; }

  /* 실제 PICK 판 (bc-grp) */
  .grp { --c: 16px; --a: #10b981; position: relative; width: 300px; height: 540px; padding: 30px 10px 10px; background: rgba(6,10,19,.8); clip-path: polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); display: flex; flex-direction: column; gap: 8px; }
  .grp::after { content: ""; position: absolute; inset: 0; z-index: 7; pointer-events: none;
    background: linear-gradient(135deg, transparent calc(50% - 1px), var(--a) calc(50% - 1px), var(--a) calc(50% + 1px), transparent calc(50% + 1px)) left top / var(--c) var(--c) no-repeat,
      linear-gradient(135deg, transparent calc(50% - 1px), var(--a) calc(50% - 1px), var(--a) calc(50% + 1px), transparent calc(50% + 1px)) right bottom / var(--c) var(--c) no-repeat,
      linear-gradient(var(--a), var(--a)) left var(--c) top 0 / 56px 2px no-repeat, linear-gradient(var(--a), var(--a)) left 0 top var(--c) / 2px 30px no-repeat,
      linear-gradient(var(--a), var(--a)) right var(--c) bottom 0 / 56px 2px no-repeat, linear-gradient(var(--a), var(--a)) right 0 bottom var(--c) / 2px 30px no-repeat;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--a) 30%, transparent); }
  .lab { position: absolute; z-index: 8; left: 20px; top: 8px; display: inline-flex; align-items: center; gap: 8px; font-family: 'Saira Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .32em; color: var(--a); }
  .lab::before { content: ""; width: 14px; height: 10px; background: currentColor; clip-path: polygon(0 0,60% 0,100% 100%,40% 100%); }
  .slot { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; }
  .stage { position: relative; height: 100%; max-width: 100%; aspect-ratio: 2/3; }

  /* 게임의 빈 PICK 카드 그대로 (.pk-empty · .pk-sk · .pk-ghostbtn) */
  .card { position: relative; width: 100%; height: 100%; container-type: inline-size; overflow: hidden; background: linear-gradient(180deg, #0a1120, #070c16); clip-path: polygon(7% 0,100% 0,100% 95.3%,93% 100%,0 100%,0 4.7%); }
  .sk { position: absolute; background: rgba(148,163,184,.09); }
  .fr { position: absolute; inset: 1.6cqw; border: 1px solid rgba(148,163,184,.2); pointer-events: none; }
  .ghostbtn { position: relative; flex: none; height: 44px; overflow: hidden; background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
  body.still *, body.still *::before, body.still *::after { animation-play-state: paused !important; }

  /* ═ E1 · 빛 훑기: 사선 빛줄기가 카드와 버튼 틀을 천천히 훑고 지나감 (로딩 스켈레톤 문법) ═ */
  .e1 .card::after, .e1 .ghostbtn::after { content: ""; position: absolute; inset: -20% -60%; background: linear-gradient(105deg, transparent 40%, rgba(148,163,184,.14) 48%, rgba(110,231,183,.12) 50%, transparent 58%); transform: translateX(-60%); animation: e1 2.8s ease-in-out infinite; }
  .e1 .ghostbtn::after { animation-delay: .35s; }
  @keyframes e1 { 0% { transform: translateX(-60%); } 60%, 100% { transform: translateX(60%); } }

  /* ═ E2 · 블록 차례로 숨쉬기: 스켈레톤 블록이 위→아래 순서로 밝아졌다 가라앉음 ═ */
  .e2 .sk { animation: e2 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * .09s); }
  @keyframes e2 { 0%, 100% { filter: brightness(1); } 30% { filter: brightness(2.1); } }
  .e2 .ghostbtn { animation: e2btn 2.4s ease-in-out 1.6s infinite; }
  @keyframes e2btn { 0%, 100% { box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); } 30% { box-shadow: inset 0 0 0 1px rgba(110,231,183,.35); } }

  /* ═ E3 · 스캔 라인: 초록 가로선이 카드 위→아래로 내려가며 읽는 느낌 · 선 뒤로 옅은 잔상 ═ */
  .e3 .card::after { content: ""; position: absolute; left: 0; right: 0; top: -18%; height: 18%; background: linear-gradient(180deg, transparent, rgba(16,185,129,.1) 80%, rgba(52,211,153,.55) 99%, transparent); animation: e3 3.2s linear infinite; }
  @keyframes e3 { 0% { top: -18%; } 70%, 100% { top: 100%; } }
  .e3 .fr { animation: e3fr 3.2s linear infinite; }
  @keyframes e3fr { 0%, 60% { border-color: rgba(148,163,184,.2); } 70% { border-color: rgba(52,211,153,.5); } 100% { border-color: rgba(148,163,184,.2); } }

  /* ═ E4 · 테두리 빛 순환: 카드 둘레를 초록 빛 한 점이 계속 돌아감 ═ */
  .e4 .stage::before { content: ""; position: absolute; inset: -2px; z-index: 0; clip-path: polygon(7% 0,100% 0,100% 95.3%,93% 100%,0 100%,0 4.7%); background: conic-gradient(from var(--r), transparent 0 75%, rgba(52,211,153,.9) 88%, transparent 100%); animation: e4 3s linear infinite; }
  .e4 .card { position: absolute; inset: 1px; width: auto; height: auto; }
  @property --r { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes e4 { to { --r: 360deg; } }

  /* ═ E5 · 떠 있는 카드: 빈 카드가 아주 천천히 위아래로 떠다니고 살짝 기울며, 아래 그림자가 숨 쉼 ═ */
  .e5 .stage { animation: e5 4s ease-in-out infinite; transform-style: preserve-3d; }
  @keyframes e5 { 0%, 100% { transform: translateY(0) rotateX(0) rotateY(0); } 50% { transform: translateY(-7px) rotateX(3deg) rotateY(-4deg); } }
  .e5 .slot { perspective: 900px; }
  .e5 .slot::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -6px; height: 12px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.6), transparent); animation: e5s 4s ease-in-out infinite; }
  @keyframes e5s { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.8); opacity: .5; } }

  /* ═ E6 · 홀로그램: 가는 주사선이 흘러내리고, 가끔 카드가 짧게 지직거림 ═ */
  .e6 .card::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(110,231,183,.05) 0 1px, transparent 1px 4px); animation: e6 1.2s linear infinite; }
  @keyframes e6 { to { background-position: 0 8px; } }
  .e6 .card { animation: e6g 5s steps(1) infinite; }
  @keyframes e6g { 0%, 91%, 100% { transform: none; filter: none; } 92% { transform: translateX(2px) skewX(-1deg); filter: hue-rotate(40deg) brightness(1.4); } 94% { transform: translateX(-2px); filter: none; } 96% { transform: translateX(1px); filter: brightness(1.2); } }

  /* ═ E7 · 대기 신호: 초상 자리에 초록 원이 물결처럼 퍼지고, 버튼 틀엔 점선이 흘러감 ═ */
  .e7 .card::before, .e7 .card::after { content: ""; position: absolute; left: 50%; top: 42%; width: 30cqw; height: 30cqw; margin: -15cqw 0 0 -15cqw; border-radius: 50%; border: 1px solid rgba(52,211,153,.6); opacity: 0; animation: e7 2.6s ease-out infinite; }
  .e7 .card::after { animation-delay: 1.3s; }
  @keyframes e7 { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
  .e7 .ghostbtn { box-shadow: none; }
  .e7 .ghostbtn::after { content: ""; position: absolute; inset: 1px; clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    background: linear-gradient(90deg, rgba(110,231,183,.4) 50%, transparent 0) 0 0 / 12px 1px repeat-x, linear-gradient(90deg, rgba(110,231,183,.4) 50%, transparent 0) 0 100% / 12px 1px repeat-x; animation: e7b 1s linear infinite; }
  @keyframes e7b { to { background-position: 12px 0, -12px 100%; } }

  /* ═ E8 · 숫자 굴림: 종합 자리에 흐린 숫자가 천천히 굴러가고(60~99), 이름 · CP 자리 블록이 번갈아 깜빡 — “누구를 뽑을까” ═ */
  .e8 .num { position: absolute; left: 6cqw; top: 7cqw; width: 26cqw; height: 19cqw; overflow: hidden; font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-size: 17cqw; line-height: 19cqw; text-align: center; color: rgba(148,163,184,.22); }
  .e8 .num span { display: block; animation: e8 6s steps(1) infinite; }
  .e8 .num span::before { content: "74"; animation: e8n 6s steps(1) infinite; }
  @keyframes e8 { 0%, 100% { transform: translateY(0); } 1% { transform: translateY(-30%); opacity: 0; } 3% { transform: translateY(30%); opacity: 0; } 5% { transform: translateY(0); opacity: 1; } }
  @keyframes e8n { 0% { content: "74"; } 16% { content: "88"; } 33% { content: "61"; } 50% { content: "93"; } 66% { content: "79"; } 83% { content: "67"; } }
  .e8 .num span { animation-duration: 1s; }
  .e8 .sk.name, .e8 .sk.cp { animation: e8b 2s ease-in-out infinite; }
  .e8 .sk.cp { animation-delay: 1s; }
  @keyframes e8b { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(2); } }
</style>
</head>
<body>
<div class="top"><b>빈 PICK 대기 애니 8안</b><span>지금 게임의 빈 PICK(카드 모양 스켈레톤 + 버튼 틀) 위에 은은한 대기 움직임만 더함 · 글자 없음</span><label><input type="checkbox" id="still" /> 움직임 멈추고 보기</label></div>
<div class="row" id="row"></div>
<script>
// 게임의 PK_SKELETON 그대로 (i = 위→아래 순서, name · cp 는 E8 이 쓰는 표시)
const SK = [
  { left: '6cqw', right: '1.6cqw', top: '1.6cqw', height: '1.3cqw', background: 'rgba(148,163,184,.22)' },
  { left: '6cqw', top: '7cqw', width: '26cqw', height: '19cqw', k: 'ov' },
  { left: '6.5cqw', top: '29cqw', width: '34cqw', height: '3.4cqw' },
  { left: '5cqw', top: '36cqw', width: '42cqw', height: '44cqw', background: 'rgba(148,163,184,.05)', boxShadow: 'inset 0 0 0 1px rgba(148,163,184,.1)' },
  { left: '9cqw', top: '41cqw', width: '20cqw', height: '3cqw' }, { left: '9cqw', top: '47cqw', width: '30cqw', height: '1.4cqw' },
  { left: '9cqw', top: '52cqw', width: '18cqw', height: '3cqw' }, { left: '9cqw', top: '58cqw', width: '26cqw', height: '1.4cqw' },
  { left: '9cqw', top: '63cqw', width: '22cqw', height: '3cqw' }, { left: '9cqw', top: '69cqw', width: '33cqw', height: '1.4cqw' },
  { left: '9cqw', top: '74cqw', width: '16cqw', height: '3cqw' },
  { left: '6cqw', bottom: '43cqw', width: '44cqw', height: '3cqw' },
  { left: '6cqw', bottom: '35.5cqw', width: '8cqw', height: '5cqw', background: 'rgba(16,185,129,.2)' },
  { left: '16cqw', bottom: '36.2cqw', width: '34cqw', height: '3.4cqw' },
  { left: '6cqw', right: '6cqw', bottom: '32.5cqw', height: '1px', background: 'rgba(16,185,129,.3)' },
  { left: '6cqw', bottom: '8cqw', width: '46cqw', height: '12cqw', k: 'name' },
  { right: '6cqw', bottom: '18cqw', width: '8cqw', height: '3cqw' },
  { right: '6cqw', bottom: '8cqw', width: '14cqw', height: '9cqw', background: 'rgba(16,185,129,.16)', k: 'cp' },
];
const css = (o) => Object.entries(o).filter(([k]) => k !== 'k').map(([k, v]) => `${k.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase())}:${v}`).join(';');
const skeleton = SK.map((s, i) => `<span class="sk ${s.k || ''}" style="${css(s)};--i:${i}"></span>`).join('') + '<span class="fr"></span>';
const V = [
  ['e1', '빛 훑기', '사선 빛줄기가 2.8초마다 카드와 버튼 틀을 천천히 훑고 지나감 — 로딩 스켈레톤의 익숙한 문법, 가장 무난'],
  ['e2', '블록 차례로 숨쉬기', '스켈레톤 블록이 위(종합)부터 아래(이름 · CP)까지 차례로 밝아졌다 가라앉고, 마지막에 버튼 틀 테두리가 초록으로 살짝'],
  ['e3', '스캔 라인', '초록 가로선이 카드 위에서 아래로 내려가며 읽고, 끝에 닿으면 카드 틀이 한 번 빛남 — HUD 느낌'],
  ['e4', '테두리 빛 순환', '카드 둘레를 초록 빛 한 점이 3초에 한 바퀴씩 계속 돎 — 판의 초록 브래킷과 잘 어울림'],
  ['e5', '떠 있는 카드', '빈 카드가 4초 주기로 아주 천천히 떠오르며 살짝 기울고, 아래 그림자가 줄었다 커짐 — 뒤집기 모션과 이어지는 입체감'],
  ['e6', '홀로그램', '가는 주사선이 흘러내리고, 5초에 한 번 카드가 짧게 지직거림 — 개성은 가장 강함'],
  ['e7', '대기 신호', '초상 자리에서 초록 원이 물결처럼 두 겹 퍼지고, 버튼 틀엔 점선이 흘러감 — “여기에 선수가 옵니다”'],
  ['e8', '숫자 굴림', '종합 자리에 흐린 숫자(74 · 88 · 61 …)가 1초마다 바뀌어 굴러가고, 이름 · CP 블록이 번갈아 깜빡 — “누구를 뽑을까”'],
];
document.getElementById('row').innerHTML = V.map(([k, t, d], i) => `
  <div class="cell"><b><i>E${i + 1}</i>${t}</b><span>${d}</span>
    <div class="grp ${k}"><span class="lab">PICK</span>
      <div class="slot"><div class="stage"><div class="card">${skeleton}${k === 'e8' ? '<div class="num"><span></span></div>' : ''}</div></div></div>
      <div class="ghostbtn"></div></div>
  </div>`).join('');
document.getElementById('still').addEventListener('change', (e) => document.body.classList.toggle('still', e.target.checked));
</script>
</body>
</html>
