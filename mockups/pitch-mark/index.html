<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>구종 표시 목업</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&display=swap" rel="stylesheet">
<!--
  구종 목록 — 색 동그라미 대신 구분하는 방법 8가지(1920 × 911, 판 하나 = 게임 고르는 판 400px 폭)
  많이 던지는 순(1번이 가장 많이) · 주무기 · 비중 글자 없음 · 2번 선택 · 5번 추천
  1 영문 약어(Baseball Savant FF · SL …)  2 한 글자  3 꺾임 화살표(흰색)  4 구속 막대
  5 계열 띠(직구 · 휘는 공 · 떨어지는 공)  6 옆 궤적 미니  7 번호만 크게  8 공 회전(실밥 · 도는 방향)
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1920px; height: 911px; overflow: hidden; background: #05080f url(/ui/duel-def.webp) center/cover; font-family: Pretendard, 'Noto Sans KR', system-ui, sans-serif; color: #fff; }
  .shade { position: fixed; inset: 0; background: rgba(5, 8, 15, .6); }
  .grid { position: relative; display: grid; grid-template-columns: repeat(4, 420px); gap: 16px 40px; justify-content: center; padding: 18px 0; }
  .cell h3 { margin: 0 0 6px 6px; font-size: 17px; font-weight: 800; color: #fbbf24; }
  .cell h3 small { color: #94a3b8; font-weight: 700; margin-left: 8px; font-size: 14px; }
  .pn { width: 420px; padding: 12px 14px; border-radius: 20px; background: linear-gradient(160deg, rgba(20,26,40,.84), rgba(8,12,22,.8)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); display: grid; gap: 4px; }
  .opt { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; border-radius: 13px; }
  .opt.on { background: rgba(251,191,36,.16); box-shadow: inset 0 0 0 2.5px #fbbf24; }
  .opt.rec { outline: 1.5px dashed rgba(255,255,255,.5); outline-offset: -4px; background: rgba(255,255,255,.06); }
  .n { font: 800 17px 'Saira Condensed'; color: #94a3b8; width: 10px; }
  .nm { font-size: 20px; font-weight: 800; }
  .v { font: 800 20px 'Saira Condensed'; margin-left: auto; width: 40px; text-align: right; }
  .rtag { font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.14); color: #e2e8f0; }
  .disp { font-family: 'Saira Condensed', sans-serif; }
</style>
<body>
<div class="shade"></div>
<div class="grid" id="grid"></div>
<script>
/* 많이 던지는 순 */
const P = [
  { k: 'fast', ko: '직구', ab: 'FF', one: '직', c: '#f87171', fam: 'F', v: 148, b: [0, -0.15] },
  { k: 'slider', ko: '슬라이더', ab: 'SL', one: '슬', c: '#a78bfa', fam: 'B', v: 134, b: [0.45, 0.15] },
  { k: 'change', ko: '체인지업', ab: 'CH', one: '체', c: '#34d399', fam: 'O', v: 128, b: [-0.2, 0.35] },
  { k: 'curve', ko: '커브', ab: 'CU', one: '커', c: '#60a5fa', fam: 'B', v: 117, b: [0.2, 0.8] },
  { k: 'cutter', ko: '커터', ab: 'FC', one: '컷', c: '#f472b6', fam: 'F', v: 141, b: [0.22, 0.05] },
  { k: 'sinker', ko: '투심', ab: 'SI', one: '투', c: '#fb923c', fam: 'F', v: 144, b: [-0.3, 0.25] },
];
const FAM = { F: ['직구 계열', '#f87171'], B: ['휘는 공', '#a78bfa'], O: ['떨어지는 공', '#2dd4bf'] };
const line = (Q) => 'M' + Q.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');

/* 3 · 꺾임 화살표(흰색) — 아래에서 올라와 꺾임 */
function arrow(p) {
  const m = Math.hypot(...p.b), B = p.b.map((v) => (v * (12 + 18 * m)) / m), C = [B[0] * 0.15 + B[1] * 0.4, B[1] * 0.15 - B[0] * 0.4];
  const Q = Array.from({ length: 13 }, (_, i) => { const s = i / 12, u = 1 - s; return [2 * u * s * C[0] + s * s * B[0], 2 * u * s * C[1] + s * s * B[1]]; });
  const xs = Q.map((q) => q[0]), ys = Q.map((q) => q[1]), cx = (Math.min(...xs) + Math.max(...xs)) / 2 - 14, cy = (Math.min(...ys) + Math.max(...ys)) / 2 - 14;
  const R = Q.map(([x, y]) => [x - cx, y - cy]), e = R[12], d = R[11], a = Math.atan2(e[1] - d[1], e[0] - d[0]);
  const h = (da) => `${(e[0] - 7 * Math.cos(a + da)).toFixed(1)} ${(e[1] - 7 * Math.sin(a + da)).toFixed(1)}`;
  return `<svg width="30" height="30" viewBox="0 0 28 28" style="overflow:visible;flex:none"><path d="${line(R)}" stroke="#e2e8f0" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M${h(0.5)} L${e[0]} ${e[1]} L${h(-0.5)}" stroke="#e2e8f0" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
/* 6 · 옆에서 본 미니 궤적 — 손(왼쪽) → 포수(오른쪽), 떨어지는 만큼 */
function side(p, on) {
  const bend = 0.8 + p.b[1] * 5, pp = p.k === 'fork' ? 3 : 2;
  const Q = Array.from({ length: 21 }, (_, i) => { const s = i / 20; return [2 + s * 50, 6 + (-1 + 1.6 * s - bend * (s - s ** pp)) * 6 + 6]; });
  return `<svg width="56" height="26" viewBox="0 0 56 26" style="flex:none;overflow:visible"><path d="${line(Q)}" stroke="${on ? '#fbbf24' : '#cbd5e1'}" stroke-opacity="${on ? 1 : .7}" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="${Q[20][0]}" cy="${Q[20][1]}" r="3.4" fill="${on ? '#fbbf24' : '#e2e8f0'}"/></svg>`;
}
/* 8 · 공 회전 — 실밥 기울기 + 도는 방향(공 둘레 호 화살). 각도: 0 = 위, 시계 방향 */
const SPIN = { fast: [0, 300, 60], slider: [60, 20, 140], change: [-30, 280, 20], curve: [0, 120, 240], cutter: [30, 0, 110], sinker: [-45, 250, 10] };
function spin(p) {
  const [rot, a0, a1] = SPIN[p.k], R = 14.5, pt = (a) => [16 + R * Math.sin(a * Math.PI / 180), 16 - R * Math.cos(a * Math.PI / 180)];
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1), t = (a1 + 90) * Math.PI / 180, tip = (da) => `${(x1 - 5 * Math.sin(t + da)).toFixed(1)} ${(y1 + 5 * Math.cos(t + da)).toFixed(1)}`;
  const sweep = ((a1 - a0 + 360) % 360) > 180 ? 1 : 0;
  return `<svg width="34" height="34" viewBox="0 0 32 32" style="flex:none;overflow:visible"><g transform="rotate(${rot} 16 16)"><circle cx="16" cy="16" r="10" fill="#f8fafc"/><path d="M11 8.5 q3 7.5 0 15 M21 8.5 q-3 7.5 0 15" stroke="#dc2626" stroke-width="1.4" fill="none"/></g><path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${sweep} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="#cbd5e1" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M${tip(-0.6)} L${x1.toFixed(1)} ${y1.toFixed(1)} L${tip(0.6)}" stroke="#cbd5e1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}/* 6b · 옆 + 위 미니 두 줄 — 궤적 카드와 같은 두 그림(위 줄 = 옆 · 높이, 아래 줄 = 위 · 좌우) */
function two(p, on) {
  const c = on ? '#fbbf24' : '#cbd5e1', tr = (axis, end, rel, y0, k) => { const bend = axis ? 0.8 + p.b[1] * 5 : p.b[0] * 8; return Array.from({ length: 21 }, (_, i) => { const s = i / 20; return [2 + s * 50, y0 + (rel + (end - rel) * s - bend * (s - s * s)) * k]; }); };
  const A = tr(1, 0.4, -1.2, 7, 4), Bq = tr(0, 0, 0.6, 21, 4.5);
  return `<svg width="56" height="30" viewBox="0 0 56 30" style="flex:none;overflow:visible"><path d="${line(A)}" stroke="${c}" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="${A[20][0]}" cy="${A[20][1]}" r="3" fill="${c}"/><path d="${line(Bq)}" stroke="${c}" stroke-opacity=".75" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="${Bq[20][0]}" cy="${Bq[20][1]}" r="3" fill="${c}" fill-opacity=".75"/></svg>`;
}const vmin = 110, vmax = 150;
const OPTS = [
  ['영문 약어', 'Baseball Savant · 중계식', (p) => `<b class="disp" style="width:38px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:17px;letter-spacing:.04em;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22);color:#e2e8f0">${p.ab}</b>`],
  ['한 글자', '이름 첫 글자 배지', (p) => `<b style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.1);color:#fff">${p.one}</b>`],
  ['꺾임 화살표', '휘는 방향 · 크기(흰색)', arrow],
  ['구속 막대', '빠를수록 길게', (p) => `<i style="width:44px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);flex:none;position:relative"><i style="position:absolute;inset:0 auto 0 0;width:${Math.round(((p.v - vmin) / (vmax - vmin)) * 100)}%;border-radius:3px;background:#e2e8f0"></i></i>`, true],
  ['계열 띠', '직구 · 휘는 공 · 떨어지는 공', (p) => `<i style="width:4px;height:30px;border-radius:2px;background:${FAM[p.fam][1]};flex:none"></i>`, false, (p) => `<span style="font-size:13px;font-weight:700;color:#94a3b8;margin-left:8px">${FAM[p.fam][0]}</span>`],
  ['옆 궤적 미니', '궤적 카드와 같은 모양', side],
  ['옆 + 위 미니', '궤적 카드의 두 그림을 작게', two],
  ['공 회전', '실밥 기울기 · 도는 방향', spin],
];
document.getElementById('grid').innerHTML = OPTS.map(([t, sub, mark, , after, big], n) => `
  <div class="cell"><h3>${n + 1} · ${t}<small>${sub}</small></h3><div class="pn">
    ${P.map((p, i) => `<div class="opt ${i === 1 ? 'on' : ''} ${i === 4 ? 'rec' : ''}">${big ? `<b class="disp" style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:20px;background:${i === 1 ? '#fbbf24' : 'rgba(255,255,255,.1)'};color:${i === 1 ? '#0b1220' : '#e2e8f0'}">${i + 1}</b>` : `<span class="n">${i + 1}</span>${mark(p, i === 1)}`}<span class="nm">${p.ko}</span>${after ? after(p) : ''}${i === 4 ? '<span class="rtag">추천</span>' : ''}<span class="v">${p.v}</span></div>`).join('')}
  </div></div>`).join('');
</script>
</body>
</html>
