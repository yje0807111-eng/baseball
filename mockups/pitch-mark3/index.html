<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>구종 표시 목업 3</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&display=swap" rel="stylesheet">
<!--
  구종 그림 — 커터 · 슬라이더 · 투심까지 갈리게, 모두 칸 안(높이 30px 안)
  1 옆 궤적 + 화살표 — 선 = 떨어지는 정도, 화살표 = 좌우(→ 바깥 · ← 몸쪽, 길고 굵으면 크게)
  2 방향 + 단계(파워프로식) — 8방향 화살 하나 + 꺾임 단계 막대 1~4
  3 휘는 쪽 칸 — 3 × 3 작은 존에서 휘는 쪽 칸이 밝음(크면 더 밝게 · 두 칸)
  4 공 + 움직임 줄 — 공 뒤로 줄(만화식), 줄 방향의 반대로 공이 움직임, 길면 크게
  방향 · 단계는 구종마다 정해 둔 값(파워프로처럼 한 구종 = 한 방향): 직구 ↑ · 커터 → 1 · 슬라이더 → 3 · 커브 ↘ 4 · 체인지업 ↙ 2 · 투심 ← 2 · 포크 ↓ 4
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1920px; height: 911px; overflow: hidden; background: #05080f url(/ui/duel-def.webp) center/cover; font-family: Pretendard, 'Noto Sans KR', system-ui, sans-serif; color: #fff; }
  .shade { position: fixed; inset: 0; background: rgba(5, 8, 15, .6); }
  .grid { position: relative; display: grid; grid-template-columns: repeat(4, 420px); gap: 36px; justify-content: center; padding: 56px 0 0; }
  .cell h3 { margin: 0 0 10px 6px; font-size: 19px; font-weight: 800; color: #fbbf24; }
  .cell h3 small { color: #94a3b8; font-weight: 700; margin-left: 8px; font-size: 14px; }
  .pn { width: 420px; padding: 14px; border-radius: 20px; background: linear-gradient(160deg, rgba(20,26,40,.84), rgba(8,12,22,.8)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); display: grid; gap: 6px; }
  .opt { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 13px; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); overflow: hidden; }
  .opt.on { background: rgba(251,191,36,.16); box-shadow: inset 0 0 0 2.5px #fbbf24; }
  .opt.rec { outline: 1.5px dashed rgba(255,255,255,.5); outline-offset: -4px; }
  .n { font: 800 17px 'Saira Condensed'; color: #94a3b8; width: 10px; }
  .nm { font-size: 20px; font-weight: 800; }
  .v { font: 800 20px 'Saira Condensed'; margin-left: auto; width: 40px; text-align: right; }
  .rtag { font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.14); color: #e2e8f0; }
  .note { position: relative; width: 1780px; margin: 22px auto 0; font-size: 16px; line-height: 1.7; color: #cbd5e1; }
  .note b { color: #fbbf24; }
</style>
<body>
<div class="shade"></div>
<div class="grid" id="grid"></div>
<div class="note">
  <b>1</b> 지금 선에 좌우 화살표만 더함 &nbsp;·&nbsp; <b>2</b> 파워프로처럼 방향 하나 + 단계 — 가장 게임다움 &nbsp;·&nbsp;
  <b>3</b> 조준판과 같은 3 × 3 — 어느 칸 쪽으로 휘는지 &nbsp;·&nbsp; <b>4</b> 공이 움직이는 모습 그대로 — 가장 직관적
</div>
<script>
const BREAK = { fast: [0, -0.15], sinker: [-0.3, 0.25], cutter: [0.22, 0.05], slider: [0.45, 0.15], curve: [0.2, 0.8], change: [-0.2, 0.35], fork: [0, 0.55] };
/* 방향(도 — 0 = 위, 시계 방향) · 단계 1~4 */
const DIR = { fast: [0, 1], cutter: [90, 1], slider: [90, 3], curve: [135, 4], change: [225, 2], sinker: [270, 2], fork: [180, 4] };
const P = [['fast', '직구', 142], ['change', '체인지업', 121], ['curve', '커브', 112], ['sinker', '투심', 138], ['slider', '슬라이더', 127], ['cutter', '커터', 135], ['fork', '포크', 126]];
const line = (Q) => 'M' + Q.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');
const col = (on) => (on ? '#fbbf24' : '#cbd5e1');
const rad = (d) => d * Math.PI / 180;
const head = (x, y, a, s, c, w) => `<path d="M${(x - s * Math.sin(a) - s * .7 * Math.cos(a)).toFixed(1)} ${(y + s * Math.cos(a) - s * .7 * Math.sin(a)).toFixed(1)} L${x.toFixed(1)} ${y.toFixed(1)} L${(x - s * Math.sin(a) + s * .7 * Math.cos(a)).toFixed(1)} ${(y + s * Math.cos(a) + s * .7 * Math.sin(a)).toFixed(1)}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;

/* 1 · 옆 궤적(칸 안) + 좌우 화살표 */
function one(t, on) {
  const b = BREAK[t], p = t === 'fork' ? 3 : 2, bend = (0.8 + b[1] * 5) * 2, c = col(on);
  const Q = Array.from({ length: 31 }, (_, i) => { const s = i / 30; return [2 + s * 40, 17 + (-1.2 + 1.6 * s - bend * (s - s ** p)) * 4]; });
  const h = Math.abs(b[0]), big = h >= 0.28, len = h < 0.1 ? 0 : big ? 16 : 10, w = big ? 2.8 : 2, dir = b[0] > 0 ? 1 : -1, x0 = 59;   // 선 끝(42)과 떨어진 자리 가운데
  const arrow = len ? `<path d="M${x0 - dir * len / 2} 15 L${x0 + dir * len / 2} 15" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>${head(x0 + dir * len / 2, 15, rad(dir > 0 ? 90 : 270), 4.5, c, w)}` : '';
  return `<svg width="70" height="30" viewBox="0 0 70 30" style="flex:none"><path d="${line(Q)}" stroke="${c}" stroke-opacity="${on ? 1 : .75}" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="${Q[30][0]}" cy="${Q[30][1]}" r="3.2" fill="${c}"/>${arrow}</svg>`;
}
/* 2 · 방향 + 단계 */
function two(t, on) {
  const [d, lv] = DIR[t], a = rad(d), c = col(on), cx = 15, cy = 15, r = 10;
  const ex = cx + r * Math.sin(a), ey = cy - r * Math.cos(a), sx = cx - 5 * Math.sin(a), sy = cy + 5 * Math.cos(a);
  const bars = Array.from({ length: 4 }, (_, i) => `<rect x="${34 + i * 7}" y="${22 - (i + 1) * 4}" width="5" height="${(i + 1) * 4}" rx="1.5" fill="${i < lv ? c : 'rgba(255,255,255,.14)'}"/>`).join('');
  return `<svg width="64" height="30" viewBox="0 0 64 30" style="flex:none"><circle cx="${cx}" cy="${cy}" r="13" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.12)"/><path d="M${sx} ${sy} L${ex} ${ey}" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>${head(ex, ey, a, 5, c, 2.6)}${bars}</svg>`;
}
/* 3 · 휘는 쪽 칸 */
function three(t, on) {
  const [d, lv] = DIR[t], c = on ? '251,191,36' : '226,232,240';
  const cellOf = (deg) => { const k = Math.round(deg / 45) % 8; return [[1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1], [0, 0]][k]; };
  const [mx, my] = cellOf(d);
  let s = '';
  for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
    const hit = x === mx && y === my, mid = x === 1 && y === 1;
    s += `<rect x="${1 + x * 9.5}" y="${1 + y * 9.5}" width="8.5" height="8.5" rx="2" fill="rgba(${c},${hit ? 0.35 + lv * 0.16 : mid ? 0.16 : 0.06})"/>`;
  }
  return `<svg width="30" height="30" viewBox="0 0 30 30" style="flex:none">${s}<circle cx="15" cy="15" r="2" fill="rgba(${c},.8)"/></svg>`;
}
/* 4 · 공 + 움직임 줄 */
function four(t, on) {
  const [d, lv] = DIR[t], a = rad(d), c = col(on), bx = 15 + 5 * Math.sin(a), by = 15 - 5 * Math.cos(a), L = 4 + lv * 2.5;
  const px = Math.cos(a), py = Math.sin(a);   // 줄에 직각
  const streak = [-4, 0, 4].map((o, i) => { const x0 = bx - 8 * Math.sin(a) + o * px, y0 = by + 8 * Math.cos(a) + o * py, l = L * (i === 1 ? 1 : 0.7); return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} L${(x0 - l * Math.sin(a)).toFixed(1)} ${(y0 + l * Math.cos(a)).toFixed(1)}" stroke="${c}" stroke-opacity="${i === 1 ? .8 : .45}" stroke-width="2" stroke-linecap="round"/>`; }).join('');
  return `<svg width="34" height="34" viewBox="0 0 30 30" style="flex:none;overflow:visible">${streak}<circle cx="${bx}" cy="${by}" r="6.5" fill="${on ? '#fbbf24' : '#f8fafc'}"/><path d="M${bx - 2.6} ${by - 4.2} q1.8 4.2 0 8.4 M${bx + 2.6} ${by - 4.2} q-1.8 4.2 0 8.4" stroke="#dc2626" stroke-width="1" fill="none" transform="rotate(${d} ${bx} ${by})"/></svg>`;
}
const OPTS = [['1 · 옆 궤적 + 화살표', '→ 바깥 · ← 몸쪽', one], ['2 · 방향 + 단계', '파워프로식', two], ['3 · 휘는 쪽 칸', '3 × 3 미니 존', three], ['4 · 공 + 움직임 줄', '줄 반대로 움직임', four]];
document.getElementById('grid').innerHTML = OPTS.map(([t, sub, f]) => `<div class="cell"><h3>${t}<small>${sub}</small></h3><div class="pn">${P.map(([k, ko, v], i) => `<div class="opt ${i === 2 ? 'on' : ''} ${i === 5 ? 'rec' : ''}"><span class="n">${i + 1}</span>${f(k, i === 2)}<span class="nm">${ko}</span>${i === 5 ? '<span class="rtag">추천</span>' : ''}<span class="v">${v}</span></div>`).join('')}</div></div>`).join('');
</script>
</body>
</html>
