<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>궤적 목업 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&display=swap" rel="stylesheet">
<!--
  ② 옆 · 위 궤적 다듬은 두 가지(1920 × 911, 조준판 760,351 · 고르는 판 right 32 bottom 32 은 게임과 같은 자리)
  A 궤적 카드 — 조준판 왼쪽 유리 카드 하나에 옆 · 위. 고른 구종이 굵은 빛 선 + 공이 날아가는 반복(1.3초), 다른 구종은 옅은 선.
  B 투영 배치 — 옆 궤적은 판 왼쪽에 존 높이와 줄을 맞춰, 위 궤적은 판 위에 존 좌우와 줄을 맞춰(도면처럼).
    두 궤적 끝에서 과녁 공까지 점선 — 과녁을 옮기면 끝이 같은 줄로 따라간다.
  궤적: 옆 = 높이, 위 = 좌우. 값(s) = 손 + (끝 − 손)·s − 휨·(s − s^p), p = 2(포크 3 — 끝에서 뚝).
        휨: 옆 = 0.8(중력) + 세로 꺾임 × 5 · 위 = 가로 꺾임 × 8 — 꺾임은 과장(Savant 궤적처럼).
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1920px; height: 911px; overflow: hidden; background: #05080f url(/ui/duel-def.webp) center/cover; font-family: Pretendard, 'Noto Sans KR', system-ui, sans-serif; color: #fff; }
  .shade { position: absolute; inset: 0; background: rgba(5, 8, 15, .42); }
  .disp { font-family: 'Saira Condensed', sans-serif; }
  .tabs { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 14px; background: rgba(8, 12, 22, .78); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); z-index: 5; }
  .tabs button { all: unset; cursor: pointer; padding: 10px 18px; border-radius: 10px; font-weight: 800; font-size: 16px; color: #94a3b8; }
  .tabs button.on { background: rgba(251,191,36,.16); color: #fbbf24; box-shadow: inset 0 0 0 2px #fbbf24; }
  .glass { position: absolute; border-radius: 22px; background: linear-gradient(160deg, rgba(20,26,40,.78), rgba(8,12,22,.72)); backdrop-filter: blur(16px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.09), 0 18px 40px rgba(0,0,0,.35); }
  svg.pad { position: absolute; left: 760px; top: 351px; overflow: visible; touch-action: none; cursor: crosshair; }
  .pn { position: absolute; right: 32px; bottom: 32px; width: 400px; height: 520px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-size: 15px; font-weight: 800; color: #94a3b8; }
  .opt { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 14px; }
  .opt:hover { background: rgba(255,255,255,.08); }
  .opt.on { background: rgba(251,191,36,.16); box-shadow: inset 0 0 0 2.5px #fbbf24; }
  .opt .n { font-size: 17px; font-weight: 800; color: #94a3b8; width: 10px; }
  .opt .nm { font-size: 20px; font-weight: 800; }
  .opt .mx { font-size: 15px; color: #cbd5e1; margin-left: auto; }
  .opt .v { font-size: 20px; font-weight: 800; width: 38px; text-align: right; }
  .go { all: unset; margin-top: auto; height: 56px; border-radius: 14px; display: grid; place-items: center; background: #fbbf24; color: #0b1220; font-weight: 900; font-size: 20px; }
  .note { position: absolute; left: 40px; top: 96px; width: 520px; font-size: 15px; line-height: 1.6; color: #cbd5e1; background: rgba(8,12,22,.72); padding: 12px 16px; border-radius: 14px; }
  .note b { color: #fbbf24; }
  .cap { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: #94a3b8; }
</style>
<body>
<div class="shade"></div>
<div class="tabs" id="tabs"></div>
<div class="note" id="note"></div>
<div id="stage"></div>
<div class="pn glass">
  <div style="display:flex;justify-content:space-between;align-items:center;min-height:36px"><span class="lbl">구종</span></div>
  <div id="list" style="display:flex;flex-direction:column;gap:6px"></div>
  <button class="go">던지기 ▶</button>
</div>
<script>
const PITCH = {
  fast: { ko: '직구', c: '#f87171', b: [0, -0.15], mix: 38, v: 148 },
  slider: { ko: '슬라이더', c: '#a78bfa', b: [0.45, 0.15], mix: 22, v: 134 },
  change: { ko: '체인지업', c: '#34d399', b: [-0.2, 0.35], mix: 14, v: 128 },
  curve: { ko: '커브', c: '#60a5fa', b: [0.2, 0.8], mix: 11, v: 117 },
  fork: { ko: '포크', c: '#2dd4bf', b: [0, 0.55], mix: 9, v: 132, late: true },
  sinker: { ko: '투심', c: '#fb923c', b: [-0.3, 0.25], mix: 6, v: 144 },
};
const REP = Object.keys(PITCH);
const VARS = [
  ['A', 'A · 궤적 카드', '조준판 왼쪽 <b>유리 카드 하나</b>에 옆 · 위. 고른 구종은 빛 선 + <b>공이 날아가는 반복</b>, 다른 구종은 옅은 선.'],
  ['B', 'B · 투영 배치', '옆 궤적은 <b>판 왼쪽에 존 높이 맞춰</b>, 위 궤적은 <b>판 위에 존 좌우 맞춰</b>. 두 궤적 끝에서 과녁까지 점선.'],
];
let variant = location.hash.slice(1) || 'A', pk = 'slider', T = [0.5, -0.55];
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const line = (P) => 'M' + P.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');
let gid = 0;

/* 궤적 점 — s 0(손) → 1(포수). axis 1 = 높이(옆), 0 = 좌우(위). 반환 값은 존 단위(반폭 1) */
const REL = { 1: -2.0, 0: 0.6 };   // 손 높이(존 위) · 손 좌우(오른손 — 바깥 쪽)
function track(t, axis, end, k = 1, rel = REL[axis]) {
  const p = PITCH[t].late ? 3 : 2, bend = (axis ? 0.8 + PITCH[t].b[1] * 5 : PITCH[t].b[0] * 8) * k, r = rel;
  return Array.from({ length: 41 }, (_, i) => { const s = i / 40; return [s, r + (end - r) * s - bend * (s - s ** p)]; });
}
/* 한 판(옆 또는 위) 그리기 — map(s, v) → [x, y] */
function view(axis, map, k = 1, rel) {
  const end = axis ? T[1] : T[0];
  let s = '';
  for (const t of REP) if (t !== pk) {
    const P = track(t, axis, end, k, rel).map(([a, v]) => map(a, v));
    s += `<path d="${line(P)}" stroke="rgba(203,213,225,.16)" stroke-width="1.6" fill="none"/>`;
  }
  const P = track(pk, axis, end, k, rel).map(([a, v]) => map(a, v)), c = PITCH[pk].c, id = 'g' + gid++;
  s += `<defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${P[0][0]}" y1="${P[0][1]}" x2="${P.at(-1)[0]}" y2="${P.at(-1)[1]}"><stop offset="0" stop-color="${c}" stop-opacity=".15"/><stop offset=".55" stop-color="${c}" stop-opacity=".75"/><stop offset="1" stop-color="${c}"/></linearGradient></defs>`;
  s += `<path d="${line(P)}" stroke="${c}" stroke-opacity=".22" stroke-width="12" stroke-linecap="round" fill="none" style="filter:blur(5px)"/>`;
  s += `<path id="p${id}" d="${line(P)}" stroke="url(#${id})" stroke-width="4" stroke-linecap="round" fill="none"/>`;
  s += `<circle cx="${P[0][0]}" cy="${P[0][1]}" r="4" fill="rgba(255,255,255,.55)"/>`;
  s += `<circle cx="${P.at(-1)[0]}" cy="${P.at(-1)[1]}" r="6.5" fill="#f8fafc" stroke="${c}" stroke-width="2.5"/>`;
  if (!still) s += `<circle r="5" fill="#fff" style="filter:drop-shadow(0 0 6px ${c})"><animateMotion dur="1.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.62;1" calcMode="linear"><mpath href="#p${id}"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.6;.66;1" dur="1.4s" repeatCount="indefinite"/></circle>`;
  return { svg: s, end: P.at(-1) };
}

/* 조준판(400 × 430, 존 50~350) */
const px = (v) => 50 + ((v + 1) / 2) * 300;
const ZN = ['몸쪽 높게', '높게', '바깥 높게', '몸쪽', '한가운데', '바깥', '몸쪽 낮게', '낮게', '바깥 낮게'];
function pad() {
  let s = `<rect x="1" y="1" width="398" height="398" rx="18" fill="rgba(8,12,22,.4)" stroke="rgba(255,255,255,.16)" stroke-dasharray="7 7"/><rect x="50" y="50" width="300" height="300" rx="10" fill="rgba(8,12,22,.35)"/>`;
  for (let i = 1; i < 3; i++) s += `<line x1="${50 + i * 100}" y1="50" x2="${50 + i * 100}" y2="350" stroke="rgba(255,255,255,.1)"/><line x1="50" y1="${50 + i * 100}" x2="350" y2="${50 + i * 100}" stroke="rgba(255,255,255,.1)"/>`;
  ZN.forEach((n, z) => { s += `<text x="${100 + (z % 3) * 100}" y="${106 + Math.floor(z / 3) * 100}" text-anchor="middle" font-size="14" font-weight="800" fill="rgba(226,232,240,.55)">${n}</text>`; });
  s += `<rect x="50" y="50" width="300" height="300" rx="10" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="3"/>`;
  s += `<text x="50" y="422" font-size="15" font-weight="700" fill="#94a3b8">◀ 몸쪽</text><text x="350" y="422" text-anchor="end" font-size="15" font-weight="700" fill="#94a3b8">바깥 ▶</text>`;
  const x = px(T[0]), y = px(T[1]);
  return s + `<circle cx="${x}" cy="${y}" r="30" fill="rgba(251,191,36,.1)" stroke="rgba(251,191,36,.5)" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="12" fill="#f8fafc" stroke="#fbbf24" stroke-width="3" style="filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))"/><path d="M${x - 5} ${y - 8} q4 8 0 16 M${x + 5} ${y - 8} q-4 8 0 16" fill="none" stroke="#dc2626" stroke-width="1.6"/>`;
}
const head = () => `<div style="display:flex;align-items:center;gap:10px"><span class="cap">궤적</span><i style="flex:1"></i><i style="width:10px;height:10px;border-radius:50%;background:${PITCH[pk].c};box-shadow:0 0 10px ${PITCH[pk].c}"></i><b style="font-size:17px">${PITCH[pk].ko}</b><b class="disp" style="font-size:19px;color:#cbd5e1">${PITCH[pk].v}</b></div>`;

/* A — 궤적 카드(410 × 380, 판 왼쪽) */
function cardA() {
  const W = 378, H = 128, x0 = 22, x1 = W - 30;
  const sideY = (v) => 72 + v * 26, topY = (v) => 62 + v * 30;
  const side = view(1, (s, v) => [x0 + (x1 - x0) * s, sideY(v)]), top = view(0, (s, v) => [x0 + (x1 - x0) * s, topY(v)]);
  const zb = (y0, y1) => `<rect x="${x1 - 4}" y="${y0}" width="8" height="${y1 - y0}" rx="3" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/>`;
  const plate = (cy) => `<path d="M${x1 + 10} ${cy - 30} h8 l6 30 l-6 30 h-8 z" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.35)"/>`;
  return `<div class="glass" style="left:318px;top:351px;width:414px;padding:16px 18px 14px">${head()}
    <svg width="${W}" height="${H * 2 + 44}" viewBox="0 0 ${W} ${H * 2 + 44}" style="display:block;margin-top:10px;overflow:visible">
      <text x="0" y="14" class="cap" fill="#64748b" font-size="12" font-weight="800">옆</text>
      <g transform="translate(0,16)">
        <line x1="${x0}" y1="${sideY(2.2)}" x2="${x1 + 20}" y2="${sideY(2.2)}" stroke="rgba(255,255,255,.1)"/>
        <path d="M${x0 - 14} ${sideY(2.2)} q14 -16 28 0" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)"/>
        ${zb(sideY(-1), sideY(1))}${side.svg}
      </g>
      <line x1="0" y1="${H + 24}" x2="${W}" y2="${H + 24}" stroke="rgba(255,255,255,.06)"/>
      <text x="0" y="${H + 46}" fill="#64748b" font-size="12" font-weight="800" letter-spacing=".08em">위</text>
      <text x="${W}" y="${H + 46}" text-anchor="end" fill="#64748b" font-size="12" font-weight="700">▲ 몸쪽</text>
      <text x="${W}" y="${H * 2 + 44}" text-anchor="end" fill="#64748b" font-size="12" font-weight="700">▼ 바깥</text>
      <g transform="translate(0,${H + 40})">${plate(topY(0))}${zb(topY(-1), topY(1))}${top.svg}</g>
    </svg></div>`;
}

/* B — 투영 배치: 옆은 판 왼쪽(존 높이와 같은 줄), 위는 판 위(존 좌우와 같은 줄) */
function layoutB() {
  const ZX0 = 810, ZX1 = 1110, ZY0 = 401, ZY1 = 701;              // 존(화면 좌표)
  const zy = (v) => ZY0 + ((v + 1) / 2) * 300, zx = (v) => ZX0 + ((v + 1) / 2) * 300;
  const SX0 = 402, SX1 = 752;                                       // 옆: 손(왼쪽) → 판 가장자리
  const TY0 = 176, TY1 = 344;                                       // 위: 손(위) → 판 위 가장자리
  const side = view(1, (s, v) => [SX0 + (SX1 - SX0) * s, zy(v)], 0.34, -1.4);   // 판 축척(1 = 150px)이라 휨을 줄여 A 와 같은 느낌으로
  const top = view(0, (s, v) => [zx(v), TY0 + (TY1 - TY0) * s], 0.22);
  const bx = zx(T[0]), by = zy(T[1]);
  const guide = `<path d="M${side.end[0]} ${side.end[1]} L${bx - 14} ${by}" stroke="rgba(251,191,36,.45)" stroke-width="1.4" stroke-dasharray="3 5"/><path d="M${top.end[0]} ${top.end[1]} L${bx} ${by - 14}" stroke="rgba(251,191,36,.45)" stroke-width="1.4" stroke-dasharray="3 5"/>`;
  const rails = `<g stroke="rgba(255,255,255,.14)" stroke-dasharray="2 6">
      <line x1="${SX0 - 6}" y1="${ZY0}" x2="${SX1}" y2="${ZY0}"/><line x1="${SX0 - 6}" y1="${ZY1}" x2="${SX1}" y2="${ZY1}"/>
      <line x1="${ZX0}" y1="${TY0 - 6}" x2="${ZX0}" y2="${TY1}"/><line x1="${ZX1}" y1="${TY0 - 6}" x2="${ZX1}" y2="${TY1}"/></g>`;
  return `<div class="glass" style="left:378px;top:300px;width:396px;height:424px"></div>
    <div class="glass" style="left:792px;top:132px;width:336px;height:226px"></div>
    
    <svg style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none" width="1920" height="911">
      <text x="${SX0 - 4}" y="${ZY1 + 16}" fill="#64748b" font-size="12" font-weight="800">옆 · 투수</text>
      <text x="${ZX0 + 8}" y="${TY0 - 22}" fill="#64748b" font-size="12" font-weight="800">위 · 투수</text>
      ${rails}${side.svg}${top.svg}${guide}
    </svg>`;
}

function render() {
  gid = 0;
  document.getElementById('tabs').innerHTML = VARS.map(([k, n]) => `<button class="${variant === k ? 'on' : ''}" data-v="${k}">${n}</button>`).join('');
  document.getElementById('note').innerHTML = VARS.find((v) => v[0] === variant)[2];
  document.getElementById('stage').innerHTML = `<svg class="pad" width="400" height="430" viewBox="0 0 400 430">${pad()}</svg>` + (variant === 'A' ? cardA() : layoutB());
  document.getElementById('list').innerHTML = REP.map((t, i) => `<button class="opt ${pk === t ? 'on' : ''}" data-p="${t}"><span class="n">${i + 1}</span><i style="width:14px;height:14px;border-radius:50%;background:${PITCH[t].c};box-shadow:0 0 10px ${PITCH[t].c}"></i><span class="nm">${PITCH[t].ko}</span><span class="mx" style="${i ? '' : 'color:#fbbf24;font-weight:800'}">${i ? `비중 ${PITCH[t].mix}%` : '주무기'}</span><span class="v disp">${PITCH[t].v}</span></button>`).join('');
}
document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-v]'); if (v) { variant = v.dataset.v; location.hash = variant; render(); }
  const p = e.target.closest('[data-p]'); if (p) { pk = p.dataset.p; render(); }
});
let drag = false;
const at = (e) => { const r = document.querySelector('svg.pad').getBoundingClientRect(), cl = (v) => Math.max(-1.3, Math.min(1.3, v)); T = [cl(((e.clientX - r.left - 50) / 300) * 2 - 1), cl(((e.clientY - r.top - 50) / 300) * 2 - 1)]; render(); };
document.addEventListener('pointerdown', (e) => { if (e.target.closest('svg.pad')) { drag = true; at(e); } });
document.addEventListener('pointermove', (e) => drag && at(e));
document.addEventListener('pointerup', () => { drag = false; });
addEventListener('keydown', (e) => { const i = +e.key - 1; if (REP[i]) { pk = REP[i]; render(); } });
render();
</script>
</body>
</html>
