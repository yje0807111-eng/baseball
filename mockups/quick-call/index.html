<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>3초 작전 카드 목업</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Saira+Condensed:wght@700;800&display=swap">
<!--
  개입 방식(야구9단식을 섞어서) — 평소엔 3초 작전 카드, 승부처는 지금처럼 멈추고 수싸움.
   · 야구9단: 경기는 흘러가고 번트 · 강공 · 대타 · 투수 교체 같은 작전을 실시간으로, 결정 시간 3초(10 · 15초로 시험했다가 3초가 가장 쾌적).
     개입하지 않으면 미리 정한 작전으로 진행.
   · 우리: 3초 안에 안 누르면 정비 작전(기본 카드)으로 넘어간다. 카드는 그 자리에서 되는 것만 2~4장.
  언제 뜨나(300경기 시뮬): 주자 있는 타석 전부면 경기당 39.6번 — 너무 잦다.
   주자 있음 + 무게 0.08↑ + 반 이닝에 한 번까지 → 경기당 약 8~10번(+30초 안팎) · 승부처 2번은 따로.
  장면: 1회말 1사 1 · 2루(공격) · 6회초 2사 2루 강타자(수비). 타이머는 3초마다 다시 돈다.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1920px; height: 911px; overflow: hidden; background: #05080f; font-family: 'IBM Plex Sans KR', sans-serif; color: #fff; }
  .shot { position: absolute; inset: 0; width: 1920px; height: 911px; }
  .ov { position: absolute; inset: 0; }
  .d { font-family: 'Saira Condensed', 'IBM Plex Sans KR', sans-serif; }
  .cap { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 50; padding: 6px 14px; border-radius: 10px; background: rgba(251,191,36,.95); color: #1a1205; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .bar { position: fixed; left: 12px; bottom: 12px; z-index: 50; display: flex; gap: 4px; padding: 5px; border-radius: 12px; background: rgba(20,24,38,.96); box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 10px 30px #000; }
  .bar button { all: unset; cursor: pointer; padding: 7px 11px; border-radius: 8px; font-weight: 700; font-size: 13px; color: #94a3b8; }
  .bar button.on { background: rgba(251,191,36,.16); color: #fbbf24; box-shadow: inset 0 0 0 2px #fbbf24; }
  .bar i { width: 1px; background: rgba(255,255,255,.15); margin: 4px; }
  :root { --k: #34d399; }
  .glass { background: rgba(7,10,18,.9); backdrop-filter: blur(12px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 18px 40px rgba(0,0,0,.55); }
  .card { all: unset; cursor: pointer; position: relative; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .card b { font-size: 20px; } .card span { font-size: 13px; color: #94a3b8; font-weight: 600; }
  .card.def { box-shadow: inset 0 0 0 2px var(--k); background: color-mix(in srgb, var(--k) 12%, transparent); }
  .card.def::after { content: '기본'; position: absolute; right: 10px; top: 10px; font-size: 11px; font-weight: 800; color: var(--k); }
  .timer { height: 5px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--k); animation: t 3s linear infinite; transform-origin: left; }
  @keyframes t { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .ring { width: 54px; height: 54px; }
  .ring circle.p { stroke: var(--k); stroke-dasharray: 150.8; animation: r 3s linear infinite; transform: rotate(-90deg); transform-origin: center; }
  @keyframes r { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 150.8; } }
  .sec { font-family: 'Saira Condensed', sans-serif; font-weight: 800; }
  .sit { font-size: 15px; font-weight: 700; color: #cbd5e1; }
  .sit em { font-style: normal; color: var(--k); }
</style>
<body>
<img class="shot" src="field.jpg">
<div class="ov" id="ov"></div>
<div class="cap" id="cap"></div>
<div class="bar" id="bar"></div>
<script>
  const SIT = {
    off: { k: '#34d399', head: '우리 공격 · 1사 1 · 2루', who: '타자 윤동균 · 상대 투수 윤석민(체력 84)',
      cards: [['강공', '장타 ↑ · 병살 ↑', 1], ['희생번트', '주자 한 루씩 · 타자 아웃'], ['히트앤런', '주자 출발 · 병살 ↓'], ['기다리기', '볼넷 ↑ · 스윙 ↓']] },
    def: { k: '#f5d27a', head: '우리 수비 · 6회초 2사 2루', who: '상대 타자 최형우(장타 93) · 다음 타자 박석민(71)',
      cards: [['정면 승부', '볼넷 ↓ · 몰린 공 ↑', 1], ['유인구', '장타 ↓ · 볼넷 ↑'], ['고의사구', '1루 채우고 다음 타자'], ['투수 교체', '불펜 이재만 79']] },
  };
  const cards = (s, cls = '') => s.cards.map(([n, sub, def]) => `<button class="card ${def ? 'def' : ''} ${cls}"><b>${n}</b><span>${sub}</span></button>`).join('');
  const RING = `<svg class="ring" viewBox="0 0 54 54"><circle cx="27" cy="27" r="24" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/><circle class="p" cx="27" cy="27" r="24" fill="none" stroke-width="5"/><text x="27" y="33" text-anchor="middle" fill="#fff" font-size="18" class="sec">3</text></svg>`;
  const V = {
    a: ['A · 아래 가운데 카드 줄', '구장 아래쪽 가운데에 카드 네 장 가로로 + 줄어드는 시간 막대 · 상황 한 줄 위에 · 경기는 멈추지 않은 듯 흐린 막 없이', (s) =>
      `<div class="glass" style="position:absolute;left:732px;top:600px;transform:translateX(-50%);width:760px;padding:14px 16px;border-radius:18px;display:flex;flex-direction:column;gap:10px;--k:${s.k}">
        <div style="display:flex;align-items:baseline;gap:12px"><b style="font-size:17px;color:${s.k}">${s.head}</b><span class="sit">${s.who}</span></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${cards(s)}</div>
        <div class="timer"><i></i></div></div>`],
    b: ['B · 오른쪽 작전 판이 바뀜', '오른쪽 작전 판 자리가 3초 동안 카드 판으로 — 눈이 늘 가는 자리 · 구장은 그대로 보임', (s) =>
      `<div class="glass" style="position:absolute;left:1458px;top:236px;width:436px;height:292px;padding:14px 16px;border-radius:20px;display:flex;flex-direction:column;gap:10px;--k:${s.k}">
        <div style="display:flex;align-items:center;gap:12px">${RING}<div style="display:flex;flex-direction:column;gap:2px"><b style="font-size:17px;color:${s.k}">${s.head}</b><span class="sit" style="font-size:13px">${s.who}</span></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1">${cards(s)}</div></div>`],
    c: ['C · 타석 카드 옆 작은 판', '왼쪽 아래 타석 카드 바로 위에 작은 버튼 넷 + 동그란 시간 — 타자 정보와 한 덩어리 · 가장 작음', (s) =>
      `<div class="glass" style="position:absolute;left:40px;top:560px;width:560px;padding:12px 14px;border-radius:16px;display:flex;flex-direction:column;gap:8px;--k:${s.k}">
        <div style="display:flex;align-items:center;gap:10px">${RING.replace('ring', 'ring" style="width:42px;height:42px')}<b style="font-size:16px;color:${s.k}">${s.head}</b></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${cards(s).replaceAll('<b>', '<b style="font-size:16px">').replaceAll('<span>', '<span style="font-size:11px">')}</div></div>`],
  };
  let v = 'a', side = 'off';
  const render = () => {
    document.getElementById('ov').innerHTML = V[v][2](SIT[side]);
    document.getElementById('cap').textContent = `${V[v][0]} — ${V[v][1]}`;
    document.getElementById('bar').innerHTML = Object.entries(V).map(([k, [n]]) => `<button data-v="${k}" class="${k === v ? 'on' : ''}">${n}</button>`).join('') + '<i></i>'
      + [['off', '공격 장면'], ['def', '수비 장면']].map(([k, n]) => `<button data-s="${k}" class="${k === side ? 'on' : ''}">${n}</button>`).join('');
    location.hash = `${v}-${side}`;
  };
  document.getElementById('bar').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.v) v = b.dataset.v; if (b.dataset.s) side = b.dataset.s; render(); });
  const h = location.hash.slice(1).split('-'); if (V[h[0]]) v = h[0]; if (SIT[h[1]]) side = h[1];
  render();
</script>
</body>
</html>
