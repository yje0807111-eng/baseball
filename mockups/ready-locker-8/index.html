<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>정비 화면 · 라커 디자인 8안</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #020409; color: #e5e7eb; font-family: 'IBM Plex Sans KR', 'Pretendard', system-ui, sans-serif; }
  .d { font-family: 'Saira Condensed', sans-serif; }
  /* 목업 머리 (게임 화면 밖) */
  .top { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 16px; background: rgba(2,4,9,.96); border-bottom: 1px solid #1f2937; font-size: 13px; color: #9ca3af; }
  .top b { color: #fff; font-size: 15px; margin-right: 8px; }
  .top a { padding: 3px 10px; color: #cbd5e1; text-decoration: none; background: rgba(255,255,255,.06); }
  .top a.on { color: #05080f; background: #10b981; font-weight: 700; }
  .note { padding: 8px 16px 10px; font-size: 13px; color: #9ca3af; border-bottom: 1px solid #111827; }
  .note b { color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(2, 960px); gap: 30px 24px; justify-content: center; padding: 20px; }
  .thumb { width: 960px; }
  .thumb h3 { margin: 0 0 6px; font-size: 14px; color: #fff; }
  .thumb h3 i { font-style: normal; color: #10b981; margin-right: 6px; }
  .thumb h3 a { color: inherit; text-decoration: none; }
  .thumb p { margin: 0 0 8px; font-size: 12px; color: #9ca3af; min-height: 32px; }
  .frame-s { width: 960px; height: 455.5px; overflow: hidden; position: relative; box-shadow: 0 0 0 1px #1f2937; }
  .frame-s .screen { transform: scale(.5); transform-origin: 0 0; position: absolute; left: 0; top: 0; }

  /* ───── 게임 화면 (1920×911) ───── */
  .screen { position: relative; width: 1920px; height: 911px; overflow: hidden; background: #05080f; display: flex; flex-direction: column; }
  .bg { position: absolute; inset: 0; background: url(/ui/mt/tile-locker.webp) center/cover; opacity: .6; }
  .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,8,15,.55), rgba(5,8,15,.85)); }
  .cut { --c: 14px; clip-path: polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
  .glass { background: rgba(6,10,19,.74); backdrop-filter: blur(10px); }
  .frame { position: relative; }
  .frame::after { content:''; position:absolute; inset:0; pointer-events:none; background: linear-gradient(135deg,transparent calc(50% - 1px),var(--a,#10b981) calc(50% - 1px),var(--a,#10b981) calc(50% + 1px),transparent calc(50% + 1px)) left top/var(--c) var(--c) no-repeat, linear-gradient(135deg,transparent calc(50% - 1px),var(--a,#10b981) calc(50% - 1px),var(--a,#10b981) calc(50% + 1px),transparent calc(50% + 1px)) right bottom/var(--c) var(--c) no-repeat, linear-gradient(var(--a,#10b981),var(--a,#10b981)) left var(--c) top 0/56px 2px no-repeat, linear-gradient(var(--a,#10b981),var(--a,#10b981)) left 0 top var(--c)/2px 30px no-repeat, linear-gradient(var(--a,#10b981),var(--a,#10b981)) right var(--c) bottom 0/56px 2px no-repeat, linear-gradient(var(--a,#10b981),var(--a,#10b981)) right 0 bottom var(--c)/2px 30px no-repeat; box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a,#10b981) 32%,transparent); }
  .lab { display:inline-flex; align-items:center; gap:8px; font-family:'Saira Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:.32em; text-transform:uppercase; color:var(--a,#10b981); margin:0; }
  .lab::before { content:''; width:14px; height:10px; background:currentColor; clip-path:polygon(0 0,60% 0,100% 100%,40% 100%); }
  .btn { --c:7px; display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:32px; padding:0 12px; font-size:12.5px; font-weight:700; color:#e8ecf2; background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(255,255,255,.22); clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); white-space: nowrap; }
  .btn.pri { background:var(--a,#10b981); color:#05080f; font-weight:800; box-shadow:none; }
  .btn.xs { min-height: 22px; padding: 0 7px; font-size: 11px; --c: 4px; }
  .btn.up { background: rgba(16,185,129,.2); color: #6ee7b7; box-shadow: inset 0 0 0 1px rgba(16,185,129,.5); }
  .btn.down { background: rgba(255,255,255,.05); color: #9ca3af; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .face { display:block; flex:none; background: #0b1220 center 12%/cover no-repeat; }
  .chip { display:inline-block; padding: 0 5px; font-family:'Saira Condensed',sans-serif; font-size: 12px; font-weight: 800; line-height: 17px; color: #05080f; }
  .grp { display:flex; align-items:center; gap:10px; margin: 0 0 6px; font-family:'Saira Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:.2em; color:#9ca3af; }
  .grp b { color: #fff; font-size: 14px; letter-spacing: .04em; }
  .grp::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.08); }
  .bar { position: relative; height: 5px; background: rgba(255,255,255,.08); }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; }
  .scan { position:absolute; inset:0; pointer-events:none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }

  /* 크롬 */
  .tb { position: relative; z-index: 2; height: 64px; flex: none; display:flex; align-items:center; gap: 22px; padding: 0 24px; border-bottom: 1px solid rgba(16,185,129,.25); background: linear-gradient(180deg,rgba(5,8,15,.94),rgba(5,8,15,.6)); }
  .body { position: relative; z-index: 1; flex: 1; min-height: 0; display: grid; grid-template-columns: 272px minmax(0,1fr) 384px; gap: 16px; padding: 16px 24px 24px; }
  .nav { display:flex; flex-direction:column; gap: 8px; padding: 12px; }
  .navit { display:flex; align-items:center; gap: 10px; padding: 6px; background: rgba(255,255,255,.03); }
  .navit .th { width: 64px; height: 48px; background: center/cover; flex:none; }
  .navit.on { background: linear-gradient(90deg, rgba(16,185,129,.22), rgba(6,10,19,.4)); box-shadow: inset 3px 0 0 #10b981; }
  .sec { --c: 20px; display:flex; flex-direction:column; min-height:0; padding: 18px 20px; }
  .head { display:flex; align-items: baseline; gap: 12px; flex: none; }
  .head .sub { font-size: 13px; color: #9ca3af; }
  .side { --c: 20px; display:flex; flex-direction:column; gap: 14px; padding: 22px; }

  /* 벤치 트레이 */
  .bench { flex: none; margin-top: 14px; padding: 12px 14px 14px; background: linear-gradient(180deg, rgba(148,163,184,.08), rgba(148,163,184,.03)); box-shadow: inset 0 1px 0 rgba(148,163,184,.25); }
  .bcard { display:grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items:center; padding: 6px 10px 6px 6px; background: rgba(5,8,15,.6); box-shadow: inset 0 0 0 1px rgba(148,163,184,.18); }

  /* ───── 정비 화면 조각 ───── */
  .body { align-items: stretch; }
  .colgap { display:flex; flex-direction:column; gap:16px; min-height:0; }
  .colgap > .sec { flex:1; min-height:0; }
  .sec { gap: 0; }
  .ph { flex:none; display:flex; align-items:flex-end; gap:12px; padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid color-mix(in srgb,var(--a,#10b981) 26%,transparent); }
  .ph h3 { margin:0; font-size:21px; font-weight:900; color:#fff; }
  .ph em { display:block; font-family:'Saira Condensed',sans-serif; font-style:normal; font-size:10px; font-weight:700; letter-spacing:.3em; color:var(--a,#10b981); }
  .ph .sum { margin-left:auto; text-align:right; }
  .ph .sum small { display:block; font-size:10.5px; color:#6b7280; }
  .ph .sum b { font-family:'Saira Condensed',sans-serif; font-size:28px; font-weight:800; line-height:1; }
  .rows { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:4px; }
  .row { overflow:hidden; min-height:0; display:grid; gap:10px; align-items:center; padding:0 10px; background:linear-gradient(90deg,rgba(255,255,255,.05),transparent 70%); box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); }
  .row .no { font-size:18px; color:#6b7280; text-align:center; }
  .hand { display:grid; place-items:center; font-family:'Saira Condensed',sans-serif; font-size:12px; font-weight:800; color:#94a3b8; }
  .nm { display:block; font-size:15px; font-weight:800; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mt { display:block; font-size:10.5px; color:#6b7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tot { position:relative; display:grid; grid-template-columns:1fr auto; gap:2px; padding:8px 12px 12px; background:rgba(255,255,255,.04); font-size:12.5px; color:#9ca3af; }
  .tot .v { display:flex; align-items:baseline; gap:6px; }
  .tot .v b { font-size:24px; line-height:1; }
  .tot .dl { font-style:normal; font-family:'Saira Condensed',sans-serif; font-size:12px; color:#6b7280; }
  .tot .dl.up { color:#34d399; } .tot .dl.dn { color:#f87171; }
  .tot > i { position:absolute; left:0; bottom:0; height:3px; }
  .kv { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid rgba(255,255,255,.07); font-size:12.5px; color:#9ca3af; }
  .kv:last-child { border:0; } .kv b { color:#fff; font-size:15px; }
  .fieldbox { position:relative; flex:1; min-height:0; overflow:hidden; background:#07130c; }
  .field { position:absolute; left:50%; top:50%; aspect-ratio:1920/1433; height:116%; transform:translate(-50%,-48%); background:url(/ui/field.webp) center/cover no-repeat; }
  .field::after { content:''; position:absolute; inset:0; background:radial-gradient(76% 66% at 50% 52%,transparent,rgba(3,6,11,.62)); }
  .tok { position:absolute; z-index:2; transform:translate(-50%,-50%); display:grid; grid-template-columns:34px minmax(0,1fr); gap:7px; align-items:center; padding:4px 8px 4px 4px; background:rgba(6,10,19,.86); box-shadow:inset 0 -2px 0 var(--a,#60a5fa), inset 0 0 0 1px rgba(255,255,255,.12); }
  .tok .tl { display:flex; align-items:center; gap:5px; font-size:11px; }
  .rot { flex:1; min-height:0; display:flex; flex-direction:column; gap:5px; }
  .slot { display:flex; align-items:center; gap:10px; min-height:0; flex:1 1 0; }
  .slot > span { flex:none; width:82px; display:flex; flex-direction:column; gap:1px; font-size:12px; font-weight:700; color:#cbd5e1; }
  .slot > span em { font-family:'Saira Condensed',sans-serif; font-style:normal; font-size:9.5px; letter-spacing:.2em; color:#64748b; }
  .slot > div { flex:1; min-width:0; align-self:stretch; min-height:38px; max-height:56px; display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:8px; }
  .pc { overflow:hidden; display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:8px; align-items:center; padding:3px 8px 3px 3px; background:rgba(255,255,255,.05); box-shadow:inset 0 -2px 0 var(--a,#f87171); }
  .pcn { min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:1px; }
  .pcn .chip { line-height:15px; }
  .sec { overflow:hidden; }
  .empty { display:grid; place-items:center; font-size:20px; color:#475569; background:rgba(255,255,255,.03); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
  .syn { flex:1; min-height:0; display:flex; flex-direction:column; gap:6px; overflow-y:auto; scrollbar-width:thin; }
  .sc { flex:none; display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:9px; align-items:center; padding:6px 9px; background:linear-gradient(90deg,color-mix(in srgb,var(--s) 16%,transparent),rgba(6,10,19,.45)); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--s) 35%,transparent); }
  .sc .ic { display:grid; place-items:center; height:28px; font-size:15px; font-weight:800; color:#05080f; background:var(--s); }
  .sc b { display:block; font-size:14px; font-weight:800; color:#fff; }
  .sc .ef { display:block; font-size:12.5px; font-weight:700; color:var(--s); }
  .sc small { display:block; font-size:10.5px; color:#6b7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sc .tag { flex:none; padding:2px 7px; font-size:11.5px; font-weight:700; color:#cbd5e1; background:rgba(255,255,255,.08); }
  .tabs { flex:none; display:flex; gap:6px; margin-bottom:10px; }
  .tab { padding:5px 14px; font-size:13px; font-weight:700; color:#9ca3af; background:rgba(255,255,255,.04); }
  .tab.on { color:#05080f; background:var(--a,#10b981); }
  .strip { flex:1; min-height:0; display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); gap:7px; }
  .sc9 { overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:6px 4px; background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)); box-shadow:inset 0 -2px 0 var(--a,#60a5fa); }
  .sc9 .no { font-size:15px; color:#6b7280; }
  .sc9 .nm { font-size:13px; text-align:center; }
  .sc9 em { font-style:normal; font-size:17px; font-weight:800; }
  .bnh { flex:none; display:flex; align-items:baseline; gap:8px; margin:10px 0 6px; font-size:13px; font-weight:700; color:#cbd5e1; }
  .bnh em { font-family:'Saira Condensed',sans-serif; font-style:normal; font-size:10px; letter-spacing:.2em; color:#64748b; }
  .bnh small { margin-left:auto; font-size:10.5px; color:#6b7280; }
  .bc { display:grid; grid-template-columns:26px auto minmax(0,1fr) auto; gap:7px; align-items:center; padding:5px 8px 5px 5px; background:rgba(255,255,255,.035); }
  .bc b { font-size:13px; font-weight:700; color:#e5e7eb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bc em { font-style:normal; font-size:14px; font-weight:800; }

  .row > .face { align-self:center; max-height:calc(100% - 6px); }
</style>
</head>
<body>
<div class="top" id="top"></div>
<div id="root"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
