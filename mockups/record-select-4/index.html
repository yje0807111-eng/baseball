<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>선수 기록 선택 효과 4안</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #03060c; color: #e5e7eb; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
  .top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 10px 16px; background: rgba(3,6,12,.95); border-bottom: 1px solid #1f2937; font-size: 13px; color: #9ca3af; }
  .top b { color: #fff; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 28px 22px; max-width: 1760px; margin: 0 auto; padding: 20px; }
  .hd { margin: 0 2px 8px; }
  .hd b { font-size: 15px; color: #fff; }
  .hd b i { font-style: normal; margin-right: 6px; color: #10b981; }
  .hd p { margin: 3px 0 0; font-size: 12.5px; color: #9ca3af; }
  .crop { position: relative; width: 400px; height: 552px; overflow: hidden; background: #05080f; box-shadow: 0 0 0 1px #1f2937; }
  .crop iframe { position: absolute; left: 0; top: 0; width: 1902px; height: 901px; border: 0; visibility: hidden; }
  .crop iframe.ready { visibility: visible; }
</style>
</head>
<body>
<div class="top"><b>선수 기록 선택 효과 4안</b><span>실제 게임 화면의 MY TEAM 판을 잘라 보여 줌 · 유격수(이종범)를 골라 둔 상태 · 다른 줄을 눌러 볼 수 있음 · 투수 카드는 하늘색, 타자 카드는 초록이 효과 색</span></div>
<div class="grid" id="grid"></div>
<script>
/* 왼쪽 세로선 없이, 카드 색(--ac: 투수 하늘 · 타자 초록)을 따라가는 선택 효과 */
const VARS = [
  { id: 'S1', title: '테두리 칸', desc: '줄 전체를 카드 색 옅은 바탕 + 1px 테두리로 감쌈 — 가장 또렷하고 단정',
    css: `html body .mt-rec tr.on { background: color-mix(in srgb, var(--ac) 12%, transparent); }
      html body .mt-rec tr.on td { box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ac) 60%, transparent), inset 0 -1px 0 color-mix(in srgb, var(--ac) 60%, transparent); }
      html body .mt-rec tr.on td:first-child { box-shadow: inset 1px 0 0 color-mix(in srgb, var(--ac) 60%, transparent), inset 0 1px 0 color-mix(in srgb, var(--ac) 60%, transparent), inset 0 -1px 0 color-mix(in srgb, var(--ac) 60%, transparent); }
      html body .mt-rec tr.on td:last-child { box-shadow: inset -1px 0 0 color-mix(in srgb, var(--ac) 60%, transparent), inset 0 1px 0 color-mix(in srgb, var(--ac) 60%, transparent), inset 0 -1px 0 color-mix(in srgb, var(--ac) 60%, transparent); }
      html body .mt-rec tr.on .pos { color: #fff; }` },
  { id: 'S2', title: '흐르는 그라데이션', desc: '왼쪽에서 오른쪽으로 옅어지는 카드 색 바탕, 자리 글자는 카드 색 · 종합 숫자에 은은한 빛',
    css: `html body .mt-rec tr.on { background: linear-gradient(90deg, color-mix(in srgb, var(--ac) 30%, transparent), color-mix(in srgb, var(--ac) 4%, transparent) 90%); }
      html body .mt-rec tr.on td { box-shadow: none; }
      html body .mt-rec tr.on .pos { color: var(--ac); font-weight: 700; }
      html body .mt-rec tr.on td.ov b { text-shadow: 0 0 12px color-mix(in srgb, var(--ac) 70%, transparent); }` },
  { id: 'S3', title: '위아래 빛선', desc: '옅은 바탕에 위아래로만 카드 색 빛선, 사진에 같은 색 고리 — 표의 가로 흐름을 살림',
    css: `html body .mt-rec tr.on { background: color-mix(in srgb, var(--ac) 9%, transparent); }
      html body .mt-rec tr.on td { box-shadow: inset 0 1px 0 var(--ac), inset 0 -1px 0 var(--ac), 0 0 14px -6px var(--ac); }
      html body .mt-rec tr.on .mt-face { box-shadow: 0 0 0 2px var(--ac); }
      html body .mt-rec tr.on .who b { color: color-mix(in srgb, var(--ac) 55%, #fff); }` },
  { id: 'S4', title: '사진 고리 · 종합 알약', desc: '바탕은 아주 옅게, 대신 사진에 빛나는 고리 · 이름은 카드 색 · 종합 숫자를 카드 색 알약에 — 가장 가볍고 게임다운 강조',
    css: `html body .mt-rec tr.on { background: rgba(255,255,255,.06); }
      html body .mt-rec tr.on td { box-shadow: none; }
      html body .mt-rec tr.on .mt-face { box-shadow: 0 0 0 2px var(--ac), 0 0 10px 1px color-mix(in srgb, var(--ac) 60%, transparent); }
      html body .mt-rec tr.on .who b { color: var(--ac); }
      html body .mt-rec tr.on td.ov b { display: inline-block; min-width: 26px; padding: 2px 4px; text-align: center; border-radius: 3px; background: color-mix(in srgb, var(--ac) 22%, transparent); }` },
];

const grid = document.getElementById('grid');
grid.innerHTML = VARS.map((v) => `<section><div class="hd"><b><i>${v.id}</i>${v.title}</b><p>${v.desc}</p></div><div class="crop"><iframe src="/?demo=draft" title="${v.id}"></iframe></div></section>`).join('');

document.querySelectorAll('.crop iframe').forEach((ifr, i) => {
  ifr.addEventListener('load', () => {
    let tries = 0;
    const t = setInterval(() => {
      const doc = ifr.contentDocument;
      const panel = doc?.querySelector('.mt-panel');
      if (!panel) { if (++tries > 80) clearInterval(t); return; }
      clearInterval(t);
      const st = doc.createElement('style'); st.textContent = VARS[i].css; doc.body.appendChild(st);
      panel.querySelectorAll('.mt-tabs button')[1].click();
      setTimeout(() => {
        doc.querySelectorAll('.mt-card.bat tbody tr')[4]?.click(); // 유격수
        const r = panel.closest('.bc-grp').getBoundingClientRect();
        const crop = ifr.parentElement;
        crop.style.width = `${Math.round(r.width)}px`; crop.style.height = `${Math.round(r.height)}px`;
        ifr.style.left = `${-Math.round(r.left)}px`; ifr.style.top = `${-Math.round(r.top)}px`;
        ifr.classList.add('ready');
      }, 300);
    }, 150);
  });
});
</script>
</body>
</html>
