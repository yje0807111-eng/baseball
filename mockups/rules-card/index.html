<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>드래프트 규칙 · 큰 탭 카드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700;800&family=Saira+Condensed:wght@500;600;700;800&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #03060c; color: #e5e7eb; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .top { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: rgba(3,6,12,.95); border-bottom: 1px solid #1f2937; font-size: 13px; color: #9ca3af; }
  .top b { color: #fff; font-size: 15px; }
  .stage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 36px; padding: 24px 16px 40px; min-height: calc(100vh - 44px); background: linear-gradient(180deg, rgba(3,5,10,.7), rgba(3,5,10,.92)), url(/ui/stadium.webp) center/cover fixed; }
  .cell > b { display: block; margin: 0 2px 8px; font-size: 12px; color: #9ca3af; font-weight: 600; }
  .w-lg { width: 512px; max-width: 100%; }
  .w-sm { width: 380px; max-width: 100%; }

  /* 게임 팝업 판 */
  .modal { --c: 22px; --a: #10b981; position: relative; display: flex; flex-direction: column; height: 720px; background: rgba(8,13,24,.96); clip-path: polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); box-shadow: 0 24px 60px -12px rgba(0,0,0,.8); }
  .modal::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: linear-gradient(135deg, transparent calc(50% - 1px), var(--a) calc(50% - 1px), var(--a) calc(50% + 1px), transparent calc(50% + 1px)) left top / var(--c) var(--c) no-repeat,
      linear-gradient(135deg, transparent calc(50% - 1px), var(--a) calc(50% - 1px), var(--a) calc(50% + 1px), transparent calc(50% + 1px)) right bottom / var(--c) var(--c) no-repeat,
      linear-gradient(var(--a), var(--a)) left var(--c) top 0 / 60px 2px no-repeat, linear-gradient(var(--a), var(--a)) left 0 top var(--c) / 2px 34px no-repeat,
      linear-gradient(var(--a), var(--a)) right var(--c) bottom 0 / 60px 2px no-repeat, linear-gradient(var(--a), var(--a)) right 0 bottom var(--c) / 2px 34px no-repeat;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--a) 28%, transparent); }
  .mh { flex: none; display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 22px 12px; }
  .mh small { display: inline-flex; align-items: center; gap: 8px; font-family: 'Saira Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .32em; color: #10b981; }
  .mh small::before { content: ""; width: 14px; height: 10px; background: currentColor; clip-path: polygon(0 0,60% 0,100% 100%,40% 100%); }
  .mh h2 { margin: 4px 0 0; font-size: 22px; font-weight: 900; color: #fff; }
  .mh .x { width: 32px; height: 32px; display: grid; place-items: center; color: #9ca3af; font-size: 18px; }

  /* 큰 탭 카드 3×2 */
  .nav { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 22px; }
  .nav button { display: flex; align-items: center; gap: 8px; padding: 9px 10px; font-size: 13px; font-weight: 700; color: #cbd5e1; background: rgba(255,255,255,.04); clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); white-space: nowrap; }
  .nav button svg { color: #6b7280; }
  .nav button:hover { background: rgba(255,255,255,.07); }
  .nav button.on { color: #fff; background: linear-gradient(135deg, rgba(16,185,129,.25), rgba(16,185,129,.08)); box-shadow: inset 0 -2px 0 #10b981; }
  .nav button.on svg { color: #34d399; }
  .w-sm .nav { padding: 0 16px; gap: 5px; }
  .w-sm .nav button { gap: 6px; padding: 8px; font-size: 12px; }

  .body { flex: 1; min-height: 0; overflow-y: auto; margin-top: 12px; padding: 4px 18px 22px 22px; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(16,185,129,.45) transparent; }
  .body::-webkit-scrollbar { width: 3px; }
  .body::-webkit-scrollbar-thumb { background: rgba(16,185,129,.45); border-radius: 99px; }
  .w-sm .body { padding: 4px 14px 20px 16px; }
  .lead { margin: 0 0 14px; padding: 10px 12px; font-size: 13.5px; line-height: 1.65; color: #e5e7eb; background: rgba(16,185,129,.07); box-shadow: inset 2px 0 0 #10b981; }
  svg.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* 구역 */
  .grp + .grp { border-top: 1px solid rgba(255,255,255,.06); }
  .hd { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 11px 0; }
  .hd::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 8px; background: #374151; transform: rotate(45deg); transition: background .2s; }
  .grp.open .hd::before { background: #10b981; box-shadow: 0 0 8px #10b981; }
  .hd .tx { flex: 1; min-width: 0; }
  .hd .t { display: block; font-size: 14px; font-weight: 700; color: #fff; }
  .hd .sm { display: block; margin-top: 1px; font-size: 12.5px; color: #9ca3af; }
  .grp.open .hd .sm { color: #6ee7b7; }
  .chev { flex: none; width: 16px; height: 16px; margin-top: 3px; color: #6b7280; transition: transform .2s; }
  .grp.open .chev { transform: rotate(180deg); color: #10b981; }
  .bd { display: none; margin: 0 0 14px 3px; padding: 2px 0 2px 15px; border-left: 1px solid rgba(16,185,129,.3); font-size: 13px; line-height: 1.7; color: #d1d5db; }
  .grp.open .bd { display: block; }
  .bd p { margin: 0 0 8px; }
  .bd p:last-child { margin-bottom: 0; }
  .bd b { color: #fff; font-weight: 700; }
  .bd em { font-style: normal; color: #6ee7b7; font-weight: 600; }
  .bd .tag { display: inline-block; padding: 0 6px; font-size: 12px; font-weight: 600; color: #fcd34d; background: rgba(251,191,36,.1); box-shadow: inset 0 0 0 1px rgba(251,191,36,.3); }
  .tip { display: flex; gap: 8px; margin: 10px 0 2px; padding: 7px 10px; font-size: 12.5px; line-height: 1.6; color: #bae6fd; background: rgba(56,189,248,.07); }
  .tip::before { content: "TIP"; flex: none; font-family: 'Saira Condensed', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: .06em; color: #38bdf8; padding-top: 1px; }

  /* 자리 칩 */
  .slots { display: grid; gap: 6px; margin: 4px 0 10px; }
  .slots .row { display: grid; grid-template-columns: 58px 1fr; align-items: center; gap: 8px; }
  .slots .k { font-size: 12px; font-weight: 700; color: #9ca3af; }
  .slots .k i { font-style: normal; font-family: 'Saira Condensed', sans-serif; color: #10b981; margin-left: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { padding: 1px 8px; font-size: 12px; font-weight: 600; color: #e5e7eb; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  .chip.g { color: #bbf7d0; background: rgba(16,185,129,.12); box-shadow: inset 0 0 0 1px rgba(16,185,129,.35); }

  /* 단계 · 흐름 */
  .steps { display: grid; gap: 6px; margin: 4px 0 8px; counter-reset: s; }
  .steps div { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
  .steps div::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 22px; height: 22px; margin-top: 1px; font-family: 'Saira Condensed', sans-serif; font-size: 13px; font-weight: 800; color: #04150e; background: #10b981; clip-path: polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px); }

  /* 예/아니오 목록 */
  .yn { display: grid; gap: 4px; margin: 4px 0 8px; }
  .yn div { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
  .yn div::before { font-weight: 800; text-align: center; }
  .yn .y::before { content: "✓"; color: #34d399; }
  .yn .n::before { content: "✕"; color: #f87171; }

  /* 표 */
  .tbl { display: grid; grid-template-columns: auto auto 1fr; margin: 4px 0 8px; font-size: 12.5px; background: rgba(255,255,255,.03); }
  .tbl > span { padding: 5px 10px; border-top: 1px solid rgba(255,255,255,.05); }
  .tbl > span.h { border-top: 0; font-size: 11px; font-weight: 700; color: #6b7280; background: rgba(255,255,255,.03); }
  .tbl .n { font-family: 'Saira Condensed', sans-serif; font-size: 15px; font-weight: 700; color: #fff; text-align: right; }
  .tbl .up { color: #fca5a5; }
  .tbl .dn { color: #6ee7b7; }

  /* 감소 사다리 */
  .ladder { display: grid; gap: 5px; margin: 4px 0 8px; }
  .ladder div { display: grid; grid-template-columns: 38px 64px 1fr; align-items: center; gap: 8px; font-size: 12.5px; }
  .ladder .v { font-family: 'Saira Condensed', sans-serif; font-size: 16px; font-weight: 800; text-align: right; }
  .ladder .bar { height: 6px; background: rgba(255,255,255,.06); }
  .ladder .bar i { display: block; height: 100%; }

  /* 시너지 단계 */
  .tiers { display: flex; gap: 4px; margin: 6px 0 8px; }
  .tiers span { flex: 1; padding: 5px 4px; text-align: center; font-size: 12px; line-height: 1.35; color: #d1d5db; background: rgba(255,255,255,.04); box-shadow: inset 0 2px 0 rgba(16,185,129,.35); }
  .tiers span b { display: block; font-family: 'Saira Condensed', sans-serif; font-size: 15px; color: #fff; }
  .tiers span:nth-child(2) { box-shadow: inset 0 2px 0 rgba(16,185,129,.65); }
  .tiers span:nth-child(3) { box-shadow: inset 0 2px 0 #10b981; background: rgba(16,185,129,.08); }
  .syn { margin: 6px 0; padding: 7px 10px; background: rgba(255,255,255,.035); }
  .syn b { display: block; font-size: 13px; }
  .syn span { font-size: 12px; color: #9ca3af; }
  .syn em { float: right; font-size: 12px; }
</style>
</head>
<body>
<div class="top"><b>드래프트 규칙 · 큰 탭 카드</b><span>합니다체 · 구역 제목 아래 한 줄 답 · 왼쪽은 게임 팝업 크기, 오른쪽은 휴대폰 폭</span></div>
<div class="stage">
  <div class="cell w-lg"><b>게임 팝업 크기 (512px)</b><section class="modal" data-m></section></div>
  <div class="cell w-sm"><b>휴대폰 폭 (380px)</b><section class="modal" data-m></section></div>
</div>
<script>
const I = {
  entry: '<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="17" cy="9" r="2.3"/><path d="M15.5 14.2c2.4.2 4.2 1.8 4.8 4.8"/></svg>',
  draft: '<svg class="ic" viewBox="0 0 24 24"><rect x="4" y="5" width="7" height="10" rx="1"/><rect x="13" y="9" width="7" height="10" rx="1"/><path d="M7.5 18v2M16.5 5V3"/></svg>',
  swap: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 8h13l-3-3M19 16H6l3 3"/></svg>',
  pos: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 20 4 12l8-8 8 8z"/><circle cx="12" cy="12" r="1.6"/></svg>',
  syn: '<svg class="ic" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  season: '<svg class="ic" viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 0 1-10 0z"/><path d="M7 5H4v1.5A3 3 0 0 0 7 9.5M17 5h3v1.5a3 3 0 0 1-3 3M12 12v4M8.5 20h7"/></svg>',
};
const CHEV = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l4 4 4-4"/></svg>';
const lad = (v, w, c, txt) => `<div><span class="v" style="color:${c}">${v}</span><span class="bar"><i style="width:${w}%;background:${c}"></i></span><span>${txt}</span></div>`;

const SECTIONS = [
  { id: 'entry', label: '엔트리', lead: '선수 <b>12명</b>으로 한 팀을 만듭니다. 포지션마다 정해진 자리에 한 명씩 채웁니다.', groups: [
    { t: '어떤 자리를 채우나요?', s: '투수 3명과 야수 9명, 모두 12자리입니다.', b: `
      <div class="slots">
        <div class="row"><span class="k">투수<i>3</i></span><span class="chips"><span class="chip">선발투수</span><span class="chip">중간계투</span><span class="chip">마무리</span></span></div>
        <div class="row"><span class="k">내야<i>5</i></span><span class="chips"><span class="chip">포수</span><span class="chip">1루수</span><span class="chip">2루수</span><span class="chip">3루수</span><span class="chip">유격수</span></span></div>
        <div class="row"><span class="k">외야<i>3</i></span><span class="chips"><span class="chip">외야수</span><span class="chip">외야수</span><span class="chip">외야수</span></span></div>
        <div class="row"><span class="k">지명<i>1</i></span><span class="chips"><span class="chip g">지명타자 · 야수 누구나</span></span></div>
      </div>
      <p>자리가 모두 찬 포지션의 카드에는 <span class="tag">유격수 마감</span>처럼 표시됩니다.</p>` },
    { t: '외국인 선수는 몇 명까지 되나요?', s: '최대 3명까지 뽑을 수 있습니다.', b: `
      <p>외국인 선수가 3명이 되면 남은 외국인 카드는 <span class="tag">외국인 한도 3/3</span>으로 잠깁니다.</p>
      <p>한 명을 방출하면 다시 뽑을 수 있습니다.</p>` },
    { t: '같은 선수를 또 뽑을 수 있나요?', s: '시즌이 달라도 한 사람은 한 번만 뽑습니다.', b: `
      <div class="yn"><div class="y"><span><b>2006 류현진</b>을 영입합니다.</span></div><div class="n"><span><b>2010 류현진</b>은 <span class="tag">동일인 영입됨</span>으로 잠깁니다.</span></div></div>` },
  ] },
  { id: 'draft', label: '드래프트', lead: '<b>12라운드</b> 동안 라운드마다 한 명씩 영입합니다. 정해진 CP 안에서 스타와 가성비 선수를 섞는 것이 핵심입니다.', groups: [
    { t: '한 라운드는 어떻게 진행되나요?', s: '시리즈를 보고, 고르고, 영입합니다.', b: `
      <div class="steps">
        <div><span>시리즈 하나가 열립니다. 구단의 한 시즌, 국가대표, 레전드 중 하나입니다.</span></div>
        <div><span>선수 카드를 누르면 <b>PICK</b>에 올라 능력치와 영입가를 볼 수 있습니다.</span></div>
        <div><span><b>영입</b>을 누르면 내 라인업에 들어가고 다음 라운드로 넘어갑니다.</span></div>
      </div>
      <div class="tip">마음에 드는 선수가 없으면 <b>새로고침</b>으로 다른 시리즈를 엽니다. 드래프트마다 3번 쓸 수 있습니다.</div>` },
    { t: 'CP는 얼마나 쓸 수 있나요?', s: '모드 화면에서 정한 샐러리 캡만큼 씁니다.', b: `
      <p>샐러리 캡은 <span class="chip">700</span> <span class="chip g">800</span> <span class="chip">900</span> CP 중에서 고릅니다.</p>
      <p>영입할 때마다 영입가만큼 줄어들고, 남은 CP보다 비싼 선수는 <span class="tag">CP 부족</span>으로 잠깁니다.</p>
      <div class="tip">PICK에 선수를 올리면 위쪽 캡 막대에 쓰일 CP가 미리 표시됩니다.</div>` },
    { t: '영입가는 어떻게 정해지나요?', s: '종합이 높을수록 점수보다 더 비싸집니다.', b: `
      <div class="tbl">
        <span class="h">종합</span><span class="h">영입가</span><span class="h">차이</span>
        <span class="n">95</span><span class="n">104</span><span class="up">9 CP 더 비쌉니다</span>
        <span class="n">90</span><span class="n">95</span><span class="up">5 CP 더 비쌉니다</span>
        <span class="n">80</span><span class="n">80</span><span>점수와 같습니다</span>
        <span class="n">65</span><span class="n">62</span><span class="dn">3 CP 더 쌉니다</span>
      </div>
      <p><b>72~84</b>는 종합과 같은 값이고, <b>85 이상</b>은 비싸지며 <b>71 이하</b>는 쌉니다.</p>` },
    { t: '다 채우지 못하면 어떻게 되나요?', s: '빈 자리는 퓨처스 유망주(종합 55)가 채웁니다.', b: `
      <p>드래프트는 <b>12라운드가 끝나거나</b>, <b>남은 CP로 뽑을 선수가 없으면</b> 끝납니다.</p>
      <p>이때 비어 있는 자리는 모두 종합 55의 퓨처스 유망주로 채워집니다.</p>
      <div class="tip">초반에 CP를 너무 많이 쓰면 마지막 자리를 유망주로 채우게 됩니다.</div>` },
  ] },
  { id: 'swap', label: '방출 · 교체', lead: '뽑은 선수를 내보내거나, 이미 찬 자리에 더 좋은 선수를 바로 들일 수 있습니다. 대신 <b>손해</b>가 있습니다.', groups: [
    { t: '방출은 어떻게 하나요?', s: '내 라인업에서 선수를 누르고 방출을 두 번 누릅니다.', b: `
      <div class="steps">
        <div><span>내 라인업에서 내보낼 선수를 누릅니다.</span></div>
        <div><span><b>방출</b>을 누르면 <b>한 번 더 누르면 방출</b>로 바뀝니다.</span></div>
        <div><span>한 번 더 누르면 방출됩니다.</span></div>
      </div>` },
    { t: '방출하면 무엇이 달라지나요?', s: '영입가의 절반을 돌려받지만 되돌릴 수 없습니다.', b: `
      <div class="yn">
        <div class="y"><span>영입가의 <b>절반</b>을 CP로 돌려받습니다. (95 CP 선수 → 47 CP)</span></div>
        <div class="n"><span>방출한 선수는 이번 드래프트에서 <b>다시 영입할 수 없습니다.</b></span></div>
        <div class="n"><span>이미 쓴 라운드는 <b>돌아오지 않습니다.</b></span></div>
        <div class="n"><span>드래프트가 끝난 뒤(정비 화면)에는 방출할 수 없습니다.</span></div>
      </div>` },
    { t: '찬 자리에 선수를 데려오려면?', s: '교체 영입으로 한 번에 맞바꿉니다.', b: `
      <p>이미 찬 포지션의 선수를 PICK에 올리면 버튼이 <span class="tag">교체 영입 (+47 CP 환불)</span>으로 바뀝니다.</p>

function render(m, cur) {
  const sec = SECTIONS.find((s) => s.id === cur);
  m.innerHTML = `<header class="mh"><div><small>HOW TO DRAFT</small><h2>드래프트 규칙</h2></div><span class="x">✕</span></header>
    <nav class="nav">${SECTIONS.map((s) => `<button class="${s.id === cur ? 'on' : ''}" data-s="${s.id}">${I[s.id]}${s.label}</button>`).join('')}</nav>
    <div class="body"><p class="lead">${sec.lead}</p>${sec.groups.map((g, i) => `
      <div class="grp ${i === 0 ? 'open' : ''}"><button class="hd"><span class="tx"><span class="t">${g.t}</span><span class="sm">${g.s}</span></span>${CHEV}</button><div class="bd">${g.b}</div></div>`).join('')}</div>`;
}
document.querySelectorAll('[data-m]').forEach((m) => {
  render(m, 'entry');
  m.addEventListener('click', (e) => {
    const tab = e.target.closest('[data-s]');
    if (tab) return render(m, tab.dataset.s);
    const hd = e.target.closest('.hd');
    if (hd) hd.parentElement.classList.toggle('open');
  });
});
