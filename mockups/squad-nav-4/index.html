<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>내 라커 · 왼쪽 SQUAD 텍스트 4안</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #020409; color: #e5e7eb; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
  .d { font-family: 'Saira Condensed', sans-serif; }
  .top { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 16px; background: rgba(2,4,9,.96); border-bottom: 1px solid #1f2937; font-size: 13px; color: #9ca3af; }
  .top b { color: #fff; font-size: 15px; margin-right: 8px; }
  .top a { padding: 3px 10px; color: #cbd5e1; text-decoration: none; background: rgba(255,255,255,.06); }
  .top a.on { color: #05080f; background: #10b981; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(4, 272px); gap: 26px 40px; justify-content: center; padding: 18px; }
  .hd { margin: 0 0 8px; min-height: 58px; }
  .hd b { font-size: 14px; color: #fff; } .hd b i { font-style: normal; color: #10b981; margin-right: 6px; }
  .hd p { margin: 3px 0 0; font-size: 12px; line-height: 1.45; color: #9ca3af; }
  .hd .m { font-size: 11px; color: #34d399; }
  .hd .m.bad { color: #f87171; }
  /* 실제 화면 왼쪽 판: 272 × 807 */
  .stage { position: relative; width: 272px; height: 807px; background: url(/ui/mt/tile-locker.webp) center/cover; }
  .stage::before { content: ''; position: absolute; inset: 0; background: rgba(5,8,15,.75); }
  .cut { --c: 14px; clip-path: polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
  .frame { position: relative; }
  .frame::after { content:''; position:absolute; inset:0; pointer-events:none; background: linear-gradient(135deg,transparent calc(50% - 1px),#10b981 calc(50% - 1px),#10b981 calc(50% + 1px),transparent calc(50% + 1px)) left top/var(--c) var(--c) no-repeat, linear-gradient(135deg,transparent calc(50% - 1px),#10b981 calc(50% - 1px),#10b981 calc(50% + 1px),transparent calc(50% + 1px)) right bottom/var(--c) var(--c) no-repeat, linear-gradient(#10b981,#10b981) left var(--c) top 0/56px 2px no-repeat, linear-gradient(#10b981,#10b981) left 0 top var(--c)/2px 30px no-repeat, linear-gradient(#10b981,#10b981) right var(--c) bottom 0/56px 2px no-repeat, linear-gradient(#10b981,#10b981) right 0 bottom var(--c)/2px 30px no-repeat; box-shadow:inset 0 0 0 1px color-mix(in srgb,#10b981 32%,transparent); }
  .nav { position: absolute; inset: 0; --c: 20px; display: flex; flex-direction: column; gap: 8px; padding: 12px; background: rgba(6,10,19,.74); }
  .lab { display:inline-flex; align-items:center; gap:8px; font-family:'Saira Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:.32em; text-transform:uppercase; color:#10b981; margin:0; }
  .lab::before { content:''; width:14px; height:10px; background:currentColor; clip-path:polygon(0 0,60% 0,100% 100%,40% 100%); }
  .item { --c: 10px; flex: none; display: flex; height: 70px; align-items: center; gap: 12px; padding: 0 14px; background: rgba(255,255,255,.03); }
  .item .th { width: 44px; height: 51px; flex: none; background: center/cover; filter: saturate(.7) brightness(.75); clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
  .item.on { background: linear-gradient(90deg, rgba(16,185,129,.24), rgba(6,10,19,.92)); box-shadow: inset 3px 0 0 #10b981; }
  .item.on .th { filter: none; }
  .item.sm { height: 52px; } .item.sm .th { width: 36px; height: 38px; }
  .squad { margin-top: auto; min-height: 0; }
</style>
</head>
<body>
<div class="top" id="top"></div>
<div id="root"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
