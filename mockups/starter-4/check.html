<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>선발 맞대결 — 얼굴 크기</title>
<style>
  body{margin:0;background:#05080f;color:#e6edf6;font-family:sans-serif;padding:16px}
  h2{font-size:13px;margin:0 0 7px;color:#7c8798;font-weight:600}
  .panel{position:relative;width:740px;height:200px;overflow:hidden;background:#0b1220;margin-bottom:16px;
    clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
  .half{position:absolute;top:0;bottom:0;overflow:hidden}
  .bg{position:absolute;inset:0;background-repeat:no-repeat}
  .shade{position:absolute;inset:0}
  .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;font-size:44px;font-style:italic;font-weight:900;color:#fff;text-shadow:0 0 26px rgba(255,255,255,.55)}
  .who{position:absolute;bottom:12px;z-index:4}
  .who b{font-size:25px;font-weight:900;display:block}
  .who small{font-size:11px;color:#94a3b8}
</style></head><body>
<div id="out"></div>
<script>
const H = 200, G = H / 2;
const MEN = [
  { id: '2002-doosan_레스', name: '레스', c: '#10b981', l: 'MY STARTER', s: '2002 두산 · 구위 104' },
  { id: '2002-doosan_김동주', name: '김동주', c: '#f87171', l: 'AI STARTER', s: '2002 두산 · 구위 99' },
];
const url = (id) => `../../public/profiles/${encodeURIComponent(id)}.webp`;
/** size · pos(안쪽/바깥쪽) 를 바꿔 가며 한 판씩 */
const panel = (size, posL, posR) => MEN.map((m, i) => {
  const cut = i ? `polygon(${H}px 0,100% 0,100% 100%,0 100%)` : `polygon(0 0,100% 0,calc(100% - ${H}px) 100%,0 100%)`;
  return `<span class="half" style="width:calc(50% + ${G}px);${i ? 'right:0' : 'left:0'};clip-path:${cut}">
    <i class="bg" style="background-image:url('${url(m.id)}');background-size:${size};background-position:${i ? posR : posL}"></i>
    <i class="shade" style="background:linear-gradient(${i ? 270 : 90}deg,${m.c}2e,rgba(5,8,15,.16) 50%,rgba(5,8,15,.9))"></i>
  </span>`; }).join('')
  + MEN.map((m, i) => `<span class="who" style="${i ? 'right:16px;text-align:right' : 'left:16px'}">
      <span style="font-size:11px;letter-spacing:.2em;color:${m.c}">${m.l}</span>
      <b>${m.name}</b><small>${m.s}</small></span>`).join('')
  + '<span class="vs">VS</span>';

const CASES = [
  ['지금 — cover · 22% (얼굴이 크다)', 'cover', '50% 22%', '50% 22%'],
  ['높이 150% · 안쪽으로', 'auto 150%', '62% 8%', '38% 8%'],
  ['높이 130% · 안쪽으로', 'auto 130%', '60% 10%', '40% 10%'],
  ['높이 115% · 안쪽으로 (가장 작다)', 'auto 115%', '58% 12%', '42% 12%'],
];
document.getElementById('out').innerHTML = CASES.map(([t, ...a]) =>
  `<h2>${t}</h2><div class="panel">${panel(...a)}</div>`).join('');
</script></body></html>
