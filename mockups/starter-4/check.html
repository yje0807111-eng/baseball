<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>카드 아트 — 카드 높이별 얼굴 자리</title>
<style>
  body{margin:0;background:#05080f;color:#e6edf6;font-family:sans-serif;padding:14px}
  h2{font-size:13px;margin:14px 0 6px;color:#7c8798;font-weight:600}
  .row{display:flex;gap:6px;flex-wrap:wrap;width:1130px}
  .card{position:relative;width:367px;overflow:hidden;background:#0b1220;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
  .l{position:absolute;inset:0;background-size:cover;background-position:50% 0%;background-repeat:no-repeat}
  .nm{position:absolute;left:10px;bottom:7px;z-index:3;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 4px #000}
  .mid{position:absolute;left:0;right:0;top:36%;height:1px;background:rgba(255,80,80,.65);z-index:4}
</style></head><body>
<p style="font-size:12px;color:#7c8798;margin:0">붉은 선 = 얼굴이 모이길 바라는 높이 · 카드 폭 367 고정 · 카드 아트 600×900 을 cover 로 위 기준</p>
<div id="out"></div>
<script>
const CARDS = ['2002-doosan_레스', '2002-doosan_김동주', '2010-guangzhou_최정', '2024-samsung_강민호', '2004-hanwha_문동환', '2015-doosan_최주환'];
const out = [];
for (const h of [200, 240, 260, 280]) {
  const cards = CARDS.map((id) => {
    const src = '../../public/cards/' + encodeURIComponent(id) + '.webp';
    return '<div class="card" style="height:' + h + 'px">'
      + '<i class="l" style="background-image:url(&quot;' + src + '&quot;)"></i>'
      + '<i class="mid"></i><b class="nm">' + id.split('_')[1] + '</b></div>';
  }).join('');
  out.push('<h2>카드 높이 ' + h + ' — 원본의 상단 ' + Math.round((h / (367 / 600 * 900)) * 100) + '% 가 보인다</h2><div class="row">' + cards + '</div>');
}
document.getElementById('out').innerHTML = out.join('');
</script></body></html>
