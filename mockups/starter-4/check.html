<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>선발 맞대결 — 반반 카드</title>
<style>
  body{margin:0;background:#05080f;color:#e6edf6;font-family:sans-serif;padding:16px}
  h2{font-size:13px;margin:0 0 7px;color:#7c8798;font-weight:600}
  .duel{position:relative;display:flex;gap:6px;width:740px;height:200px;margin-bottom:16px}
  .card{position:relative;flex:1;min-width:0;overflow:hidden;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
  .l{position:absolute;inset:0}
  .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;font-size:44px;font-style:italic;font-weight:900;color:#fff;text-shadow:0 0 26px rgba(255,255,255,.55)}
  .ovr{position:absolute;top:8px;font-size:30px;font-weight:800;line-height:1}
  .who{position:absolute;bottom:12px;z-index:4}
  .who b{font-size:25px;font-weight:900;display:block;color:#fff}
  .who small{font-size:11px;color:#94a3b8;display:block}
  .who em{font-size:11px;letter-spacing:.2em;font-style:normal}
  .k{font-size:11px;color:#94a3b8;margin-top:2px;display:flex;gap:10px}
</style></head><body>
<div id="out"></div>
<script>
const MEN = [
  { id: '2002-doosan_레스', name: '레스', c: '#10b981', l: 'MY STARTER', y: '2002 두산', ovr: 104, k: [['구위',108],['제구',101],['체력',101]] },
  { id: '2002-doosan_김동주', name: '김동주', c: '#f87171', l: 'AI STARTER', y: '2002 두산', ovr: 99, k: [['구위',105],['제구',99],['체력',105]] },
];
const url = (id) => `../../public/profiles/${encodeURIComponent(id)}.webp`;
const card = (m, right, tint) => `<div class="card" style="background:${tint.base(m.c)};box-shadow:inset 0 0 0 1px ${m.c}55, inset 0 -3px 0 ${m.c}">
  <i class="l" style="background:${tint.glow(m.c)}"></i>
  <i class="l" style="background-image:url('${url(m.id)}');background-size:auto 130%;background-position:50% 10%;background-repeat:no-repeat"></i>
  <i class="l" style="background:linear-gradient(90deg,rgba(5,8,15,.97) 4%,rgba(5,8,15,.05) 38%,rgba(5,8,15,.05) 62%,rgba(5,8,15,.97) 96%)"></i>
  <i class="l" style="background:${tint.foot(m.c)}"></i>
  <b class="ovr" style="${right ? 'right' : 'left'}:14px;color:${m.c};text-shadow:0 0 18px ${m.c}88">${m.ovr}</b>
  <span class="who" style="${right ? 'right:16px;text-align:right' : 'left:16px'}">
    <em style="color:${m.c}">${m.l}</em><b>${m.name}</b><small>${m.y}</small>
    <span class="k" style="${right ? 'justify-content:flex-end' : ''}">${m.k.map(([k, v]) => `<span>${k} <b style="font-size:12.5px;display:inline;color:#e6edf6">${v}</b></span>`).join('')}</span>
  </span></div>`;
const CASES = [
  ['지금 적용한 것 — 위에서 팀 색이 깔리고 인물 뒤에서 번진다', {
    base: (c) => `linear-gradient(180deg,${c}2a,rgba(7,11,20,.97) 64%)`,
    glow: (c) => `radial-gradient(54% 48% at 50% 32%,${c}4d,transparent 72%)`,
    foot: (c) => `linear-gradient(0deg,rgba(5,8,15,.94),${c}14 54%,transparent)` }],
  ['더 진하게 — 카드가 팀 색으로 물든다', {
    base: (c) => `linear-gradient(180deg,${c}4d,rgba(7,11,20,.94) 70%)`,
    glow: (c) => `radial-gradient(60% 55% at 50% 30%,${c}66,transparent 74%)`,
    foot: (c) => `linear-gradient(0deg,rgba(5,8,15,.92),${c}26 56%,transparent)` }],
  ['옅게 — 바탕만 살짝', {
    base: (c) => `linear-gradient(180deg,${c}18,rgba(7,11,20,.98) 58%)`,
    glow: (c) => `radial-gradient(48% 44% at 50% 34%,${c}33,transparent 70%)`,
    foot: () => 'linear-gradient(0deg,rgba(5,8,15,.95),rgba(5,8,15,.1) 52%,transparent)' }],
];
document.getElementById('out').innerHTML = CASES.map(([t, tint]) =>
  `<h2>${t}</h2><div class="duel">${card(MEN[0], false, tint)}${card(MEN[1], true, tint)}<span class="vs">VS</span></div>`).join('');
</script></body></html>
