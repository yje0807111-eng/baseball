<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시너지 도크 32안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #03060c; color: #e5e7eb; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
  .top { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 16px; background: rgba(3,6,12,.95); border-bottom: 1px solid #1f2937; font-size: 13px; color: #9ca3af; }
  .top b { color: #fff; font-size: 15px; }
  .top .opt a { padding: 2px 8px; margin-left: 2px; color: #cbd5e1; text-decoration: none; background: rgba(255,255,255,.06); }
  .top .opt a.on { color: #05080f; background: #10b981; }
  .top nav { display: flex; flex-wrap: wrap; gap: 3px; }
  .top nav a { padding: 1px 6px; font-family: 'Saira Condensed', sans-serif; font-size: 12px; font-weight: 700; color: #cbd5e1; text-decoration: none; background: rgba(255,255,255,.05); }
  .grpt { grid-column: 1 / -1; margin: 10px 2px -6px; font-family: 'Saira Condensed', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .2em; color: #10b981; }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cw), 1fr)); gap: 26px 18px; max-width: 1860px; margin: 0 auto; padding: 18px; }
  .item .hd { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 6px; }
  .item .hd b { font-size: 14px; color: #fff; }
  .item .hd b i { font-style: normal; margin-right: 5px; font-family: 'Saira Condensed', sans-serif; color: #10b981; }
  .item .hd a { margin-left: auto; font-size: 11.5px; color: #6ee7b7; white-space: nowrap; }
  .item p { margin: 0 2px 8px; font-size: 12px; color: #9ca3af; min-height: 32px; }
  .cell { position: relative; overflow: hidden; background: #05080f; box-shadow: 0 0 0 1px #1f2937; }
  .cell > img { position: absolute; max-width: none; pointer-events: none; }
  .cell > .dockbox { position: absolute; top: 0; bottom: 0; right: 0; display: flex; flex-direction: column; padding: 12px 16px 10px 22px; background: linear-gradient(90deg, rgba(5,8,15,0), rgba(5,8,15,.5) 16%, rgba(5,8,15,.7)); }
  body.one { overflow: hidden; }
  body.one iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; }
  body.one .badge { position: fixed; right: 10px; bottom: 10px; z-index: 5; padding: 4px 10px; font-size: 12px; color: #fff; background: rgba(5,8,15,.85); box-shadow: inset 0 0 0 1px #10b981; }
  .srcframe { position: fixed; left: -4000px; top: 0; width: 1902px; border: 0; visibility: hidden; }
  @keyframes prism { to { background-position: 200% 50%; } }
</style>
</head>
<body>
<script type="module">
/* 시너지 도크 전면 새 디자인 32안. 선수 구역을 0.9배로 줄이고 그만큼 시너지 도크를 왼쪽으로 넓힘.
   목록 화면: 숨긴 게임 화면(/?demo=draft)에서 라인업을 읽어 도크 32개를 실제 크기로 그림(구장 사진 오른쪽 끝을 뒤에 깔고).
   ?v=N: 실제 게임 화면의 도크를 그 안으로 바꿔 끼움 — 줄을 누르면 게임의 시너지 강조, 전체 보기는 게임 팝업. 판 안 설명 문구 없음. */
const { ALL_PLAYERS, checkSynergies, playAt, freeSlot } = await import('/src/KboAugmentDraft.jsx');
const QS = new URLSearchParams(location.search);
const H = +(QS.get('h') || 1000);
const CAND = QS.get('cand') || '';
const F = 0.9; // 선수 구역 배율
const TS = 0.8, HALF = 107 * TS, WA = { l: -201.6, t: 7.35, w: 1303.5, h: 553 };
const HIDDEN = new Set(['franchise']);

/* ───────── 데이터 ───────── */
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const findPlayer = (name, hint) => { const c = ALL_PLAYERS.filter((p) => p.name === name); return c.find((p) => hint.includes(String(p.year))) || c[0]; };
function readGame(doc) {
  const toks = [...doc.querySelectorAll('.lf-field .lf-tok')];
  if (!toks.length) return null;
  const roster = [], face = {};
  let cand = null;
  toks.forEach((t) => {
    if (t.classList.contains('empty') && !t.classList.contains('ghost')) return;
    const ins = t.querySelectorAll('.lf-in'); const inner = ins[ins.length - 1] || t;
    const name = inner.querySelector('.lf-bx b')?.textContent, sub = inner.querySelector('.lf-bx small')?.textContent || '';
    if (!name || name === '빈 자리') return;
    const p = findPlayer(name, sub + (doc.querySelector('.pk-stage')?.innerText || ''));
    if (!p) return;
    face[p.name] = (inner.querySelector('.lf-bp')?.getAttribute('style') || '').replace(/"/g, "'").replace(/url\(('?)(?!\/|https?:|data:)/g, 'url($1/');
    if (t.classList.contains('ghost')) cand = { ...p, slot: t.dataset.slot }; else roster.push({ ...p, slot: t.dataset.slot });
  });
  return { roster, face, cand };
}
const leftOf = (s) => (s.level < s.tiers.length ? Math.max(0, s.need - s.count) : 0);
const fillOf = (s) => (s.level < s.tiers.length ? s.count / s.need : 1);
const BONUS = { bat: '타격', pit: '투구', power: '파워', contact: '컨택', speed: '주루', defense: '수비', stability: '안정' };
function model(g) {
  const on = g.roster.map(playAt);
  let cand = g.cand;
  if (!cand && CAND) { const p = ALL_PLAYERS.find((x) => x.name === CAND && x.year === 2008) || ALL_PLAYERS.find((x) => x.name === CAND); if (p) cand = { ...p, slot: freeSlot(on, p.position)?.id }; }
  const all = checkSynergies(on).filter((s) => !HIDDEN.has(s.id));
  const after = cand ? new Map(checkSynergies([...on, playAt(cand)]).map((s) => [s.id, s])) : null;
  const grows = (s) => { const a = after?.get(s.id); return !!a && (a.cur > s.cur || a.members.length > s.members.length); };
  const list = [...all].filter((s) => s.cur > 0 || grows(s))
    .sort((a, b) => b.active - a.active || leftOf(a) - leftOf(b) || fillOf(b) - fillOf(a) || b.level - a.level)
    .map((s) => {
      const stage = Math.min(s.level, s.tiers.length - 1);
      const from = stage > 0 ? s.tiers[stage - 1].need : 0, to = s.tiers[stage].need;
      const maxed = s.level === s.tiers.length;
      const a = after?.get(s.id);
      const gr = grows(s);
      const mine = s.members.map((m) => m.name);
      const miss = s.names ? s.names.filter((n) => !mine.includes(n) && !(gr && n === cand?.name)) : [];
      return { id: s.id, name: s.name, kind: s.kind, level: s.level, tiers: s.tiers, cur: s.cur, from, to, maxed, active: s.active, next: gr ? Math.min(a.cur, to) : s.cur,
        grows: gr, mine, cand: gr ? cand.name : null, miss, cond: s.cond, effect: s.active ? s.effect : null, nextEffect: s.tiers[s.level]?.effect || null, top: s.top,
        left: maxed ? 0 : to - s.cur, bonusKeys: Object.keys(s.tiers[0].bonus || {}) };
    });
  const sum = {};
  all.filter((s) => s.active).forEach((s) => Object.entries(s.bonus).forEach(([k, v]) => { sum[k] = (sum[k] || 0) + v; }));
  return { list, on: list.filter((i) => i.active).length, sum, face: g.face, roster: g.roster, cand };
}

/* ───────── 공통 조각 ───────── */
const lv = (i) => (i.level ? `<em class="lv">${i.tiers.length > 1 ? `${i.level}단계` : 'ON'}</em>` : '');
const segs = (i) => Array.from({ length: i.to - i.from }, (_, k) => (k < i.cur - i.from ? (i.maxed ? 'm' : 'f') : k < i.next - i.from ? 'p' : ''));
const pips = (i, cls = 'pips') => `<span class="${cls}">${segs(i).map((c) => `<i class="${c}"></i>`).join('')}</span>`;
const cnt = (i) => `<span class="cnt">${i.cur}<small>/${i.to}</small>${i.grows && i.next > i.cur ? `<u>+${i.next - i.cur}</u>` : ''}</span>`;
const mem = (i, max = 9) => [...i.mine.map((n) => `<span class="mm">${esc(n)}</span>`), ...(i.cand ? [`<span class="mc">${esc(i.cand)}</span>`] : []), ...i.miss.slice(0, Math.max(0, max - i.mine.length - (i.cand ? 1 : 0))).map((n) => `<span class="mx">${esc(n)}</span>`)].join('');
const memOr = (i, max) => (i.mine.length || i.cand || i.miss.length ? mem(i, max) : `<span class="mx">${esc(i.cond)}</span>`);
const eff = (i) => (i.effect ? `<span class="ef on">${esc(i.effect)}</span>` : i.nextEffect ? `<span class="ef">${esc(i.nextEffect)}</span>` : '');
const pct = (i) => (i.to - i.from ? (i.cur - i.from) / (i.to - i.from) : 1);
const pctN = (i) => (i.to - i.from ? (i.next - i.from) / (i.to - i.from) : 1);
const ring = (i, size = 38) => `<span class="ring ${i.active ? 'on' : ''}" style="--p:${pct(i) * 100};--q:${pctN(i) * 100};--sz:${size}px"><b>${i.cur}<small>/${i.to}</small></b></span>`;
const face = (d, n, cls = '') => `<i class="fc ${cls}" style="${d.face[n] || ''}" title="${esc(n)}"></i>`;
const head = (d, extra = '') => `<div class="sh"><b>시너지</b><span class="onc">${d.on} On</span>${extra}<button type="button" data-all>전체 보기</button></div>`;
const rowAttrs = (i, st) => `data-syn="${esc(i.name)}" class="${i.active ? 'on' : ''} ${st.focus === i.name ? 'fo' : ''} ${i.grows ? 'gr' : ''}"`;
const scroll = (html) => `<div class="sc">${html}</div>`;
const HEX = 'polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)';

const V = [
  { g: 'A · 목록형' },
  { t: '슬림 목록', d: '이름 · 단계 · 칸, 아랫줄 선수 — 구분선만 두고 여백으로 나눔', r: (d, st) => head(d) + scroll(d.list.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="l1"><b>${esc(i.name)}</b>${lv(i)}${pips(i)}</span><span class="l2">${memOr(i, 5)}</span></button>`).join('')) },
  { t: '두 줄 카드', d: '줄마다 어두운 카드, 오른쪽 위 효과 칩(켜지면 초록), 아래 칸 · 인원 · 선수', r: (d, st) => head(d) + scroll(d.list.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="l1"><b>${esc(i.name)}</b>${eff(i)}</span><span class="l2">${pips(i)}${cnt(i)}<span class="ms">${memOr(i, 3)}</span></span></button>`).join('')) },
  { t: '진행 막대 · 단계 눈금', d: '최종 단계까지 한 줄 막대에 단계마다 눈금, 채운 만큼 초록 · 후보가 채울 만큼 하늘', r: (d, st) => head(d) + scroll(d.list.map((i) => { const top = i.tiers[i.tiers.length - 1].need;
    return `<button type="button" ${rowAttrs(i, st)}><span class="l1"><b>${esc(i.name)}</b>${cnt(i)}</span><span class="bar"><i class="f" style="width:${(i.cur / top) * 100}%"></i><i class="p" style="left:${(i.cur / top) * 100}%;width:${((Math.max(i.next, i.cur) - i.cur) / top) * 100}%"></i>${i.tiers.map((t) => `<s style="left:${(t.need / top) * 100}%" class="${i.cur >= t.need ? 'ok' : ''}"></s>`).join('')}</span><span class="l2">${eff(i)}<span class="ms">${memOr(i, 3)}</span></span></button>`; }).join('')) },
  { t: '단계 사다리', d: '단계마다 “3 능력치 +1” 칩이 차례로 켜짐, 다음 단계는 하늘 테두리', r: (d, st) => head(d) + scroll(d.list.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="l1"><b>${esc(i.name)}</b>${cnt(i)}</span><span class="lad">${i.tiers.map((t, k) => `<span class="${k < i.level ? 'ok' : k === i.level ? 'nx' : ''}"><i>${t.need}</i>${esc(t.effect)}</span>`).join('')}</span><span class="l2">${memOr(i, 5)}</span></button>`).join('')) },
  { t: '원형 게이지', d: '왼쪽 링에 채운 칸(초록) · 후보 몫(하늘), 오른쪽 이름 · 효과 · 선수', r: (d, st) => head(d) + scroll(d.list.map((i) => `<button type="button" ${rowAttrs(i, st)}>${ring(i)}<span class="tx"><span class="l1"><b>${esc(i.name)}</b>${lv(i)}</span>${eff(i)}<span class="l2">${memOr(i, 4)}</span></span></button>`).join('')) },
  { t: '큰 숫자', d: '왼쪽에 “2/3” 큰 숫자(완성은 초록), 오른쪽 이름 · 효과 · 선수', r: (d, st) => head(d) + scroll(d.list.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="big">${i.cur}<small>/${i.to}</small>${i.grows && i.next > i.cur ? `<u>+${i.next - i.cur}</u>` : ''}</span><span class="tx"><b>${esc(i.name)}</b>${eff(i)}<span class="l2">${memOr(i, 4)}</span></span></button>`).join('')) },
  { t: '사선 띠', d: '구장 토큰과 같은 사선 띠, 켜진 시너지는 초록 그라데이션 띠', r: (d, st) => head(d) + scroll(d.list.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="in"><span class="l1"><b>${esc(i.name)}</b>${pips(i)}</span><span class="l2">${i.effect ? esc(i.effect) : memOr(i, 3)}</span></span></button>`).join('')) },
  { t: '타임라인', d: '왼쪽 세로 선에 점(켜짐 초록 · 진행 빈 원), 오른쪽 이름 · 칸 · 선수', r: (d, st) => head(d) + scroll(d.list.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="dot"></span><span class="tx"><span class="l1"><b>${esc(i.name)}</b>${pips(i)}</span><span class="l2">${i.effect ? `<span class="ef on">${esc(i.effect)}</span> ` : ''}${memOr(i, 4)}</span></span></button>`).join('')) },
  { g: 'B · 묶음형' },
  { t: '적용 · 진행 두 묶음', d: '위 “적용 중”, 아래 “진행 중” 두 묶음으로 나누고 묶음 머리에 개수', r: (d, st) => { const sec = (k, arr) => (arr.length ? `<div class="gt">${k}<span>${arr.length}</span></div>${arr.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="l1"><b>${esc(i.name)}</b>${i.active ? `<span class="ef on">${esc(i.effect)}</span>` : pips(i)}</span><span class="l2">${memOr(i, 4)}</span></button>`).join('')}` : '');
    return head(d) + scroll(sec('적용 중', d.list.filter((i) => i.active)) + sec('진행 중', d.list.filter((i) => !i.active))); } },
  { t: '실화 조합 · 팀 구성', d: '실제 함께 뛴 조합과 팀 구성 조건을 두 묶음으로', r: (d, st) => { const sec = (k, arr) => (arr.length ? `<div class="gt">${k}<span>${arr.length}</span></div>${arr.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="l1"><b>${esc(i.name)}</b>${lv(i)}${pips(i)}</span><span class="l2">${memOr(i, 4)}</span></button>`).join('')}` : '');
    return head(d) + scroll(sec('실화 조합', d.list.filter((i) => i.kind === 'story')) + sec('팀 구성', d.list.filter((i) => i.kind !== 'story'))); } },
  { t: '탭 [적용 · 진행]', d: '머리 아래 두 칸 탭, 누르면 목록이 바뀜', r: (d, st) => { const tab = st.tab || 'on'; const arr = d.list.filter((i) => (tab === 'on' ? i.active : !i.active));
    return head(d) + `<div class="tabs"><button type="button" data-tab="on" class="${tab === 'on' ? 'on' : ''}">적용 ${d.on}</button><button type="button" data-tab="go" class="${tab === 'go' ? 'on' : ''}">진행 ${d.list.length - d.on}</button></div>` + scroll(arr.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="l1"><b>${esc(i.name)}</b>${cnt(i)}</span>${pips(i, 'pips wide')}<span class="l2">${eff(i)} ${memOr(i, 3)}</span></button>`).join('') || '<div class="none">-</div>'); } },
  { t: '받는 쪽으로 묶기', d: '타자가 강해지는 · 투수가 강해지는 · 둘 다 — 효과 대상으로 묶음', r: (d, st) => { const who = (i) => { const k = i.bonusKeys; const b = k.some((x) => ['bat', 'power', 'contact', 'speed', 'defense'].includes(x)), p = k.some((x) => ['pit', 'stability'].includes(x)); return b && p ? '타자 · 투수' : p ? '투수' : '타자'; };
    const groups = ['타자', '투수', '타자 · 투수'].map((k) => [k, d.list.filter((i) => who(i) === k)]).filter(([, a]) => a.length);
    return head(d) + scroll(groups.map(([k, arr]) => `<div class="gt">${k}<span>${arr.length}</span></div>${arr.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="l1"><b>${esc(i.name)}</b>${lv(i)}${pips(i)}</span><span class="l2">${eff(i)}</span></button>`).join('')}`).join('')); } },
  { g: 'C · 격자형' },
  { t: '2열 타일', d: '두 칸 격자 타일: 위 이름, 오른쪽 위 작은 링, 아래 효과 · 인원', r: (d, st) => head(d) + scroll(`<div class="gridx">${d.list.map((i) => `<button type="button" ${rowAttrs(i, st)}>${ring(i, 30)}<b>${esc(i.name)}</b>${eff(i)}<span class="l2">${i.mine.length ? `${i.mine.length}명` : ''}${i.cand ? ' <span class="mc">+1</span>' : ''}</span></button>`).join('')}</div>`) },
  { t: '육각 단계 배지', d: '왼쪽 육각 배지 안에 단계 숫자(켜짐 초록 · 0은 회색), 오른쪽 이름 · 칸 · 선수', r: (d, st) => head(d) + scroll(d.list.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="hx" style="clip-path:${HEX}"><b>${i.level}</b></span><span class="tx"><span class="l1"><b>${esc(i.name)}</b>${pips(i)}</span><span class="l2">${eff(i)} ${memOr(i, 3)}</span></span></button>`).join('')) },
  { t: '벌집', d: '육각 타일 벌집(이름 · 인원), 누른 시너지는 아래 상세 칸에 단계 · 선수', r: (d, st) => { const f = d.list.find((i) => i.name === st.focus) || d.list[0];
    return head(d) + `<div class="hive">${d.list.map((i) => `<button type="button" ${rowAttrs(i, st)} style="clip-path:${HEX}"><b>${esc(i.name)}</b><span>${i.cur}/${i.to}</span></button>`).join('')}</div>` + (f ? `<div class="det"><div class="l1"><b>${esc(f.name)}</b>${lv(f)}${pips(f)}</div><div class="lad">${f.tiers.map((t, k) => `<span class="${k < f.level ? 'ok' : k === f.level ? 'nx' : ''}"><i>${t.need}</i>${esc(t.effect)}</span>`).join('')}</div><div class="l2">${memOr(f, 8)}</div></div>` : ''); } },
  { t: '미니 카드 2열', d: '모서리 잘린 작은 카드 2열: 단계 칩 · 이름 · 칸 · 효과', r: (d, st) => head(d) + scroll(`<div class="gridx">${d.list.map((i) => `<button type="button" ${rowAttrs(i, st)}><span class="l1">${i.level ? lv(i) : `<em class="lv off">${i.cur}/${i.to}</em>`}</span><b>${esc(i.name)}</b>${pips(i)}${eff(i)}</button>`).join('')}</div>`) },
  { g: 'D · 선수 중심' },

const items = V.filter((v) => v.t);
const renderDock = (m, n, st) => { const v = items[n - 1]; return `<div class="sy v${n}" style="--nc:${m.roster.length + (m.cand && !m.roster.some((p) => p.name === m.cand.name) ? 1 : 0)}">${v.r(m, st)}</div>`; };

/* 레이아웃: 선수 구역 0.9배 · 도크 왼쪽으로 */
function layout(W, Hh) {
  const kw = (Hh / WA.h) * 1.003, s = kw * F;
  const x = 14 - (140 - HALF) * s;
  const imgH = WA.h * s, imgTop = (Hh - imgH) / 2, y = imgTop - WA.t * s;
  const dockL = Math.round(x + (760 + HALF) * s + 16);
  const imgL = x + WA.l * s, imgW = WA.w * s;
  const pc = (px) => Math.min(100, Math.max(0, ((px - imgL) / imgW) * 100));
  return { s, x, y, dockL, imgL, imgTop, imgW, imgH, mask: `linear-gradient(90deg, #000 ${pc(dockL + 40)}%, transparent ${pc(dockL + (W - dockL) * 0.8)}%)` };
}

const one = QS.get('v');
if (!one) {
  const st = document.createElement('style'); st.textContent = BASE + CSS.join('\n'); document.head.appendChild(st);
  const opt = (k, vals) => vals.map(([v, t]) => { const q = new URLSearchParams(location.search); if (v) q.set(k, v); else q.delete(k); return `<a href="?${q}" class="${(QS.get(k) || '') === v ? 'on' : ''}">${t}</a>`; }).join('');
  document.body.insertAdjacentHTML('beforeend', `<div class="top"><b>시너지 도크 32안</b><span>선수 구역 0.9배 · 도크 왼쪽으로 넓힘 · 줄을 누르면 강조(목록에서는 표시만) · “게임에서 보기”는 실제 화면에 끼운 모습</span>
    <span class="opt">화면 ${opt('h', [['', '1902×1000'], ['901', '1902×901'], ['1080', '1902×1080']])}</span>
    <span class="opt">후보 미리보기 ${opt('cand', [['', '없음'], ['이대호', '이대호 2008'], ['류현진', '류현진 2008']])}</span>
    <nav>${items.map((_, k) => `<a href="#s${k + 1}">${k + 1}</a>`).join('')}</nav></div>
    <div class="gal" id="gal"></div><iframe class="srcframe" src="/?demo=draft" style="height:${H}px"></iframe>`);
  const gal = document.getElementById('gal');
  const src = document.querySelector('.srcframe');
  const state = {};
  let last = '', geo = null, mdl = null;
  let n = 0;
  gal.innerHTML = V.map((v) => (v.g ? `<div class="grpt">${v.g}</div>` : (() => { n += 1; return `<section class="item" id="s${n}"><div class="hd"><b><i>${n}</i>${v.t}</b><a href="./?v=${n}&h=${H}${CAND ? `&cand=${CAND}` : ''}" target="_blank">게임에서 보기 ↗</a></div><p>${v.d}</p><div class="cell" data-n="${n}"></div></section>`; })())).join('');
  const draw = () => {
    if (!geo || !mdl) return;
    gal.style.setProperty('--cw', `${geo.cw}px`);
    gal.querySelectorAll('.cell').forEach((cell) => {
      const k = +cell.dataset.n; const s = state[k] || (state[k] = {});
      cell.style.width = `${geo.cw}px`; cell.style.height = `${geo.h}px`;
      cell.innerHTML = `<img src="/ui/field-wide.webp" style="left:${geo.imgL - geo.cut}px;top:${geo.imgTop}px;width:${geo.imgW}px;height:${geo.imgH}px;-webkit-mask-image:${geo.mask};mask-image:${geo.mask}"><div class="dockbox" style="width:${geo.dw}px">${renderDock(mdl, k, s)}</div>`;
    });
  };
  gal.addEventListener('click', (e) => {
    const cell = e.target.closest('.cell'); if (!cell) return;
    const s = state[+cell.dataset.n] || (state[+cell.dataset.n] = {});
    const t = e.target.closest('[data-syn],[data-tab]'); if (!t) return;
    if (t.dataset.tab) s.tab = t.dataset.tab; else s.focus = s.focus === t.dataset.syn ? null : t.dataset.syn;
    draw();
  });
  src.addEventListener('load', () => setInterval(() => {
    const doc = src.contentDocument; const field = doc?.querySelector('.lf-field'); if (!field) return;
    const g = readGame(doc); if (!g || !g.roster.length) return;
    const wrap = field.parentElement; const W = wrap.clientWidth, Hh = wrap.clientHeight; if (!W || !Hh) return;
    const key = JSON.stringify([g.roster.map((p) => p.id + p.slot), W, Hh]);
    if (key === last) return;
    last = key;
    const L = layout(W, Hh);
    const cut = L.dockL - 70;
    geo = { cw: W - cut, h: Hh, dw: W - L.dockL, cut, imgL: L.imgL, imgTop: L.imgTop, imgW: L.imgW, imgH: L.imgH, mask: L.mask.replace(/(\d+(\.\d+)?)%/g, (m0, v) => `${((+v / 100) * L.imgW + L.imgL - L.imgL) / L.imgW * 100}%`) };
    mdl = model(g);
    draw();
  }, 500));
} else {
  const nIdx = +one;
  document.body.className = 'one';
  document.title = `${nIdx} · ${items[nIdx - 1]?.t}`;
  document.body.innerHTML = `<iframe src="/?demo=draft" title="드래프트 화면"></iframe><span class="badge">${nIdx} · ${items[nIdx - 1]?.t}</span>`;
  const ifr = document.querySelector('iframe');
  ifr.addEventListener('load', () => {
    const st = {};
    const tick = () => {
      const doc = ifr.contentDocument; const field = doc?.querySelector('.lf-field'); const dock = doc?.querySelector('.syn-dock');
      if (!field || !dock) return;
      if (!doc.getElementById('sy-style')) {
        const s = doc.createElement('style'); s.id = 'sy-style';
        s.textContent = BASE + CSS.join('\n') + `
          html body .lf-field { transform: var(--sy-t) !important; }
          html body .lf-field > img { -webkit-mask-image: var(--sy-mask) !important; mask-image: var(--sy-mask) !important; }
          html body .syn-dock.wide { left: var(--sy-l) !important; width: var(--sy-w) !important; }
          html body .syn-dock > section { display: none !important; }
          @keyframes prism { to { background-position: 200% 50%; } }`;
        doc.body.appendChild(s);
      }
      const wrap = field.parentElement; const W = wrap.clientWidth, Hh = wrap.clientHeight;
      if (dock.classList.contains('wide')) {
        const L = layout(W, Hh);
        wrap.style.setProperty('--sy-t', `translate(${L.x}px, ${L.y}px) scale(${L.s})`);
        wrap.style.setProperty('--sy-l', `${L.dockL}px`); wrap.style.setProperty('--sy-w', `${W - L.dockL}px`); wrap.style.setProperty('--sy-mask', L.mask);
      }
      const g = readGame(doc); if (!g) return;
      const native = [...doc.querySelectorAll('.syn-dock .dock-row.open')].map((r) => r.querySelector('.text-sm')?.textContent);
      st.focus = native[0] || null;
      let root = dock.querySelector(':scope > .sy-host');
      if (!root) {
        root = doc.createElement('div'); root.className = 'sy-host'; root.style.cssText = 'display:flex;flex-direction:column;flex:1;min-height:0'; dock.appendChild(root);
        root.addEventListener('click', (e) => {
          const t = e.target.closest('[data-syn],[data-tab],[data-all]'); if (!t) return;
          if (t.dataset.tab) { st.tab = t.dataset.tab; root.dataset.h = ''; tick(); return; }
          if (t.hasAttribute('data-all')) { [...doc.querySelectorAll('.syn-dock button')].find((b) => b.textContent.trim() === '전체 보기')?.click(); return; }
          [...doc.querySelectorAll('.syn-dock .dock-row')].find((r) => r.querySelector('.text-sm')?.textContent === t.dataset.syn)?.click();
        });
      }
      const html = renderDock(model(g), nIdx, st);
      if (root.dataset.h !== html) { const sc = root.querySelector('.sc')?.scrollTop || 0; root.innerHTML = html; root.dataset.h = html; const ns = root.querySelector('.sc'); if (ns) ns.scrollTop = sc; }
    };
    tick(); setInterval(tick, 300);
  });
}
</script>
</body>
