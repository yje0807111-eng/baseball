.s5 .gh { position: absolute; left: 0; top: 0; bottom: 0; width: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: color-mix(in srgb, var(--ac) 16%, transparent); box-shadow: inset 2px 0 0 var(--ac); }

.s6 .gh { height: 20px; padding: 0 4px; }
.s6 .gh b::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; vertical-align: 2px; background: var(--ac); transform: rotate(45deg); }

.s7 .grp-b { padding-top: 12px; box-shadow: inset 0 2px 0 rgba(148,163,184,.25); }

.s8 .gh { height: 26px; align-items: center; padding: 0 4px; }
.s8 .gh b { color: var(--ac); }
`;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const tierOf = (v) => (v == null ? '' : v >= 90 ? 't90' : v >= 75 ? 't75' : '');
const mean = (a) => { const b = a.filter((x) => x != null && !Number.isNaN(x)); return b.length ? b.reduce((s, x) => s + x, 0) / b.length : null; };
const fmt = (v, d = 1) => (v == null ? '-' : d ? v.toFixed(d) : String(Math.round(v)));
const numT = (v, d = 1) => `<span class="num ${tierOf(v)}">${fmt(v, d)}</span>`;
const grade = (v) => (v == null ? '-' : v >= 88 ? 'S' : v >= 80 ? 'A' : v >= 74 ? 'B' : v >= 66 ? 'C' : 'D');
const sgn = (d) => `${d >= 0 ? '+' : ''}${Math.round(d)}`;
const mulberry = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

function parse(p) {
  const s = (p.source || '').split('—')[0];
  const g = (re) => (s.match(re) || [])[1];
  if (p.type === 'pitcher') return { era: g(/ERA\s?([\d.]+)/), w: g(/(\d+)승/), sv: g(/(\d+)SV/), hld: g(/(\d+)HLD/), k: g(/(\d+)K\b/) };
  return { avg: g(/(\.\d{3})/), hr: g(/(\d+)HR/), sb: g(/(\d+)SB/), rbi: g(/(\d+)타점/) };
}
const PCOLS = [
  ['ERA', (r) => r.era, (r) => +r.era, true],
  ['승', (r) => r.w, (r) => +r.w],
  ['S/H', (r) => (r.sv && +r.sv >= +(r.hld || 0) ? `${r.sv}S` : r.hld ? `${r.hld}H` : null), (r) => Math.max(+(r.sv || 0), +(r.hld || 0)) || NaN],
  ['K', (r) => r.k, (r) => +r.k],
];
const BCOLS = [['타율', (r) => r.avg, (r) => +r.avg], ['HR', (r) => r.hr, (r) => +r.hr], ['도루', (r) => r.sb, (r) => +r.sb], ['타점', (r) => r.rbi, (r) => +r.rbi]];

function readState(doc) {
  const rows = [...doc.querySelectorAll('.ll-row')];
  if (rows.length !== 12) return null;
  const roster = [], face = {};
  let sel = null;
  rows.forEach((r, i) => {
    const slot = ORDER[i];
    if (r.classList.contains('on')) sel = slot;
    if (r.classList.contains('e')) return;
    const name = r.querySelector('.ll-nm')?.textContent, sea = r.querySelector('.ll-sea')?.textContent;
    const p = ALL_PLAYERS.find((x) => x.name === name && `${x.year} ${x.team}` === sea);
    if (!p) return;
    roster.push({ ...p, source: SOURCE.get(p.id), slot });
    face[p.name] = (r.querySelector('.ll-fc')?.getAttribute('style') || '').replace(/"/g, "'").replace(/url\('(?!\/|https?:|data:)/g, "url('/");
  });
  const meter = doc.querySelector('[role="meter"][aria-label="샐러리 캡 잔여"]');
  const text = doc.body.innerText;
  const mode = DRAFT_MODES.find((m) => text.includes(m.name)) || DRAFT_MODES.find((m) => m.id === 'mix');
  return { roster, face, sel, mode, cp: +(meter?.getAttribute('aria-valuenow') || 0), cap: +(meter?.getAttribute('aria-valuemax') || 0) };
}

const pv = (p) => p.stats.stuff * 0.4 + p.stats.control * 0.3 + p.stats.stability * 0.3;
function metrics(roster, hideDraftOnly) {
  const on = withSlots(roster).map(playAt);
  const eff = applySynergies(on, checkSynergies(on).filter((s) => !hideDraftOnly || !HIDDEN.has(s.id)));
  const by = new Map(eff.map((p) => [p.slot, p]));
  const bats = eff.filter((p) => p.type === 'batter');
  const st = (key) => mean(bats.map((p) => p.stats[key]));
  return {
    eff, by,
    avgT: mean(eff.map((p) => p.overall)), avgP: mean(eff.filter((p) => PITCH.includes(p.slot)).map((p) => p.overall)), avgB: mean(eff.filter((p) => !PITCH.includes(p.slot)).map((p) => p.overall)),
    power: st('power'), contact: st('contact'), speed: st('speed'), defense: st('defense'),
    sp: by.get('SP') ? pv(by.get('SP')) : null, pen: mean(['MR', 'CL'].map((s) => by.get(s)).filter(Boolean).map(pv)),
  };
}
const aiCache = new Map();
function aiAvg(mode, cap) {
  const key = `${mode.id}:${cap}`;
  if (!aiCache.has(key)) {
    const teams = Array.from({ length: 24 }, (_, i) => metrics(aiDraft({ players: mode.players, cap: cap || mode.cap, rng: mulberry(1000 + i * 7919) })));
    aiCache.set(key, Object.fromEntries(['avgT', 'avgP', 'avgB', 'power', 'contact', 'speed', 'defense', 'sp', 'pen'].map((k) => [k, mean(teams.map((t) => t[k]))])));
  }
  return aiCache.get(key);
}
const AXES = [['파워', 'power'], ['컨택', 'contact'], ['주루', 'speed'], ['수비', 'defense'], ['선발', 'sp'], ['불펜', 'pen']];
const STR = { 파워: '홈런 타선', 컨택: '컨택 타선', 주루: '발 빠른 야구', 수비: '짠물 수비', 선발: '선발 야구', 불펜: '철벽 불펜' };
const WEAK = { 파워: '장타 부족', 컨택: '정교함 부족', 주루: '느린 발', 수비: '불안한 수비', 선발: '얇은 선발', 불펜: '불안한 뒷문' };

function compute(st) {
  const me = metrics(st.roster, true);
  const ai = aiAvg(st.mode, st.cap);
  const axes = AXES.map(([k, key]) => ({ k, m: me[key], a: ai[key], d: me[key] == null ? null : me[key] - ai[key] }));
  const known = axes.filter((x) => x.d != null).sort((x, y) => y.d - x.d);
  return { ...st, ...me, ai, axes, known, best: known[0], worst: known[known.length - 1], rawBy: new Map(st.roster.map((p) => [p.slot, p])) };
}

/* ── 레이더 ── */
function radar(c, o = {}) {
  const W = o.w ?? 340, H = o.h ?? 262, R = o.R ?? 88, cx = W / 2, cy = o.cy ?? H / 2, lo = 40, n = c.axes.length;
  const at = (i, r) => { const ang = -Math.PI / 2 + (i * Math.PI * 2) / n; return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)]; };
  const rOf = (v) => (R * Math.max(0, Math.min(100, v ?? lo) - lo)) / (100 - lo);
  const poly = (f) => c.axes.map((_, i) => at(i, f(i)).map((x) => x.toFixed(1)).join(',')).join(' ');
  const grid = [0.25, 0.5, 0.75, 1].map((k) => `<polygon points="${poly(() => R * k)}" fill="${k === 1 && o.bg ? 'rgba(255,255,255,.02)' : 'none'}" stroke="rgba(148,163,184,${k === 1 ? 0.3 : 0.12})"/>`).join('')
    + c.axes.map((_, i) => { const [x, y] = at(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(148,163,184,.12)"/>`; }).join('');
  const labels = c.axes.map((x, i) => {
    const [lx, ly] = at(i, R + (o.gap ?? 26)); const an = Math.abs(lx - cx) < 4 ? 'middle' : lx > cx ? 'start' : 'end';
    const dx = an === 'start' ? -10 : an === 'end' ? 10 : 0;
    const delta = o.noDelta || x.d == null ? '' : `<tspan class="d" dx="4" fill="${x.d >= 0 ? '#34d399' : '#fb923c'}">${sgn(x.d)}</tspan>`;
    return `<text x="${lx + dx}" y="${ly - 4}" text-anchor="${an}">${x.k}</text><text class="v" x="${lx + dx}" y="${ly + 12}" text-anchor="${an}">${fmt(x.m, 0)}${delta}</text>`;
  }).join('');
  const glow = o.glow ? `<defs><radialGradient id="rg${o.glow}" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#34d399" stop-opacity=".55"/><stop offset="100%" stop-color="#34d399" stop-opacity=".12"/></radialGradient><filter id="gf${o.glow}"><feGaussianBlur stdDeviation="3"/></filter></defs>` : '';
  const mine = poly((i) => rOf(c.axes[i].m));
  return `<svg class="rd" viewBox="0 0 ${W} ${H}">${glow}${grid}
    <polygon points="${poly((i) => rOf(c.axes[i].a))}" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
    ${o.glow ? `<polygon points="${mine}" fill="none" stroke="#34d399" stroke-width="5" opacity=".45" filter="url(#gf${o.glow})"/>` : ''}
    <polygon points="${mine}" fill="${o.glow ? `url(#rg${o.glow})` : '#34d399'}" fill-opacity="${o.glow ? 1 : 0.2}" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/>${labels}</svg>`;
}
const headline = (c) => `<h3><span class="g">${c.best ? STR[c.best.k] : '-'}</span> · <span class="o">${c.worst ? WEAK[c.worst.k] : '-'}</span></h3>`;
const legend = (c) => `<div class="lgd"><span><i></i>우리 팀<b>${fmt(c.avgT)}</b></span><span><i class="ai"></i>AI 평균<b>${fmt(c.ai.avgT)}</b></span></div>`;
const chip = (x, row) => `<span class="${x.d >= 0 ? 'up' : 'dn'}">${row ? x.k : `${x.d >= 0 ? '▲' : '▼'} ${x.k}`}<b>${sgn(x.d)}</b></span>`;

const TEAM = {
  A1: (c) => `<div class="ta"><span class="eyebrow">TEAM STYLE</span>${headline(c)}${radar(c, { h: 270, R: 92 })}${legend(c)}<div class="chips">${c.known.map((x) => chip(x)).join('')}</div></div>`,
  A2: (c) => `<div class="ta"><div class="a2-top"><div class="bdg2"><span class="up"><em>강점</em>${c.best ? STR[c.best.k] : '-'}</span><span class="dn"><em>약점</em>${c.worst ? WEAK[c.worst.k] : '-'}</span></div>
      <div class="tot"><small>팀 종합</small>${numT(c.avgT)}</div></div>${radar(c, { h: 276, R: 94 })}${legend(c)}<div class="chips row">${c.known.map((x) => chip(x, true)).join('')}</div></div>`,
  A3: (c) => `<div class="ta" style="gap:10px">${headline(c)}<div class="trio"><div><small>팀 종합</small>${numT(c.avgT)}</div><div><small>투수</small>${numT(c.avgP)}</div><div><small>야수</small>${numT(c.avgB)}</div></div>${radar(c, { h: 300, R: 104, gap: 28 })}${legend(c)}</div>`,
  A4: (c) => { const w = (d) => Math.min(Math.abs(d) / 20, 1) * 50;
    return `<div class="ta" style="gap:6px">${headline(c)}${radar(c, { h: 196, R: 62, gap: 22, noDelta: true })}
      <div class="dvs">${c.known.map((x) => `<div class="dv"><span>${x.k}</span><span class="trk"><i class="${x.d >= 0 ? 'up' : 'dn'}" style="width:${w(x.d)}%"></i></span><span class="num">${fmt(x.m, 0)}</span><small class="${x.d >= 0 ? 'up' : 'dn'}">${sgn(x.d)}</small></div>`).join('')}</div>${legend(c)}</div>`; },
  A5: (c) => `<div class="ta a5" style="height:100%;justify-content:center">${headline(c)}${radar(c, { w: 340, h: 380, R: 120, cy: 204, gap: 30, bg: true })}${legend(c)}</div>`,
  A6: (c) => `<div class="ta" style="gap:6px"><div class="a6"><span class="grade g-${grade(c.avgT)}">${grade(c.avgT)}</span><div class="txt"><small>팀 종합 ${fmt(c.avgT)}</small><b><span class="g">${c.best ? STR[c.best.k] : '-'}</span></b><b><span class="o">${c.worst ? WEAK[c.worst.k] : '-'}</span></b></div></div>
      ${radar(c, { h: 222, R: 74, gap: 24, glow: 'a6' })}${legend(c)}
      <div class="sw2"><div class="up">${c.known.filter((x) => x.d >= 0).slice(0, 3).map((x) => `<span>${x.k}<b>${sgn(x.d)}</b></span>`).join('')}</div><div class="dn">${[...c.known].reverse().filter((x) => x.d < 0).slice(0, 3).map((x) => `<span>${x.k}<b>${sgn(x.d)}</b></span>`).join('')}</div></div></div>`,
  A7: (c) => `<div class="ta">${headline(c)}${radar(c, { h: 262, R: 88, noDelta: true })}${legend(c)}
      <div class="sw2"><div class="up">${c.known.slice(0, 3).map((x) => `<span>▲ ${x.k}<b>${fmt(x.m, 0)} <small style="font-size:12px">${sgn(x.d)}</small></b></span>`).join('')}</div>
        <div class="dn">${[...c.known].reverse().slice(0, 3).map((x) => `<span>▼ ${x.k}<b>${fmt(x.m, 0)} <small style="font-size:12px">${sgn(x.d)}</small></b></span>`).join('')}</div></div></div>`,
  A8: (c) => { const win = Math.round(100 / (1 + Math.exp(-(((c.avgT ?? 0) - c.ai.avgT) / 4))));
    return `<div class="ta" style="gap:10px"><div class="vsl"><div><span class="eyebrow me">MY TEAM</span>${numT(c.avgT)}</div>
      <div class="wp"><div class="row"><span>${win}%</span><span>${100 - win}%</span></div><div class="bar"><i style="width:${win}%"></i><i></i></div></div>
      <div class="ai"><span class="eyebrow ai">AI</span><span class="num">${fmt(c.ai.avgT)}</span></div></div>
      ${headline(c)}${radar(c, { h: 330, R: 112, gap: 30 })}</div>`; },
};

/* ── 기록표 ── */
function bestOf(c, slots, cols) {
  return cols.map(([, , n, low]) => {
    const vals = slots.map((s) => c.rawBy.get(s)).filter((p) => p?.source).map((p) => n(parse(p))).filter((v) => !Number.isNaN(v));
    return vals.length > 1 ? (low ? Math.min(...vals) : Math.max(...vals)) : null;
  });
}
function recTable(c, sel, pitch, s) {
  const slots = pitch ? PITCH : BATS, cols = pitch ? PCOLS : BCOLS, best = bestOf(c, slots, cols);
  const filled = slots.filter((x) => c.by.has(x));
  const avg = mean(filled.map((x) => c.by.get(x).overall));
  const rows = slots.map((slot) => {
    const p = c.by.get(slot);
    if (!p) return `<tr class="e ${sel === slot ? 'on' : ''}" data-slot="${slot}"><td class="l pos">${SHORT[slot]}</td><td></td><td class="l">비어 있음</td>${cols.map(() => '<td></td>').join('')}<td></td></tr>`;
    const raw = c.rawBy.get(slot), r = parse(raw);
    const stats = cols.map(([, show, n], i) => { const v = raw.source ? show(r) : null;
      return `<td><span class="st ${v == null ? 'none' : best[i] != null && n(r) === best[i] ? 'best' : ''}">${v ?? '-'}</span></td>`; }).join('');
    return `<tr class="${sel === slot ? 'on' : ''}" data-slot="${slot}"><td class="l pos">${SHORT[slot]}</td>
      <td class="l"><i class="face ${c.face[p.name] ? '' : 'nof'}" style="${c.face[p.name] || ''}"></i></td>
      <td class="l"><span class="who"><span class="nm"><b>${esc(p.name)}</b><small>${p.year} ${esc(p.team)}</small></span></span></td>${stats}<td class="ov">${numT(p.overall, 0)}</td></tr>`;
  }).join('');
  const label = pitch ? '투수' : '타자';
  const gh = `<div class="gh">${s === 'S4' ? `<span class="en">${pitch ? 'PITCHERS' : 'BATTERS'}</span>` : ''}<b>${label}</b><em>${filled.length}/${slots.length}</em>${s === 'S8' ? `<span class="avg">평균 ${numT(avg)}</span>` : ''}</div>`;
  const head = `<tr><th class="l ${s === 'S7' ? 'gname' : ''}" colspan="${s === 'S7' ? 3 : 1}">${s === 'S7' ? `${label} <span style="font-weight:400;color:#6b7280">${filled.length}/${slots.length}</span>` : '자리'}</th>${s === 'S7' ? '' : '<th></th><th class="l">선수</th>'}${cols.map(([h]) => `<th>${h}</th>`).join('')}<th>종합</th></tr>`;
  const colg = `<colgroup><col style="width:46px"><col style="width:30px"><col>${cols.map(() => '<col style="width:39px">').join('')}<col style="width:32px"></colgroup>`;
  return `<section class="grp ${pitch ? 'grp-p' : 'grp-b'}">${gh}<table>${colg}<thead>${head}</thead><tbody>${rows}</tbody></table></section>`;
}
const REC = (c, sel, s) => `<div class="rt ${s.toLowerCase()}">${recTable(c, sel, true, s)}${recTable(c, sel, false, s)}</div>`;

const panelHtml = (c, v, tab, sel) => `<div class="tabs">${[['rep', '팀 분석'], ['rec', '선수 기록']].map(([k, t]) => `<button type="button" data-tab="${k}" class="${tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>
  <div class="tb">${tab === 'rec' ? REC(c, sel, v.s) : TEAM[v.t](c)}</div>`;

const one = new URLSearchParams(location.search).get('v');
if (!one) {
  const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
  document.body.insertAdjacentHTML('beforeend', `
    <div class="top"><b>팀 컬러 · 기록표 8안</b><span>W2 팀 분석 × W1 기록표 · 판 크기 400×552 · 왼쪽 팀 분석 탭 · 오른쪽 선수 기록 탭</span>
      <nav>${VERS.map((v) => `<a href="#${v.id}">${v.id}</a>`).join('')}</nav></div>
    <div class="wrapall">${VERS.map((v) => `<section class="ver" id="${v.id}">
      <div class="hd"><b><i>${v.id}</i>${v.title}</b><a href="./?v=${v.id}" target="_blank">게임에서 보기 ↗</a><span class="desc"><b>팀 분석</b> ${v.team}</span><span class="desc"><b>선수 기록</b> ${v.rec}</span></div>
      <div class="pair">${['rep', 'rec'].map((tab) => `<figure><div class="pn"><span class="lab">MY TEAM</span><div class="mk mk-side" data-v="${v.id}" data-tab="${tab}" data-sel=""></div></div><figcaption>${tab === 'rep' ? '팀 분석 탭' : '선수 기록 탭'}</figcaption></figure>`).join('')}</div>
    </section>`).join('')}</div>
    <iframe class="srcframe" src="${SRC}" title="데이터 원본"></iframe>`);
  const src = document.querySelector('.srcframe');
  let last = '', cache = null;
  const render = (force) => {
    const doc = src.contentDocument; if (!doc) return;
    const state = readState(doc); if (!state) return;
    const key = JSON.stringify([state.roster.map((p) => p.id + p.slot), state.cp, state.mode.id]);
    if (!force && key === last) return;
    if (key !== last) { last = key; cache = compute(state); }
    document.querySelectorAll('.mk-side[data-v]').forEach((el) => { el.innerHTML = panelHtml(cache, VERS.find((x) => x.id === el.dataset.v), el.dataset.tab, el.dataset.sel || null); });
  };
  document.addEventListener('click', (e) => {
    const side = e.target.closest('.mk-side[data-v]'); if (!side) return;
    const t = e.target.closest('[data-tab],[data-slot]'); if (!t) return;
    if (t.dataset.tab) side.dataset.tab = t.dataset.tab;
    else side.dataset.sel = side.dataset.sel === t.dataset.slot ? '' : t.dataset.slot;
    render(true);
  });
  src.addEventListener('load', () => { setInterval(() => render(false), 400); });
} else {
  const v = VERS.find((x) => x.id === one) || VERS[0];
  document.body.className = 'one';
  document.title = `${v.id} · ${v.title}`;
  document.body.innerHTML = `<iframe src="${SRC}" title="드래프트 화면"></iframe><span class="badge">${v.id} · ${v.title}</span>`;
  const ifr = document.querySelector('iframe');
  ifr.addEventListener('load', () => {
    let tab = 'rep', lastKey = '', c = null;
    const tick = () => {
      const doc = ifr.contentDocument;
      const listP = doc?.querySelector('.ll-body')?.closest('.bc-grp');
      if (!listP) return;
      if (!doc.getElementById('mk-style')) { const s = doc.createElement('style'); s.id = 'mk-style'; s.textContent = CSS; doc.body.appendChild(s); }
      doc.body.classList.add('mk-hasside');
      const state = readState(doc); if (!state) return;
      const key = JSON.stringify([state.roster.map((p) => p.id + p.slot), state.cp, state.mode.id]);
      if (key !== lastKey) { lastKey = key; c = compute(state); }
      const lab = listP.querySelector('.bc-label'); if (lab && lab.textContent !== 'MY TEAM') lab.textContent = 'MY TEAM';
      let side = listP.querySelector(':scope > .mk-side');
      if (!side) {
        side = doc.createElement('div'); side.className = 'mk mk-side'; listP.appendChild(side);
        side.addEventListener('click', (e) => {
          const t = e.target.closest('[data-tab],[data-slot]'); if (!t) return;
          if (t.dataset.tab) { tab = t.dataset.tab; side.dataset.h = ''; tick(); }
          else doc.querySelectorAll('.ll-row')[ORDER.indexOf(t.dataset.slot)]?.click();
        });
      }
      const html = panelHtml(c, v, tab, state.sel);
      if (side.dataset.h !== html) { side.innerHTML = html; side.dataset.h = html; }
    };
    tick(); setInterval(tick, 250);
  });
}
</script>
</body>
</html>
