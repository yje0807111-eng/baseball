const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const tierOf = (v) => (v == null ? '' : v >= 90 ? 't90' : v >= 75 ? 't75' : '');
const mean = (a) => { const b = a.filter((x) => x != null && !Number.isNaN(x)); return b.length ? b.reduce((s, x) => s + x, 0) / b.length : null; };
const fmt = (v, d = 1) => (v == null ? '-' : d ? v.toFixed(d) : String(Math.round(v)));
const numT = (v, d = 1, extra = '') => `<span class="num ${tierOf(v)}" ${extra}>${fmt(v, d)}</span>`;
const mulberry = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

/* ── 시즌 기록 ── */
function parse(p) {
  const s = (p.source || '').split('—')[0];
  const g = (re) => (s.match(re) || [])[1];
  if (p.type === 'pitcher') return { kind: 'p', era: g(/ERA\s?([\d.]+)/), w: g(/(\d+)승/), l: g(/(\d+)패/), sv: g(/(\d+)SV/), hld: g(/(\d+)HLD/), k: g(/(\d+)K\b/), ip: g(/([\d.]+)IP/), gm: g(/(\d+)G\b/), whip: g(/WHIP\s?([\d.]+)/) };
  return { kind: 'b', avg: g(/(\.\d{3})/), obp: g(/\.\d{3}\/(\.\d{3})/), hr: g(/(\d+)HR/), sb: g(/(\d+)SB/), rbi: g(/(\d+)타점/), run: g(/(\d+)득점/), pa: g(/(\d+)PA/), gm: g(/(\d+)G\b/) };
}
/** 대단한 시즌 기준: t75 초록 · t90 무지개 */
const GREAT = {
  era: (v) => (v <= 2 ? 't90' : v <= 3 ? 't75' : ''), w: (v) => (v >= 18 ? 't90' : v >= 13 ? 't75' : ''),
  sv: (v) => (v >= 35 ? 't90' : v >= 25 ? 't75' : ''), hld: (v) => (v >= 25 ? 't90' : v >= 15 ? 't75' : ''), k: (v) => (v >= 180 ? 't90' : v >= 130 ? 't75' : ''),
  avg: (v) => (v >= 0.35 ? 't90' : v >= 0.31 ? 't75' : ''), hr: (v) => (v >= 40 ? 't90' : v >= 25 ? 't75' : ''),
  sb: (v) => (v >= 40 ? 't90' : v >= 20 ? 't75' : ''), rbi: (v) => (v >= 120 ? 't90' : v >= 90 ? 't75' : ''),
};
/** 표의 열: [머리, 값 뽑기(표시 문자열), 크기 비교용 숫자, 등급 키, 낮을수록 좋음] */
const PCOLS = [
  ['ERA', (r) => r.era, (r) => +r.era, 'era', true],
  ['승', (r) => r.w, (r) => +r.w, 'w'],
  ['S/H', (r) => (r.sv && +r.sv >= +(r.hld || 0) ? `${r.sv}S` : r.hld ? `${r.hld}H` : null), (r) => Math.max(+(r.sv || 0), +(r.hld || 0)) || NaN, (r) => (r.sv && +r.sv >= +(r.hld || 0) ? 'sv' : 'hld')],
  ['K', (r) => r.k, (r) => +r.k, 'k'],
];
const BCOLS = [
  ['타율', (r) => r.avg, (r) => +r.avg, 'avg'],
  ['HR', (r) => r.hr, (r) => +r.hr, 'hr'],
  ['도루', (r) => r.sb, (r) => +r.sb, 'sb'],
  ['타점', (r) => r.rbi, (r) => +r.rbi, 'rbi'],
];

/* ── 게임 화면에서 라인업 읽기 ── */
function readState(doc) {
  const rows = [...doc.querySelectorAll('.ll-row')];
  if (rows.length !== 12) return null;
  const roster = [], face = {};
  let sel = null;
  rows.forEach((r, i) => {
    const slot = ORDER[i];
    if (r.classList.contains('on')) sel = slot;
    if (r.classList.contains('e')) return;
    const name = r.querySelector('.ll-nm')?.textContent, sea = r.querySelector('.ll-sea')?.textContent;
    const p = ALL_PLAYERS.find((x) => x.name === name && `${x.year} ${x.team}` === sea);
    if (!p) return;
    roster.push({ ...p, source: SOURCE.get(p.id), slot });
    face[p.name] = (r.querySelector('.ll-fc')?.getAttribute('style') || '').replace(/"/g, "'").replace(/url\('(?!\/|https?:|data:)/g, "url('/");
  });
  const meter = doc.querySelector('[role="meter"][aria-label="샐러리 캡 잔여"]');
  const text = doc.body.innerText;
  const mode = DRAFT_MODES.find((m) => text.includes(m.name)) || DRAFT_MODES.find((m) => m.id === 'mix');
  return { roster, face, sel, mode, cp: +(meter?.getAttribute('aria-valuenow') || 0), cap: +(meter?.getAttribute('aria-valuemax') || 0) };
}

const pv = (p) => p.stats.stuff * 0.4 + p.stats.control * 0.3 + p.stats.stability * 0.3;
/** 한 팀의 지표 (시너지 · 제자리 반영) */
function metrics(roster, hideDraftOnly) {
  const on = withSlots(roster).map(playAt);
  const syn = checkSynergies(on).filter((s) => !hideDraftOnly || !HIDDEN.has(s.id));
  const eff = applySynergies(on, syn);
  const by = new Map(eff.map((p) => [p.slot, p]));
  const bats = eff.filter((p) => p.type === 'batter');
  const st = (key) => mean(bats.map((p) => p.stats[key]));
  return {
    eff, by, on, syn,
    avgT: mean(eff.map((p) => p.overall)), avgP: mean(eff.filter((p) => PITCH.includes(p.slot)).map((p) => p.overall)), avgB: mean(eff.filter((p) => !PITCH.includes(p.slot)).map((p) => p.overall)),
    offense: mean(bats.map((p) => p.stats.contact * 0.4 + p.stats.power * 0.4 + p.stats.speed * 0.2)),
    defense: st('defense'), power: st('power'), contact: st('contact'), speed: st('speed'),
    sp: by.get('SP') ? pv(by.get('SP')) : null, pen: mean(['MR', 'CL'].map((s) => by.get(s)).filter(Boolean).map(pv)),
  };
}
/** 같은 모드 · 같은 캡의 AI 올스타 (고정 시드) */
const aiCache = new Map();
function aiTeams(mode, cap) {
  const key = `${mode.id}:${cap}`;
  if (!aiCache.has(key)) {
    const teams = Array.from({ length: 24 }, (_, i) => metrics(aiDraft({ players: mode.players, cap: cap || mode.cap, rng: mulberry(1000 + i * 7919) })));
    const avgOf = (k) => mean(teams.map((t) => t[k]));
    aiCache.set(key, { teams, avg: Object.fromEntries(['avgT', 'avgP', 'avgB', 'offense', 'defense', 'power', 'contact', 'speed', 'sp', 'pen'].map((k) => [k, avgOf(k)])) });
  }
  return aiCache.get(key);
}

function compute(st) {
  const me = metrics(st.roster, true);
  const rawBy = new Map(st.roster.map((p) => [p.slot, p]));
  const emptySlots = ORDER.filter((s) => !me.by.has(s));
  const per = emptySlots.length ? Math.floor(st.cp / emptySlots.length) : 0;
  const ai = aiTeams(st.mode, st.cap);
  // 빈 자리를 자리당 CP 로 살 수 있는 상위 5명 평균으로 채운 예상 종합
  const fills = emptySlots.map((s) => { const pool = st.mode.players.filter((p) => p.position === SLOT_POS[s] && p.cost <= per).sort((a, b) => b.overall - a.overall).slice(0, 5); return pool.length ? mean(pool.map((p) => p.overall)) : 55; });
  const projT = mean([...me.eff.map((p) => p.overall), ...fills]);
  return { ...st, ...me, rawBy, emptySlots, per, ai, projT, fills };
}

/* ───────── 팀 분석 4안 ───────── */
const AXES = [['공격력', 'offense'], ['수비력', 'defense'], ['선발', 'sp'], ['불펜', 'pen'], ['파워', 'power'], ['컨택', 'contact'], ['주루', 'speed']];

const TEAM = {
  T1: (c) => {
    const d = (c.avgT ?? 0) - c.ai.avg.avgT;
    const win = Math.round(100 / (1 + Math.exp(-d / 4)));
    const rows = AXES.map(([k, key]) => { const m = c[key], a = c.ai.avg[key]; return { k, m, a, d: m == null ? null : m - a }; });
    const lead = rows.filter((r) => r.d != null && r.d >= 0), lag = rows.filter((r) => r.d != null && r.d < 0);
    const top = lead.sort((x, y) => y.d - x.d)[0], low = lag.sort((x, y) => x.d - y.d)[0];
    const w = (v) => `${Math.max(0, Math.min(100, ((v ?? 40) - 40) / 60 * 100))}%`;
    return `<div class="ta t1">
      <div class="vs"><div><span class="eyebrow me">MY TEAM</span>${numT(c.avgT)}</div><b>VS</b><div class="ai"><span class="eyebrow ai">AI 올스타 평균</span><span class="num">${fmt(c.ai.avg.avgT)}</span></div></div>
      <div class="wp"><div class="row"><span>간이 예상 승률 <b>${win}%</b></span><span><b class="ai">${100 - win}%</b></span></div><div class="bar"><i style="width:${win}%"></i><i></i></div></div>
      <div class="h2h">${rows.map((r) => { const mw = r.d != null && r.d >= 0;
        return `<div class="hh"><span class="num ${mw ? 'win' : ''}">${fmt(r.m, 0)}</span><span class="me"><i class="${mw ? 'win' : ''}" style="width:${w(r.m)}"></i></span><span>${r.k}</span><span class="ai"><i class="${mw ? '' : 'win'}" style="width:${w(r.a)}"></i></span><span class="num ${mw ? '' : 'win'}">${fmt(r.a, 0)}</span></div>`; }).join('')}</div>
      <div class="t1-foot"><div style="--k:#34d399"><small>가장 앞서는 곳 · ${lead.length}개 우세</small><b>${top ? `${top.k}<em>+${Math.round(top.d)}</em>` : '없음'}</b></div>
        <div style="--k:#f87171"><small>가장 밀리는 곳 · ${lag.length}개 열세</small><b>${low ? `${low.k}<em>${Math.round(low.d)}</em>` : '없음'}</b></div></div>
    </div>`;
  },

  T2: (c) => {
    const axes = [['파워', 'power'], ['컨택', 'contact'], ['주루', 'speed'], ['수비', 'defense'], ['선발', 'sp'], ['불펜', 'pen']].map(([k, key]) => ({ k, m: c[key], a: c.ai.avg[key], d: c[key] == null ? null : c[key] - c.ai.avg[key] }));
    const STR = { 파워: '홈런 타선', 컨택: '컨택 타선', 주루: '발 빠른 야구', 수비: '짠물 수비', 선발: '선발 야구', 불펜: '철벽 불펜' };
    const WEAK = { 파워: '장타 부족', 컨택: '정교함 부족', 주루: '느린 발', 수비: '불안한 수비', 선발: '얇은 선발', 불펜: '불안한 뒷문' };
    const known = axes.filter((x) => x.d != null);
    const best = [...known].sort((x, y) => y.d - x.d)[0], worst = [...known].sort((x, y) => x.d - y.d)[0];
    const cx = 170, cy = 128, R = 88, lo = 40;
    const at = (i, r) => { const ang = -Math.PI / 2 + (i * Math.PI * 2) / 6; return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)]; };
    const rOf = (v) => (R * Math.max(0, Math.min(100, v ?? lo) - lo)) / (100 - lo);
    const poly = (f) => axes.map((_, i) => at(i, f(i)).map((n) => n.toFixed(1)).join(',')).join(' ');
    const grid = [0.25, 0.5, 0.75, 1].map((k) => `<polygon points="${poly(() => R * k)}" fill="none" stroke="rgba(148,163,184,${k === 1 ? 0.3 : 0.12})"/>`).join('')
      + axes.map((_, i) => { const [x, y] = at(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(148,163,184,.12)"/>`; }).join('');
    const labels = axes.map((x, i) => { const [lx, ly] = at(i, R + 26); const an = Math.abs(lx - cx) < 4 ? 'middle' : lx > cx ? 'start' : 'end';
      const dx = an === 'start' ? -10 : an === 'end' ? 10 : 0;
      return `<text x="${lx + dx}" y="${ly - 4}" text-anchor="${an}">${x.k}</text><text class="v" x="${lx + dx}" y="${ly + 11}" text-anchor="${an}">${fmt(x.m, 0)}<tspan class="d" dx="4" fill="${x.d >= 0 ? '#34d399' : '#fb923c'}">${x.d == null ? '' : `${x.d >= 0 ? '+' : ''}${Math.round(x.d)}`}</tspan></text>`; }).join('');
    return `<div class="ta t2">
      <span class="eyebrow">TEAM STYLE</span>
      <h3><span class="g">${best ? STR[best.k] : '-'}</span> · <span class="o">${worst ? WEAK[worst.k] : '-'}</span></h3>
      <span class="lead">같은 모드 AI 올스타 평균과 견준 우리 팀의 색깔</span>
      <svg viewBox="0 0 340 262">${grid}<polygon points="${poly((i) => rOf(axes[i].a))}" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
        <polygon points="${poly((i) => rOf(axes[i].m))}" fill="#34d399" fill-opacity=".2" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/>${labels}</svg>
      <div class="legend2"><span><i></i>우리 팀 ${fmt(c.avgT)}</span><span><i class="ai"></i>AI 평균 ${fmt(c.ai.avg.avgT)}</span></div>
      <div class="trs">${[...known].sort((x, y) => y.d - x.d).map((x) => `<span class="${x.d >= 0 ? 'up' : 'dn'}">${x.d >= 0 ? '▲' : '▼'} ${x.k}<b>${x.d >= 0 ? '+' : ''}${Math.round(x.d)}</b></span>`).join('')}</div>
    </div>`;
  },

  T3: (c) => {
    const bats = c.eff.filter((p) => p.type === 'batter' && !PITCH.includes(p.slot));
    const left = [...bats];
    const take = (score) => { if (!left.length) return null; left.sort((a, b) => score(b) - score(a)); return left.shift(); };
    const lineup = new Array(9).fill(null);
    lineup[0] = take((p) => p.stats.speed * 0.55 + p.stats.contact * 0.45);
    lineup[1] = take((p) => p.stats.contact);
    lineup[3] = take((p) => p.stats.power);
    lineup[2] = take((p) => p.stats.power * 0.5 + p.stats.contact * 0.5);
    lineup[4] = take((p) => p.stats.power);
    for (let i = 5; i < 9; i++) lineup[i] = take((p) => p.overall);
    const empties = c.emptySlots.filter((s) => !PITCH.includes(s));
    const role = (i) => (i === 0 ? ['리드오프', 'lead'] : i === 1 ? ['테이블세터', 'lead'] : i <= 4 ? ['클린업', 'core'] : ['하위 타선', '']);
    const key = (i, p) => (i <= 1 ? ['컨택', p.stats.contact] : i <= 4 ? ['파워', p.stats.power] : ['종합', p.overall]);
    const rows = lineup.map((p, i) => {
      const [r, rc] = role(i);
      if (!p) { const s = empties.shift(); return `<div class="bo-r e"><span class="no">${i + 1}</span><span class="pos">${s ? SHORT[s] : ''}</span><b>비어 있음</b><span></span><span></span></div>`; }
      const [kk, kv] = key(i, p);
      return `<div class="bo-r ${rc === 'core' ? 'core' : ''}"><span class="no">${i + 1}</span><span class="pos">${SHORT[p.slot]}</span><b>${esc(p.name)}</b><span class="role ${rc}">${r}</span><span class="kst">${kk}<b>${kv}</b></span></div>`;
    }).join('');
    const sp = c.by.get('SP'), mr = c.by.get('MR'), cl = c.by.get('CL');
    const inn = sp ? (sp.stats.stamina >= 90 ? 7 : sp.stats.stamina >= 80 ? 6 : 5) : 0;
    const who = (i) => (i === 9 ? (cl ? ['CL', cl] : mr ? ['MR', mr] : ['SP', sp]) : i <= inn ? ['SP', sp] : mr ? ['MR', mr] : cl ? ['CL', cl] : ['SP', sp]);
    const COL = { SP: '#34d399', MR: '#38bdf8', CL: '#fbbf24' };
    const cells = Array.from({ length: 9 }, (_, k) => { const i = k + 1; const [r, p] = who(i); const tired = r === 'SP' && i === inn;
      const missing = (i === 9 && !cl) || (i > inn && i < 9 && !mr);
      return `<span style="--pc:${COL[r]}"><i class="${missing ? 'none' : tired ? 'tired' : ''}"></i>${i}</span>`; }).join('');
    const segs = [['SP', 1, inn, sp], ['MR', inn + 1, 8, mr], ['CL', 9, 9, cl]].filter(([, a, b]) => b >= a)
      .map(([r, a, b, p]) => `<div style="grid-column:${a} / ${b + 1};--pc:${p ? COL[r] : 'rgba(148,163,184,.4)'}">${p ? esc(p.name) : '없음'}<small>${LABEL[r]}${r === 'SP' && p ? ` · 체력 ${p.stats.stamina}` : ''}</small></div>`).join('');
    return `<div class="ta t3">
      <div><div class="sech">예상 타순<small>빠른 발 · 컨택은 앞, 파워는 3~5번</small></div><div class="bo">${rows}</div></div>
      <div><div class="sech">투수 운용 9이닝<small>선발 체력 80+ 6이닝 · 90+ 7이닝</small></div><div class="inn">${cells}</div><div class="segs">${segs}</div></div>
    </div>`;
  },

  T4: (c) => {
    const others = c.ai.teams.slice(0, 9).map((t, i) => ({ name: `AI 올스타 ${'ABCDEFGHI'[i]}`, v: t.avgT }));
    const ranked = [...others, { name: 'MY TEAM', v: c.projT, me: true }].sort((a, b) => b.v - a.v);
    const rank = ranked.findIndex((t) => t.me) + 1;
    const nowRank = [...others, { v: c.avgT ?? 0, me: true }].sort((a, b) => b.v - a.v).findIndex((t) => t.me) + 1;
    // 순위표: 채웠을 때(순위 번호) + 지금 라인업 그대로(흐린 줄, 번호 없음)
    const table = c.emptySlots.length ? [...ranked, { name: `지금 (${c.eff.length}명)`, v: c.avgT ?? 0, ghost: true }].sort((a, b) => b.v - a.v) : ranked;
    let no = 0;
    const vals = table.map((t) => t.v); const lo = Math.min(...vals) - 2, hi = Math.max(...vals) + 1;
    return `<div class="ta t4">
      <div class="rk"><div><span class="eyebrow">예상 순위 · 10팀</span><div class="big"><span class="num ${rank <= 3 ? 't75' : ''}">${rank}</span><span>위</span></div></div>
        <div class="side"><span class="cap">빈 자리 채운 예상 종합</span><span class="num">${fmt(c.projT)}</span></div></div>
      <div class="lb">${table.map((t) => `<div class="lb-r ${t.me ? 'me' : ''} ${t.ghost ? 'ghost' : ''}"><span class="n">${t.ghost ? '' : ++no}</span><span>${t.name}</span><i style="width:${((t.v - lo) / (hi - lo)) * 100}%"></i><span class="num ${t.me ? tierOf(t.v) : ''}">${fmt(t.v)}</span></div>`).join('')}</div>
      <div class="t4-foot"><div><small>지금 라인업 그대로 (빈 자리 ${c.emptySlots.length})</small><b>${fmt(c.avgT)} · ${nowRank}위</b></div>
        <div><small>남은 ${c.cp} CP로 빈 자리를 채우면</small><b>${fmt(c.projT)} · ${rank}위 <em>${c.projT >= (c.avgT ?? 0) ? '+' : ''}${fmt(c.projT - (c.avgT ?? 0))}</em></b></div></div>
    </div>`;
  },
};

/* ───────── 기록표 4안 ───────── */
function bestOf(c, slots, cols) {
  return cols.map(([, , n, , low]) => {
    const vals = slots.map((s) => c.rawBy.get(s)).filter((p) => p?.source).map((p) => n(parse(p))).filter((v) => !Number.isNaN(v) && v != null);
    return vals.length > 1 ? (low ? Math.min(...vals) : Math.max(...vals)) : null;
  });
}
function recTable(c, sel, kind, style) {
  const pitch = kind === 'p';
  const slots = pitch ? PITCH : BATS;
  const cols = pitch ? PCOLS : BCOLS;
  const best = style === 'Ra' ? bestOf(c, slots, cols) : [];
  const great = style !== 'Ra';
  const faceW = style === 'Ra' ? 32 : style === 'Rc' ? 28 : 0;
  const statW = style === 'Rc' ? 36 : 40;
  const colg = `<colgroup><col style="width:${style === 'Rc' ? 44 : 40}px">${faceW ? `<col style="width:${faceW}px">` : ''}<col>${cols.map(() => `<col style="width:${statW}px">`).join('')}<col style="width:${style === 'Rc' ? 36 : 32}px"></colgroup>`;
  const nCols = cols.length;
  const rows = slots.map((s) => {
    const p = c.by.get(s);
    const posCell = style === 'Rc' ? `<td class="l"><span class="chip">${SHORT[s]}</span></td>` : `<td class="l pos">${SHORT[s]}</td>`;
    if (!p) return `<tr class="e ${sel === s ? 'on' : ''}" data-slot="${s}">${posCell}${faceW ? '<td></td>' : ''}<td class="l" colspan="${nCols + 1}">비어 있음</td><td></td></tr>`;
    const raw = c.rawBy.get(s);
    const r = parse(raw);
    const faceCell = faceW ? `<td class="l"><i class="face ${c.face[p.name] ? '' : 'nof'}" style="${c.face[p.name] || ''}"></i></td>` : '';
    let nameCell;
    if (style === 'Rb') nameCell = `<td class="l"><span class="who"><b>${esc(p.name)}</b><small>’${String(p.year).slice(2)} ${esc(p.team)}</small></span></td>`;
    else if (style === 'Rc') nameCell = `<td class="l" title="${p.year} ${esc(p.team)}"><span class="who" style="gap:0;align-items:baseline"><b>${esc(p.name)}</b><small class="sea" style="margin-left:5px;flex:none">’${String(p.year).slice(2)}</small></span></td>`;
    else if (style === 'Rd') {
      const sub = !raw.source ? (raw.note || '올타임 레전드 시즌') : pitch
        ? [r.w && `${r.w}승${r.l ? ` ${r.l}패` : ''}`, r.ip && `${r.ip}이닝`, r.whip && `WHIP ${r.whip}`].filter(Boolean).join(' · ')
        : [r.obp && `출루 ${r.obp}`, r.pa && `${r.pa}타석`, r.run && `${r.run}득점`].filter(Boolean).join(' · ');
      nameCell = `<td class="l"><span class="who"><span class="nm"><b>${esc(p.name)} <small style="display:inline;font-size:10.5px;color:#6b7280">${p.year} ${esc(p.team)}</small></b><small>${esc(sub)}</small></span></span></td>`;
    } else nameCell = `<td class="l"><span class="who"><span class="nm"><b>${esc(p.name)}</b><small>${p.year} ${esc(p.team)}</small></span></span></td>`;
    const statCells = !raw.source
      ? `<td class="lg" colspan="${nCols}">레전드 카드 · <em>${esc(raw.note || '시즌 기록 없음')}</em></td>`
      : cols.map(([, show, n, gk], i) => {
        const v = show(r); const nv = n(r);
        const gkey = typeof gk === 'function' ? gk(r) : gk;
        const cls = v == null ? '' : best[i] != null && nv === best[i] ? 'best' : great ? (GREAT[gkey]?.(nv) || '') : '';
        return `<td><span class="st ${cls}">${v ?? '-'}</span></td>`;
      }).join('');
    const ovCell = style === 'Rc'
      ? `<td class="ov"><span class="box ${tierOf(p.overall) ? `${tierOf(p.overall)}b` : ''}"><span class="num ${tierOf(p.overall)}">${p.overall}</span></span></td>`
      : `<td class="ov">${numT(p.overall, 0)}</td>`;
    return `<tr class="${sel === s ? 'on' : ''}" data-slot="${s}">${posCell}${faceCell}${nameCell}${statCells}${ovCell}</tr>`;
  }).join('');
  const heads = `<tr><th class="l">자리</th>${faceW ? '<th></th>' : ''}<th class="l">선수</th>${cols.map(([h]) => `<th>${h}</th>`).join('')}<th>종합</th></tr>`;
  const capNote = style === 'Ra' ? '초록 = 우리 팀 1등' : great ? '초록 · 무지개 = 대단한 시즌' : '';
  return `<table><caption>${pitch ? '투수' : '타자'}<small>${capNote}</small></caption>${colg}<thead>${heads}</thead><tbody>${rows}</tbody></table>`;
}
const REC = (style) => (c, sel) => `<div class="rt ${style.toLowerCase()}">${recTable(c, sel, 'p', style)}${recTable(c, sel, 'b', style)}</div>`;

const panelHtml = (c, v, ui, sel) => `<div class="tabs">${[['rep', '팀 분석'], ['rec', '선수 기록']].map(([k, t]) => `<button type="button" data-tab="${k}" class="${ui.tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>
  <div class="tb">${ui.tab === 'rec' ? REC(v.r)(c, sel) : TEAM[v.t](c)}</div>`;

/* ───────── 화면 ───────── */
const one = new URLSearchParams(location.search).get('v');
if (!one) {
  const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
  document.body.insertAdjacentHTML('beforeend', `
    <div class="top"><b>팀 분석 4안 · 기록표 다듬기</b><span>판 크기 = 실제 1902×901 화면 오른쪽 판(400×552) · 왼쪽 팀 분석 탭(기본) · 오른쪽 선수 기록 탭 · 누르면 탭/줄 선택이 바뀜</span>
      <nav>${VERS.map((v) => `<a href="#${v.id}">${v.id}</a>`).join('')}</nav></div>
    <div class="wrapall">${VERS.map((v) => `<section class="ver" id="${v.id}">
      <div class="hd"><b><i>${v.id}</i>${v.title}</b><a href="./?v=${v.id}" target="_blank">게임에서 보기 ↗</a><span class="desc"><b>팀 분석</b> ${v.team}</span><span class="desc"><b>선수 기록</b> ${v.rec}</span></div>
      <div class="pair">${['rep', 'rec'].map((tab) => `<figure><div class="pn"><span class="lab">MY TEAM</span><div class="mk mk-side" data-v="${v.id}" data-tab="${tab}" data-sel=""></div></div><figcaption>${tab === 'rep' ? '팀 분석 탭' : '선수 기록 탭'}</figcaption></figure>`).join('')}</div>
    </section>`).join('')}</div>
    <iframe class="srcframe" src="${SRC}" title="데이터 원본"></iframe>`);
  const src = document.querySelector('.srcframe');
  let last = '', cache = null;
  const render = (force) => {
    const doc = src.contentDocument; if (!doc) return;
    const state = readState(doc); if (!state) return;
    const key = JSON.stringify([state.roster.map((p) => p.id + p.slot), state.cp, state.mode.id]);
    if (!force && key === last) return;
    if (key !== last) { last = key; cache = compute(state); }
    document.querySelectorAll('.mk-side[data-v]').forEach((el) => {
      const v = VERS.find((x) => x.id === el.dataset.v);
      el.innerHTML = panelHtml(cache, v, { tab: el.dataset.tab }, el.dataset.sel || null);
    });
  };
  document.addEventListener('click', (e) => {
    const side = e.target.closest('.mk-side[data-v]'); if (!side) return;
    const t = e.target.closest('[data-tab],[data-slot]'); if (!t) return;
    if (t.dataset.tab) side.dataset.tab = t.dataset.tab;
    else side.dataset.sel = side.dataset.sel === t.dataset.slot ? '' : t.dataset.slot;
    render(true);
  });
  src.addEventListener('load', () => { setInterval(() => render(false), 400); });
} else {
  const v = VERS.find((x) => x.id === one) || VERS[0];
  document.body.className = 'one';
  document.title = `${v.id} · ${v.title}`;
  document.body.innerHTML = `<iframe src="${SRC}" title="드래프트 화면"></iframe><span class="badge">${v.id} · ${v.title}</span>`;
  const ifr = document.querySelector('iframe');
  ifr.addEventListener('load', () => {
    const ui = { tab: 'rep' };
    let lastKey = '', c = null;
    const tick = () => {
      const doc = ifr.contentDocument;
      const listP = doc?.querySelector('.ll-body')?.closest('.bc-grp');
      if (!listP) return;
      if (!doc.getElementById('mk-style')) { const s = doc.createElement('style'); s.id = 'mk-style'; s.textContent = CSS; doc.body.appendChild(s); }
      doc.body.classList.add('mk-hasside');
      const state = readState(doc); if (!state) return;
      const key = JSON.stringify([state.roster.map((p) => p.id + p.slot), state.cp, state.mode.id]);
      if (key !== lastKey) { lastKey = key; c = compute(state); }
      const lab = listP.querySelector('.bc-label'); if (lab && lab.textContent !== 'MY TEAM') lab.textContent = 'MY TEAM';
      let side = listP.querySelector(':scope > .mk-side');
      if (!side) {
        side = doc.createElement('div'); side.className = 'mk mk-side'; listP.appendChild(side);
        side.addEventListener('click', (e) => {
          const t = e.target.closest('[data-tab],[data-slot]'); if (!t) return;
          if (t.dataset.tab) { ui.tab = t.dataset.tab; side.dataset.h = ''; tick(); }
          else doc.querySelectorAll('.ll-row')[ORDER.indexOf(t.dataset.slot)]?.click();
        });
      }
      const html = panelHtml(c, v, ui, state.sel);
      if (side.dataset.h !== html) { side.innerHTML = html; side.dataset.h = html; }
    };
    tick(); setInterval(tick, 250);
  });
}
</script>
</body>
</html>
