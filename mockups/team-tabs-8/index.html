/** 게임 명단 줄에서 라인업 · 얼굴 · 선택 자리 · CP 를 읽는다 */
function readState(doc) {
  const rows = [...doc.querySelectorAll('.ll-row')];
  if (rows.length !== 12) return null;
  const roster = [], face = {};
  let sel = null;
  rows.forEach((r, i) => {
    const slot = ORDER[i];
    if (r.classList.contains('on')) sel = slot;
    if (r.classList.contains('e')) return;
    const name = r.querySelector('.ll-nm')?.textContent, sea = r.querySelector('.ll-sea')?.textContent;
    const p = ALL_PLAYERS.find((x) => x.name === name && `${x.year} ${x.team}` === sea);
    if (!p) return;
    roster.push({ ...p, source: SOURCE.get(p.id), slot });
    face[p.name] = (r.querySelector('.ll-fc')?.getAttribute('style') || '').replace(/"/g, "'").replace(/url\('(?!\/|https?:|data:)/g, "url('/");
  });
  const meter = doc.querySelector('[role="meter"][aria-label="샐러리 캡 잔여"]');
  return { roster, face, sel, cp: +(meter?.getAttribute('aria-valuenow') || 0), cap: +(meter?.getAttribute('aria-valuemax') || 0) };
}

function compute(st) {
  const on = st.roster.map(playAt);
  const syn = checkSynergies(on).filter((s) => !HIDDEN.has(s.id));
  const eff = applySynergies(on, syn);
  const effBy = new Map(eff.map((p) => [p.slot, p]));
  const baseBy = new Map(on.map((p) => [p.slot, p]));
  const rawBy = new Map(st.roster.map((p) => [p.slot, p]));
  const gain = (s) => (effBy.get(s)?.overall ?? 0) - (baseBy.get(s)?.overall ?? 0);
  const offPen = (s) => (baseBy.get(s)?.naturalPosition ? rawBy.get(s).overall - baseBy.get(s).overall : 0);
  const bats = eff.filter((p) => p.type === 'batter'), pits = eff.filter((p) => p.type === 'pitcher');
  const bat = BAT_KEYS.map(([k, key]) => [k, mean(bats.map((p) => p.stats[key])), '타선']);
  const pit = PIT_KEYS.map(([k, key]) => [k, mean(pits.map((p) => p.stats[key])), '마운드']);
  const all8 = [...bat, ...pit].filter((x) => x[1] != null);
  const emptySlots = ORDER.filter((s) => !effBy.has(s));
  const near = syn.filter((s) => s.cur > 0 && s.level < s.tiers.length).map((s) => {
    const next = s.tiers[s.level]; const names = new Set(s.members.map((m) => m.name));
    return { ...s, next, left: next.need - s.count, miss: s.names ? s.names.filter((n) => !names.has(n)) : [] };
  }).filter((s) => s.left <= 2).sort((a, b) => a.left - b.left || b.cur - a.cur);
  const sp = effBy.get('SP');
  const pv = (p) => p.stats.stuff * 0.4 + p.stats.control * 0.3 + p.stats.stability * 0.3;
  const boosted = eff.filter((p) => gain(p.slot) > 0);
  const ov = (f) => mean(eff.filter(f).map((p) => p.overall));
  return {
    ...st, eff, effBy, baseBy, rawBy, gain, offPen, bat, pit, emptySlots, near, boosted,
    empties: emptySlots.length, per: emptySlots.length ? Math.floor(st.cp / emptySlots.length) : 0,
    avgT: ov(() => true), avgP: ov((p) => PITCH.includes(p.slot)), avgB: ov((p) => !PITCH.includes(p.slot)),
    best: all8.length ? all8.reduce((a, b) => (b[1] > a[1] ? b : a)) : null,
    worst: all8.length ? all8.reduce((a, b) => (b[1] < a[1] ? b : a)) : null,
    weak: eff.length ? eff.reduce((a, b) => (b.overall < a.overall ? b : a)) : null,
    gainSum: boosted.reduce((s, p) => s + gain(p.slot), 0),
    offense: mean(bats.map((p) => p.stats.contact * 0.4 + p.stats.power * 0.4 + p.stats.speed * 0.2)),
    defense: mean(bats.map((p) => p.stats.defense)),
    sp, spInn: sp ? (sp.stats.stamina >= 90 ? 7 : sp.stats.stamina >= 80 ? 6 : 5) : null, spVal: sp ? pv(sp) : null,
    pen: mean(['MR', 'CL'].map((s) => effBy.get(s)).filter(Boolean).map(pv)),
    foreign: eff.filter((p) => p.isForeign).length,
    hands: { L: bats.filter((p) => p.hand === 'L').length, R: bats.filter((p) => p.hand === 'R').length, S: bats.filter((p) => p.hand === 'S').length },
    groups: GROUPS.map(([g, slots]) => { const ps = slots.map((s) => effBy.get(s)).filter(Boolean); return { g, slots, filled: ps.length, avg: mean(ps.map((p) => p.overall)) }; }),
  };
}

/* ───────── 팀 분석 8안 ───────── */
const numT = (v, d = 1, cls = '') => `<span class="num ${cls} ${tierOf(v)}">${fmt(v, d)}</span>`;
const pipsOf = (n, of) => `<span class="pips">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}<em>${n}/${of}</em></span>`;
const trio = (c) => `<div class="trio"><div><span class="cap">팀 종합</span>${numT(c.avgT)}</div><div><span class="cap">투수</span>${numT(c.avgP)}</div><div><span class="cap">야수</span>${numT(c.avgB)}</div></div>`;

function radar(vals, color) {
  const cx = 90, cy = 84, R = 52, lo = 40;
  const at = (i, r) => { const a = -Math.PI / 2 + (i * Math.PI) / 2; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const rOf = (v) => (R * Math.max(0, Math.min(100, v ?? lo) - lo)) / (100 - lo);
  const poly = (f) => [0, 1, 2, 3].map((i) => at(i, f(i)).map((n) => n.toFixed(1)).join(',')).join(' ');
  const rings = [0.33, 0.66, 1].map((k) => `<polygon points="${poly(() => R * k)}" fill="none" stroke="rgba(148,163,184,${k === 1 ? 0.28 : 0.14})" />`).join('');
  const axes = [0, 1, 2, 3].map((i) => { const [x, y] = at(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(148,163,184,.14)" />`; }).join('');
  const pos = [[cx, cy - R - 20, 'middle'], [cx + R + 8, cy - 2, 'start'], [cx, cy + R + 14, 'middle'], [cx - R - 8, cy - 2, 'end']];
  const labels = vals.map(([k, v], i) => { const [x, y, an] = pos[i]; return `<text x="${x}" y="${y}" text-anchor="${an}">${k}</text><text class="v" x="${x}" y="${y + 13}" text-anchor="${an}">${fmt(v, 0)}</text>`; }).join('');
  return `<svg viewBox="0 0 180 172">${rings}${axes}<polygon points="${poly((i) => rOf(vals[i][1]))}" fill="${color}" fill-opacity=".22" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" />${labels}</svg>`;
}

const kv = (k, v, cls = '') => `<div class="kv"><span>${k}</span><span class="num ${cls}">${v}</span></div>`;

const TEAM = {
  T1: (c) => `<div class="t1">
    <div><span class="cap">팀 종합 · 시너지 반영</span>
      <div class="t1-big">${numT(c.avgT)}<span class="grade g-${grade(c.avgT)}">${grade(c.avgT)}</span></div>
      <span class="t1-sub">12자리 중 ${c.eff.length}자리 · 시너지 보정 <b>+${c.gainSum}</b> (${c.boosted.length}명)</span></div>
    <div class="t1-split">${[['투수', c.avgP, 'p'], ['야수', c.avgB, '']].map(([k, v, cl]) => `<div><span class="cap">${k} 평균</span>${numT(v).replace('class="num', 'class="num')}<i class="meter ${cl}"><b style="width:${v ?? 0}%"></b></i></div>`).join('')}</div>
    <div class="t1-sw"><div class="up"><span class="cap">강점</span><div class="row"><b>${c.best ? `${c.best[2]} ${c.best[0]}` : '-'}</b><span class="num">${c.best ? fmt(c.best[1], 0) : '-'}</span></div></div>
      <div class="dn"><span class="cap">약점</span><div class="row"><b>${c.worst ? `${c.worst[2]} ${c.worst[0]}` : '-'}</b><span class="num">${c.worst ? fmt(c.worst[1], 0) : '-'}</span></div></div></div>
    <div class="t1-foot"><div><span class="cap">남은 CP</span><span class="num">${c.cp}</span></div><div><span class="cap">빈 자리</span><span class="num">${c.empties}</span></div><div><span class="cap">자리당 CP</span><span class="num">${c.per || '-'}</span></div></div>
  </div>`,

  T2: (c) => `<div class="t2">${trio(c)}
    <div class="t2-rad"><div><h5>타선</h5>${radar(c.bat, '#34d399')}</div><div><h5>마운드</h5>${radar(c.pit, '#38bdf8')}</div></div>
    <div class="t2-foot">
      <div class="kv"><span>강점 <b>${c.best ? c.best[0] : '-'}</b></span><span class="num up">${c.best ? fmt(c.best[1], 0) : '-'}</span></div>
      <div class="kv"><span>약점 <b>${c.worst ? c.worst[0] : '-'}</b></span><span class="num dn">${c.worst ? fmt(c.worst[1], 0) : '-'}</span></div>
      ${kv('공격력', fmt(c.offense, 0))}${kv('수비력', fmt(c.defense, 0))}
    </div></div>`,

  T3: (c) => {
    const row = (k, sub, v) => `<div class="t3-row"><span>${k}</span><small>${sub}</small><b>${v}</b></div>`;
    return `<div class="t3">
      <div class="t3-g">전력</div>
      ${row('팀 종합', '시너지 · 제자리 반영', `<span class="${tierOf(c.avgT)}">${fmt(c.avgT)}</span>`)}
      ${row('투수', '선발 · 중계 · 마무리', `<span class="${tierOf(c.avgP)}">${fmt(c.avgP)}</span>`)}
      ${row('야수', '포수 · 내야 · 외야 · 지명', `<span class="${tierOf(c.avgB)}">${fmt(c.avgB)}</span>`)}
      ${row('시너지 보정', `${c.boosted.map((p) => p.name).join('·') || '없음'}`, `<span class="t75">+${c.gainSum}</span>`)}
      <div class="t3-g">경기력</div>
      ${row('공격력', '컨택 · 파워 · 주루', fmt(c.offense, 0))}
      ${row('수비력', '야수 수비 평균', fmt(c.defense, 0))}
      ${row('선발', c.sp ? `${c.sp.name} · ${c.spInn}이닝 소화` : '비어 있음', fmt(c.spVal, 0))}
      ${row('불펜', '중계 · 마무리', fmt(c.pen, 0))}
      <div class="t3-g">구성</div>
      ${row('남은 CP', c.empties ? `자리당 ${c.per} CP` : '', `${c.cp}<i> / ${c.cap}</i>`)}
      ${row('빈 자리', c.emptySlots.map((s) => LABEL[s]).join('·'), c.empties)}
      ${row('외국인', '최대 3명', `${c.foreign}<i> / 3</i>`)}
      ${row('타선 좌우', '좌타 · 우타', `${c.hands.L}<i> : </i>${c.hands.R}`)}
    </div>`;
  },

  T4: (c) => `<div class="t4">
    <div class="t4-top"><div class="ring" style="--v:${c.avgT ?? 0}"><span><span class="cap">팀 종합</span>${numT(c.avgT)}</span></div>
      <div class="t4-side">
        <div>${kv('투수', fmt(c.avgP), tierOf(c.avgP))}<i class="meter p"><b style="width:${c.avgP ?? 0}%"></b></i></div>
        <div>${kv('야수', fmt(c.avgB), tierOf(c.avgB))}<i class="meter"><b style="width:${c.avgB ?? 0}%"></b></i></div>
        ${kv('시너지 보정', `+${c.gainSum}`, 't75')}
      </div></div>
    <div class="t4-cols">${[['타선', c.bat, ''], ['마운드', c.pit, 'p']].map(([h, rows, cl]) => `<div><h5>${h}</h5>${rows.map(([k, v]) => `${kv(k, fmt(v, 0), statTier(v))}<i class="meter ${cl}"><b style="width:${v ?? 0}%"></b></i>`).join('')}</div>`).join('')}</div>
    <div class="t4-foot"><span>남은<b>${c.cp}</b> CP</span><span>빈 자리<b>${c.empties}</b></span><span>자리당<b>${c.per || '-'}</b> CP</span></div>
  </div>`,

  T5: (c) => {
    const base = c.avgT ?? 70;
    const dv = ([k, v]) => { const d = v == null ? 0 : v - base; const w = Math.min(Math.abs(d) / 25, 1) * 50;
      return `<div class="dv"><span>${k}</span><span class="trk"><i class="${d >= 0 ? 'up' : 'dn'}" style="width:${w}%"></i></span><span class="num">${fmt(v, 0)}</span><small class="${d >= 0 ? 'up' : 'dn'}">${v == null ? '' : `${d >= 0 ? '+' : ''}${Math.round(d)}`}</small></div>`; };
    const ups = [...c.bat, ...c.pit].filter(([, v]) => v != null && v >= base).length;
    return `<div class="t5">
      <div class="t5-hd"><div class="big"><span class="cap">팀 종합 (가운데 선)</span>${numT(c.avgT)}</div>
        <div class="side"><div><span class="cap">투수</span>${numT(c.avgP)}</div><div><span class="cap">야수</span>${numT(c.avgB)}</div></div></div>
      <div class="t5-g">타선<em>팀 종합 대비</em></div>${c.bat.map(dv).join('')}
      <div class="t5-g">마운드<em>팀 종합 대비</em></div>${c.pit.map(dv).join('')}
      <div class="t5-legend"><span><i style="background:#34d399"></i>높음 ${ups}</span><span><i style="background:#fb923c"></i>낮음 ${8 - ups}</span><span style="margin-left:auto">남은 ${c.cp} CP · 빈 자리 ${c.empties}</span></div>
    </div>`;
  },

  T6: (c) => `<div class="t6">
    <div class="tiles">${c.groups.map((g) => `<div class="tile"><span class="cap">${g.g}</span>${numT(g.avg)}${pipsOf(g.filled, g.slots.length)}</div>`).join('')}</div>
    <div><h5>빈 자리 ${c.empties}곳<small>남은 ${c.cp} CP · 자리당 ${c.per || '-'} CP</small></h5>
      <div class="chips">${c.emptySlots.map((s) => `<span>${LABEL[s]}</span>`).join('') || '<span style="color:#34d399;background:none;box-shadow:none;padding:0">모두 채움</span>'}</div></div>
    <div><h5>한 걸음 남은 시너지<small>누구를 데려오면 되는지</small></h5>
      ${c.near.slice(0, 3).map((s) => `<div class="nr"><div class="l1"><b>${esc(s.name)}</b><em>${s.left}명 → ${esc(s.next.effect)}</em></div>
        <div class="l2">${s.miss.length ? `${s.miss.slice(0, 4).map(esc).join(' · ')}${s.miss.length > 4 ? ` <span>외 ${s.miss.length - 4}명</span>` : ''}` : `<span>${esc(s.cond)}</span>`}</div></div>`).join('') || '<p class="cap">없음</p>'}</div>
    <div class="t6-foot"><span class="cap">팀 종합</span><span class="num ${tierOf(c.avgT)}" style="font-size:20px">${fmt(c.avgT)}</span></div>
  </div>`,

  T7: (c) => {
    const out = [];
    if (c.empties) {
      const pe = c.emptySlots.filter((s) => PITCH.includes(s));
      const pick = pe.length && (c.avgP ?? 0) <= (c.avgB ?? 0) ? pe[0] : c.emptySlots[0];
      const g = c.groups.find((x) => x.slots.includes(pick));
      out.push({ tc: '#fbbf24', tag: '빈 자리', t: `${LABEL[pick]} 채우기`, s: `${g.g} 평균 ${fmt(g.avg)} · 자리당 ${c.per} CP까지${c.empties > 1 ? ` · 그 밖에 ${c.empties - 1}곳` : ''}` });
    }
    if (c.near[0]) { const s = c.near[0]; out.push({ tc: '#38bdf8', tag: '시너지', t: `${s.name} ${s.left}명 더`, s: `${s.next.effect}${s.miss.length ? ` · ${s.miss.slice(0, 3).join('·')}` : ''}` }); }
    if (c.worst) out.push({ tc: '#fb923c', tag: '약점', t: `${c.worst[2]} ${c.worst[0]} ${fmt(c.worst[1], 0)}`, s: `팀 능력치 중 가장 낮음 — 다음 ${c.worst[2] === '마운드' ? '투수' : '타자'}는 ${c.worst[0]} 높은 선수로` });
    if (c.weak) out.push({ tc: '#94a3b8', tag: '교체 후보', t: `${LABEL[c.weak.slot]} ${c.weak.name} ${c.weak.overall}`, s: `라인업에서 종합이 가장 낮음 · 방출하면 +${releaseRefund(c.rawBy.get(c.weak.slot))} CP` });
    return `<div class="t7">${trio(c)}<h5>지금 할 일</h5>
      <div class="todo">${out.slice(0, 4).map((x, i) => `<div class="td" style="--tc:${x.tc}"><span class="no">${i + 1}</span><div class="l1">${esc(x.t)}<span class="tag">${x.tag}</span></div><div class="l2">${esc(x.s)}</div></div>`).join('')}</div></div>`;
  },

  T8: (c) => {
    const cell = (k, v, d = 1, cls = '') => `<span><small>${k}</small><span class="num ${cls}">${v == null ? '-' : typeof v === 'number' && d != null ? fmt(v, d) : v}</span></span>`;
    const msg = [c.near[0] && `${c.near[0].name} ${c.near[0].left}명 더면 ${c.near[0].next.effect}`, c.empties && `빈 자리 ${c.emptySlots.map((s) => LABEL[s]).join(' · ')}`, c.worst && `약점 ${c.worst[2]} ${c.worst[0]} ${fmt(c.worst[1], 0)}`].filter(Boolean).join('   ▸   ');
    return `<div class="t8">
      <div class="sb sb3">${cell('TEAM', c.avgT, 1, tierOf(c.avgT))}${cell('투수', c.avgP, 1, tierOf(c.avgP))}${cell('야수', c.avgB, 1, tierOf(c.avgB))}</div>
      <div class="sb sb4"><b>타선</b>${c.bat.map(([k, v]) => cell(k, v, 0)).join('')}</div>
      <div class="sb sb4"><b>마운드</b>${c.pit.map(([k, v]) => cell(k, v, 0)).join('')}</div>
      <div class="sb sb3 sbx">${cell('남은 CP', c.cp, 0)}${cell('빈 자리', c.empties, 0)}${cell('외국인', `${c.foreign}/3`, null)}</div>
      <div class="sb sb3 sbx">${cell('공격력', c.offense, 0)}${cell('수비력', c.defense, 0)}${cell('시너지', `+${c.gainSum}`, null, 't75')}</div>
      <div class="tick"><span>▸ ${esc(msg)}</span></div>
    </div>`;
  },
};

/* ───────── 선수 기록 8안 ───────── */
const faceI = (c, p, cls = '') => `<i class="face ${cls} ${p ? '' : 'nof'}" style="${p ? c.face[p.name] || '' : ''}"></i>`;
const on = (sel, s) => (sel === s ? 'on' : '');
const erow = (s, sel) => `<button type="button" class="erow ${on(sel, s)}" data-slot="${s}"><span class="pos">${LABEL[s]}</span><i></i><span>비어 있음</span></button>`;

const RECS = {
  R1: (c, sel) => GROUPS.map(([g, slots]) => `<div class="gh">${g}<em>${slots.filter((s) => c.effBy.has(s)).length}/${slots.length}</em></div>` + slots.map((s) => {
    const p = c.effBy.get(s); if (!p) return erow(s, sel); const raw = c.rawBy.get(s), g2 = c.gain(s);
    return `<button type="button" class="r1 ${on(sel, s)}" data-slot="${s}">${faceI(c, p)}
      <span class="l1"><span class="pos">${LABEL[s]}</span><b>${esc(p.name)}</b><small>${p.year} ${esc(p.team)}</small></span>
      <span class="ov">${numT(p.overall, 0)}${g2 ? `<sup>+${g2}</sup>` : ''}</span>
      <span class="l2">${esc(recLine(raw))}</span><span class="cp">${raw.cost} CP</span></button>`;
  }).join('')).join(''),

  R2: (c, sel) => GROUPS.map(([g, slots]) => `<div class="gh">${g}<em>${slots.filter((s) => c.effBy.has(s)).length}/${slots.length}</em></div>` + slots.map((s) => {
    const p = c.effBy.get(s); if (!p) return erow(s, sel);
    const keys = p.type === 'pitcher' ? PIT_KEYS : BAT_KEYS;
    return `<button type="button" class="r2 ${on(sel, s)}" data-slot="${s}">${faceI(c, p)}
      <span class="who"><b>${esc(p.name)}</b><small>${LABEL[s]} · ${p.year} ${esc(p.team)}</small></span>
      ${keys.map(([k, key]) => `<span class="chip"><small>${k[0]}</small><span class="num ${statTier(p.stats[key])}">${p.stats[key]}</span></span>`).join('')}
      ${numT(p.overall, 0)}</button>`;
  }).join('')).join(''),

  R3: (c, sel) => {
    const table = (title, slots, heads) => `<table><caption>${title}</caption><colgroup><col style="width:44px"><col><col style="width:44px"><col style="width:40px"><col style="width:40px"><col style="width:36px"><col style="width:36px"></colgroup>
      <thead><tr><th>자리</th><th>선수</th>${heads.map((h) => `<th>${h}</th>`).join('')}<th>종합</th></tr></thead><tbody>${slots.map((s) => {
        const p = c.effBy.get(s);
        if (!p) return `<tr class="e ${on(sel, s)}" data-slot="${s}"><td>${SHORT[s]}</td><td>비어 있음</td><td></td><td></td><td></td><td></td><td></td></tr>`;
        const r = parse(c.rawBy.get(s));
        const vals = r.kind === 'p' ? [r.era, r.w, r.sv && +r.sv >= r.hld ? `${r.sv}S` : r.hld ? `${r.hld}H` : r.sv ? `${r.sv}S` : '', r.k] : [r.avg, r.hr, r.sb, r.rbi];
        return `<tr class="${on(sel, s)}" data-slot="${s}"><td>${SHORT[s]}</td><td><b>${esc(p.name)}</b><small>’${String(p.year).slice(2)}</small></td>${vals.map((v) => `<td>${v ?? '-'}</td>`).join('')}<td>${numT(p.overall, 0)}</td></tr>`;
      }).join('')}</tbody></table>`;
    return `<div class="r3">${table('투수', PITCH, ['ERA', '승', 'S/H', 'K'])}${table('타자', ORDER.filter((s) => !PITCH.includes(s)), ['타율', 'HR', '도루', '타점'])}</div>`;
  },

  R4: (c, sel) => `<div class="r4">${GROUPS.map(([, slots]) => `<div class="r4-grp">${slots.map((s) => {
    const p = c.effBy.get(s);
    const row = `<button type="button" class="r4-row ${p ? '' : 'e'} ${on(sel, s)}" data-slot="${s}"><span class="pos">${LABEL[s]}</span><b>${p ? esc(p.name) : '비어 있음'}</b><small>${p ? `${p.year} ${esc(p.team)}` : ''}</small>${p ? numT(p.overall, 0) : '<span></span>'}</button>`;
    if (!p || sel !== s) return row;
    const raw = c.rawBy.get(s), g2 = c.gain(s), off = c.offPen(s);
    const keys = p.type === 'pitcher' ? PIT_KEYS : BAT_KEYS;
    return `${row}<div class="r4-det">${faceI(c, p)}<div>
      <div class="r4-keys">${keyStats(raw).map(([k, v]) => `<div><span class="num">${v ?? '-'}</span><small>${k}</small></div>`).join('')}</div>
      <div class="r4-ab">${keys.map(([k, key]) => `<div><span>${k}</span><i class="meter ${p.type === 'pitcher' ? 'p' : ''}"><b style="width:${p.stats[key]}%"></b></i><span class="num ${statTier(p.stats[key])}">${p.stats[key]}</span></div>`).join('')}</div>
      <div class="r4-foot">${raw.note ? `<span class="note">★ ${esc(raw.note)}</span>` : ''}<span>${handOf(raw)}${raw.isForeign ? ' · 외국인' : ''}</span><span>${raw.cost} CP</span>${g2 ? `<em>시너지 +${g2}</em>` : ''}${off ? `<span style="color:#fb923c">제자리 아님 −${off}</span>` : ''}</div>
    </div></div>`;
  }).join('')}</div>`).join('')}${sel && c.effBy.has(sel) ? '' : '<p class="r4-hint">줄을 누르면 선수 상세가 펼쳐집니다</p>'}</div>`,

  R5: (c, sel) => GROUPS.map(([g, slots]) => {
    const pitch = slots === GROUPS[0][1];
    return `<div class="r5h"><span>${g} <span style="font-weight:500;color:#6b7280">${slots.filter((s) => c.effBy.has(s)).length}/${slots.length}</span></span><span class="keys">${(pitch ? PIT_KEYS : BAT_KEYS).map(([k]) => `<i style="font-style:normal">${k[0]}</i>`).join('')}</span><span></span></div>`
      + slots.map((s) => {
        const p = c.effBy.get(s); if (!p) return erow(s, sel);
        const keys = p.type === 'pitcher' ? PIT_KEYS : BAT_KEYS;
        return `<button type="button" class="r5 ${on(sel, s)}" data-slot="${s}">${faceI(c, p)}
          <span class="who"><span class="l1"><b>${esc(p.name)}</b><small>${LABEL[s]} · ${p.year} ${esc(p.team)}</small></span><span class="l2">${esc(recLine(c.rawBy.get(s)))}</span></span>
          <span class="spk" title="${keys.map(([k, key]) => `${k} ${p.stats[key]}`).join(' · ')}">${keys.map(([, key]) => `<i class="${statTier(p.stats[key])}" style="height:${Math.max(8, ((p.stats[key] - 40) / 60) * 100)}%"></i>`).join('')}</span>
          ${numT(p.overall, 0)}</button>`;
      }).join('');
  }).join(''),

  R6: (c, sel) => `<div class="r6">${ORDER.map((s) => {
    const p = c.effBy.get(s);
    if (!p) return `<button type="button" class="r6c e ${on(sel, s)}" data-slot="${s}"><small>${LABEL[s]}</small><span>비어 있음</span></button>`;
    return `<button type="button" class="r6c ${on(sel, s)}" data-slot="${s}">${faceI(c, p)}
      <span class="l0"><small>${LABEL[s]}</small>${numT(p.overall, 0)}</span><b>${esc(p.name)}</b><span class="sea">${p.year} ${esc(p.team)}</span><span class="rc">${esc(recLine(c.rawBy.get(s)))}</span></button>`;
  }).join('')}</div>`,

  R7: (c, sel) => GROUPS.map(([, slots]) => `<div class="r7g">${slots.map((s) => {
    const p = c.effBy.get(s); if (!p) return erow(s, sel);
    const raw = c.rawBy.get(s), g2 = c.gain(s), off = c.offPen(s);
    const badges = [raw.note && `<span class="aw">★ ${esc(raw.note)}</span>`, g2 && `<span class="sy">시너지 +${g2}</span>`, off && `<span class="off">제자리 아님 −${off}</span>`, raw.isForeign && '<span class="fx">외국인</span>', `<span>${handOf(raw)}</span>`, !raw.note && `<span>${esc(recLine(raw))}</span>`].filter(Boolean).join('');
    return `<button type="button" class="r7 ${on(sel, s)}" data-slot="${s}">${faceI(c, p)}
      <span class="mid"><span class="l1"><span class="pos">${LABEL[s]}</span><b>${esc(p.name)}</b><small>${p.year} ${esc(p.team)}</small></span><span class="bdg">${badges}</span></span>
      <span class="rt">${numT(p.overall, 0)}<small>${raw.cost} CP</small></span></button>`;
  }).join('')}</div>`).join(''),

  R8: (c, sel) => `<div class="r8">${c.groups.map((g) => `<div class="r8-box"><div class="r8-hd"><b>${g.g}</b>${pipsOf(g.filled, g.slots.length)}<span class="cap">평균</span><span class="num ${tierOf(g.avg)}" style="margin-left:6px">${fmt(g.avg)}</span></div>
    ${g.slots.map((s) => { const p = c.effBy.get(s);
      return `<button type="button" class="r8-row ${p ? '' : 'e'} ${on(sel, s)}" data-slot="${s}"><span class="pos">${LABEL[s]}</span><b>${p ? esc(p.name) : '비어 있음'}</b><small>${p ? `${p.year} ${esc(p.team)}` : ''}</small><span class="k">${p ? esc(keyStats(c.rawBy.get(s)).slice(0, 2).map((k) => k[2]).filter(Boolean).join(' ')) : ''}</span>${p ? numT(p.overall, 0) : '<span></span>'}</button>`; }).join('')}</div>`).join('')}</div>`,
};

const panelHtml = (c, v, ui, sel) => `<div class="tabs">${[['rep', '팀 분석'], ['rec', '선수 기록']].map(([k, t]) => `<button type="button" data-tab="${k}" class="${ui.tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>
  <div class="tb">${ui.tab === 'rec' ? RECS[v.r](c, sel) : TEAM[v.t](c)}</div>`;

/* ───────── 목록 화면: 숨긴 게임 화면에서 데이터 → 판 두 장씩 ───────── */
const one = new URLSearchParams(location.search).get('v');
if (!one) {
  const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
  document.body.insertAdjacentHTML('beforeend', `
    <div class="top"><b>팀 분석 · 선수 기록 탭 8안</b><span>판 크기는 실제 1902×901 화면의 오른쪽 판(400×552) · 왼쪽 = 팀 분석 탭(기본), 오른쪽 = 선수 기록 탭 · 탭과 줄은 눌러 볼 수 있음 · “게임에서 보기”는 실제 화면에 얹은 모습</span>
      <nav>${VERS.map((v) => `<a href="#${v.id}">${v.id}</a>`).join('')}</nav></div>
    <div class="wrapall">${VERS.map((v) => `<section class="ver" id="${v.id}">
      <div class="hd"><b><i>${v.id}</i>${v.title}</b><a href="./?v=${v.id}" target="_blank">게임에서 보기 ↗</a><span class="desc"><b style="font-size:12.5px;color:#cbd5e1">팀 분석</b> ${v.team}</span><span class="desc"><b style="font-size:12.5px;color:#cbd5e1">선수 기록</b> ${v.rec}</span></div>
      <div class="pair">${['rep', 'rec'].map((tab) => `<figure><div class="pn"><span class="lab">MY TEAM</span><div class="mk mk-side" data-v="${v.id}" data-tab="${tab}" data-sel="3B"></div></div><figcaption>${tab === 'rep' ? '팀 분석 탭' : '선수 기록 탭'}</figcaption></figure>`).join('')}</div>
    </section>`).join('')}</div>
    <iframe class="srcframe" src="${SRC}" title="데이터 원본"></iframe>`);
  const src = document.querySelector('.srcframe');
  let last = '';
  const render = (force) => {
    const doc = src.contentDocument; if (!doc) return;
    const state = readState(doc); if (!state) return;
    const key = JSON.stringify([state.roster.map((p) => p.id + p.slot), state.cp]);
    if (!force && key === last) return;
    last = key;
    const c = compute(state);
    document.querySelectorAll('.mk-side[data-v]').forEach((el) => {
      const v = VERS.find((x) => x.id === el.dataset.v);
      el.innerHTML = panelHtml(c, v, { tab: el.dataset.tab }, el.dataset.sel || null);
    });
  };
  document.addEventListener('click', (e) => {
    const side = e.target.closest('.mk-side[data-v]'); if (!side) return;
    const t = e.target.closest('[data-tab],[data-slot]'); if (!t) return;
    if (t.dataset.tab) side.dataset.tab = t.dataset.tab;
    else side.dataset.sel = side.dataset.sel === t.dataset.slot ? '' : t.dataset.slot;
    render(true);
  });
  src.addEventListener('load', () => { setInterval(() => render(false), 400); });
} else {
  /* ───────── 게임에서 보기: 실제 오른쪽 판을 MY TEAM 탭 판으로 ───────── */
  const v = VERS.find((x) => x.id === one) || VERS[0];
  document.body.className = 'one';
  document.title = `${v.id} · ${v.title}`;
  document.body.innerHTML = `<iframe src="${SRC}" title="드래프트 화면"></iframe><span class="badge">${v.id} · ${v.title}</span>`;
  const ifr = document.querySelector('iframe');
  ifr.addEventListener('load', () => {
    const ui = { tab: 'rep' };
    const tick = () => {
      const doc = ifr.contentDocument;
      const listP = doc?.querySelector('.ll-body')?.closest('.bc-grp');
      if (!listP) return;
      if (!doc.getElementById('mk-style')) { const s = doc.createElement('style'); s.id = 'mk-style'; s.textContent = CSS; doc.body.appendChild(s); }
      doc.body.classList.add('mk-hasside');
      const state = readState(doc); if (!state) return;
      const lab = listP.querySelector('.bc-label'); if (lab && lab.textContent !== 'MY TEAM') lab.textContent = 'MY TEAM';
      let side = listP.querySelector(':scope > .mk-side');
      if (!side) {
        side = doc.createElement('div'); side.className = 'mk mk-side'; listP.appendChild(side);
        side.addEventListener('click', (e) => {
          const t = e.target.closest('[data-tab],[data-slot]'); if (!t) return;
          if (t.dataset.tab) { ui.tab = t.dataset.tab; side.dataset.h = ''; tick(); }
          else doc.querySelectorAll('.ll-row')[ORDER.indexOf(t.dataset.slot)]?.click();
        });
      }
      const html = panelHtml(compute(state), v, ui, state.sel);
      if (side.dataset.h !== html) { const tb = side.querySelector('.tb'); const sc = tb?.scrollTop || 0; side.innerHTML = html; side.dataset.h = html; const nb = side.querySelector('.tb'); if (nb) nb.scrollTop = sc; }
    };
    tick(); setInterval(tick, 250);
  });
}
</script>
</body>
</html>
