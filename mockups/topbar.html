<title>상단 바 8안</title>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --em:#10b981; --em2:#34d399; --red:#f87171; --yel:#fde047; --sky:#7dd3fc; --vio:#c4b5fd; }
  * { box-sizing:border-box; }
  body { margin:0; background:#010205; color:#e8ecf2; font-family:'IBM Plex Sans KR',system-ui,'Malgun Gothic',sans-serif; }
  h1.page { font-size:22px; padding:24px 32px 4px; margin:0; }
  .d { font-family:'Saira Condensed',sans-serif; }
  .screen { position:relative; width:1920px; height:360px; margin:14px auto 10px; overflow:hidden; background:#05080f; border:1px solid #1f2937; }
  .note { width:1920px; margin:0 auto 46px; color:#9ca3af; font-size:15px; line-height:1.6; } .note b { color:#fff; }
  /* 기존 화면과 같은 문법 */
  .cut { --c:14px; clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
  .glass { background:rgba(6,10,19,.74); backdrop-filter:blur(10px); }
  .frame { position:relative; }
  .frame::after { content:''; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.10); clip-path:inherit; }
  .frame.hot::after { box-shadow:inset 0 0 0 2px var(--a,#10b981), inset 0 0 36px color-mix(in srgb, var(--a,#10b981) 26%, transparent); }
  .lab { display:inline-flex; align-items:center; gap:8px; font:700 12px/1 'Saira Condensed'; letter-spacing:.32em; text-transform:uppercase; color:var(--a,#10b981); margin:0; }
  .lab::before { content:''; width:14px; height:10px; background:currentColor; clip-path:polygon(0 0,60% 0,100% 100%,40% 100%); }
  .btn { --c:9px; display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:46px; padding:0 22px; font:700 15px 'IBM Plex Sans KR'; color:#e8ecf2; background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(255,255,255,.22); clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
  .btn.pri { background:var(--em); color:#05080f; box-shadow:none; font-weight:800; }
  .btn.lg { min-height:62px; font-size:19px; }
  .chip { --c:6px; display:inline-flex; align-items:center; gap:6px; padding:4px 10px; font:600 12px 'IBM Plex Sans KR'; color:#cbd5e1; background:rgba(5,8,15,.6); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a,#94a3b8) 45%,transparent); clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c)); }
  .scan { background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px); }
  .bar { height:6px; background:rgba(255,255,255,.08); } .bar i { display:block; height:100%; }
  .kpi b { display:block; font:800 40px/1 'Saira Condensed'; color:#fff; } .kpi small { font-size:11px; color:#9ca3af; }
  /* 카드(선수) */
  .pc { position:relative; width:150px; height:200px; overflow:hidden; background:linear-gradient(180deg,#0e1726,#05080f); }
  .pc .ov { position:absolute; left:10px; top:8px; font:800 30px/1 'Saira Condensed'; color:var(--a,#34d399); text-shadow:0 0 18px color-mix(in srgb,var(--a,#34d399) 50%,transparent); }
  .pc .pos { position:absolute; right:10px; top:10px; font:800 11px 'Saira Condensed'; letter-spacing:.14em; color:#05080f; background:var(--a,#34d399); padding:2px 7px; }
  .pc .img { position:absolute; inset:34px 0 52px; background:var(--img) center/cover; opacity:.55; }
  .pc .nm { position:absolute; left:10px; right:10px; bottom:26px; font-weight:700; font-size:16px; color:#fff; text-shadow:0 2px 8px #000; }
  .pc .meta { position:absolute; left:10px; right:10px; bottom:8px; font:600 11px 'Saira Condensed'; letter-spacing:.06em; color:#9ca3af; }
  .pc .grad { position:absolute; inset:0; background:linear-gradient(180deg,rgba(5,8,15,.1) 40%,rgba(5,8,15,.95)); }
  @keyframes pulse { 50% { opacity:.55; } }
</style>

<h1 class="page">상단 바 통일안 8개 — 각 안마다 메인·라커·상점 세 화면에서의 모습 (1920 폭)</h1>
